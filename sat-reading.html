<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAT Reading Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a test desk. The short text is a paper sheet on the left; the question and its four choices sit beside it.
   One dark petrol band opens the library; the completed blank is always marked in highlighter amber. */
:root{
  --bg:#EDF2F3; --sheet:#FFFFFF; --ink:#10222B; --muted:#586A73; --line:#D2DDE0; --soft:#E1EAEC;
  --brand:#0B5563; --brand-ink:#FFFFFF; --brand-soft:#DAECEE;
  --deep:#082F38; --deep-ink:#EAF4F5; --deep-muted:#A3C3C9; --deep-line:#1D4852;
  --mark:#FFD970; --mark-ink:#2B2200;
  --ok:#1B7A4B; --ok-soft:#DCF1E4; --bad:#BF3B2B; --bad-soft:#FAE3DE;
  --f-display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1316; --sheet:#111D21; --ink:#E4ECEE; --muted:#93A6AD; --line:#24353B; --soft:#19282D;
  --brand:#62C6D3; --brand-ink:#06181C; --brand-soft:#12353C;
  --deep:#07262D; --deep-ink:#EAF4F5; --deep-muted:#9DBDC3; --deep-line:#1A4049;
  --mark:#6A5413; --mark-ink:#FFF1C2;
  --ok:#5BCB93; --ok-soft:#132E1F; --bad:#F08B78; --bad-soft:#391C17; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1316; --sheet:#111D21; --ink:#E4ECEE; --muted:#93A6AD; --line:#24353B; --soft:#19282D;
  --brand:#62C6D3; --brand-ink:#06181C; --brand-soft:#12353C;
  --deep:#07262D; --deep-ink:#EAF4F5; --deep-muted:#9DBDC3; --deep-line:#1A4049;
  --mark:#6A5413; --mark-ink:#FFF1C2;
  --ok:#5BCB93; --ok-soft:#132E1F; --bad:#F08B78; --bad-soft:#391C17; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.mono{font:600 11px/1.3 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.small{font-size:13.5px;color:var(--muted)}
.lab{display:inline-block;font:600 10.5px/1.3 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.rn{font:italic 500 16px/1.2 var(--f-display)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:11px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.brand .mk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:italic 500 15px/1 var(--f-display)}
.brand b{font:600 19px/1 var(--f-display);letter-spacing:-.01em}
.brand b i{font-weight:400;color:var(--brand)}
.xlink{font-size:13px;color:var(--brand);text-decoration:none;font-weight:500;white-space:nowrap}
.xlink:hover{text-decoration:underline}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:999px}
.tabs button{border:0;background:none;padding:6px 16px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(8,47,56,.14)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--sheet);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;line-height:1.2;transition:border-color .15s, background-color .15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.btn.gold{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:600}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ondeep{background:transparent;border-color:var(--deep-line);color:var(--deep-ink)}
.btn.ondeep:hover{border-color:var(--deep-muted)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* library */
.hero{margin-top:22px;background:var(--deep);color:var(--deep-ink);border-radius:18px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px 44px;align-items:end}
.hero .eyebrow{font:600 11.5px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--deep-muted)}
.hero h1{font:600 clamp(36px,6vw,62px)/1 var(--f-display);letter-spacing:-.02em;margin:12px 0 14px}
.hero h1 i{font-weight:400;color:var(--mark)}
.hero .lede{font-size:16.5px;line-height:1.55;color:var(--deep-muted);margin:0 0 22px;max-width:52ch}
.hero-s{display:flex;flex-direction:column;gap:20px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-top:1px solid var(--deep-line);padding-top:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:500 clamp(24px,3vw,32px)/1 var(--f-display)}
.stat span{font-size:12.5px;color:var(--deep-muted)}
.stat small{font-size:.55em;color:var(--deep-muted)}
.shelf{display:flex;align-items:flex-end;gap:5px;height:64px}
.sp{flex:1;min-width:0;border-radius:3px 3px 0 0;background:var(--deep-line);display:flex;align-items:flex-end;overflow:hidden}
.sp i{display:block;width:100%;background:var(--mark)}
.shelfcap{font-size:12.5px;color:var(--deep-muted);margin:-12px 0 0}
.resume{margin-top:14px;border:1px solid var(--brand);background:var(--brand-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.qc{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .15s, transform .15s}
.qc b{font:600 17.5px/1.25 var(--f-display)}
.qc span{font-size:13px;color:var(--muted)}
.qc:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.qc:disabled{opacity:.5;cursor:default}
.lvh{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px;flex-wrap:wrap}
.lvh h2{font:600 24px/1.1 var(--f-display);margin:0}
.lvh .band{font:italic 400 16px/1.2 var(--f-display);color:var(--brand)}
.lvh .rule{flex:1;min-width:20px;height:1px;background:var(--line);align-self:center}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.tcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tno{font:italic 400 15px/1 var(--f-display);color:var(--brand)}
.tcard h3{font:600 19px/1.22 var(--f-display);margin:2px 0 0;min-height:2.44em}
.meta{font-size:12.5px;color:var(--muted);margin:0}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.tcard .btns{margin-top:8px}
.tcard .btn{flex:1;text-align:center;padding-inline:10px;white-space:nowrap}
.foot{font-size:12.5px;color:var(--muted);max-width:84ch;margin-top:26px}

/* session */
.sbar{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.stitle{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.stitle b{font:600 19px/1.2 var(--f-display)}
.clockwrap{display:flex;align-items:baseline;gap:8px}
.clock,.score{font:500 24px/1 var(--f-display)}
.clock.low{color:var(--bad)}
.strip{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px}
.sq{min-width:36px;height:34px;padding:0 9px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;font:italic 500 15px/1 var(--f-display);cursor:pointer;color:var(--muted)}
.sq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sq.cur{box-shadow:0 0 0 2px var(--brand);color:var(--ink)}
.sgrid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:18px;align-items:start}
.passage{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px 30px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 68px);max-height:calc(100vh - 92px);overflow:auto;min-width:0}
.ph{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tag{font:600 10.5px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.ptitle{font:600 clamp(24px,3vw,30px)/1.15 var(--f-display);letter-spacing:-.01em;margin:4px 0 0}
.ph .small{margin:0}
.para{font:400 17.5px/1.66 var(--f-read);margin:14px 0 0;position:relative;padding:0 0 0 46px;max-width:68ch}
.para .pl{position:absolute;left:2px;top:-2px;font:italic 500 25px/1.2 var(--f-display);color:var(--muted)}
.para .pk{position:absolute;left:0;top:34px;font:italic 500 14px/1 var(--f-display);color:var(--brand)}
.para .pk.ok{color:var(--ok)} .para .pk.bad{color:var(--bad)}
.para.dim{color:var(--muted)}
.para.cur{background:var(--brand-soft);border-radius:var(--r-sm);padding:10px 12px 10px 54px;margin-inline:-8px}
.para.cur .pl{left:12px;top:7px;color:var(--brand)}
.para.cur .pk{left:10px;top:44px}
mark.ev{background:var(--mark);color:var(--mark-ink);padding:1px 2px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.only-narrow{display:none}
.qpane{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.card > h3{font:600 11px/1.3 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.qh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.instr{font:600 21px/1.3 var(--f-display);margin:10px 0 14px}
.instr span{display:block;font:400 13.5px/1.45 var(--f-ui);color:var(--muted);margin-top:4px}
.hopts{display:flex;flex-direction:column;gap:6px}
.hopt{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;font:400 16.5px/1.35 var(--f-read);color:var(--ink);transition:border-color .12s, background-color .12s}
.hopt .rn{color:var(--muted)}
.hopt .un{font:600 10px/1.3 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hopt:hover:not(:disabled){border-color:var(--brand)}
.hopt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.hopt.sel .rn{color:var(--brand)}
.hopt:disabled{cursor:default}
.hopt.used{color:var(--muted);background:transparent;border-style:dashed}
.hopt.used .ht{text-decoration:line-through}
.hopt.right{border-color:var(--ok);background:var(--ok-soft)}
.hopt.right .rn,.hopt.right .un{color:var(--ok)}
.hopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.hopt.wrong .rn,.hopt.wrong .un{color:var(--bad)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.hinttxt{font-size:14px;background:var(--brand-soft);padding:10px 13px;border-radius:var(--r-sm);margin:10px 0 0}

/* feedback */
.fb{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.verdict{padding:12px 16px;border-radius:var(--r-sm);display:flex;flex-direction:column;gap:3px;scroll-margin-top:calc(env(safe-area-inset-top, 0px) + 72px)}
.verdict .vt{font-weight:600}
.verdict.ok{background:var(--ok-soft)} .verdict.ok .vt{color:var(--ok)}
.verdict.bad{background:var(--bad-soft)} .verdict.bad .vt{color:var(--bad)}
.verdict .vh{font:600 18.5px/1.3 var(--f-display)}
.fsec{display:flex;flex-direction:column;gap:8px;min-width:0}
.fsec h4{font:600 11px/1.3 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.fsec p{margin:0;max-width:68ch}
blockquote{margin:0;font:400 16.5px/1.5 var(--f-read);padding:10px 14px;background:var(--mark);color:var(--mark-ink);border-radius:var(--r-sm)}
.pmap{display:flex;gap:3px;height:12px}
.pmap i{display:block;min-width:6px;border-radius:3px;background:var(--soft)}
.pmap i.k{background:var(--mark);box-shadow:inset 0 0 0 1px var(--mark-ink)}
.cap{font-size:13.5px;color:var(--muted)}
.fsec.miss{background:var(--bad-soft);border-radius:var(--r-sm);padding:14px 16px}
.fsec.miss h4{color:var(--bad)}
.hd{font:400 16.5px/1.35 var(--f-read)}
.hd b{font:italic 500 15px/1 var(--f-display);margin-right:7px}
.ttag{font:600 10.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);border:1px solid currentColor;padding:4px 8px;border-radius:999px;align-self:flex-start;display:inline-block}
.note{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.advice{font-size:14px;background:var(--sheet);border-radius:var(--r-sm);padding:10px 13px}
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.tree li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:10px 13px;border-top:1px solid var(--line);font-size:14px;align-items:start}
.tree li:first-child{border-top:0}
.tree .tq b{display:block;font:600 10.5px/1.6 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tree .tr{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.tree .r{font:italic 500 15px/1.3 var(--f-display);white-space:nowrap}
.tree .r.yes{color:var(--ok)} .tree .r.no{color:var(--bad)}
.tree li.fail{background:var(--bad-soft)}
.tree .why{grid-column:1 / -1;font-size:13.5px;color:var(--bad);font-weight:500}
.trapcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.trapcard .th{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.trapcard .th b{font:600 17px/1.2 var(--f-display)}
.trapcard p{margin:0;max-width:68ch}
.eyebrow2{font:600 10.5px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--bad)}
.rulefull{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.exbox{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sheet);padding:10px 13px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tlist li{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.tlist li:first-child{border-top:0;padding-top:0}

/* exam */
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hlist li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:6px;padding:5px 6px;border-radius:4px;font:400 16.5px/1.4 var(--f-read)}
.hlist .rn{color:var(--muted)}
.hlist li.used{color:var(--muted);text-decoration:line-through}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .al{font:italic 500 20px/1 var(--f-display)}
.arow select{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sheet)}
.rsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rsum div{display:flex;flex-direction:column;gap:5px}
.rsum b{font:500 30px/1 var(--f-display)}
.erow{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:4px}
.erow:first-of-type{border-top:0;padding-top:0}
.eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eh .fl{font:italic 500 21px/1 var(--f-display);min-width:20px}
.eh .ea{font-size:14px;flex:1;min-width:0}
.pill{font:600 10.5px/1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.dlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.dlist li{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:5px}
.dlist li:first-child{border-top:0;padding-top:0}
.dlist p{margin:0;max-width:68ch}
.finish{max-width:780px;padding-block:34px 0;display:flex;flex-direction:column;gap:14px}
.finish h1{font:500 clamp(52px,10vw,88px)/1 var(--f-display);margin:0;letter-spacing:-.02em}
.finish p{margin:0;max-width:68ch}

/* reading pages */
.doc{max-width:880px;padding-block:30px 0}
.doc > h1{font:600 clamp(32px,5vw,46px)/1.05 var(--f-display);letter-spacing:-.02em;margin:0 0 12px}
.doc > .lede{font-size:16.5px;color:var(--muted);margin:0;max-width:66ch}
.rsec{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-top:16px}
.rsec h2{font:600 23px/1.2 var(--f-display);margin:0 0 12px}
.rsec p{margin:0 0 10px;max-width:70ch}
.rsec ol,.rsec ul{margin:0 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:7px;max-width:72ch}
.rsec.plain{background:transparent;border-style:dashed}
.finish .rsec{margin-top:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 10.5px/1.3 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
td.en{font:400 16px/1.4 var(--f-read)}
.dsteps{list-style:none!important;margin:0!important;padding:0!important;display:flex;flex-direction:column;gap:0!important;border:1px solid var(--line);border-radius:var(--r-sm);max-width:none!important}

  <div class="brand"><span class="mk" aria-hidden="true">R</span><b>SAT Reading <i>Pro</i></b><a class="xlink" id="xlink1" href="sat-writing.html" hidden>SAT Writing →</a><a class="xlink" id="xlink2" href="matching-headings-pro.html" hidden>Matching Headings →</a><a class="xlink" id="xlink3" href="index.html" hidden>TFNG →</a></div>
  <nav class="tabs" aria-label="Sections">
    <button data-act="tab" data-v="lib">Tests</button>

<script>
/* ===================== QUESTION BANK: 7 reading question types, 40 questions each =====================
   Row: [skill, text, [correct choice, three wrong choices], explanation, [pattern|note for each wrong choice], custom question].
   The correct choice is written first; the order shown on screen is fixed per question by a seeded shuffle. */
const B = {};
/* Words in Context. Row: [skill, text, [correct, wrong, wrong, wrong], why, [error|note ×3], custom stem] */
B.wic = [
["w-blank","Unlike its neighbors, which have changed hands many times, the bakery on Alder Street has been run by the same family for ninety years. It is a ____ presence in a neighborhood where little else stays the same.",["constant","temporary","reluctant","noisy"],"The clues are “the same family for ninety years” and the contrast with a neighborhood “where little else stays the same”. The blank needs a word meaning unchanging, and “constant” means exactly that.",["opp|“Temporary” means short-lived, the reverse of ninety years under one family.","ctx|“Reluctant” means unwilling. Nothing in the text is about willingness.","ctx|Nothing in the text is about sound. The clue is about how long the bakery has lasted."]],
["w-blank","The first reviews of the film were ____: critics praised its photography but found the plot slow and the ending confusing.",["mixed","enthusiastic","hostile","irrelevant"],"The colon introduces an explanation: one thing was praised and two were criticized. Reviews that combine praise and criticism are “mixed”.",["half|“Enthusiastic” fits the praise for the photography but ignores the complaints about the plot and ending.","half|“Hostile” fits the complaints but ignores the praise for the photography.","ctx|The reviews discuss the film directly, so they are not irrelevant."]],
["w-blank","Marine biologist Leila Haddad expected the damaged reef to recover slowly, so she was ____ to find young coral covering most of the area after just two years.",["surprised","disappointed","reluctant","obligated"],"She expected a slow recovery and found a fast one. When reality differs from an expectation, the natural reaction is surprise.",["conn|Disappointment is a reaction to bad news, and a fast recovery is good news.","ctx|“Reluctant to find” would mean she did not want to find the coral. The text gives no reason for that.","ctx|“Obligated” means required. The sentence describes a reaction, not a duty."]],
["w-blank","Because the two fossils were found in the same rock layer, the team concluded that the animals were ____, living at roughly the same time.",["contemporaries","descendants","rivals","predators"],"The phrase after the comma defines the blank: “living at roughly the same time”. Contemporaries are beings that exist in the same period.",["opp|A descendant lives after its ancestor, not at the same time as it.","oos|The text says when the animals lived, not that they competed.","oos|Nothing in the text says that either animal hunted."]],
["w-blank","The instructions were so ____ that even first-time users assembled the shelf in minutes without asking for help.",["clear","vague","lengthy","technical"],"“So ____ that” introduces a result: beginners succeeded quickly and without help. Only easily understood instructions produce that result.",["opp|Vague instructions would leave first-time users confused, the reverse of the result described.","ctx|Long instructions would not explain why assembly took only minutes.","ctx|Technical instructions would make the job harder for first-time users, not easier."]],
["w-blank","Rather than ____ the old bridge, the city chose to repair it, keeping the stone arches that residents had admired for generations.",["demolish","restore","photograph","cross"],"“Rather than” sets up a contrast with “repair” and “keeping”. The rejected option must be the reverse of preserving the bridge: tearing it down.",["opp|Restoring is the same as repairing, so it cannot be the alternative that the city rejected.","ctx|Photographing the bridge is not an alternative to repairing it.","ctx|Crossing a bridge is not an alternative to repairing it."]],
["w-blank","The desert plant survives long droughts by storing water in its thick leaves, an ____ that lets it grow where most species cannot.",["adaptation","obstacle","accident","exception"],"Storing water in thick leaves is a feature that helps the plant survive in a dry environment. A helpful feature of this kind is an adaptation.",["opp|An obstacle would make growth harder. This feature makes growth possible.","ctx|An accident is an unplanned event, not a feature that helps a plant survive.","rec|The plant is an exception among species, but the blank names the water-storing feature, not the plant."]],
["w-blank","The mayor’s speech was notably ____: in under three minutes she thanked the volunteers, announced the new park, and sat down.",["brief","emotional","rambling","controversial"],"The explanation after the colon stresses time: “in under three minutes” she did three things “and sat down”. The speech was short.",["oos|Thanking volunteers is not described as emotional. The stress is on speed.","opp|A rambling speech wanders and runs long. This one made three quick points.","oos|Nothing in the speech caused disagreement."]],
["w-mean","After the storm, volunteers worked to [[clear]] the trail, dragging fallen branches into the woods so that hikers could pass.",["remove obstacles from","make transparent","declare innocent","give approval to"],"The volunteers drag branches away “so that hikers could pass”. Here “clear” means to remove what is blocking the way.",["lit|“Clear” can mean transparent, as in clear glass, but a trail cannot be made transparent.","lit|“Clear” can mean to free from blame, but no one is accused of anything here.","lit|“Clear” can mean to approve, as in clearing a plan, but dragging branches is physical work, not approval."]],
["w-mean","The museum’s director said the new wing would [[address]] a long-standing problem: the lack of space for large sculptures.",["deal with","speak to","send mail to","give a name to"],"A new wing provides space, so it solves the problem of too little space. To “address” a problem is to deal with it.",["lit|“Address” can mean to speak to an audience, but a building does not speak to a problem.","lit|“Address” can mean to write a destination on mail. That sense has nothing to do with a problem.","ctx|Naming the problem would not provide more space."]],

["w-blank","Economist Tomás Rivera argues that the tax on sugary drinks did not ____ consumption, as its designers had hoped; sales of the drinks stayed at about the same level.",["reduce","stimulate","measure","explain"],"A tax on sugary drinks is designed to make people buy fewer of them. Sales “stayed at about the same level”, so the tax failed to lower consumption.",["opp|Designers of a tax on sugary drinks hope for less consumption, not more.","ctx|The tax was meant to change consumption, not to measure it.","ctx|A tax does not explain consumption. The hoped-for effect was a change in behavior."]],
["w-blank","Although the novelist’s early stories were ____ by publishers, who saw no market for them, the same stories were later collected in a best-selling volume.",["rejected","celebrated","revised","imitated"],"“Although” signals a contrast with the later success, and publishers “saw no market” for the stories. Publishers who see no market turn the work down.",["opp|Publishers who saw no market for the stories would not celebrate them.","oos|Nothing says that publishers changed the stories. They were “the same stories” later.","oos|Nothing in the text is about copying the stories."]],
["w-blank","The study’s results are ____ rather than final: the sample was small, and the researchers themselves say that larger trials are needed.",["tentative","conclusive","fraudulent","irrelevant"],"“Rather than final” tells you the blank is the reverse of final. Results that still need confirmation are tentative.",["opp|“Conclusive” means final, which is exactly what the sentence says the results are not.","conn|“Fraudulent” accuses the researchers of dishonesty. A small sample is a limitation, not a deception.","conn|The results matter enough to justify larger trials, so they are not irrelevant."]],
["w-blank","In her paintings, Amara Nwosu ____ traditional textile patterns with images from modern city life, so that woven motifs appear beside traffic lights and billboards.",["combines","replaces","confuses","criticizes"],"The result clause shows both elements together: motifs “appear beside” traffic lights. The artist puts the two together, so she combines them.",["opp|If the patterns were replaced, they would not appear beside the city images.","conn|“Confuses” would mean she mixes them up by mistake. The placement is described as an artistic method.","oos|Nothing in the text suggests that the paintings attack either tradition or city life."]],
["w-blank","The committee’s report was praised for its ____: it presented the evidence for and against the dam without favoring either side.",["impartiality","brevity","optimism","originality"],"The explanation after the colon is “without favoring either side”. Treating both sides equally is impartiality.",["oos|The text says nothing about the length of the report.","oos|A report that weighs both sides is not described as hopeful.","oos|Nothing says the report was new or unusual. The praised quality is balance."]],
["w-blank","Honeybee scouts do not choose a new nest site alone. The decision is ____: hundreds of bees inspect the candidates, and the swarm moves only when enough of them favor one site.",["collective","individual","arbitrary","hasty"],"The scouts “do not choose alone”, and the swarm moves only when many bees agree. A decision made by a group is collective.",["opp|The first sentence says directly that scouts do not choose alone.","opp|An arbitrary choice is made at random. The bees inspect each candidate site.","opp|Hundreds of inspections and a wait for agreement describe a careful process, not a hasty one."]],
["w-blank","The archive’s letters ____ the official account: while the company’s history says the factory closed for lack of orders, the owner’s correspondence reveals a dispute among the partners.",["contradict","confirm","summarize","predate"],"“While” contrasts two different explanations for the closing. Letters that give a different story contradict the official account.",["opp|The letters give a different reason for the closing, so they do not confirm the official one.","ctx|A summary would repeat the official account in shorter form. The letters disagree with it.","oos|The text compares what the two sources say, not when each was written."]],
["w-blank","Demand for the handmade paper is ____: orders surge before the winter holidays and nearly vanish in summer.",["seasonal","steady","declining","global"],"Orders rise and fall with the time of year (winter holidays, summer). Demand that follows the calendar is seasonal.",["opp|Demand that surges and then nearly vanishes is the reverse of steady.","half|Orders fall in summer but surge again each winter, so the demand is not simply declining.","oos|The text says when people order, not where they live."]],
["w-mean","Though the two species look alike, a [[fine]] distinction separates them: the pattern of veins on the underside of the leaf.",["subtle","excellent","satisfactory","thin"],"The species “look alike”, so the difference is small and hard to notice. A “fine distinction” is a subtle one.",["lit|“Fine” often means excellent, but the text is about how small the difference is, not how good it is.","lit|“Fine” can mean acceptable, as in “that is fine”. That sense does not describe a difference between species.","lit|“Fine” can mean thin, as in fine thread, but a distinction has no physical thickness."]],
["w-mean","The council voted to [[table]] the proposal until the spring session, when the budget figures would be known.",["postpone","display","list","defeat"],"“Until the spring session” shows that the council will return to the proposal later. To table a proposal here is to put it off.",["ctx|Displaying the proposal would not explain waiting until spring.","lit|A table can be a list of figures, but the council is delaying a decision, not arranging data.","conn|“Defeat” is too final. The council plans to take the proposal up again in spring."]],

["w-blank","Critics once dismissed the composer’s late works as ____, but performers now value the very lack of ornament that those critics complained about.",["bare","elaborate","derivative","sentimental"],"The second half names the complaint: a “lack of ornament”. The critics’ word must describe music with little decoration, and “bare” does.",["opp|Elaborate music is full of ornament, the reverse of the complaint.","oos|“Derivative” means copied from others. The complaint was about ornament, not originality.","oos|“Sentimental” means overly emotional. The complaint was about a lack of ornament."]],
["w-blank","Glaciologists treat ice cores as a kind of ____: each layer preserves dust and air from the year it formed, allowing scientists to read past climates in sequence.",["archive","forecast","barrier","experiment"],"Each layer “preserves” material from its own year so that scientists can “read past climates”. Something that stores a record of the past is an archive.",["opp|A forecast looks ahead. Ice cores are used to read the past.","ctx|A barrier blocks something. The cores are described as preserving information.","ctx|An experiment is designed and run by scientists. The layers formed naturally."]],
["w-blank","The translator’s choices were ____, not careless: each departure from the literal wording was made to preserve a rhyme or a joke.",["deliberate","accidental","invisible","excessive"],"“Not careless” and “was made to preserve” show that every change had a purpose. Choices made on purpose are deliberate.",["opp|Accidental changes would be careless, which the sentence denies.","oos|The text is about why the changes were made, not whether readers can see them.","conn|“Excessive” criticizes the changes. The sentence defends them."]],
["w-blank","For decades the theory remained ____, because no instrument was sensitive enough to test it; only in the 2010s could physicists finally check its predictions.",["unverified","unpopular","discredited","obvious"],"The reason given is that the theory could not be tested. A theory that has not yet been tested is unverified.",["oos|The text says the theory could not be tested, not that scientists disliked it.","conn|A discredited theory has been shown to be wrong. This one had simply not been checked.","opp|An obvious theory would not need sensitive instruments to check its predictions."]],
["w-blank","Urban planner Mei Tanaka warns against treating bike lanes as a ____: on their own, she says, they cut traffic only slightly, and they must be paired with better transit.",["cure-all","luxury","hazard","precedent"],"Tanaka says the lanes help only slightly “on their own” and need other measures. She warns against seeing them as a complete solution, a cure-all.",["oos|She does not say that bike lanes are an unnecessary expense. She says they are not enough alone.","conn|She says the lanes help a little, so she is not calling them a danger.","ctx|A precedent is an earlier example to follow. The warning is about expecting too much."]],
["w-blank","The senator’s reply was ____: she spoke for ten minutes about her respect for the committee without ever saying how she would vote.",["evasive","candid","hostile","concise"],"She talked at length but avoided the one question that mattered. A reply that avoids the point is evasive.",["opp|A candid reply would state plainly how she would vote.","opp|She expressed respect for the committee, so the reply was not hostile.","opp|Ten minutes without an answer is the reverse of concise."]],
["w-blank","The city’s records for the 1890s are ____: fires destroyed several volumes, and others list births for some months but not for others.",["fragmentary","meticulous","confidential","forged"],"Volumes are missing and the rest have gaps. Records that survive only in pieces are fragmentary.",["opp|Meticulous records would be complete and careful. These have gaps.","oos|The text describes missing information, not restricted access.","conn|“Forged” would mean the records are fake. They are incomplete, not dishonest."]],
["w-blank","Rather than ____ her mentor’s methods, the young chef adapted them, keeping the slow cooking but replacing the heavy sauces with lighter ones.",["abandon","follow","admire","learn"],"“Rather than” contrasts the blank with adapting, which keeps part of the method. The rejected option is to give the methods up completely.",["ctx|Adapting a method is one way of following it, so “follow” creates no contrast with “adapted”.","ctx|Admiring a method and adapting it are not alternatives. She could do both.","ctx|She must already have learned the methods in order to adapt them."]],
["w-mean","The poet’s later work shows a new [[economy]]: where she once used ten lines to describe a landscape, she now needs only two.",["spareness","prosperity","commerce","cheapness"],"The example contrasts ten lines with two. Here “economy” means using few words, which is spareness.",["lit|“Economy” often refers to wealth, but the example is about the number of lines.","lit|“Economy” often refers to trade, but nothing is bought or sold in the text.","conn|“Cheapness” suggests low quality. The text presents the shorter style as a development."]],
["w-mean","In the narrator’s telling, her grandmother [[commanded]] the kitchen: no pot was moved and no spice added without her approval.",["controlled","overlooked","deserved","requested"],"Nothing happened in the kitchen “without her approval”. She was in charge of it, so “commanded” means controlled.",["lit|A hill can “command” a view, meaning overlook it, but the grandmother is directing people.","lit|“Command respect” means deserve it, but the object here is the kitchen, which she ran.","conn|“Requested” is too weak. Her approval was required."]],

["w-blank","Far from being ____ by the criticism, the young architect seemed energized by it, submitting an even bolder design the following month.",["discouraged","inspired","flattered","informed"],"“Far from” tells you the blank is the reverse of “energized”. Criticism might have been expected to discourage her, but it did not.",["opp|“Inspired” means the same as “energized”, so it creates no contrast after “far from”.","ctx|Criticism does not flatter, so denying it creates no meaningful contrast with “energized”.","ctx|“Informed” is neutral and does not contrast with “energized”."]],
["w-blank","Paleontologist Ines Okoye cautions that the similarity between the two skulls may be ____: unrelated species that eat the same food often evolve the same jaw shape, so resemblance alone does not show common ancestry.",["superficial","inherited","exaggerated","decisive"],"Okoye’s point is that the skulls may look alike without being related. A similarity that exists only on the surface is superficial.",["opp|An inherited similarity would show common ancestry, which is what Okoye doubts.","oos|She does not say the likeness has been overstated. She says it may not mean what it seems to mean.","opp|A decisive similarity would settle the question. She says resemblance alone settles nothing."]],
["w-blank","The critic’s praise was ____: he called the novel “competent” and “never dull,” words that left readers unsure whether he had enjoyed it at all.",["lukewarm","effusive","insincere","scathing"],"“Competent” and “never dull” are weak compliments, and readers could not tell whether he liked the book. Praise with little warmth is lukewarm.",["opp|Effusive praise is warm and abundant. These compliments are faint.","oos|Nothing suggests that he was lying. His praise was simply weak.","conn|“Scathing” describes a harsh attack. He offered mild compliments, not an attack."]],
["w-blank","Because the treaty’s wording was ____, each government could tell its citizens that the agreement meant what they wanted it to mean.",["ambiguous","explicit","binding","controversial"],"Each government could give the treaty a different meaning. Wording that allows more than one reading is ambiguous.",["opp|Explicit wording would allow only one reading.","oos|Whether the treaty must be obeyed does not explain why it could be read in different ways.","oos|The text gives no sign of public dispute. It explains why both sides could claim success."]],
["w-blank","The discovery did not overturn the standard model of the cell so much as ____ it, adding a detail that earlier researchers had no tools to see.",["refine","refute","simplify","popularize"],"“Did not overturn … so much as” calls for a milder action, and “adding a detail” defines it. To refine a model is to improve it with small additions.",["opp|“Refute” means the same as “overturn”, which the sentence rules out.","opp|Adding a detail makes the model more detailed, not simpler.","oos|The text is about scientific content, not about making the model widely known."]],
["w-blank","Sociologist Ravi Menon found that the town’s reputation for hostility to newcomers was ____: in his surveys, recent arrivals reported more invitations from neighbors than residents of any comparable town.",["undeserved","well-earned","understated","deliberate"],"The survey shows that newcomers were welcomed more than elsewhere, so the reputation for hostility does not match the facts. It is undeserved.",["opp|A well-earned reputation would match the facts. The survey contradicts this one.","opp|“Understated” would mean the town is even more hostile than people say.","oos|Nothing suggests that anyone created the reputation on purpose."]],
["w-mean","The geologist described the evidence as [[sound]], noting that three independent laboratories had reproduced the measurements.",["reliable","audible","unharmed","deep"],"Measurements reproduced by three independent laboratories can be trusted. Here “sound” means reliable.",["lit|“Sound” as a noun is something heard, but evidence is not being listened to.","lit|“Safe and sound” means unharmed, but the text is about whether the evidence can be trusted.","lit|“Sound sleep” is deep sleep. That sense does not apply to evidence."]],
["w-mean","Reviewers found the biography [[partial]]: it lingers over the general’s victories while passing quickly over his failures.",["biased","incomplete","brief","affectionate"],"The biography gives generous space to successes and little to failures. That unequal treatment favors its subject, so “partial” means biased.",["lit|“Partial” often means incomplete, but the failures are included. The complaint is about unequal treatment.","oos|The text says nothing about the length of the book.","conn|“Partial to” can mean fond of, but reviewers are describing a fault in the book, not a feeling."]],
["w-mean","The engineer’s solution was [[elegant]]: a single valve, costing almost nothing, replaced a system of pumps and sensors.",["ingeniously simple","fashionable","luxurious","graceful in movement"],"One cheap valve does the work of a complicated system. In science and engineering, an “elegant” solution is one that is clever and simple.",["lit|“Elegant” often means stylish, as in elegant clothes, but a valve is not praised for style.","opp|A luxurious solution would be costly. This one costs almost nothing.","lit|“Elegant” can describe graceful movement, but the text praises simplicity."]],
["w-mean","Historians [[qualify]] the claim that the printing press spread literacy quickly, pointing out that for a century most printed books were bought by people who could already read.",["place limits on","meet the requirements for","officially approve","strengthen"],"The historians add a fact that makes the claim less sweeping. To qualify a claim is to limit it with a reservation.",["lit|“Qualify for” means to meet requirements, but historians are commenting on a claim, not earning a place.","lit|“Qualified” can mean certified, but the historians are not approving the claim.","opp|Their evidence weakens the claim. It does not strengthen it."]]
];

/* Text Structure and Purpose. [[ ]] marks an underlined portion. */
B.tsp = [
["t-purpose","Most people think of deserts as hot, but the definition of a desert depends on rainfall, not temperature. Any region that receives less than about 250 millimeters of precipitation a year qualifies. By that measure, the largest desert on Earth is Antarctica, where the air is so cold and dry that almost no snow falls.",["To correct a common assumption about what makes a region a desert","To explain why Antarctica receives so little snow","To compare the climates of the world’s largest deserts","To argue that scientists should change the definition of a desert"],"The text opens with what “most people think” and then gives the real definition, using Antarctica as a striking example. Its purpose is to correct the assumption that deserts must be hot.",["narrow|The text mentions cold, dry air in one clause only, as part of an example.","oos|Only one desert is described, and no climates are compared.","oos|The text explains the existing definition. It does not ask anyone to change it."]],
["t-purpose","When Naledi opened the workshop door, the smell of cedar shavings met her like an old friend. The lathe stood where her father had left it, a half-turned bowl still fixed in place. She ran a thumb along its rough edge. He had always said a piece told you when it was finished. This one, she thought, was still waiting.",["To show a character’s reflective response to a place connected with her father","To explain how a wooden bowl is shaped on a lathe","To describe a disagreement between a father and his daughter","To show a character deciding to sell her father’s workshop"],"The text follows Naledi as she enters her father’s workshop, notices what he left and thinks about his words. It presents her quiet, reflective reaction to the place.",["oos|The lathe and bowl are part of the setting. No process is explained.","oos|Her father’s saying is remembered warmly. No disagreement appears.","oos|Nothing in the text mentions selling the workshop."]],
["t-purpose","Cities are usually warmer than the countryside around them, a pattern known as the urban heat island effect. Dark roofs and pavement absorb sunlight during the day and release it as heat at night. Trees, by contrast, shade surfaces and cool the air as water evaporates from their leaves, which is why many cities now plant them along their hottest streets.",["To explain a phenomenon and note one measure taken in response to it","To argue that cities should replace pavement with lighter materials","To compare the cost of planting trees with the cost of cooling buildings","To describe how trees take up water from city soil"],"The text names the urban heat island effect, explains its cause and ends with one response: planting trees. It explains a phenomenon and mentions a measure against it.",["oos|Lighter materials are never mentioned, and the text informs instead of arguing.","oos|No costs appear anywhere in the text.","narrow|Evaporation from leaves is one detail. Water uptake from soil is not described at all."]],
["t-purpose","The Chilean poet Gabriela Mistral worked for years as a rural schoolteacher before her poetry made her famous. In 1945 she became the first Latin American author to receive the Nobel Prize in Literature. Even then she continued to write about the subjects she knew from her classrooms: childhood, the land, and the lives of ordinary people.",["To present key facts about a writer’s career and the subjects of her work","To argue that Mistral’s poetry is superior to that of her contemporaries","To explain how the Nobel Prize in Literature is awarded","To criticize the working conditions of rural schoolteachers"],"The text gives Mistral’s early work, her major award and her lasting subjects. It is a short informative overview of her career and themes.",["oos|No other poets are mentioned and no comparison of quality is made.","narrow|The prize is one fact about her. How it is awarded is not explained.","oos|Teaching is mentioned as her background. No working conditions are criticized."]],
["t-struct","For decades, biologists assumed that octopuses were solitary animals that met only to mate. Then divers off the coast of eastern Australia found a site where more than a dozen octopuses lived in dens only a few steps apart, signaling to and even evicting one another. The finding suggests that octopus social behavior is more varied than was thought.",["It presents a long-held view, describes a discovery that challenges it, and states what the discovery implies.","It describes a discovery, explains the method behind it, and lists its weaknesses.","It poses a question, offers two competing answers, and chooses one of them.","It introduces a species, describes its diet, and explains why it is endangered."],"Sentence 1 gives the old assumption (“for decades … assumed”), sentence 2 the discovery (“Then divers … found”) and sentence 3 the implication (“The finding suggests”).",["oos|No method is explained and no weaknesses are listed.","oos|The text contains no question and no pair of competing answers.","oos|Diet and endangerment are never mentioned."]],
["t-struct","Sourdough bread needs no packaged yeast. A baker begins by mixing flour and water and leaving the mixture uncovered. Over several days, wild yeasts and bacteria from the flour and the air multiply in it. Once the mixture bubbles reliably, a portion is added to fresh dough, where the microbes produce the gas that makes the loaf rise.",["It makes a statement about a type of bread and then describes, in order, the process that explains it.","It compares two types of bread and then recommends one of them.","It describes a problem that bakers face and then offers several solutions.","It presents a traditional belief about bread and then shows that the belief is false."],"The first sentence states a fact. The following sentences give the steps in time order (“begins”, “over several days”, “once”), which explain how the bread rises without packaged yeast.",["oos|Only sourdough is described, and nothing is recommended.","oos|No problem is presented. The text explains how a process works.","oos|No belief is presented or shown to be false."]],
["t-func","Monarch butterflies that hatch in late summer do something their parents never did: they fly up to 4,000 kilometers south to a few mountain forests in central Mexico. [[No individual butterfly has made the trip before.]] How they find the same groves each year is still being studied, though researchers know that the insects use the position of the sun as a compass.",["It stresses what makes the migration remarkable, preparing for the question of how the butterflies find their way.","It explains why monarch butterflies leave their summer habitat.","It summarizes what researchers have discovered about monarch navigation.","It suggests that monarch butterflies often fail to reach Mexico."],"The underlined sentence adds a surprising fact: every butterfly is making the trip for the first time. That makes the next sentence’s question, how they find the groves, feel urgent.",["oos|The text never says why the butterflies leave.","swap|The research finding (the sun compass) comes in the last sentence, not the underlined one.","oos|Failure to arrive is never mentioned."]],
["t-func","Community gardens are often praised for the fresh food they produce, but their yields are usually small. [[A study of forty gardens in one city found that the average plot supplied only a few weeks’ worth of vegetables per household each year.]] Their greater value may be social: gardeners in the same study reported knowing far more of their neighbors than non-gardeners did.",["It provides evidence for the claim that community gardens produce little food.","It introduces the main claim that the rest of the text supports.","It presents an objection to the study described in the text.","It explains why gardeners know more of their neighbors."],"Sentence 1 claims that yields are small. The underlined sentence backs this up with a specific study result, so it is evidence for that claim.",["swap|The claim comes in the first sentence. The underlined sentence supports it.","oos|The underlined sentence reports the study. It does not object to it.","swap|Neighbors are discussed in the final sentence, and no explanation of that result is given."]],
["t-purpose","Every spring, the town of Marlow closes one lane of its river road for six weeks. The reason is small and slow: thousands of toads cross the road at night to reach the ponds where they breed. Volunteers carry stragglers across in buckets. Drivers complain, but since the closures began, the toad population has doubled.",["To describe a town’s unusual practice and indicate its result","To argue that Marlow should close the river road permanently","To explain why toads breed in ponds instead of rivers","To criticize drivers who object to wildlife protection"],"The text describes the yearly lane closure, gives its reason and reports the outcome (the population doubled). It describes a practice and its result.",["oos|The closure lasts six weeks, and no permanent closure is proposed.","oos|The text does not explain the toads’ choice of ponds.","narrow|Drivers’ complaints take up three words. The text does not criticize them."]],
["t-struct","The violin and the fiddle are the same instrument; what differs is how they are played. A classical violinist reads from a score and aims for an even, polished tone. A fiddler usually learns tunes by ear and may add slides and drones that a concert hall would not welcome. Many musicians move between the two styles with ease.",["It states that two things are physically identical and then contrasts the ways they are used.","It traces the history of an instrument from its invention to the present.","It argues that one style of playing is harder than another.","It describes an instrument’s parts and then explains how sound is produced."],"The first sentence says the instruments are the same but the playing differs. The next two sentences contrast the violinist’s approach with the fiddler’s.",["oos|No dates, invention or historical development appear.","oos|The styles are contrasted, but neither is called harder.","oos|No parts are described and sound production is not explained."]],

["t-purpose","In the 1920s, astronomer Cecilia Payne proposed that stars are made mostly of hydrogen and helium. Senior astronomers found the idea implausible, and she was persuaded to describe her own result as probably wrong. Within a few years, other researchers had confirmed it. Her conclusion is now a foundation of modern astrophysics.",["To recount how a scientific conclusion that was first doubted came to be accepted","To explain how astronomers measure the composition of stars","To argue that senior scientists should not review the work of junior colleagues","To compare Payne’s theory with later theories of how stars form"],"The text moves from Payne’s proposal to the doubts of senior astronomers, then to confirmation and present-day acceptance. It tells the story of an idea’s path from doubt to acceptance.",["oos|The text never explains how composition is measured.","ext|The text reports one episode. It makes no general argument about scientific review.","oos|No later theories of star formation are mentioned."]],
["t-purpose","The schedule said the ferry left at six. At ten past, Ilya was still on the dock, watching the boat shrink toward the island, his sister’s wedding cake balanced in his arms. He looked at the cake. He looked at the fishing boats tied along the pier. Then he walked toward the nearest one and cleared his throat.",["To show a character facing a setback and beginning to act on a new plan","To explain why the ferry left without one of its passengers","To describe the preparations for a wedding on an island","To show that a character regrets agreeing to deliver a cake"],"Ilya misses the ferry (the setback), looks at the fishing boats and walks toward one. The text shows him starting on another way to reach the island.",["oos|The text never says why he was late or why the ferry did not wait.","oos|The wedding is the reason for his trip, but no preparations are described.","oos|No regret is expressed. His actions show determination."]],
["t-struct","Why do zebras have stripes? One long-standing idea is that stripes confuse predators such as lions. Another is that they help zebras stay cool. The best-supported explanation today, however, involves insects: in field experiments, biting flies landed far less often on striped surfaces than on plain ones.",["It poses a question, mentions two possible answers, and then presents the answer with the strongest support.","It presents a theory, describes an experiment that disproved it, and proposes further research.","It describes an animal’s appearance and then explains how that appearance changes with age.","It lists three explanations and argues that all three are equally likely."],"The text opens with a question, gives two ideas (“one … another”) and then, after “however”, presents the “best-supported” explanation with its evidence.",["oos|No theory is said to be disproved, and no further research is proposed.","oos|Changes with age are never mentioned.","opp|The text singles out one explanation as “best-supported”, so the three are not treated as equal."]],
["t-func","Economists often measure a country’s well-being by its gross domestic product (GDP), the total value of the goods and services it produces. [[But GDP rises when a country rebuilds after a flood and when its citizens buy more medicine because they are sick.]] For this reason, some researchers prefer measures that also track health, education and leisure time.",["It gives examples showing a weakness of the measure described in the first sentence.","It defines a term that is used in the first sentence.","It describes the alternative measures that some researchers prefer.","It argues that floods are good for a country’s economy."],"The underlined sentence starts with “But” and gives two cases in which GDP goes up although people are not better off. These examples expose a weakness of GDP as a measure of well-being.",["swap|The definition of GDP is given in the first sentence itself.","swap|The alternatives are described in the last sentence.","rec|Floods appear as an example of misleading growth. The sentence does not praise them."]],
["t-func","The first photographs required exposures of several minutes, so anything that moved disappeared from the image. An 1838 picture of a Paris boulevard, a street that was busy with carriages, appears completely empty. [[Only one man is visible: he had stopped to have his boots polished and stood still long enough to be recorded.]] He may be the first person ever photographed.",["It describes an exception that illustrates the point made in the first sentence.","It explains why early photographs needed long exposures.","It questions whether the photograph was really taken in 1838.","It introduces a new topic, the history of shoe polishing."],"Moving things vanished from early photographs. The man was recorded only because he stood still, so this exception shows the same rule at work.",["oos|The text never says why long exposures were needed.","oos|The date of the photograph is not doubted.","rec|The boot polishing explains why the man stood still. It is not a new topic."]],
["t-purpose","Coral reefs cover less than one percent of the ocean floor, yet about a quarter of all marine species depend on them at some stage of life. Fish use reefs as nurseries, and the structures protect coasts from storm waves. When reefs die, the effects therefore spread far beyond the corals themselves.",["To emphasize how important coral reefs are in relation to their small area","To explain what causes coral reefs to die","To describe the life cycle of reef fish","To argue that reefs matter more to coastal towns than to marine life"],"“Less than one percent … yet about a quarter” contrasts small area with large importance, and the last sentence draws the consequence. The purpose is to stress how much depends on reefs.",["oos|The text says what happens when reefs die, not why they die.","narrow|Nurseries are mentioned in half a sentence. No life cycle is described.","oos|The text names both benefits and does not rank one above the other."]],
["t-struct","When the town of Brill replaced its streetlights with brighter, whiter lamps, officials expected fewer nighttime accidents. Accident numbers did not change. What did change was the night sky: residents who had once counted hundreds of stars could now see only a few dozen. The council is now debating whether to dim the lamps after midnight.",["It describes a change and its expected benefit, reports the actual results, and notes a response under discussion.","It presents a scientific theory and then gives an example from daily life that supports it.","It compares the lighting policies of two towns and explains why they differ.","It describes a problem, traces its history, and predicts how it will get worse."],"The text gives the change and the expectation, then the real results (no fewer accidents, fewer visible stars), then the council’s debate about a response.",["oos|No scientific theory is presented.","oos|Only one town is discussed.","oos|No history is traced and no worsening is predicted."]],
["t-func","Lichens look like single organisms, but each one is a partnership between a fungus and an alga. The fungus provides structure and holds water; the alga makes food from sunlight. [[Neither partner could survive alone on the bare rock where lichens often grow.]] Together, they are among the first living things to settle on new lava and exposed stone.",["It shows why the partnership matters by noting what each partner could not do without the other.","It explains how the alga makes food from sunlight.","It introduces an exception to the claim that lichens are partnerships.","It describes the places where lichens are most often found."],"After describing each partner’s role, the text states that neither could live alone on bare rock. This underlines the value of the partnership and prepares for the final sentence about settling new stone.",["oos|The sentence does not explain how food is made.","opp|The sentence reinforces the idea of partnership. It is not an exception.","narrow|Bare rock is mentioned, but the sentence’s job is to stress mutual dependence."]],
["t-struct","Ama had rehearsed the speech for a week. She knew where to pause and where to smile. But when she reached the podium and saw her grandmother in the front row, wearing the yellow dress from the old photographs, the sentences left her. She folded the paper, looked up, and began to speak about the dress.",["It describes a character’s careful preparation and then shows an unexpected moment leading her to set that preparation aside.","It describes a character’s fear of speaking and then explains where that fear came from.","It presents a conflict between two characters and then shows how it is resolved.","It describes an event from one character’s point of view and then from another’s."],"The first two sentences show preparation. “But” introduces the surprise (seeing her grandmother), after which she folds the paper and speaks without it.",["oos|Ama is not described as afraid, and no origin of fear is given.","oos|There is no conflict between Ama and her grandmother.","oos|The whole text stays with Ama’s point of view."]],
["t-purpose","Critics of remote work claim that employees are less productive at home. The evidence is less clear than they suggest. In one large study, call-center staff who worked from home handled more calls per shift than those in the office. In another, software teams that never met in person produced fewer new ideas. The effect seems to depend on the kind of work.",["To show that a common claim about remote work is too simple","To argue that remote work makes all employees more productive","To describe the methods of two studies of call-center employees","To explain why software teams prefer to meet in person"],"The text states the critics’ claim, says the evidence is “less clear”, gives one study on each side and concludes that the effect depends on the work. It complicates a simple claim.",["ext|One study showed a loss, so the text does not claim a benefit for all employees.","narrow|Only one study concerns call centers, and no methods are described.","oos|The text reports a result for software teams. It says nothing of their preferences."]],

["t-func","In 1811, the French mathematician Sophie Germain submitted a paper on the vibration of elastic plates to a competition held by the Paris Academy of Sciences. She was the only entrant. [[The judges nevertheless declined to award the prize, citing gaps in her mathematics.]] She revised the work twice and won on her third attempt, in 1816.",["It presents a setback that the following sentence shows Germain overcoming.","It explains why Germain was the only entrant in the competition.","It shows that the judges were unqualified to assess the paper.","It summarizes the mathematical argument of Germain’s paper."],"The underlined sentence reports a failure: no prize despite no competitors. The next sentence shows her revising and winning, so the underlined sentence sets up the obstacle she overcame.",["oos|The text never says why no one else entered.","oos|The judges gave a reason, and the text does not question their ability.","oos|The content of the paper’s argument is not summarized."]],
["t-purpose","Some linguists argue that when a language disappears, a body of knowledge goes with it. The Seri people of northwestern Mexico, for example, have a detailed vocabulary for the sea turtles they once hunted, including words for behaviors that marine biologists documented only recently. Such knowledge is rarely written down, and translation preserves only part of it.",["To support a claim about language loss with a specific example","To describe the hunting methods of the Seri people","To argue that marine biologists should learn the Seri language","To explain why languages disappear"],"The first sentence states the claim, “for example” introduces the Seri turtle vocabulary, and the last sentence explains why the knowledge is at risk. The text supports a claim with an example.",["narrow|Hunting is mentioned in passing. No methods are described.","oos|The text makes no recommendation to biologists.","oos|The text discusses what is lost when languages disappear, not why they disappear."]],
["t-struct","A glacier looks motionless, yet it flows. Snow that survives the summer is buried by later snowfall and slowly compressed into ice. When the ice is thick enough, its own weight makes it deform and slide downhill, sometimes less than a meter a day. At lower, warmer elevations the front melts, and where melting balances flow, the glacier’s edge seems to stand still.",["It states a surprising fact and then explains the process behind it, ending with why the fact is easy to miss.","It describes two types of glacier and explains how they differ.","It presents a problem caused by glaciers and then proposes a solution.","It describes a past belief about glaciers and then explains how it was disproved."],"The first sentence gives the surprise (a glacier flows). The middle sentences explain how ice forms and moves, and the last explains why the edge appears still.",["oos|Only one kind of glacier is described.","oos|No problem or solution appears.","oos|The text does not present an earlier belief or its disproof."]],
["t-func","For most of the twentieth century, textbooks stated that adult brains could not grow new neurons. [[The claim rested largely on the absence of evidence: no one had seen such growth, and the tools to detect it did not exist.]] When researchers in the 1990s labeled dividing cells with chemical markers, they found new neurons forming in the adult hippocampus.",["It points out the weak basis of the claim stated in the first sentence.","It describes the tools that researchers used in the 1990s.","It restates the textbook claim in simpler terms.","It explains why the hippocampus is important for memory."],"The underlined sentence says the textbook claim depended on what had not been seen and on missing tools. That shows the claim was poorly grounded and prepares for its reversal.",["swap|The chemical markers of the 1990s appear in the last sentence.","rec|The sentence does more than repeat the claim. It explains what the claim was based on.","oos|The role of the hippocampus in memory is never mentioned."]],
["t-purpose","Photographs of the Dust Bowl often show abandoned farms, and it is easy to conclude that everyone left. In fact, about three-quarters of the people in the affected region stayed. They planted trees to block the wind, changed how they plowed, and waited. The familiar story of flight leaves out this larger story of endurance.",["To argue that a familiar account of a historical event is incomplete","To explain what caused the Dust Bowl","To describe the hardships of the families who left the region","To compare farming methods before and after the Dust Bowl"],"The text states a common conclusion (“everyone left”), corrects it with “in fact” and says the familiar story “leaves out” those who stayed. It argues that the usual account is incomplete.",["oos|The causes of the Dust Bowl are not discussed.","opp|The text turns attention to those who stayed, not those who left.","narrow|Changed plowing is one detail. No comparison of methods is developed."]],
["t-struct","Marta had always found her uncle’s stories tiresome: the same storms, the same lost nets, the same fish growing larger with each telling. On her first night working his boat, the wind rose just as he had described, and she found her hands doing what his stories had told them to do. She did not interrupt him again.",["It presents a character’s attitude and then describes an experience that changes it.","It describes a dangerous event and then explains what caused it.","It presents two characters’ opposing views and leaves the disagreement unresolved.","It describes a tradition and then explains why it is disappearing."],"Sentence 1 gives Marta’s attitude (the stories are tiresome). Sentence 2 gives the experience that proves their worth, and sentence 3 shows her changed behavior.",["oos|The storm is not explained. It serves to change Marta’s view.","opp|The text ends with a change in Marta, so the matter is resolved.","oos|No tradition is said to be disappearing."]],
["t-func","Urban foxes are bolder than rural ones, and it is tempting to say that city life has made them so. [[But boldness may be what brought them to the city in the first place: timid foxes would be unlikely to settle among people at all.]] Distinguishing between these explanations requires following fox families across generations.",["It offers an alternative explanation for the pattern described in the first sentence.","It provides evidence that city life makes foxes bolder.","It describes the method researchers use to follow fox families.","It concludes that timid foxes cannot survive in cities."],"The first sentence gives one explanation (city life causes boldness). The underlined sentence, beginning “But”, reverses the direction: bold foxes may be the ones that move in.",["opp|The sentence questions that explanation. It does not support it.","swap|The method is mentioned in the final sentence, and only briefly.","ext|The sentence says timid foxes would be unlikely to settle. It draws no firm conclusion."]],
["t-purpose","The first reviewers of Zora Neale Hurston’s 1937 novel “Their Eyes Were Watching God” were divided, and the book soon went out of print. Decades later, a new generation of writers and scholars championed it. Today it is among the most widely taught American novels, a reminder that a book’s first reception does not settle its reputation.",["To use the history of one novel to make a point about how literary reputations change","To summarize the plot of a novel by Hurston","To explain why the first reviewers disliked Hurston’s novel","To argue that novels should not be reviewed when they are first published"],"The text traces the novel’s reception from divided reviews to wide teaching and ends with the general lesson. The novel’s history serves a point about reputation.",["oos|Nothing about the plot is given.","oos|The reviewers’ reasons are not explained.","ext|The lesson is that early reception is not final. Nothing is said against reviewing new books."]],
["t-struct","Hospitals once assumed that alarms made patients safer: the more monitors that could sound, the better. Nurses on a busy ward may now hear hundreds of alarms per shift, most of them false. Studies show that staff begin to tune the sounds out, and real emergencies can be missed. Some hospitals are therefore reducing the number of alarms.",["It presents an assumption, describes an unintended consequence, and notes a change made in response.","It describes a new technology and lists its advantages over an older one.","It presents the results of a study and then questions the study’s methods.","It compares the practices of two hospitals and recommends one of them."],"The text begins with the assumption (more alarms, more safety), shows the consequence (staff tune them out) and ends with the response (“therefore reducing”).",["oos|No new technology is praised.","oos|The studies are accepted, and their methods are not questioned.","oos|No two hospitals are compared."]],
["t-func","The painter Agnes Varga kept every canvas she considered a failure, stacking them face-in along her studio wall. [[Visitors assumed she meant to paint over them.]] She never did. After her death, her notebooks showed that she had studied the stack regularly, listing for each canvas the exact point at which it had gone wrong.",["It presents a reasonable guess that the rest of the text shows to be mistaken.","It explains why Varga considered some canvases failures.","It reveals what Varga wrote in her notebooks.","It criticizes visitors for misunderstanding Varga’s paintings."],"The underlined sentence gives the visitors’ assumption. “She never did” and the notebooks then reveal the real reason she kept the canvases, so the assumption proves wrong.",["oos|The sentence does not say why the canvases failed.","swap|The notebooks are described in the final sentence.","conn|The visitors’ guess is reported neutrally. No one is criticized."]],

["t-purpose","It is often said that medieval people believed the Earth was flat. Yet the scholars of the period routinely described it as a sphere, and a widely used thirteenth-century textbook was titled “On the Sphere of the World.” The flat-Earth story became popular only in the nineteenth century, when writers used it to contrast their own age with an ignorant past.",["To challenge a popular belief about the Middle Ages and explain where it came from","To describe what medieval scholars thought about the size of the Earth","To argue that nineteenth-century writers were more ignorant than medieval scholars","To explain how medieval scholars showed that the Earth is a sphere"],"The text states the popular belief, corrects it with evidence (“Yet”) and then explains the belief’s nineteenth-century origin. It both challenges the belief and accounts for it.",["rec|The text concerns the Earth’s shape. Its size is never discussed.","ext|The writers are said to have spread a false story. No comparison of ignorance is made.","oos|The text says scholars described a sphere. It does not say how they showed it."]],
["t-struct","A language’s grammar can seem like a fixed set of rules, but it is closer to a slow river. English once marked the roles of nouns with endings, as Latin does. Over centuries those endings wore away, and word order took over their work. Speakers at every stage believed that they were simply speaking correctly.",["It offers a comparison to describe how grammar behaves and then illustrates it with a historical change.","It lists the rules of English grammar and then explains exceptions to them.","It contrasts English with Latin to show that Latin is the more logical language.","It describes a debate among linguists and then takes a side in it."],"The first sentence introduces the comparison (grammar as a slow river). The rest illustrates slow change with the loss of noun endings in English.",["oos|No rules or exceptions are listed.","rec|Latin is mentioned only as a point of similarity. No language is called more logical.","oos|No debate among linguists appears."]],
["t-func","Economist Hana Sato studied a town where a new bridge cut the trip to the nearest city from an hour to ten minutes. Planners had predicted that the bridge would bring shoppers into the town. [[Instead, residents began driving to the city’s larger stores, and within five years a third of the town’s shops had closed.]] Sato concluded that better connections can drain small economies as well as feed them.",["It reports an outcome contrary to the prediction, which is the basis for Sato’s conclusion.","It explains why planners expected the bridge to bring shoppers.","It states the general principle that Sato’s study was designed to test.","It describes the method Sato used to collect her data."],"“Instead” signals a result that goes against the planners’ prediction. Sato’s conclusion in the next sentence is drawn from exactly this result.",["oos|The planners’ reasoning is not explained.","swap|The general conclusion comes in the last sentence.","oos|No method of data collection is described."]],
["t-purpose","Sleep researchers long treated the eight-hour night as a biological norm. Historian Roger Ekirch, reading diaries and court records from before the industrial era, found repeated references to a “first sleep” and a “second sleep” separated by an hour or more of quiet wakefulness. The pattern faded as artificial light spread. What we call normal sleep may partly be a product of the lamp.",["To present historical evidence suggesting that a pattern assumed to be natural is partly cultural","To describe the kinds of documents historians use to study daily life","To argue that people should return to sleeping in two periods","To explain how artificial light affects the brain"],"The text sets an assumed “biological norm” against Ekirch’s evidence for two sleeps and ends by suggesting that modern sleep is partly a product of lighting. It questions how natural the norm is.",["narrow|Diaries and court records are his sources, not the subject of the text.","ext|The text describes a past pattern. It does not advise anyone to return to it.","oos|Effects of light on the brain are not explained."]],
