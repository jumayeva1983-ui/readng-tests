["t-struct","A bridge built in 1940 across the Tacoma Narrows twisted itself apart in a moderate wind four months after it opened. Engineers at first blamed the wind’s force alone. Later analysis showed that the narrow, flexible deck had fed its own oscillations, each twist drawing more energy from the airflow. Bridge decks have been tested in wind tunnels ever since.",["It describes an event, gives an early explanation and a later, better one, and notes a lasting consequence.","It describes an engineering principle and then gives three examples of it.","It compares two bridges and explains why only one of them failed.","It presents an argument for a new bridge design and then answers objections to it."],"The event comes first, then the first explanation (“at first blamed”), then the improved one (“later analysis showed”), then the consequence (“ever since”).",["oos|Only one event is described, not three examples of a principle.","oos|No second bridge appears.","oos|No design is argued for and no objections are answered."]],
["t-func","Psychologists have found that people who are asked to explain how a zipper or a flush toilet works usually rate their own understanding much lower afterward. [[The attempt to explain reveals gaps that a general feeling of familiarity had hidden.]] The effect is weaker for facts, such as capital cities, which people either know or do not know.",["It explains why the finding in the first sentence occurs.","It describes how the psychologists designed their experiment.","It gives an example of an object that people misunderstand.","It introduces a finding that contradicts the first sentence."],"Sentence 1 reports that ratings drop after people try to explain. The underlined sentence gives the reason: explaining exposes gaps that familiarity concealed.",["oos|The sentence does not describe the design of the experiment.","swap|The examples (zipper, toilet) are in the first sentence.","opp|The sentence accounts for the finding. It does not contradict it."]],
["t-purpose","The mechanical clock is usually described as a tool for telling time. Historian Lena Fischer suggests that it also changed what time was. Before clocks, an “hour” in much of Europe was one-twelfth of the daylight, longer in summer than in winter. Clocks could not easily follow such hours, so communities gradually adopted equal ones. The instrument reshaped the thing it measured.",["To present a scholar’s view that an invention altered the concept it was built to measure","To explain how the gears of a mechanical clock work","To argue that unequal hours were more practical than equal ones","To describe how daylight changes between summer and winter"],"The text contrasts the usual description of the clock with Fischer’s suggestion and ends by restating it: the instrument reshaped what it measured.",["oos|No mechanism is explained.","oos|The text does not judge which kind of hour was more practical.","narrow|Seasonal daylight is background for the old definition of an hour."]],
["t-struct","Ecologists once treated wildfire purely as destruction. Research in western forests later showed that many tree species need fire: some cones open only in intense heat, and seedlings thrive in the cleared, ash-rich soil. A century of putting out every fire, however, has let dead wood pile up, so that fires now burn hotter than these species can survive.",["It describes a changed understanding of a phenomenon and then explains how an older policy created a new problem.","It presents a problem and then describes two solutions that scientists have tested.","It describes a natural process step by step and ends by predicting its future.","It contrasts two species and explains why one is better adapted to fire."],"The text moves from the old view to the revised one (trees need fire). “However” then shows that long fire suppression has made fires too hot, a problem created by the old policy.",["oos|No solutions are described or tested.","oos|The text makes no prediction about the future.","oos|No two species are contrasted."]],
["t-func","Translator Emi Kondo says that she reads a novel three times before writing a word. On the first reading she simply follows the story. On the second she marks every sentence whose effect depends on sound or rhythm. [[On the third she reads aloud, listening for the voice she will have to rebuild in another language.]] Only then does she begin.",["It completes the description of her preparation by naming what the translation must finally capture.","It explains why translation takes longer than writing a novel.","It contrasts Kondo’s method with the methods of other translators.","It shows that Kondo considers the story less important than the sound."],"The underlined sentence is the last of three steps. It identifies the goal of all her preparation: the voice she must recreate.",["oos|No comparison of time with novel writing is made.","oos|No other translators are mentioned.","ext|She reads for story first and sound later. Nothing says she values one above the other."]],
["t-purpose","Cartographers must flatten a sphere, and every method of doing so distorts something. The familiar Mercator map keeps compass directions true, which made it ideal for sailors, but it enlarges regions far from the equator so much that Greenland appears as large as Africa, a continent fourteen times its size. No flat map is neutral: each one records a decision about what matters most.",["To explain that every map projection involves trade-offs, using one well-known example","To argue that the Mercator map should no longer be used","To describe how sailors navigated before modern instruments","To compare the land areas of Greenland and Africa"],"The first sentence states the general point, the Mercator map illustrates it with an advantage and a distortion, and the last sentence returns to the general point about choices.",["ext|The text notes a distortion. It does not call for the map to be abandoned.","narrow|Sailors are mentioned to explain one advantage of the map.","narrow|The Greenland comparison is an illustration of distortion, not the purpose of the text."]]
];

/* Cross-Text Connections. text = [Text 1, Text 2]; the stem is always custom (6th element). */
B.ctc = [
["c-respond",["Many archaeologists have held that pottery was invented by early farmers. Settled communities that grew grain, the reasoning goes, needed sturdy containers to store their harvests, and people who moved from camp to camp would have had little use for heavy, breakable pots.","Fragments of clay vessels found in caves in East Asia have been dated to thousands of years before farming began in the region. The people who made them lived by hunting, fishing and gathering, and residues inside the pots suggest that they were used for cooking fish."],["By pointing out that pottery was being made by hunter-gatherers long before farming began","By agreeing that only settled communities had a use for pottery","By arguing that the East Asian fragments were probably made by early farmers","By claiming that the first farmers stored grain in baskets, not pots"],"Text 1 says farmers invented pottery. Text 2 reports pots made by hunter-gatherers thousands of years before farming, which directly contradicts that view.",["opp|Text 2 shows people who were not farmers making and using pots.","opp|Text 2 says the makers lived by hunting, fishing and gathering.","oos|Neither text mentions baskets."],"Based on the texts, how would the author of Text 2 most likely respond to the view described in Text 1?"],
["c-respond",["The new novel by Dara Whitlock has one serious flaw: its pace. For two hundred pages the heroine waits in a border town for a permit that never comes, and almost nothing happens. Readers who want a story will lose patience long before the end.","Whitlock’s novel is slow by design. The heroine’s life has been suspended by an office that will not answer her, and the long, uneventful chapters make the reader feel that suspension directly. A faster book would have told us about her waiting; this one makes us wait with her."],["The slow pace is a deliberate choice that lets readers share the heroine’s experience.","The novel is slow, but its final chapters make up for the delay.","The pace is a flaw that Whitlock should correct in a later edition.","Readers who lose patience have chosen the wrong kind of book."],"Text 1 calls the slow pace a flaw. Text 2 says the novel is “slow by design” and that the slowness makes readers feel the heroine’s waiting.",["oos|Text 2 does not mention the final chapters.","opp|Text 2 defends the pace. It does not treat it as a flaw.","conn|Text 2 explains the purpose of the pace. It does not criticize readers."],"Based on the texts, how would the author of Text 2 most likely respond to the criticism in Text 1?"],
["c-relate",["Planting trees is among the most effective ways for a city to cool its streets. Shade lowers the temperature of pavement, and water evaporating from leaves cools the surrounding air. Cities facing hotter summers should plant as many trees as their budgets allow.","Street trees do cool cities, but only living ones. In several large planting campaigns, a third of the new trees died within five years because no one watered or pruned them. Money spent on planting is wasted unless a comparable sum is set aside for care."],["Trees can lower temperatures in cities.","Cities should spend their whole tree budget on planting.","Most newly planted street trees die within five years.","Shade matters more than evaporation in cooling a street."],"Text 1 calls trees an effective way to cool streets, and Text 2 begins “Street trees do cool cities”. That is the point they share.",["opp|Text 2 wants money reserved for care, so it would reject spending everything on planting.","ext|Text 2 says a third died in some campaigns, not most, and Text 1 does not discuss tree deaths.","oos|Neither text ranks shade against evaporation."],"Based on the texts, the authors of both texts would most likely agree with which statement?"],
["c-respond",["Daytime naps are a poor habit for adults. Sleep taken in the afternoon is sleep that will not be needed at night, so people who nap lie awake later and wake less rested. Anyone who has trouble sleeping should give up naps entirely.","In a study led by Priya Raman, adults who napped for about twenty minutes fell asleep at night as quickly as those who did not nap at all. Only naps longer than an hour were followed by delayed and lighter nighttime sleep."],["It is too broad, since short naps did not disturb nighttime sleep in the study.","It is correct, since every nap in the study delayed nighttime sleep.","It is irrelevant, since the study did not measure nighttime sleep.","It is too cautious, since naps of any length improved nighttime sleep."],"Text 1 condemns all naps. Raman’s study found that only long naps disturbed nighttime sleep, so the claim in Text 1 goes too far.",["opp|Twenty-minute naps did not delay nighttime sleep in the study.","opp|The study measured how quickly people fell asleep at night.","ext|Short naps left night sleep unchanged. The study does not say they improved it."],"Based on the texts, how would Raman (Text 2) most likely evaluate the claim made in Text 1?"],
["c-respond",["When young children who are growing up with two languages mix words from both in a single sentence, they show that they have not yet separated the two systems. Such mixing is a sign of confusion and is best discouraged by speaking only one language at home.","Linguists who record bilingual children find that their mixed sentences follow rules. A child will insert a noun from one language into a sentence built in the other, but will almost never break the grammar of either. Mixing of this kind requires knowing both systems well."],["Mixing languages shows command of two grammars, not confusion between them.","Mixing languages is a problem, but children outgrow it without help.","Children mix languages mainly because their parents do.","Bilingual children should learn one language fully before starting another."],"Text 1 treats mixing as confusion. Text 2 says mixed sentences obey the grammar of both languages and require knowing both well.",["opp|Text 2 does not treat mixing as a problem at all.","oos|Text 2 says nothing about parents’ speech.","opp|This is close to the advice of Text 1, which Text 2’s evidence undermines."],"Based on the texts, how would the author of Text 2 most likely respond to the claim in Text 1?"],
["c-respond",["Schools still spend hours teaching children to write by hand, a skill that adults now rarely use. That time would be better spent on typing, which is faster and is what students will need at university and at work.","In experiments by psychologist Jonas Weber, students who took lecture notes by hand remembered the main ideas better a week later than students who typed. Typists tended to copy the lecturer’s words; hand writers, who could not keep up, had to summarize."],["Handwriting has a benefit for learning that the argument in Text 1 overlooks.","Typing is faster than handwriting and should replace it in schools.","Students who type their notes remember lectures best.","Handwriting should be taught only at university."],"Text 1 values handwriting only as a practical skill. Weber’s experiments show an advantage for memory that Text 1 does not consider.",["swap|This is the position of Text 1, not of Weber.","opp|The typists remembered the main ideas less well.","oos|Neither text suggests moving handwriting lessons to university."],"Based on the texts, how would Weber (Text 2) most likely respond to the argument in Text 1?"],
["c-respond",["After wolves returned to one national park, elk numbers fell, and the willows that elk had browsed for decades began to recover along the streams. The wolves, it seems, repaired the whole valley from the top of the food chain down.","The years after the wolves returned were also years of drought, of growing bear populations and of heavy hunting outside the park. Each of these reduced the number of elk. Willow recovery has also been patchy, strong on some streams and absent on others."],["It gives one cause too much credit for a change that had several causes.","It is right that wolves alone explain the recovery of the willows.","It ignores evidence that elk numbers actually rose after the wolves returned.","It underestimates how completely the willows have recovered."],"Text 1 credits the wolves with the change. Text 2 lists drought, bears and hunting as further causes of the elk decline and notes that the recovery is uneven.",["opp|Text 2 names several other causes besides wolves.","opp|Text 2 accepts that elk declined. It disputes the reason.","opp|Text 2 says the recovery is patchy, which is less complete than Text 1 implies."],"Based on the texts, how would the author of Text 2 most likely characterize the conclusion in Text 1?"],
["c-relate",["Roman roads were instruments of conquest. They ran as straight as the land allowed because their builders cared about one thing: moving soldiers quickly to wherever they were needed.","Whatever their first purpose, Roman roads soon carried far more merchants than soldiers. Inns, markets and workshops grew up along them, and goods from distant provinces appear in towns that the roads connected."],["Text 2 accepts that the roads may have begun as military works but stresses their later commercial use.","Text 2 denies that Roman roads were ever used by soldiers.","Text 2 argues that the roads were built by merchants, not by the army.","Text 2 repeats the claim of Text 1 with additional examples."],"“Whatever their first purpose” leaves the military origin unchallenged. Text 2 then shifts attention to trade along the roads.",["ext|Text 2 says merchants outnumbered soldiers, not that soldiers never used the roads.","oos|Text 2 does not say who built the roads.","opp|Text 2 adds a different emphasis. It does not repeat Text 1."],"Which choice best describes the relationship between the two texts?"],
["c-respond",["Birds on remote islands often lose the ability to fly. The usual explanation is simple: with no predators to escape, wings are no longer needed, and over many generations they shrink.","Flight muscles are expensive: they can make up a quarter of a bird’s weight and must be fed even at rest. On islands where food is scarce, birds that put less into wings can put more into survival and eggs. Flightless species have evolved even on islands that have hawks."],["It is incomplete, because saving energy also favors the loss of flight.","It is mistaken, because island birds have never lost the ability to fly.","It is correct, because flightless birds are found only where there are no predators.","It is irrelevant, because flight muscles weigh very little."],"Text 1 explains flightlessness by the absence of predators. Text 2 adds the energy cost of flight and notes flightless birds on islands with hawks, so the first explanation is not the whole story.",["opp|Text 2 itself discusses flightless island species.","opp|Text 2 says flightless species evolved on islands that have hawks.","opp|Text 2 says flight muscles can be a quarter of a bird’s weight."],"Based on the texts, how would the author of Text 2 most likely view the explanation in Text 1?"],
["c-respond",["Students who take music lessons earn higher mathematics scores than those who do not. Schools that want to raise achievement in mathematics should therefore make music lessons compulsory.","Children who choose music lessons tend to come from families with more money and more books, and they often had higher scores before their first lesson. In studies that assigned children to music lessons at random, the gains in mathematics were small or absent."],["The difference in scores probably reflects which students take music, not what music does.","Music lessons raise mathematics scores only when they are compulsory.","Schools should replace some mathematics lessons with music.","Students with high mathematics scores usually dislike music."],"Text 2 points out that music students differed from others before any lessons and that random-assignment studies found little gain. The correlation in Text 1 is therefore not proof of an effect.",["oos|Text 2 does not say that compulsory lessons work better.","oos|Neither text proposes cutting mathematics lessons.","opp|Text 2 implies that high scorers are more likely to take music."],"Based on the texts, how would the author of Text 2 most likely respond to the reasoning in Text 1?"],

["c-respond",["Basic economic theory predicts that when the legal minimum wage rises, employers will hire fewer workers. Labor, like anything else, is bought in smaller amounts when its price goes up.","Economist Lucia Ferrand compared restaurants in pairs of neighboring counties that lie on opposite sides of a state border. When one state raised its minimum wage and the other did not, employment in the two counties stayed nearly identical for the following three years."],["Evidence from comparable counties did not show the job losses that the theory predicts.","The theory is confirmed by the loss of restaurant jobs in the counties she studied.","Minimum wages should be the same in every state.","Restaurants respond to higher wages by raising their prices."],"The theory in Text 1 predicts fewer jobs. Ferrand’s matched counties showed nearly identical employment, so her evidence does not match the prediction.",["opp|Employment stayed nearly identical, so no loss was observed.","oos|Ferrand reports a comparison. She makes no policy proposal in the text.","oos|Prices are not mentioned in either text."],"Based on the texts, how would Ferrand (Text 2) most likely respond to the prediction described in Text 1?"],
["c-respond",["A nineteenth-century critic wrote that photography could never be an art. The painter, he argued, creates every mark on the canvas, while the photographer merely opens a shutter and lets a machine do the work.","A photograph is the result of decisions. The photographer chooses where to stand, what to leave outside the frame, how the light should fall and, above all, the instant at which to release the shutter. Two people with the same camera in the same street will not bring home the same picture."],["It overlooks the choices a photographer makes, which are what make the result personal.","It rightly observes that the camera makes the important decisions.","It applies to early cameras but not to modern ones.","It underestimates how difficult cameras are to operate."],"The critic says the machine does the work. Text 2 lists the photographer’s choices and notes that two people with one camera produce different pictures.",["opp|Text 2 says the photographer, not the camera, makes the decisions.","oos|Text 2 draws no distinction between early and modern cameras.","rec|Text 2 stresses artistic choice, not technical difficulty."],"Based on the texts, how would the author of Text 2 most likely respond to the critic’s argument in Text 1?"],
["c-respond",["The great Maya cities of the southern lowlands were abandoned within about a century. Lake sediments from the region record a series of severe droughts at exactly that time. The conclusion is hard to avoid: the rains failed, and the cities fell.","Drought alone is an awkward explanation for the Maya collapse. Cities in the drier north outlasted those in the wetter south by generations. Inscriptions from the final decades in the south record intensifying wars and the fall of ruling families."],["It leaves out political and military factors that the evidence also points to.","It wrongly assumes that the cities were abandoned at all.","It is supported by the survival of cities in the north.","It relies on inscriptions that are difficult to interpret."],"Text 1 blames drought. Text 2 calls drought alone “awkward” and adds wars and the fall of rulers, so it sees Text 1 as leaving out other causes.",["opp|Text 2 accepts the collapse and discusses its causes.","opp|The survival of cities in the drier north is evidence against a drought-only account.","swap|The inscriptions are Text 2’s own evidence, not Text 1’s."],"Based on the texts, how would the author of Text 2 most likely characterize the conclusion in Text 1?"],
["c-relate",["In the 1940s, the biologist Karl von Frisch proposed that honeybees tell their nestmates where food is by dancing: the angle of the dance indicates direction, and its duration indicates distance. Skeptics replied that recruits might simply follow the scent of flowers on the dancer’s body.","Decades later, researchers fitted tiny radar reflectors to bees that had just watched a dance and tracked them after release. The bees flew in the direction and for the distance that the dance indicated, even when they were released from a spot the dancer had never visited."],["Text 2 describes later evidence that supports the proposal in Text 1 against the skeptics’ objection.","Text 2 shows that the skeptics mentioned in Text 1 were right.","Text 2 describes a different kind of communication in another insect.","Text 2 argues that the proposal in Text 1 can never be tested."],"The tracked bees followed the dance’s direction and distance even from an unfamiliar release point, which scent-following cannot explain. Text 2 supports von Frisch.",["opp|The result contradicts the idea that recruits only follow scent.","oos|Text 2 is about honeybees and the same dance.","opp|Text 2 describes a test of the proposal."],"Which choice best describes the relationship between the two texts?"],
["c-respond",["Online ratings have made shopping safer. A product with thousands of reviews and an average of four and a half stars has been tested by thousands of buyers, and a shopper can trust their combined judgment.","Marketing researcher Kofi Asante compared star ratings for 300 products with the results of independent laboratory tests. The two were only weakly related. People are most likely to post a review, he notes, when they are delighted or furious, so the reviewers are not typical buyers."],["Average ratings are a weak guide to quality because reviewers are not typical buyers.","Ratings become reliable once a product has thousands of reviews.","Laboratory tests are less trustworthy than the experience of buyers.","Most online reviews are written by the sellers themselves."],"Text 1 trusts the combined judgment of reviewers. Asante found ratings only weakly related to tested quality and explains that reviewers are an unrepresentative group.",["swap|This is the claim of Text 1, which Asante’s results undermine.","opp|Asante uses laboratory tests as the standard for judging ratings.","oos|Fake reviews are not mentioned in either text."],"Based on the texts, how would Asante (Text 2) most likely respond to the claim in Text 1?"],
["c-respond",["A research team analyzing the DNA of modern dogs concluded that all of them descend from one population of wolves that was domesticated in a single region. Dogs then spread with people across the rest of the world.","Geneticists who sequenced DNA from the bones of ancient dogs found two deeply separate lineages, one in the east of Eurasia and one in the west, each older than any sign of contact between them. Modern dogs carry traces of both."],["Ancient DNA suggests that dogs may have been domesticated more than once.","The DNA of modern dogs cannot tell us anything about their origins.","Dogs were domesticated in the east and never reached the west.","The team in Text 1 studied wolves instead of dogs."],"Text 1 argues for a single origin. Text 2 reports two old, separate lineages, which points to more than one domestication.",["ext|Text 2 adds ancient DNA. It does not say modern DNA is worthless.","opp|Text 2 describes a western lineage as well as an eastern one.","opp|Text 1 says the team analyzed the DNA of modern dogs."],"Based on the texts, how would the geneticists in Text 2 most likely respond to the conclusion of the team in Text 1?"],
["c-respond",["The poems of Ilse Brandt are famously hard to read, and some critics believe she meant them to be. Difficulty, on this view, was her gate: it kept out casual readers and reserved the poems for a devoted few.","Brandt’s letters tell a different story. She complained when reviewers called her obscure, and her drafts show her replacing rare words with common ones. The difficulty that remains comes from compression. She cut every word a line could live without."],["It mistakes a side effect of her concise style for a deliberate barrier.","It correctly identifies her wish to be read by only a few people.","It ignores the fact that her poems are easy to read.","It depends too heavily on her private letters."],"The critics think the difficulty was intended. Text 2 shows that Brandt tried to be clearer and that the difficulty results from compression, so it was not a gate.",["opp|Her complaints and revisions show that she did not want to exclude readers.","opp|Text 2 admits that difficulty remains.","swap|The letters are Text 2’s evidence against the critics."],"Based on the texts, how would the author of Text 2 most likely respond to the critics’ view described in Text 1?"],
["c-relate",["Office workers who sit for eight hours a day have higher rates of back pain and heart disease than those who move around. Desks that allow people to work standing up are a simple remedy.","Standing still for hours strains the legs and lower back, and studies of shop and factory workers who stand all day show health problems of their own. What the body needs is not a different fixed position but frequent changes of position."],["Sitting without a break for most of the day is bad for health.","Standing desks are the best answer to the problems caused by sitting.","People who stand all day are healthier than people who sit all day.","Back pain is mostly unrelated to posture."],"Text 1 states the harm of sitting directly. Text 2 says the body needs “frequent changes of position” and not a “fixed position”, which also rejects sitting all day.",["swap|Only Text 1 recommends standing desks. Text 2 warns against standing still.","opp|Text 2 reports health problems among workers who stand all day.","opp|Both texts connect back problems with staying in one position."],"Based on the texts, the authors of both texts would most likely agree with which statement?"],
["c-respond",["According to the leading theory, the Moon formed when a body the size of Mars struck the young Earth. Computer models of the collision indicate that most of the debris that became the Moon came from the impacting body, not from Earth.","Rocks brought back from the Moon match Earth’s rocks almost exactly in the ratios of several isotopes. Other bodies in the solar system, such as Mars and most meteorites, differ clearly from Earth in these ratios."],["The models must explain why the Moon is chemically so similar to Earth.","The models are confirmed by the difference between Moon rocks and Earth rocks.","The Moon probably formed far from Earth and was captured later.","Isotope ratios are the same everywhere in the solar system."],"If the Moon were made mostly of another body, it should differ from Earth as Mars and meteorites do. Text 2 shows that it does not, so the models face a problem.",["opp|Text 2 reports a close match, not a difference.","oos|Capture is not suggested in either text, and the match argues against a distant origin.","opp|Text 2 says other bodies differ clearly from Earth."],"Based on the texts, the author of Text 2 would most likely say which of the following about the models described in Text 1?"],
["c-respond",["Tourism has transformed the economy of the island of Tavu. Visitors now spend more than 400 million dollars a year there, a sum larger than all of the island’s exports combined, and the benefits to residents are plain.","Most of Tavu’s large hotels belong to companies based abroad, and most of what guests eat and drink is imported. Economist Mele Tupou estimates that of every dollar a visitor spends, about seventy cents leaves the island within a year."],["Visitor spending overstates the benefit, since most of the money does not stay on the island.","Tourism has brought no money at all to the island.","The island should export more goods to pay for its imports.","Visitors spend less on Tavu than official figures suggest."],"Text 1 judges the benefit by total spending. Tupou estimates that about seventy cents of each dollar leaves, so the benefit to residents is much smaller than the total.",["ext|About thirty cents of each dollar stays, so some money does reach the island.","oos|Tupou makes no recommendation about exports.","rec|Tupou does not dispute how much visitors spend. She says where the money goes."],"Based on the texts, how would Tupou (Text 2) most likely respond to the claim in Text 1 that the benefits to residents are plain?"],

["c-relate",["Why did the Industrial Revolution begin in Britain? Historian Arun Mehta gives a one-word answer: coal. Britain had large deposits close to the surface and close to the sea, so energy was cheaper there than anywhere else in Europe.","Cheap coal mattered, historian Clara Voss agrees, but other regions with cheap coal did not industrialize. In Britain, wages were also unusually high. Only where labor was expensive and energy was cheap did it pay to invent machines that replaced workers with coal."],["Voss accepts the factor that Mehta identifies but argues that it was not enough on its own.","Voss rejects Mehta’s claim that coal was cheap in Britain.","Voss argues that high wages, not coal, explain everything.","Voss and Mehta disagree about when the Industrial Revolution began."],"Voss “agrees” that cheap coal mattered, then notes that other coal regions did not industrialize and adds high wages. Coal was necessary but not sufficient in her view.",["opp|Voss agrees that coal was cheap and that it mattered.","ext|She says both conditions were needed together.","oos|Neither text discusses the date."],"Which choice best describes how Voss’s view (Text 2) relates to Mehta’s view (Text 1)?"],
["c-respond",["Self-control, according to one influential theory, works like a muscle that tires. In early experiments, people who had to resist eating chocolate gave up sooner on a difficult puzzle afterward, as though their willpower had been used up.","When twenty-three laboratories repeated a standard version of the experiment with more than two thousand participants, the average effect was close to zero. Other studies found that people who believe willpower is unlimited show no decline at all."],["They would doubt it, since a large repetition of the experiment found almost no effect.","They would accept it, since the effect appeared in twenty-three laboratories.","They would argue that chocolate is a poor test of self-control.","They would claim that willpower grows stronger each time it is used."],"The theory rests on the early experiments. Text 2 reports that a large repeated study found an effect close to zero, which gives reason to doubt the theory.",["opp|The twenty-three laboratories found an average effect near zero.","oos|Text 2 does not criticize the use of chocolate.","ext|Text 2 reports no decline for some people. It does not claim that willpower grows."],"Based on the texts, how would the researchers in Text 2 most likely regard the theory described in Text 1?"],
["c-respond",["Beneath the forest floor, threads of fungi link the roots of neighboring trees. Through this network, popular accounts say, old “mother trees” recognize their own seedlings and send them sugar, nursing the next generation through the shade.","A team that reviewed the published field studies found that fungal links between trees have been mapped in only a few forest types. Studies that tracked carbon found amounts too small to affect a seedling’s growth, and none showed that trees direct resources to their relatives."],["They go well beyond what field studies have shown so far.","They underestimate how much sugar seedlings receive from older trees.","They are wrong that fungi grow on the roots of trees.","They have been confirmed in every forest type studied."],"The popular accounts describe trees nursing their seedlings. The review found tiny carbon transfers and no evidence of help directed to relatives, so the accounts outrun the evidence.",["opp|The review found the amounts too small to matter.","opp|The review accepts that fungal links exist in some forests.","opp|The links have been mapped in only a few forest types."],"Based on the texts, how would the team in Text 2 most likely characterize the popular accounts described in Text 1?"],
["c-respond",["A good translation, critic Paul Arden writes, is a pane of glass. The reader should look through it at the original and never notice the translator. Any phrase that sounds foreign is a scratch on the glass.","Translator Noor Haidari leaves some scratches on purpose. When a novel’s characters use a form of address that English lacks, she keeps the form and lets the context explain it. A translation that sounds as if it had been written in English, she says, hides the fact that it came from somewhere else."],["Some foreign-sounding phrases are worth keeping because they remind readers of the work’s origin.","A translation should read as though it had been written in English.","Translators should explain every unfamiliar term in a note.","Novels with unfamiliar forms of address cannot be translated."],"Arden wants no trace of foreignness. Haidari keeps some on purpose and objects that a fully smooth translation hides where the book came from.",["swap|This is Arden’s standard, which Haidari rejects.","opp|She lets the context explain the form. Notes are not mentioned.","opp|She translates such novels and keeps the form of address."],"Based on the texts, how would Haidari (Text 2) most likely respond to Arden’s view (Text 1)?"],
["c-respond",["The smaller stones of Stonehenge, the bluestones, came from hills in Wales more than 200 kilometers away. Some geologists have argued that no one carried them: glaciers picked the stones up during an ice age and left them on Salisbury Plain, where the builders found them.","At two rock outcrops in Wales whose chemistry matches the bluestones, archaeologists have found stone wedges, a loading platform built of earth and stone, and hearths dated to about 3400 BCE, a few centuries before the bluestones were set up at Stonehenge."],["Evidence of quarrying at the source suggests that people, not ice, moved the stones.","The bluestones did not come from Wales after all.","Glaciers carried the stones part of the way to Salisbury Plain.","The dates of the hearths are too uncertain to be useful."],"Wedges, a loading platform and hearths at the matching outcrops point to human quarrying shortly before the stones were erected. That favors transport by people.",["opp|Text 2 confirms the Welsh source by matching the chemistry.","oos|Text 2 gives no evidence of partial transport by ice.","opp|The archaeologists use the dates as evidence. They do not question them."],"Based on the texts, how would the archaeologists in Text 2 most likely respond to the geologists’ argument in Text 1?"],
["c-respond",["The cure for congestion is capacity. When a highway is crowded, adding lanes gives the same number of cars more room, and traffic flows again. Cities that refuse to widen their roads condemn their residents to delay.","Transport researcher Elif Kaya examined thirty highway widenings. Within five years, traffic on the widened roads had grown in almost exact proportion to the new capacity, and travel times at peak hours were back where they had started. Faster roads, she found, invite trips that people would otherwise not have made."],["It wrongly assumes that the number of cars stays the same after a road is widened.","It is correct that widened roads stay uncongested for decades.","It overlooks the high cost of building new lanes.","It underestimates how much drivers dislike delay."],"Text 1 speaks of “the same number of cars” with more room. Kaya found that traffic grew to fill the new lanes, so that assumption fails.",["opp|Travel times were back to their starting point within five years.","oos|Kaya’s finding concerns traffic volume, not building costs.","oos|Drivers’ attitudes to delay are not Kaya’s point."],"Based on the texts, how would Kaya (Text 2) most likely respond to the argument in Text 1?"],
["c-relate",["The detective novel is a comforting form. A crime disturbs an orderly world; a clever investigator finds the guilty person; order returns. However dark its events, the genre assures readers that truth can be known and justice done.","That description fits the detective novels of the 1920s and 1930s. It does not fit many written since. In recent examples the culprit is known but untouchable, or the investigation exposes the police themselves, and the final pages restore nothing."],["Text 2 limits the claim in Text 1 to an earlier period of the genre.","Text 2 rejects the claim in Text 1 for every period of the genre.","Text 2 argues that detective novels of the 1920s were not comforting.","Text 2 agrees with Text 1 that recent detective novels restore order."],"Text 2 says the description “fits” the novels of the 1920s and 1930s but not many later ones. It narrows the claim instead of rejecting it.",["ext|Text 2 accepts the claim for the earlier novels.","opp|Text 2 says the comforting description fits those novels.","opp|Text 2 says recent examples “restore nothing”."],"Which choice best describes the relationship between the two texts?"],
["c-respond",["Several small, icy bodies beyond Neptune travel on stretched orbits that point in roughly the same direction. Some astronomers argue that the alignment is no accident: an unseen planet several times the mass of Earth must be herding them.","The distant bodies in question were found by surveys that looked at limited patches of sky during particular seasons. A team that modeled those limits found that the surveys would have been likely to detect aligned orbits even if the true orbits pointed in every direction."],["The alignment may be a result of where and when telescopes searched.","The unseen planet has already been photographed.","The icy bodies are too small for their orbits to be measured.","The alignment proves that the unseen planet exists."],"The team shows that the surveys’ limits could produce an apparent alignment by themselves. The pattern may therefore reflect the search, not a planet.",["oos|No photograph is mentioned in either text.","opp|Their orbits have been measured. The question is how the sample was collected.","swap|This is the position of the astronomers in Text 1."],"Based on the texts, how would the team in Text 2 most likely respond to the astronomers’ argument in Text 1?"],
["c-respond",["People respond to incentives. If parents are often late to collect their children from daycare, the remedy is obvious: charge a fine for each late arrival, and lateness will fall.","Researchers introduced a small fine for late pickup at several daycare centers. Late arrivals roughly doubled. Parents who had hurried out of a sense of obligation to the teachers now seemed to treat the fine as a fee for extra care. When the fine was removed, lateness stayed high."],["It fails to consider that a fine can replace a sense of obligation with a sense of purchase.","It is confirmed by the results at the daycare centers.","It would have worked if the fine had been removed sooner.","It wrongly assumes that parents are often late."],"Text 1 predicts less lateness. In Text 2 lateness doubled, apparently because parents came to see the fine as a price. The prediction ignored that change in meaning.",["opp|Lateness rose, so the prediction was not confirmed.","opp|Lateness stayed high after the fine was removed.","rec|Text 2 does not dispute that lateness occurs. It reports what the fine did."],"Based on the texts, how would the researchers in Text 2 most likely respond to the prediction in Text 1?"],
["c-respond",["Symbolic behavior, such as painting, was long regarded as the mark that separated modern humans from Neanderthals. Neanderthals made tools and used fire, the argument ran, but nothing they left behind shows that they made images.","Red markings on the walls of three caves in Spain lie beneath thin mineral crusts. Dating of the crusts shows that some of the markings are more than 64,000 years old. Modern humans are not known to have reached the region until about 20,000 years later."],["Some cave markings appear to be older than the arrival of modern humans, so Neanderthals probably made them.","Neanderthals never lived in the caves of Spain.","The markings were made by modern humans who arrived earlier than believed.","Mineral crusts cannot be dated reliably."],"The markings are older than any known presence of modern humans in the region. That leaves Neanderthals as their likely makers, against the argument in Text 1.",["opp|The inference in Text 2 depends on Neanderthals being present before modern humans.","oos|Text 2 gives no evidence for an earlier arrival of modern humans.","opp|Text 2 relies on the dating of the crusts."],"Based on the texts, how would the author of Text 2 most likely respond to the argument described in Text 1?"],

["c-respond",["A survey of 12,000 teenagers found that those who spent more hours on social media reported lower well-being. The authors conclude that the platforms are damaging young people and call for strict limits on their use.","Statistician Maren Holt reanalyzed the same kind of survey data. The association is real, she reports, but very small: about the size of the association between well-being and eating potatoes regularly. Surveys of this type also cannot show whether heavy use lowers mood or low mood leads to heavy use."],["The association is too small and too ambiguous to support such a strong conclusion.","The survey shows that social media improves well-being.","No association exists between social media use and well-being.","Strict limits should apply to adults as well as teenagers."],"Holt accepts the association but calls it very small and notes that the direction of cause is unknown. Both points undercut the confident conclusion in Text 1.",["opp|She confirms a small negative association, not a positive one.","opp|She says “the association is real”.","oos|Adults are not discussed in either text."],"Based on the texts, how would Holt (Text 2) most likely respond to the conclusion of the authors in Text 1?"],
["c-relate",["Without the printing press, historian Viktor Lang argues, there would have been no Reformation. Within weeks of 1517, printed copies of Luther’s arguments were circulating across the German lands, and no authority could recall them.","Historian Ada Brenner notes that most people in those lands could not read. Printed pamphlets mattered, she writes, because they reached preachers, students and town officials who were already discontented and who read them aloud in churches and taverns. The press gave a movement a louder voice."],["Brenner treats the press as strengthening a movement that already existed, while Lang treats it as the movement’s necessary cause.","Brenner denies that printed pamphlets played any part, while Lang treats them as important.","Both historians argue that literacy caused the Reformation.","Lang emphasizes preachers, while Brenner emphasizes printers."],"Lang says there would have been no Reformation without the press. Brenner says the press “gave a movement a louder voice”: people were already discontented, and printing amplified them.",["opp|Brenner writes that the pamphlets “mattered”.","opp|Brenner stresses that most people could not read.","swap|Brenner is the one who mentions preachers. Lang stresses printing."],"Which choice best describes a difference between the views of Lang (Text 1) and Brenner (Text 2)?"],
["c-respond",["Species brought by people into regions where they did not evolve are a leading cause of extinction. Conservation agencies should treat every non-native species as a threat and remove it wherever removal is possible.","In parts of California, several native butterflies now lay their eggs mainly on non-native plants, because the native plants they once used have largely disappeared. Ecologist Tomas Reyes warns that clearing those plants would remove the butterflies’ last food source."],["It should be replaced by case-by-case judgment, since some non-native species now support native ones.","It is too weak, since non-native plants are destroying the butterflies.","It is sound, since native butterflies never use non-native plants.","It should apply to plants but not to animals."],"Text 1 sets a blanket rule. Reyes gives a case in which removal would harm native butterflies, which shows that the rule needs exceptions.",["opp|The non-native plants are feeding the butterflies, not destroying them.","opp|Text 2 says the butterflies lay eggs mainly on non-native plants.","oos|Reyes draws no line between plants and animals."],"Based on the texts, how would Reyes (Text 2) most likely respond to the recommendation in Text 1?"],
["c-respond",["Speakers of some languages do not say “left” and “right” but use compass directions for everything: the cup is to the north of the plate. Such speakers stay oriented even indoors. Some linguists conclude that language determines how its speakers think about space.","Cognitive scientist Hui Lin gave speakers of one such language a task in which compass directions were useless. They quickly switched to left and right reasoning and performed as well as English speakers. Language, Lin argues, builds strong habits of attention, but habits are not limits."],["Language influences which ways of thinking are habitual but does not prevent other ways of thinking.","Language has no effect at all on how people think about space.","Speakers of such languages cannot understand left and right.","English speakers think about space more accurately than others."],"The linguists say language “determines” thought. Lin’s participants switched strategies easily, so she concludes that language shapes habits without setting limits.",["ext|Lin says language builds strong habits, which is an effect.","opp|Her participants used left and right reasoning successfully.","opp|Both groups performed equally well in her task."],"Based on the texts, how would Lin (Text 2) most likely respond to the conclusion of the linguists in Text 1?"],
["c-relate",["The paintings of Johannes Vermeer contain effects that the unaided eye does not see: soft, out-of-focus highlights and slightly exaggerated differences in the size of near and far figures. Art historian Petra Aalto concludes that he must have traced images projected by a lens.","No lens or optical device appears in the detailed inventory of Vermeer’s possessions made after his death, and no visitor to his studio mentions one. Historian Marc Olivier suggests that a painter of exceptional patience could have observed such effects in a mirror or a glass of water and reproduced them freehand."],["Vermeer’s paintings show optical effects that call for an explanation.","Vermeer certainly owned a lens.","Vermeer could not have painted such effects without tracing.","The inventory of Vermeer’s possessions is unreliable."],"Aalto begins with the effects, and Olivier offers another way they could have been produced. Both accept that the effects are there and need explaining.",["opp|Olivier stresses that no device is recorded among his possessions.","swap|Only Aalto says he must have traced. Olivier proposes freehand painting.","opp|Olivier uses the inventory as evidence, and Aalto does not mention it."],"Based on the texts, Aalto (Text 1) and Olivier (Text 2) would most likely agree with which statement?"],
["c-respond",["When gut bacteria from anxious mice are transferred to calm mice, the calm mice begin to behave anxiously. Researcher Dev Anand argues that such results show that the bacteria in our intestines shape human moods and that changing them could treat depression.","Many effects found in laboratory mice have failed to appear in people. The human studies of gut bacteria and mood published so far mostly compare groups at one moment, so they cannot show which came first: a change in bacteria or a change in mood, diet and sleep."],["It moves too quickly from results in mice to conclusions about people.","It is undermined by the fact that mice have no gut bacteria.","It is confirmed by human studies that tracked patients over time.","It underestimates how strongly diet shapes the moods of mice."],"Anand reasons from mice to humans. Text 2 notes that mouse effects often fail in people and that the human evidence cannot yet establish cause.",["opp|The experiments in Text 1 depend on mice having gut bacteria.","opp|Text 2 says the human studies mostly compare groups at one moment.","rec|Diet is mentioned for humans, as a possible cause of bacterial change."],"Based on the texts, how would the author of Text 2 most likely respond to Anand’s argument in Text 1?"],
["c-respond",["Patents are the engine of invention. An inventor who can be copied freely has little reason to invest years in a new device. By granting a temporary monopoly, patent law makes that investment worthwhile, and countries without it will produce few inventions.","Economic historian Petra Moser examined the inventions that countries displayed at nineteenth-century world’s fairs. Countries without patent laws showed as many inventions per person as countries with them. Their inventors, however, concentrated on fields such as food processing and dyes, where secrets were easy to keep."],["Patent laws may affect which fields attract inventors more than how much invention occurs.","Patent laws should be abolished because they reduce invention.","Countries without patent laws produced almost no inventions.","World’s fairs displayed only inventions that had been patented."],"Text 1 predicts few inventions without patents. Moser found equal numbers but different fields, which suggests that patents steer invention more than they increase it.",["ext|Moser reports a pattern. She does not say patents reduce invention or call for abolition.","opp|Those countries showed as many inventions per person.","opp|Countries without patent laws also displayed inventions at the fairs."],"Based on the texts, how would Moser (Text 2) most likely respond to the claim in Text 1?"],
["c-respond",["Between about 1400 and 1850 the world passed through the Little Ice Age. Rivers that never freeze today froze regularly, glaciers advanced, and harvests failed. The episode shows how the whole planet can cool for centuries at a time.","A group that combined temperature records from tree rings, corals and ice on every continent found cold periods in most regions during those centuries, but at different times. The coldest decades in the central Pacific came about 200 years before the coldest decades in northwestern Europe."],["The cooling was real in many regions but did not happen everywhere at the same time.","No region of the world cooled between 1400 and 1850.","The Little Ice Age affected only northwestern Europe.","Tree rings and corals give no useful information about past temperatures."],"Text 1 describes a single global episode. Text 2 confirms cold periods in most regions but shows that they came at different times.",["opp|The group found cold periods in most regions.","opp|Cold decades are reported for the central Pacific as well.","opp|The group’s findings are built on those records."],"Based on the texts, how would the group in Text 2 most likely qualify the description in Text 1?"],
["c-respond",["How did singers in societies without writing perform epic poems thousands of lines long? The traditional answer is memory: each singer learned the poem word for word from a teacher and repeated it exactly.","Scholars who recorded epic singers in the Balkans in the 1930s found that no two performances of a song were the same, even by one singer on successive days. The singers built each line as they sang it, drawing on a stock of ready-made phrases. Asked to compare two versions, they insisted that the songs were identical."],["Singers recomposed the poem at each performance and did not recite a fixed text.","Singers repeated their poems exactly, as they themselves reported.","Epic poems were too long for any singer to perform.","The singers had secretly learned their songs from written copies."],"The traditional answer is exact memorization. The recordings show that every performance differed and that lines were built from stock phrases, so the poems were recomposed each time.",["rec|The singers said the versions were identical, but the recordings showed that they were not.","opp|Text 2 describes actual performances.","oos|Written copies are not mentioned."],"Based on the texts, how would the scholars in Text 2 most likely respond to the traditional answer described in Text 1?"],
["c-respond",["Expert performance, a popular account holds, is a matter of hours. Anyone who completes roughly ten thousand hours of focused practice in music, chess or sport will reach the top level; talent is a myth.","A team that pooled the results of 88 studies found that the amount of practice accounted for only a minority of the differences in skill among musicians and among chess players. Some players reached master level after far fewer hours than others who never reached it."],["Practice matters, but it leaves most of the difference between performers unexplained.","Practice has no connection with skill.","Ten thousand hours is too few to master chess.","Talent is a myth, as the differences among chess players show."],"The team found that practice explains a minority of the differences, and that some people reach master level with far less practice than others who fail. Hours alone are not the whole story.",["ext|Practice accounted for part of the differences, so it is connected with skill.","oos|The team does not propose a larger number of hours.","opp|Different results from similar practice suggest that something besides practice matters."],"Based on the texts, how would the team in Text 2 most likely respond to the account described in Text 1?"]
];

/* Central Ideas and Details. i-main uses the default stem; i-detail needs a custom stem. */
B.cid = [
["i-main","Sea otters eat sea urchins, and sea urchins eat kelp. Along coasts where otters were hunted out in the nineteenth century, urchins multiplied and grazed the kelp forests down to bare rock. Where otters have returned, the kelp has grown back, and with it the fish and seabirds that shelter there.",["The presence of sea otters indirectly protects kelp forests and the animals that depend on them.","Sea urchins are the most destructive animals on the coast.","Sea otters were hunted heavily in the nineteenth century.","Kelp forests grow back quickly after any kind of damage."],"The text links otters to urchins and urchins to kelp, then shows what happens without otters and with them. The main idea is that otters keep kelp forests, and their inhabitants, alive.",["ext|Urchins overgraze only where otters are missing, and no ranking of animals is given.","narrow|The hunting is one detail that sets up the main point.","oos|The text describes recovery after otters return, not after any damage."]],
["i-main","Wen had practiced the difficult passage for weeks, and tonight her fingers found every note. Yet as the last chord faded and the applause began, she felt strangely flat. Walking home, she understood why: she had played the piece exactly as her teacher played it. Nothing in it had been hers.",["Wen realizes that playing flawlessly is not the same as playing in her own way.","Wen is disappointed because she made mistakes during the concert.","Wen’s teacher is unhappy with the way she played.","Wen decides to give up the piano after the concert."],"Wen plays every note correctly but feels flat, and she understands that the performance copied her teacher. The text is about that realization.",["opp|Her fingers “found every note”, so there were no mistakes.","oos|The teacher’s reaction is never described.","oos|Nothing suggests that she will stop playing."]],
["i-detail","The ostrich cannot fly, but it is far from defenseless. It can run at seventy kilometers an hour for long distances, faster than most predators can manage. If cornered, it kicks forward with a foot that carries a ten-centimeter claw. And its eyes, the largest of any land animal, let it spot danger from far away.",["It can see threats at a great distance.","It can make short flights when chased.","It hides its head in the sand.","It lives in large herds for protection."],"The last sentence says its eyes “let it spot danger from far away”. That is a stated way of avoiding predators.",["opp|The first sentence says the ostrich cannot fly.","oos|Hiding its head is never mentioned in the text.","oos|Herds are not mentioned."],"According to the text, what is one way the ostrich protects itself from predators?"],
["i-detail","In the 1850s, Eunice Foote filled glass cylinders with different gases and set them in the sun. The cylinder of carbon dioxide grew warmest and took the longest to cool. Foote concluded that an atmosphere richer in that gas would give Earth a higher temperature. Her paper was presented at a scientific meeting by a male colleague and was then largely forgotten for more than a century.",["That more carbon dioxide in the atmosphere would make Earth warmer","That glass cylinders trap more heat than metal ones","That sunlight is stronger in summer than in winter","That her paper should be presented by a colleague"],"The text states her conclusion directly: an atmosphere richer in carbon dioxide “would give Earth a higher temperature”.",["oos|No metal cylinders appear in the text.","oos|The seasons are not discussed.","rec|Who presented the paper is a fact about its history, not a conclusion from her experiment."],"According to the text, what did Foote conclude from her experiment?"],
["i-main","For centuries, Venice has been protected from the sea by the shallow lagoon around it. The same lagoon now threatens it: as sea level rises and the ground slowly sinks, high tides flood the city’s squares dozens of times a year. A system of mobile barriers can close the lagoon’s inlets during the highest tides, but engineers disagree about how long it will be enough.",["Venice faces increasingly frequent flooding, and the long-term success of its defenses is uncertain.","Venice was built in a lagoon to protect it from attack.","Mobile barriers have ended flooding in Venice.","The ground beneath Venice is sinking faster than sea level is rising."],"The text describes the growing flood threat and ends with doubt about how long the barriers will work. Both parts belong in the main idea.",["narrow|Past protection is background to the present threat.","opp|Engineers disagree about how long the barriers will be enough.","oos|The text names both causes but does not compare their speed."]],
["i-detail","When the letter came, Olu did not open it at once. He set it on the shelf above the stove, where the steam from the kettle could not reach it, and went on mending the net. His mother watched him from the doorway. “It will say the same thing whether you read it now or after supper,” she said. He kept his eyes on the knots.",["He continues with his work and leaves it unopened.","He reads it aloud to his mother.","He hides it so that his mother will not see it.","He throws it into the stove."],"He “did not open it at once”, put it on the shelf and “went on mending the net”.",["opp|He has not opened the letter, so he cannot read it aloud.","opp|His mother watches him and speaks about the letter, so it is not hidden from her.","rec|The stove is mentioned only as the place below the shelf."],"According to the text, what does Olu do when the letter arrives?"],
["i-main","The modern pencil contains no lead. Its core is graphite mixed with clay, a recipe developed in France in the 1790s when war cut off supplies of pure English graphite. More clay makes a harder, paler line; less makes a softer, darker one. The grades stamped on pencils today still describe that mixture.",["The pencil’s graphite-and-clay core was invented in response to a shortage and still determines how pencils are graded.","Pencils once contained lead but no longer do.","English graphite is purer than French graphite.","Soft pencils are more useful than hard ones."],"The text explains what the core is made of, why the recipe was developed and how the mixture relates to today’s grades.",["oos|The text says the modern pencil has no lead. It does not say pencils once did.","narrow|The purity of English graphite is a background detail.","oos|No grade is called more useful."]],
["i-detail","City pigeons seem to wander at random, but they are creatures of habit. Researchers who fitted pigeons in one city with small tracking tags found that each bird visited the same few feeding sites day after day, often arriving just before a market opened or a café put out its tables.",["That the pigeons returned to the same feeding places on a regular schedule","That the pigeons flew to a different part of the city each day","That the pigeons avoided places where people gather","That the tags made the pigeons fly more slowly"],"The researchers found that each bird “visited the same few feeding sites day after day”, often at set times.",["opp|The birds kept to the same few sites.","opp|Markets and cafés are places where people gather.","oos|No effect of the tags on flight is mentioned."],"According to the text, what did the researchers find?"],
["i-main","The saxophone was invented in the 1840s for military bands, and for decades classical composers mostly ignored it. Its fortunes changed in the United States in the 1920s, when jazz musicians discovered how closely its tone could imitate the human voice. Within a generation, an instrument designed for the parade ground had become the sound of the nightclub.",["The saxophone became famous through a kind of music different from the one it was designed for.","Classical composers were wrong to ignore the saxophone.","The saxophone is easier to play than other band instruments.","Jazz began in the United States in the 1920s."],"The text follows the saxophone from military bands to jazz. The main idea is the change from its intended use to the use that made it famous.",["oos|The text reports that composers ignored it. It does not judge them.","oos|Ease of playing is not mentioned.","rec|The text says when the saxophone’s fortunes changed, not when jazz began."]],
["i-detail","Paper wasps build their nests from wood. A female scrapes fibers from a fence post or dead branch with her jaws, chews them with saliva into a paste, and spreads the paste in thin layers that dry into a light, gray paper. Wasps on the same nest recognize one another by the markings on their faces.",["By the patterns on one another’s faces","By the smell of the nest paper","By the sound of their wings","By the shape of the cells they build"],"The last sentence says the wasps recognize one another “by the markings on their faces”.",["oos|Smell is not mentioned in the text.","oos|Wing sounds are not mentioned.","rec|Nest building is described, but it is not how the wasps identify one another."],"According to the text, how do paper wasps on the same nest recognize one another?"],

["i-main","Before standard time zones, every town in North America set its clocks by its own noon, so that the time in one city might be twelve minutes ahead of the time in the next. This caused little trouble while travel was slow. Once trains could cross several hundred kilometers in a day, the confusion became dangerous, and in 1883 the railroads themselves divided the continent into zones.",["Standard time zones were created because fast rail travel made local times unworkable.","Towns in North America once set their clocks by the sun.","Trains in the nineteenth century were often late.","Governments forced the railroads to adopt time zones."],"The text explains the old system, why it had worked and why railways made it dangerous, which led to the zones. The main idea is that cause and its result.",["narrow|Local noon is the background, not the main point.","oos|Lateness is not mentioned.","opp|The railroads “themselves” created the zones."]],
["i-main","I kept the garden because my mother had kept it, and for the first year I resented every weed. The beans did not care what I felt. They climbed the strings she had tied, flowered and set pods, and one evening in August I found myself standing among them with a full basket, unwilling to go inside.",["The narrator’s reluctant care for an inherited garden turns into attachment.","The narrator plans to plant more beans the following year.","The narrator’s mother was a more skillful gardener than the narrator.","The narrator resents the mother for leaving the garden behind."],"The narrator starts by resenting the work and ends “unwilling to go inside”. The text shows that change of feeling.",["oos|No plans for the next year are mentioned.","oos|The two are never compared as gardeners.","rec|The resentment is directed at the weeds, and it fades by the end."]],
["i-detail","Honey almost never spoils. It contains so little water, and so much sugar, that bacteria landing in it lose their own water and die. Bees also add an enzyme that produces small amounts of hydrogen peroxide, which is toxic to microbes. Jars of honey thousands of years old have been found in tombs, crystallized but still safe to eat.",["Its low water content kills bacteria by drawing water out of them.","It is stored by bees in sealed wax cells.","It crystallizes when it is kept for a long time.","It was placed in tombs with great care."],"The second sentence gives the reason: honey has so little water that bacteria “lose their own water and die”.",["oos|Wax cells are not mentioned in the text.","rec|Crystallizing is something that happened to the old honey, not a reason it stayed safe.","rec|The tombs are where old honey was found. They do not explain why it kept."],"According to the text, what is one reason that honey resists spoiling?"],
["i-detail","Economist Farah Siddiqui studied a program that gave small cash grants to street vendors in three cities. A year later, vendors who had received grants earned on average 20 percent more than those who had not. The gain was concentrated among vendors who used the money to buy stock in bulk; those who spent it on better stalls saw almost no change.",["Those who bought their goods in large quantities","Those who built better stalls","Those who worked in the largest of the three cities","Those who received their grants later than the others"],"The gain “was concentrated among vendors who used the money to buy stock in bulk”.",["opp|Vendors who spent on stalls “saw almost no change”.","oos|The cities are not compared.","oos|The timing of the grants is not discussed."],"According to the text, which vendors benefited most from the grants?"],
["i-main","Glass frogs, small tree frogs of Central and South America, have skin so clear that their organs can be seen from below. Researchers recently found that when the frogs sleep, they pack nearly all of their red blood cells into the liver, which is wrapped in reflective tissue. With the red cells hidden, the sleeping frog becomes two to three times more transparent, and harder for predators to see.",["Glass frogs increase their transparency during sleep by concentrating red blood cells in the liver.","Glass frogs are the only transparent animals in Central and South America.","The liver of a glass frog is larger than its other organs.","Predators cannot see glass frogs at any time of day."],"The text presents a finding: the frogs hide red blood cells in the liver while asleep, which makes them more transparent and harder to see.",["ext|The text does not claim that no other animal there is transparent.","oos|The size of the liver is not discussed.","ext|The frogs become “harder” to see while sleeping, not invisible at all times."]],
["i-detail","The first public library in the town of Ashby opened in 1903 in two rooms above a hardware store. Its founder, Ruth Calder, stocked it with her own books and charged no fee, against the advice of the town council, which feared that free books would be stolen. In the first year, 4,000 loans were recorded and eleven books were lost.",["It worried that books offered without charge would be taken and not returned.","It believed that the rooms above the hardware store were too small.","It wanted Calder to buy new books for the library.","It expected that few people would want to borrow books."],"The council “feared that free books would be stolen”, which is why it advised against charging no fee.",["oos|The size of the rooms is not given as an objection.","oos|The council’s concern was about fees, not about new books.","oos|The council feared theft, not a lack of interest."],"According to the text, why did the town council advise against Calder’s plan?"],
["i-main","Some stars vary in brightness on a regular schedule. In the early twentieth century, Henrietta Leavitt noticed that for one class of these stars, the longer the cycle, the greater the star’s true brightness. Astronomers could therefore time a star’s cycle, work out how bright it really was, compare that with how bright it appeared, and calculate its distance. Her rule became the first reliable yardstick for measuring the distances to other galaxies.",["Leavitt’s discovery about variable stars gave astronomers a way to measure very great distances.","Leavitt was the first astronomer to observe stars that vary in brightness.","Most stars change in brightness on a regular schedule.","Astronomers could not see other galaxies before Leavitt’s work."],"The text explains Leavitt’s rule and how it turns a star’s cycle into a distance. Its main point is the measuring method her discovery made possible.",["oos|She noticed a pattern among such stars. The text does not say she was first to observe them.","ext|The text says “some stars”, not most.","oos|Her rule measured distances. Whether galaxies could be seen is not discussed."]],
["i-detail","The road to the quarry had not been used in years, and grass grew down its center. Halima walked it anyway, counting fence posts as her brother had taught her, until she reached the forty-first. There the wire had been cut and carefully twisted back so that the gap would not show. Someone, she thought, still comes here.",["A fence wire that has been cut and twisted back into place","Fresh tire tracks in the grass","A light in the quarry at night","Her brother’s footprints on the road"],"At the forty-first post she finds wire that “had been cut and carefully twisted back”, and she concludes that someone still comes there.",["oos|No tire tracks are mentioned. Grass grows down the center of the road.","oos|No light is mentioned.","rec|Her brother taught her to count posts. No footprints appear."],"According to the text, what leads Halima to think that someone still visits the place?"],
["i-main","Hospitals have long used checklists for surgery, but a study led by Dr. Anjali Rao suggests that the list matters less than how it is used. In operating rooms where every member of the team spoke a line of the checklist aloud, complications fell by a third. Where one nurse ticked the boxes silently, they did not fall at all.",["A surgical checklist reduces complications only when the whole team takes an active part in it.","Surgical checklists do not reduce complications.","Nurses should not be responsible for surgical checklists.","Most hospitals use surgical checklists incorrectly."],"The study contrasts two ways of using the same list and finds a benefit only where everyone spoke. The main idea is that active use by the team is what counts.",["ext|Complications fell by a third where the whole team took part.","oos|The contrast is between silent and spoken use, not about who should be in charge.","oos|The text does not say how most hospitals use checklists."]],
["i-detail","The Inca built some 40,000 kilometers of roads through the Andes without wheeled vehicles or horses. Messages traveled by relay: runners stationed a few kilometers apart carried spoken messages and knotted cords called khipu from one post to the next. In this way news could cover 240 kilometers in a single day.",["Runners passed them from one station to the next.","Riders carried them on horseback.","They were sent in wheeled carts.","Each runner carried a message for the whole journey."],"The text says messages traveled “by relay”, with runners stationed a few kilometers apart handing them on.",["opp|The Inca had no horses.","opp|The Inca had no wheeled vehicles.","opp|A relay means each runner covered only a short section."],"According to the text, how were messages carried along the Inca roads?"],

["i-main","The stone statues of Easter Island weigh many tons, and how they were moved from the quarry was long a puzzle. Islanders’ traditions say that the statues walked. In 2012, a team showed that eighteen people with three ropes could rock a five-ton replica from side to side and move it forward upright, in a motion that looks very much like walking.",["An experiment suggests that the statues may have been moved upright by rocking, as islanders’ traditions describe.","The statues of Easter Island were carved from the island’s hardest stone.","Moving the statues required thousands of workers.","Islanders’ traditions about the statues are not meant to be taken seriously."],"The text sets a puzzle, mentions the tradition that the statues walked and reports an experiment that makes the tradition plausible.",["oos|The hardness of the stone is not mentioned.","opp|The experiment needed only eighteen people.","opp|The experiment gives the tradition practical support."]],
["i-main","No one ever told me that the river was dangerous. They told me instead about my great-uncle, who could swim like a fish and who went in one spring morning after a dog. The story was never finished in my hearing. It did not need to be. I learned to swim in the pond.",["The narrator learned to fear the river through a family story and not through a direct warning.","The narrator’s great-uncle was the best swimmer in the family.","The narrator disobeyed the family and swam in the river.","The narrator believes that ponds are more dangerous than rivers."],"The narrator was never warned directly. The unfinished story about the great-uncle taught the lesson, and the narrator stayed out of the river.",["narrow|His skill is a detail that makes the unfinished story more frightening.","opp|The narrator learned to swim in the pond.","opp|Choosing the pond shows that the narrator saw it as the safer place."]],
["i-detail","Linguist Sione Mata studied how a new word spreads through a city. He tracked a slang term for “excellent” in two million public social media posts. The word appeared first among teenagers in two neighborhoods, spread within months to teenagers across the city, and reached adults only after it began appearing in advertisements, by which time the teenagers were abandoning it.",["After it was used in advertisements","When teenagers across the city first adopted it","Before it appeared in the two neighborhoods","After teenagers had completely stopped using it"],"The word “reached adults only after it began appearing in advertisements”.",["swap|The citywide spread among teenagers came earlier, before adults used the word.","opp|The word started in the two neighborhoods.","ext|Teenagers “were abandoning” it at that time. The text does not say they had stopped completely."],"According to the text, when did adults begin to use the word?"],
["i-main","It is tempting to picture the Sahara as an ancient sea of sand, but about 6,000 years ago much of it was grassland dotted with lakes. Rock paintings deep in the desert show giraffes, cattle and people swimming. The change came when a slow shift in Earth’s orbit weakened the summer rains; within a few centuries, by some estimates, the green landscape was gone.",["The Sahara was once a green region and became a desert relatively quickly after the rains weakened.","Rock paintings are the best evidence of ancient climates.","The Sahara is the oldest desert on Earth.","Giraffes once lived farther north than they do today."],"The text corrects the picture of an ancient desert, gives evidence of a green Sahara and explains the fast change. The main idea covers both the green past and the change.",["ext|The paintings are one piece of evidence. They are not ranked against other kinds.","opp|The text says the desert is younger than people imagine.","narrow|Giraffes in the paintings are one supporting detail."]],
