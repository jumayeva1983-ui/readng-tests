["n-sci","The flowers of one desert plant open only after sunset. They are pale, which makes them visible in dim light, and strongly scented. Bees, the main pollinators of most plants in the region, are inactive at night, while several species of moth fly only after dark. It is therefore likely that ____",["the plant is pollinated mainly by moths and not by bees.","the plant does not need pollinators in order to reproduce.","bees in the region are attracted to pale, scented flowers.","moths in the region are active mostly during the day."],"The flowers are open only when bees are inactive and moths are flying, and their color and scent suit the dark. Moths are the likely pollinators.",["leap|Nothing suggests the plant can do without pollinators. Its flowers are built to attract them.","opp|Bees are inactive when these flowers are open.","opp|The text says the moths fly only after dark."]],
["n-hum","The painter Elena Varga signed her early canvases with her full name and her later ones with only her initials. A landscape long thought to be an early work has no visible signature, but cleaning has revealed the initials “E.V.” under a layer of varnish. This discovery suggests that ____",["the landscape was painted later in Varga’s career than had been thought.","the landscape was painted by another artist with the same initials.","Varga signed all of her paintings with her initials.","the varnish was applied by Varga herself."],"Initials alone were her later practice. A painting signed with initials therefore belongs with the later works, not the early ones.",["oos|The text gives no reason to suspect a different painter.","opp|The text says she signed early works with her full name.","oos|Who applied the varnish is not something the evidence addresses."]],
["n-sci","In streams where predatory fish are common, guppies mature earlier and at a smaller size than guppies in streams without predators. When researchers moved guppies from a stream with predators to one without, the descendants of those guppies, after several generations, matured later and at a larger size. These results suggest that ____",["the presence of predators favors guppies that mature early.","guppies mature early because streams with predators are warmer.","predators prefer to eat small guppies.","guppies cannot survive in streams without predators."],"Early maturing is found with predators and fades over generations once predators are gone. The predators are what favors it.",["oos|Water temperature is not mentioned.","oos|The text does not say which guppies predators prefer.","opp|The moved guppies and their descendants lived on for generations without predators."]],
["n-hum","A town made its buses free in the hope of reducing car traffic. Bus ridership rose by 40 percent in the first year, but traffic counts on the main roads did not change. A survey found that most of the new riders had previously walked or cycled for the same trips. The town’s experience suggests that ____",["free buses mainly attracted people who had not been driving, so they did little to reduce car use.","free buses caused more people to buy cars.","the town’s residents did not notice that buses had become free.","walking and cycling are less healthy than riding the bus."],"Ridership rose, yet traffic stayed the same, and the new riders came from walking and cycling. The policy did not move drivers out of their cars.",["oos|Nothing indicates that car ownership rose. Traffic was unchanged.","opp|A 40 percent rise in ridership shows that people responded to the change.","oos|Health is not discussed."]],
["n-hum","A songbook printed in 1850 states that a certain ballad was composed in 1790. One verse of the ballad, however, describes a traveler crossing a particular iron bridge that is known to have been built in 1832. Scholars therefore conclude that ____",["at least that verse was written later than the date the songbook gives.","the songbook was printed earlier than 1850.","the iron bridge was actually built before 1790.","the ballad was not popular when the songbook was printed."],"A verse cannot describe a bridge 42 years before it existed. That verse, at least, dates from 1832 or later.",["oos|The bridge evidence bears on the ballad’s date, not the printing date.","opp|The text says the building date of the bridge is known.","oos|Popularity is not addressed."]],
["n-sci","Some fish that live in completely dark caves have no working eyes. Their embryos, however, begin to form eyes in the same way as the embryos of related fish that live in rivers; the eye tissue then stops growing and is absorbed. Biologists take this as evidence that ____",["the cave fish are descended from ancestors that had working eyes.","the cave fish will regain their sight if they are moved to a river.","eyes are harmful to fish that live in rivers.","the river fish are descended from blind cave fish."],"Embryos that start to build eyes and then lose them carry a developmental program inherited from sighted ancestors.",["leap|Nothing shows that an individual fish could regrow eyes.","oos|The text does not suggest that eyes harm river fish.","swap|The direction is reversed. Eye formation in cave embryos points to sighted ancestors."]],
["n-hum","A café raised the price of a cup of coffee by 10 percent. Over the following month, the number of cups it sold fell by 2 percent, and its other sales did not change. It can reasonably be concluded that during that month ____",["the café’s income from coffee increased.","the café’s income from coffee decreased.","the café lost most of its customers.","customers bought more food to go with their coffee."],"Each cup brought in 10 percent more, and only 2 percent fewer cups were sold. The gain per cup outweighs the lost sales, so coffee income rose.",["opp|A 2 percent drop in cups is smaller than the 10 percent rise in price.","ext|Sales of coffee fell by only 2 percent.","opp|The text says other sales did not change."]],
["n-hum","The diaries of novelist Ruth Amsel show that she wrote only between six and ten in the morning and never at any other time of day. From 1931 to 1936 she published nothing. During exactly those years, records show, she taught at a school whose classes began at seven. The most reasonable explanation is that ____",["her teaching took up the only hours in which she was able to write.","she had lost interest in writing novels.","her publisher refused her manuscripts during those years.","she wrote several novels in the evenings while teaching."],"Her only writing hours were six to ten in the morning, and school began at seven. The gap in her publications matches the years her mornings were taken.",["oos|Nothing in the diaries or records indicates a loss of interest.","oos|No refused manuscripts are mentioned.","opp|The diaries say she never wrote at any other time of day."]],
["n-sci","Trees add one growth ring a year, wide in wet years and narrow in dry ones, so the pattern of rings in a region is like a calendar. The rings of an oak beam in an old farmhouse match the regional pattern for the years 1610 to 1702, and the outermost ring, just under the bark, corresponds to 1702. The farmhouse, therefore, ____",["cannot have been built before 1702.","must have been built in 1610.","was built from a tree that was 200 years old.","is older than any other house in the region."],"The tree was still growing in 1702, so it was cut down in that year or later. A house containing its beam cannot be older than that.",["data|1610 is when the surviving rings begin, not when the tree was cut.","data|The rings cover 1610 to 1702, about 92 years.","oos|No other houses are mentioned."]],
["n-sci","In one experiment, students were asked to walk into a room of their classmates wearing a T-shirt with an embarrassing picture on it. Afterward, the students guessed that about half of the people in the room had noticed the shirt. In fact, only about a quarter had. The result suggests that people ____",["tend to overestimate how much attention others pay to them.","pay close attention to what others are wearing.","are rarely embarrassed in front of their classmates.","notice embarrassing details more often than ordinary ones."],"The wearers guessed half, and the true figure was a quarter. They believed they were noticed about twice as much as they were.",["opp|Three-quarters of the observers did not notice the shirt.","oos|The students’ level of embarrassment was not measured.","oos|No comparison with ordinary details was made."]],

["n-sci","Male frogs of one species call at a higher pitch in noisy mountain streams than in quiet ponds, which makes their calls easier to hear over rushing water. When researchers played recordings of stream noise to males from quiet ponds, the males did not change the pitch of their calls. This finding suggests that the higher pitch of stream frogs ____",["is an inherited difference and not an immediate reaction to noise.","is something each frog learns from older males.","makes their calls harder for females to hear.","would disappear if the streams became quiet."],"If pitch were an immediate reaction, pond males would have raised it when they heard the noise. They did not, so the difference is likely built in.",["oos|Learning from older males is not tested or mentioned.","opp|The text says the higher pitch makes calls easier to hear.","leap|Males did not adjust to noise, so there is no reason to expect a quick change when noise stops."]],
["n-hum","The earliest surviving letter between two merchants, dated 1742, concerns a shipment of cloth. In it, one merchant writes that payment will follow “by the usual arrangement” and gives no further explanation. Historians infer that ____",["the two merchants had done business with each other before 1742.","the two merchants had never met in person.","the shipment of cloth was never paid for.","the letter was written by a clerk and not by the merchant."],"An arrangement can only be “usual” if it has been used before, and it needs no explanation only between people who already know it. Earlier dealings must have existed.",["oos|Whether they had met cannot be told from the phrase.","oos|Nothing suggests that payment failed.","oos|Who physically wrote the letter is not addressed."]],
["n-sci","Penicillin and related antibiotics kill bacteria by preventing them from building their cell walls; without a sound wall, a growing bacterium bursts. Viruses are not cells and have no cell walls. It follows that such antibiotics ____",["would not be expected to work against infections caused by viruses.","kill viruses more slowly than they kill bacteria.","damage the walls of human cells as well.","work only against bacteria that have stopped growing."],"These drugs act on cell walls, and viruses have none. With nothing to act on, the drugs should have no effect on viruses.",["leap|There is no basis for a slower effect. The drug has no target in a virus at all.","oos|Human cells are not discussed.","opp|The text says a growing bacterium bursts, so the drug acts on bacteria that are growing."]],
["n-hum","Linguists studying an inland farming people found that their language had borrowed dozens of words from the language of a coastal people. Nearly all of the borrowed words name things connected with boats, fishing and trade goods; the words for crops, animals and tools of the field are native. This pattern suggests that contact between the two peoples ____",["took place mainly through trade and travel by water.","began when the coastal people taught the inland people to farm.","was brief and left little trace.","led the inland people to give up farming."],"Borrowed words cluster in boats, fishing and trade, so those were the areas where the peoples met. Farming words stayed native, which shows little contact in that area.",["opp|Farming vocabulary is native, so farming was not learned from the coastal people.","opp|Dozens of borrowed words are a substantial trace.","oos|Nothing suggests they stopped farming. Their farming words are intact."]],
["n-sci","Astronomers monitoring a distant star found that its brightness drops by one percent for about three hours and then returns to normal. The dip repeats every 3.5 days, always with the same depth and duration. The most likely explanation is that ____",["an object orbiting the star passes in front of it once every 3.5 days.","the star is slowly running out of fuel.","clouds in Earth’s atmosphere block the star’s light.","the star is moving away from Earth."],"A dip that is identical each time and returns on a fixed schedule fits something that crosses the star once per orbit and blocks a little of its light.",["opp|A dying star would not return to normal brightness on a precise schedule.","opp|Clouds would not produce identical dips exactly every 3.5 days.","oos|Steady motion away would not cause brief, repeating dips."]],
["n-hum","A marble statue in a museum was long believed to have been carved in Greece in the fifth century BCE. Chemical analysis has now shown that its marble came from a quarry that, according to archaeological evidence, was first worked in the first century CE. The statue is therefore probably ____",["several centuries younger than had been believed.","made of a stone other than marble.","older than the quarry from which its stone came.","the earliest statue carved from that quarry’s marble."],"Stone cannot be carved before it is quarried. If the quarry opened in the first century CE, the statue dates from then or later, centuries after the supposed date.",["opp|The analysis identifies the marble’s source. It confirms that the stone is marble.","opp|A statue cannot be older than the working of its quarry.","leap|Nothing indicates where the statue stands in the quarry’s history."]],
["n-hum","To keep housing affordable, a city limited the rents that could be charged in buildings constructed before 1980. Rents in newer buildings and in offices were not limited. Over the next decade, the owners of many older buildings converted them from apartments into offices. One consequence of the policy, then, may have been ____",["a reduction in the number of apartments covered by the rent limit.","an increase in the rents charged for offices.","a decline in the construction of new office buildings.","an increase in the number of older apartments available to rent."],"Conversions turned older apartments, the ones under the limit, into offices. Fewer such apartments remained, which works against the policy’s purpose.",["oos|Office rents are not reported, and more offices would not obviously raise them.","oos|Office construction is not discussed.","opp|Conversions reduced the number of older apartments."]],
["n-sci","Mice that received a certain compound found their way through a maze faster than untreated mice when both groups were tested an hour later. When the same mice were tested again a week later, with no further doses, the two groups performed equally. These results suggest that the compound ____",["improves performance for a short time without producing lasting learning.","permanently improves the memory of mice.","makes mice slower once it wears off.","has no effect on how mice perform in a maze."],"The advantage appeared an hour after the dose and was gone a week later. The effect is temporary.",["opp|A permanent improvement would still show a week later.","opp|A week later the two groups were equal. The treated mice were not slower.","opp|The treated mice were faster in the first test."]],
["n-hum","In 1847 a critic praised a volume of poems by “A. Leigh” as “vigorous and original.” A year later, in the same journal, he dismissed a second volume as “thin and imitative.” Both books were by Mary Hollis; only the second carried her real name, and scholars find the two very similar in style and quality. The episode suggests that ____",["the critic’s judgment was influenced by what he believed about the author.","Hollis’s second book was much weaker than her first.","the critic did not read the first volume carefully.","Hollis changed her style after the first review."],"Two similar books received opposite verdicts, and the main difference was the name on the cover. The author’s identity seems to have shaped his judgment.",["opp|Scholars find the two books very similar in quality.","oos|Nothing shows how carefully he read either book.","opp|The books are very similar in style."]],
["n-sci","Two populations of a land snail live on opposite sides of a mountain range and look quite different: one has a banded shell, the other a plain one. When snails from the two populations are brought together in a laboratory, they mate and produce fertile offspring. Biologists who define a species as a group whose members can interbreed would therefore ____",["regard the two populations as belonging to a single species.","conclude that the two populations never meet in the wild.","classify the banded and plain snails as two species.","expect the offspring to be unable to reproduce."],"Under this definition the test is interbreeding with fertile offspring, and the snails pass it. They count as one species, whatever their shells look like.",["irr|This may be true, but it does not follow from the definition, which concerns ability to interbreed.","opp|Appearance does not matter under this definition. The snails interbreed.","opp|The text says the offspring are fertile."]],

["n-sci","Plants of one species that grow beside a highway contain more of a bitter defensive chemical than plants of the same species in distant fields. Researchers first supposed that exhaust fumes trigger the chemical’s production. But roadside plants moved to a clean-air greenhouse kept their high levels, and so did plants grown there from their seeds. It seems, then, that ____",["the roadside plants differ genetically from the field plants.","exhaust fumes directly raise the level of the chemical in each plant.","the chemical protects plants against exhaust fumes.","field plants would produce more of the chemical if moved to the roadside."],"High levels persisted in clean air and were passed on through seeds. A difference that is inherited and independent of the fumes is genetic.",["opp|High levels remained without fumes, so the fumes are not the direct trigger.","oos|The function of the chemical against fumes is not tested.","leap|No field plants were moved, and the results suggest fumes do not trigger production."]],
["n-sci","At one university, students who chose seats in the front rows of lecture halls earned higher grades than students who sat at the back. To find out why, a professor assigned seats at random for a term. That term, grades in the front and back rows were the same. The earlier difference therefore most likely arose because ____",["students who choose to sit at the front tend to be those who would earn higher grades anyway.","sitting at the front makes lectures easier to hear.","the professor graded students at the front more generously.","students assigned to the back rows stopped attending."],"When seating was random, the advantage disappeared. The seat was not the cause, so the earlier gap reflects the kind of student who picks the front.",["opp|If hearing better at the front raised grades, the random front rows would have done better too.","oos|Nothing suggests biased grading, and such bias would have favored the random front rows as well.","oos|Attendance is not mentioned."]],
["n-hum","Customs records for an eighteenth-century port show that the amount of sugar imported for local sale tripled between 1720 and 1760. The city’s population hardly changed during those years, and the price of sugar fell by half. Historians conclude that ____",["the average resident was consuming far more sugar in 1760 than in 1720.","most of the sugar was sold on to other cities.","sugar had become harder to obtain by 1760.","the city’s wealthiest families stopped buying sugar."],"Three times as much sugar was sold locally to about the same number of people. Consumption per person must have risen greatly.",["opp|The records concern sugar imported for local sale.","opp|More supply and a lower price show that sugar had become easier to obtain.","oos|Nothing is said about the buying habits of wealthy families."]],
["n-sci","Giant tube worms living beside hot vents on the deep-sea floor have no mouth and no digestive system. Their bodies contain a large organ packed with bacteria that produce sugars using chemicals dissolved in the vent water. The worms absorb those chemicals through their red plumes and carry them in their blood to the organ. The worms, it appears, ____",["rely on the bacteria inside them for their nourishment.","feed on smaller animals that live near the vents.","are harmed by the bacteria they contain.","could live as easily far from the vents."],"With no mouth or gut, the worms cannot eat. They deliver chemicals to bacteria that make sugars, so the bacteria must be feeding them.",["opp|An animal with no mouth cannot eat other animals.","opp|The worms actively supply the bacteria, which points to benefit, not harm.","opp|The chemicals the bacteria need come from the vent water."]],
["n-hum","Offered a choice between five dollars today and six dollars in a week, most people in one study chose the five dollars. Offered a choice between five dollars in a year and six dollars in a year and a week, most of the same people chose the six dollars, although the extra wait was identical. The study suggests that people ____",["are far less willing to wait when a reward is available immediately.","always prefer the larger of two rewards.","do not understand the difference between a week and a year.","value money less as they grow older."],"The extra wait is one week in both cases. People refused it only when the smaller reward could be had today, so immediacy is what changes their choice.",["opp|In the first choice most people took the smaller reward.","oos|Nothing suggests confusion about lengths of time.","oos|The age of the participants is not discussed."]],
["n-hum","A wall painting in a village church has long been said to have been entirely repainted in the eighteenth century. Analysis shows that the blue of the sky is Prussian blue, a pigment first made in the early 1700s. Every other color tested, however, is a pigment that painters had used since the 1300s, applied directly to the original plaster. The findings suggest that ____",["only the sky was repainted, while the rest of the painting may be original.","the whole painting dates from the eighteenth century.","the sky is the oldest part of the painting.","Prussian blue was available to painters in the 1300s."],"Only the sky contains a pigment that did not exist before the 1700s. The other colors are old pigments on the original plaster, so they need not be a repainting.",["opp|Old pigments on original plaster count against a complete repainting.","opp|The sky contains the newest pigment, so it is the latest part.","opp|The text says Prussian blue was first made in the early 1700s."]],
["n-sci","Mud at the bottom of a lake preserves pollen from the surrounding plants, layer by layer. In layers from 8,000 years ago, most of the pollen comes from oak and other forest trees. In layers from 3,000 years ago, tree pollen is scarce; pollen from grasses and cereal crops dominates, and the mud contains many fragments of charcoal. The record suggests that by 3,000 years ago ____",["people had cleared much of the forest around the lake for farming.","the lake had dried up completely.","oak trees had become more common around the lake.","the climate had become too cold for any plants to grow."],"Cereal pollen means crops, charcoal means burning, and scarce tree pollen means the forest was gone. Together they point to clearing for agriculture.",["opp|Mud layers kept forming, so the lake was still there.","opp|Tree pollen became scarce.","opp|Grasses and cereals were growing in abundance."]],
["n-sci","Participants in a classic experiment watched a wheel of numbers being spun; it was rigged to stop at either 10 or 65. They were then asked what percentage of the member countries of the United Nations are in Africa. Those who had seen the wheel stop at 10 guessed 25 percent on average; those who had seen 65 guessed 45 percent. The experiment suggests that ____",["people’s estimates can be pulled toward a number they know to be irrelevant.","people who see large numbers become better at estimating.","most people know how many African countries belong to the United Nations.","the wheel gave participants useful information about the answer."],"The only difference between the groups was a number from a wheel, which has nothing to do with the question. Their guesses still moved toward it.",["oos|Accuracy is not compared. The point is that the guesses differed.","opp|The two groups gave very different answers, so they were not working from knowledge.","opp|A spun wheel carries no information about the United Nations."]],
["n-hum","In one region, speakers over sixty pronounce the “r” in words like “card,” while speakers under thirty leave it out. Is this because people begin to pronounce the “r” as they age? Recordings made in the 1960s of the same older speakers, who were then in their twenties, show that they pronounced the “r” then too. The difference between the age groups therefore reflects ____",["a change in the dialect from one generation to the next.","a change that each speaker goes through while growing older.","a difference in how carefully the two groups speak.","the influence of the older speakers on the younger ones."],"The older speakers pronounced “r” when they were young as well, so they did not change with age. The young now speak differently from how the old spoke at the same age, which is a change between generations.",["opp|The 1960s recordings rule this out. The older speakers already pronounced “r” in their twenties.","oos|Carefulness of speech is not examined.","opp|If the young were following the old, they would pronounce the “r”."]],
["n-sci","People with a certain chronic illness usually have low levels of vitamin D in their blood, and some physicians suspected that the deficiency causes the illness. In a large trial, patients who took vitamin D supplements for two years reached normal blood levels, yet their symptoms were no better than those of patients who took a placebo. The trial suggests that ____",["low vitamin D is more likely a result or a sign of the illness than its cause.","vitamin D supplements do not raise the level of vitamin D in the blood.","the illness is caused by too much vitamin D.","a placebo is an effective treatment for the illness."],"If the deficiency caused the illness, correcting it should have helped. Levels became normal and symptoms did not improve, so the low level probably accompanies the illness without causing it.",["opp|The supplements brought blood levels to normal.","oos|Nothing points to an excess of vitamin D.","leap|The placebo group is the comparison. Equal results do not show that the placebo works."]],

["n-sci","Cuckoos lay their eggs in the nests of other birds, and many host species have evolved the habit of throwing out eggs that look unlike their own. On one island, cuckoos died out several thousand years ago. Researchers who placed model cuckoo eggs in the nests of the island’s host birds found that they threw them out nearly as often as hosts on the mainland do. The finding suggests that ____",["a defensive behavior can persist long after the threat that favored it has gone.","cuckoos have recently returned to the island.","island birds are better than mainland birds at recognizing their own eggs.","rejecting eggs is something each bird learns from encounters with cuckoos."],"The island birds have had no cuckoos for thousands of years and still reject strange eggs. The behavior has outlasted its cause.",["oos|Nothing indicates that cuckoos have returned.","opp|The island birds rejected eggs nearly as often as mainland birds, not more often.","opp|No living island bird has met a cuckoo, so the behavior cannot have been learned that way."]],
["n-hum","Historians often estimate literacy in the past by counting how many people signed their names in marriage registers instead of making a mark. In one seventeenth-century parish, 30 percent of grooms signed. In the schools of that period, however, reading was taught first and writing only later, and many children left school after a year or two. The share of grooms who could read was therefore probably ____",["higher than 30 percent, since some who had learned to read never learned to write.","lower than 30 percent, since signing a name does not require reading.","exactly 30 percent, since everyone who could read could sign.","impossible to connect in any way with the signatures."],"Reading came before writing, and many left school early. Some men could therefore read but not sign, so readers outnumbered signers.",["opp|Writing was taught after reading, so a man who could sign had almost certainly been taught to read.","opp|Early school leavers could read without being able to sign.","ext|The signatures give a minimum figure, which is a useful connection."]],
["n-hum","A country’s unemployment rate is the share of its labor force that has no job, and the labor force includes only people who either have a job or are actively looking for one. In one year, a country’s unemployment rate fell from 8 percent to 6 percent, although the number of people with jobs did not change. This combination suggests that ____",["some people without jobs stopped looking for work and so were no longer counted.","many unemployed people found jobs during the year.","the country’s population grew quickly during the year.","employers created a large number of new jobs."],"With no change in the number employed, the rate can fall only if fewer people are counted as unemployed. Those who stop looking leave the labor force and the count.",["opp|If unemployed people had found jobs, the number of people with jobs would have risen.","oos|Population growth is not mentioned, and it would not lower the rate with employment unchanged.","opp|New jobs that were filled would have raised the number of people with jobs."]],
["n-sci","Two moons of the same planet have been struck by meteorites at about the same rate for billions of years. The surface of the first is covered with craters of every size, overlapping one another. The surface of the second has very few craters and is crossed by long, smooth plains. Planetary scientists infer that ____",["some process has renewed the surface of the second moon and erased older craters.","the second moon is much younger than the first.","the second moon has been struck by fewer meteorites than the first.","the first moon has a thicker atmosphere than the second."],"Both moons were hit at the same rate, so the second must once have had as many craters. Its smooth plains show that something resurfaced it.",["leap|A young surface does not mean a young moon. The text speaks of billions of years for both.","opp|The text says they have been struck at about the same rate.","oos|No atmosphere is mentioned for either moon."]],
["n-hum","An unsigned political pamphlet of 1768 has long been attributed to the statesman Robert Marsh. A computer comparison of how often very common words occur shows that the pamphlet closely matches Marsh’s signed essays. It matches equally well, however, the letters of Marsh’s secretary, who is known to have drafted many of the essays published under Marsh’s name. The comparison, therefore, ____",["cannot by itself show whether Marsh or his secretary wrote the pamphlet.","proves that Marsh wrote the pamphlet.","proves that the secretary wrote the pamphlet.","shows that the pamphlet was written by neither man."],"The pamphlet matches both men’s writing equally well. A test that fits two candidates the same cannot decide between them.",["ext|The equal match with the secretary prevents such a conclusion.","ext|The equal match with Marsh’s essays prevents such a conclusion.","opp|The pamphlet matches both men closely, which points toward them."]],
["n-sci","Salmon spend most of their lives at sea and return to rivers to breed and die. Nitrogen from the ocean has a chemical signature different from nitrogen from the land. Two years after a dam on one river was removed, salmon were again breeding far upstream, and the newest growth rings of trees along the upper river contained more nitrogen with the ocean signature than the older rings did. The most likely explanation is that ____",["nutrients from the bodies of salmon are entering the soil and being taken up by the trees.","the trees are absorbing seawater that flows up the river.","the dam had been supplying the trees with nitrogen from the land.","the salmon are feeding on the leaves of the trees."],"Ocean nitrogen appears in the trees only after the salmon return. The fish carry it from the sea in their bodies, and when they die it reaches the soil and roots.",["oos|Rivers flow to the sea, and nothing suggests seawater moving upstream.","opp|Ocean nitrogen increased after the dam was gone.","oos|Salmon eating leaves would not put ocean nitrogen into the trees."]],
["n-hum","A journalist surveyed the founders of one hundred highly successful companies and found that sixty of them had left university without a degree. He concluded that leaving university improves a person’s chances of business success. The survey, however, included no founders of companies that failed. Without that information, ____",["it is impossible to tell whether those who leave university succeed more often than those who stay.","it is clear that most founders who leave university fail.","the survey shows that a degree is necessary for success.","the sixty founders must have succeeded because they left university."],"To know whether leaving helps, the success rates of leavers and stayers must be compared, which requires counting failures too. The survey counted only successes.",["leap|The survey has no data on failures, so this cannot be concluded either.","opp|Sixty successful founders had no degree.","leap|This repeats the journalist’s conclusion, which the missing data cannot support."]],
["n-hum","In a Bronze Age cemetery, most graves contain a few pots. A small number contain gold ornaments and bronze weapons. Archaeologists found that these rich graves are clustered together and include the graves of young children, who were buried with the same kinds of ornaments as the adults beside them. The children’s graves suggest that in this society ____",["high status could be inherited and did not have to be earned.","children were trained as warriors from an early age.","gold was more common than pottery.","most families buried their dead with weapons."],"Young children had no time to earn wealth or rank. Their rich burials beside rich adults suggest that status came from the family.",["leap|Ornaments in a child’s grave do not show training in warfare.","opp|Most graves contain only pots, and gold is found in a small number.","opp|Only a small number of graves contain weapons."]],
["n-sci","After an injury to part of the brain, a patient reported that he could see nothing in the left half of his field of view. When researchers flashed a light somewhere in that half and asked him to point to it, he protested that he was only guessing. His “guesses,” however, were correct far more often than chance would allow. The case suggests that ____",["some visual information can guide behavior without reaching conscious awareness.","the patient was not telling the truth about his vision.","the patient’s vision in the left half was fully normal.","pointing is less accurate than describing what one sees."],"He felt that he saw nothing, yet he pointed correctly. Information about the light was being used without his awareness of it.",["oos|He sincerely believed he was guessing, and nothing suggests dishonesty.","opp|He reported seeing nothing there, so his vision was not normal.","oos|Pointing and describing are not compared for accuracy."]],
["n-hum","During a period of rapid inflation, shopkeepers in one country began setting their prices in a stable foreign currency and changing the local-currency price each morning to match. Wages, by law, were fixed in the local currency and adjusted only once a year. Over the course of each year, therefore, ____",["the amount that a worker’s wage could buy steadily declined.","shopkeepers lost money on everything they sold.","workers were paid in the foreign currency.","prices in the shops stayed the same in local currency."],"Local-currency prices rose daily while wages stayed fixed for a year. The same wage bought less and less until the next adjustment.",["opp|Repricing each morning protected shopkeepers from the inflation.","opp|Wages were fixed in the local currency by law.","opp|Local-currency prices were changed every morning."]]
];

/* ===================== BUILD THE BANK ===================== */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmt(sec){ sec = Math.max(0, sec); return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s"); }
/* Seeded generator: the order of the choices is fixed for each question, so letters stay the same between visits */
function rng(seed){ let h = 2166136261; for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } let a = h >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sshuf(a, r){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const QID = {}, ALLQ = [], SETS = [], SBY = {};
TYPE_ORDER.forEach(ty => {
  const rows = B[ty], r = rng("sat-reading-" + ty);
  let pos = [];
  for (let s = 0; s < rows.length; s += 10) pos = pos.concat(sshuf([0, 1, 2, 3, 0, 1, 2, 3, (s / 10) % 4, (s / 10 + 2) % 4], r));
  rows.forEach((row, i) => {
    const a = pos[i], wr = sshuf([1, 2, 3], r), order = []; let w = 0;
    for (let j = 0; j < 4; j++) order.push(j === a ? 0 : wr[w++]);
    const q = { id:ty + pad(i + 1), ty, sk:row[0], body:row[1], o:order.map(k => row[2][k]), a, k:LET[a], why:row[3], lvl:i < 10 ? 1 : i < 30 ? 2 : 3,
      x:order.map(k => { if (!k) return null; const p = row[4][k - 1].split("|"); return { k:p[0], note:p.slice(1).join("|") }; }) };
    q.fig = ty === "coq" ? q.body[0] : null;
    q.text = ty === "coq" ? q.body[1] : q.body;
    let stem = row[5] || SKILLS[q.sk].stem;
    if (q.sk === "w-mean") stem = "As used in the text, what does the word “" + /\[\[(.+?)\]\]/.exec(q.text)[1] + "” most nearly mean?";
    q.stem = stem;
    QID[q.id] = q; ALLQ.push(q);
  });
  const qs = ALLQ.filter(q => q.ty === ty);
  for (let i = 0; i < qs.length; i += 10) {
    const part = qs.slice(i, i + 10), no = i / 10 + 1, lv = [...new Set(part.map(q => q.lvl))].sort();
    const st = { id:ty + no, ty, no, qs:part, ids:part.map(q => q.id), title:TYPES[ty].n + " · Set " + no, lv:lv.map(l => LEVELS[l]).join("–") };
    part.forEach((q, j) => { q.set = st; q.no = j + 1; });
    SETS.push(st); SBY[st.id] = st;
  }
});
const TOTALQ = ALLQ.length;
const SECS = 71; /* 32 minutes for 27 questions in a real module */
function minsFor(n){ return Math.ceil(n * SECS / 60); }

function opt(q, v){ return q.o[LET.indexOf(v)]; }
function ol(v){ return '<span class="ol">' + v + "</span>"; }
function hd(q, v){ return '<span class="hd"><b>' + v + "</b>" + esc(opt(q, v)) + "</span>"; }
function errOf(q, v){ const e = q.x[LET.indexOf(v)]; return e ? { k:e.k, n:ERR[e.k].n, note:e.note } : null; }
function skillQs(sk){ return ALLQ.filter(q => q.sk === sk); }
function errQs(k){ return ALLQ.filter(q => q.x.some(e => e && e.k === k)); }

/* ---------- Text, figures ---------- */
function rich(t, fill){
  const h = esc(t).replace(/\[\[(.+?)\]\]/g, '<u class="ul">$1</u>').replace(/\n/g, "<br>");
  return h.replace("____", fill ? '<mark class="ev">' + esc(fill) + "</mark>" : '<span class="blank" role="img" aria-label="blank"></span>');
}
function tableHTML(f){
  return '<div class="tbl"><table class="dt"><thead><tr>' + f.h.map(x => "<th>" + esc(x) + "</th>").join("") + "</tr></thead><tbody>" +
    f.r.map(r => "<tr>" + r.map((c, i) => "<td" + (i ? ' class="num"' : "") + ">" + esc(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
}
function chartSVG(f){
  const W = 440, H = 250, L = 38, R = 8, T = 12, Bm = 30, pw = W - L - R, ph = H - T - Bm, ns = f.h.length - 1, y0 = T + ph;
  const max = Math.max(...f.r.map(r => Math.max(...r.slice(1))));
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200].find(s => max / s <= 6), top = Math.ceil(max / step) * step;
  const y = v => T + ph - v / top * ph, gw = pw / f.r.length, bw = Math.min(44, (gw * 0.72 - (ns - 1) * 2) / ns);
  const label = f.t + ". Bar graph. " + f.r.map(r => r[0] + ": " + r.slice(1).map((v, k) => (ns > 1 ? f.h[k + 1] + " " : "") + "about " + v).join(", ")).join("; ") + ".";
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">';
  for (let v = 0; v <= top; v += step) s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + "</text>";
  f.r.forEach((row, i) => {
    const cx = L + gw * i + gw / 2, tw = ns * bw + (ns - 1) * 2;
    row.slice(1).forEach((v, k) => {
      const x = cx - tw / 2 + k * (bw + 2), yy = y(v), rr = Math.min(3, y0 - yy);
      s += '<path class="b' + (k + 1) + '" d="M' + x + "," + y0 + "V" + (yy + rr) + "Q" + x + "," + yy + " " + (x + rr) + "," + yy + "H" + (x + bw - rr) + "Q" + (x + bw) + "," + yy + " " + (x + bw) + "," + (yy + rr) + "V" + y0 + 'Z"/>';
    });
    s += '<text class="ax cat" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(row[0]) + "</text>";
  });
  return s + '<line class="bl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y0 + '" y2="' + y0 + '"/></svg>';
}
function figHTML(f, done){
  let h = '<figure class="fig"><figcaption>' + esc(f.t) + "</figcaption>";
  if (!f.g) return h + tableHTML(f) + "</figure>";
  h += '<div class="lgrow"><span class="yl">' + esc(f.y) + "</span>" + (f.h.length > 2 ? '<span class="lg">' + f.h.slice(1).map((n, k) => '<span><i class="k' + (k + 1) + '"></i>' + esc(n) + "</span>").join("") + "</span>" : "") + "</div>" + chartSVG(f);
  if (done) h += '<details class="more" open><summary>Values shown in the graph</summary>' + tableHTML(f) + "</details>";
  return h + "</figure>";
}
function bodyHTML(q, done){
  const fill = done ? q.o[q.a] : "";
  if (q.ty === "ctc") return q.text.map((t, i) => '<p class="tlabel">Text ' + (i + 1) + '</p><p class="ptext">' + rich(t) + "</p>").join("");
  return (q.fig ? figHTML(q.fig, done) : "") + '<p class="ptext' + (q.text.indexOf("\n") > 0 ? " verse" : "") + '">' + rich(q.text, fill) + "</p>";
}
function methodHTML(ty, sk){
  const t = TYPES[ty];
  return '<ol class="steps">' + t.steps.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol>" + (sk ? '<p><span class="lab">Working tip</span>' + esc(SKILLS[sk].tip) + "</p>" : "");

/* ===================== STORAGE ===================== */
const KEY = "sat-reading-v1";
function fresh(){ return { ans:{}, exams:{} }; }
let store = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.ans) store = Object.assign(fresh(), s); } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
function record(q, v){
  const r = store.ans[q.id] || { n:0, wrong:0, hist:[] };
  r.n++; r.last = v; r.ok = v === q.k; if (!r.ok) r.wrong++;
  r.hist = (r.hist || []).concat(v).slice(-10); r.r = "";
  store.ans[q.id] = r; save();
}
function answeredIds(){ return Object.keys(store.ans).filter(k => QID[k]); }
function wrongIds(){ return answeredIds().filter(k => !store.ans[k].ok); }
function trapTally(){
  const tally = {};
  answeredIds().forEach(id => { const q = QID[id]; (store.ans[id].hist || []).forEach(v => { if (v !== q.k) { const e = errOf(q, v); if (e) tally[e.k] = (tally[e.k] || 0) + 1; } }); });
  return tally;
}

const S = { view:"lib", sess:null, timer:null, confirmReset:false };
const VIEWS = { lib:"tests", rules:"rules", mist:"mistakes", stats:"results" };

/* ===================== SESSION ===================== */
function startSession(ids, title, mode, sid){
  stopTimer();
  const mins = minsFor(ids.length);
  S.sess = { ids, title, mode, sid:sid || null, idx:0, ans:{}, pick:{}, hint:{}, ro:{}, flag:{}, submitted:false, auto:false, warn:false, mins, left:mode === "exam" ? mins * 60 : 0, used:null };
  S.view = "sess"; render(); window.scrollTo(0, 0);
  if (mode === "exam") S.timer = setInterval(tick, 1000);
}
function stopTimer(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function tick(){
  const s = S.sess; if (!s || s.submitted || s.mode !== "exam") return stopTimer();
  s.left--;
  if (s.left <= 0) { s.left = 0; submitExam(true); return; }
  const el = document.getElementById("clock"); if (el) { el.textContent = fmt(s.left); el.classList.toggle("low", s.left < 120); }
}
function sessOpen(){ const s = S.sess; return !!s && (s.mode === "exam" ? !s.submitted : s.ids.some(id => !s.ans[id])); }
function isOk(s, id){ return s.ans[id] === QID[id].k; }
function shown(s, id){ return s.mode === "exam" ? s.submitted : !!s.ans[id]; }
function curQ(){ const s = S.sess; return s ? QID[s.ids[s.idx]] : null; }
/* Twenty questions in the order the test uses: Craft and Structure first, then Information and Ideas */
function mixedExam(){
  const n = { wic:5, tsp:3, ctc:1, cid:3, coe:3, coq:2, inf:3 };
  return TYPE_ORDER.reduce((a, ty) => a.concat(shuffle(ALLQ.filter(q => q.ty === ty)).slice(0, n[ty]).sort((x, y) => x.lvl - y.lvl).map(q => q.id)), []);
}

function sessHTML(){
  const s = S.sess, exam = s.mode === "exam", q = curQ();

  if (exam) h += s.submitted ? '<span class="mono">Score</span><span class="score num">' + okN + " / " + s.ids.length + '</span><button class="btn sm" data-act="results">Results</button>' : '<span class="mono">Time left</span><span id="clock" class="clock num' + (s.left < 120 ? " low" : "") + '">' + fmt(s.left) + "</span>";
  else h += '<span class="mono">Correct</span><span class="score num">' + okN + " / " + done + "</span>";

function passageHTML(s, q){

function questionHTML(s, q){

/* ---------- Explanation: verdict, reason, the mistake, every choice, the method ---------- */
function fbHTML(q, v, uid){

  h += '<div class="fsec"><h4>Why ' + q.k + " is correct</h4><p>" + esc(q.why) + '</p><p class="cap"><span class="lab">Skill tested</span>' + esc(sk.n) + ": " + esc(sk.s) + "</p></div>";
  if (x) {

    h += '<div class="fsec miss"><h4>Where you went wrong</h4><p><span class="lab">You chose</span>' + hd(q, v) + '</p><p><span class="ttag">' + esc(x.n) + "</span></p><p>" + esc(x.note) + '</p><p class="note">' + esc(ERR[x.k].s) + '</p><p class="note"><span class="lab">How to avoid it</span>' + esc(ERR[x.k].avoid) + "</p>";
    if (rec && !rec.ok && rec.last === v) {
      h += '<div><span class="lab">Why did you choose it? (optional)</span><div class="chips" style="margin-top:6px">' + Object.keys(REASONS).map(r => '<button class="chip" data-act="reason" data-id="' + q.id + '" data-r="' + r + '" aria-pressed="' + (rec.r === r) + '">' + REASONS[r].t + "</button>").join("") + "</div></div>";
      if (rec.r) h += '<p class="advice"><span class="lab">Advice</span>' + esc(REASONS[rec.r].a) + "</p>";
    }
    h += "</div>";
  }
  h += '<div class="fsec"><h4>Choice by choice</h4><ul class="cx">' + LET.map((L, i) => {

function submitExam(auto){
  const s = S.sess; if (!s || s.submitted) return;
  stopTimer(); s.submitted = true; s.auto = !!auto; s.warn = false; s.used = s.mins * 60 - s.left;
  s.ids.forEach(id => { if (s.ans[id]) record(QID[id], s.ans[id]); });
  const okN = s.ids.filter(id => isOk(s, id)).length, key = s.sid || "mix", prev = store.exams[key] || { n:0, best:0 };
  store.exams[key] = { n:prev.n + 1, best:Math.max(prev.best || 0, okN), last:okN, total:s.ids.length, used:s.used, t:Date.now() };
  save(); S.view = "fin"; render(); window.scrollTo(0, 0);
}

    h += '<div class="rsec"><h2>Traps that catch you</h2><p class="small">Counts every wrong answer across all your attempts.</p>' + bars(tc, "") + '<div class="insight"><b>Your main weak spot: ' + esc(top[0]) + "</b><p>" + esc(ERR[top[2]].s) + "</p><p>" + esc(ERR[top[2]].avoid) + '</p><div class="btns"><button class="btn sm" data-act="errdrill" data-k="' + top[2] + '">Practice this trap (' + errQs(top[2]).length + ')</button><button class="btn ghost sm" data-act="tab" data-v="mist">All common mistakes</button></div></div></div>';
    const rc = Object.keys(REASONS).map(r => [REASONS[r].t, ids.filter(id => store.ans[id].r === r).length, r]).filter(r => r[1]).sort((a, b) => b[1] - a[1]);
    h += '<div class="rsec"><h2>Reasons you gave</h2>' + (rc.length ? bars(rc, "r") + '<div class="insight"><b>Advice</b><p>' + esc(REASONS[rc[0][2]].a) + "</p></div>" : '<p class="empty">When you answer “Why did you choose it?” after a mistake, personal advice appears here.</p>') + "</div>";
  }
  h += '<div class="rsec"><h2>Mistakes notebook</h2>';
  if (wrong.length) h += '<p class="small">Questions whose latest answer is wrong. A question leaves the notebook once you solve it correctly.</p><div class="btns" style="margin-bottom:6px"><button class="btn primary" data-act="quick" data-k="mist">Solve them all again (' + wrong.length + ')</button></div><ul class="wlist">' + wrong.map(id => {
    const q = QID[id], r = store.ans[id], x = errOf(q, r.last);
    return '<li><span class="mono">' + esc(q.set.title) + " · question " + q.no + " · " + esc(SKILLS[q.sk].n) + (r.wrong > 1 ? " · wrong " + r.wrong + " times" : "") + '</span><p class="hd">' + esc(q.stem) + '</p><p><span class="lab">You chose</span>' + hd(q, r.last) + '</p><p><span class="lab">Correct</span>' + hd(q, q.k) + "</p>" + (x ? '<p><span class="ttag">' + esc(x.n) + "</span>" + (r.r ? ' <span class="small">· ' + REASONS[r.r].t + "</span>" : "") + '</p><p class="small">' + esc(x.note) + "</p>" : "") +
      '<details class="more"><summary>Text and explanation</summary><div class="worked" style="margin-top:8px">' + bodyHTML(q, true) + '</div><p style="margin-top:8px">' + esc(q.why) + '</p><p class="small" style="margin-top:6px"><b>' + esc(SKILLS[q.sk].n) + ".</b> " + esc(SKILLS[q.sk].tip) + "</p></details></li>";
  }).join("") + "</ul>";
  else h += "<p>No wrong answers at the moment.</p>";
  h += "</div>";
  h += '<div class="rsec plain"><h2>Clear results</h2>' + (S.confirmReset ? '<p>All results and the mistakes notebook will be deleted. Continue?</p><div class="btns"><button class="btn danger" data-act="reset2">Yes, delete</button><button class="btn" data-act="reset0">Cancel</button></div>' : '<button class="btn" data-act="reset1">Delete all results</button>') + "</div></section>";
  return h;
}

/* ===================== RENDER AND EVENTS ===================== */
function render(){
  const v = S.view;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", (b.dataset.v === v || ((v === "sess" || v === "fin") && b.dataset.v === "lib")) ? "page" : "false"));
  document.getElementById("app").innerHTML = v === "sess" ? sessHTML() : v === "fin" ? finishHTML() : v === "rules" ? rulesHTML() : v === "mist" ? mistHTML() : v === "stats" ? statsHTML() : libHTML();
}
function go(v){ S.view = v; S.confirmReset = false; render(); window.scrollTo(0, 0); try { if (VIEWS[v] && location.hash !== "#" + VIEWS[v]) history.replaceState(null, "", "#" + VIEWS[v]); } catch(e) {} }
function keep(fn){ const y = window.scrollY; fn(); render(); window.scrollTo(0, y); }
function narrow(){ return window.innerWidth <= 900; }
function goQ(){
  S.sess.warn = false; render();
  if (narrow()) { const g = document.getElementById("sgrid"); if (g) g.scrollIntoView({ block:"start" }); } else window.scrollTo(0, 0);
}
function drill(ids, title){ if (ids.length) startSession(shuffle(ids), title, "practice"); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset, s = S.sess, q = S.view === "sess" ? curQ() : null;
  switch (d.act) {
    case "tab": go(d.v); break;
    case "home": go("lib"); break;
    case "rulesfor": go("rules"); { const el = document.getElementById("r-" + d.ty); if (el) el.scrollIntoView({ block:"start" }); } break;
    case "start": { const st = SBY[d.s]; startSession(st.ids.slice(), st.title, d.m, st.id); break; }
    case "resume": S.view = "sess"; render(); window.scrollTo(0, 0); break;
    case "results": S.view = "fin"; render(); window.scrollTo(0, 0); break;
    case "quick": {
      if (d.k === "exam") startSession(mixedExam(), "Timed module", "exam", "mix");
      if (d.k === "mix") startSession(shuffle(ALLQ).slice(0, 10).map(x => x.id), "Mixed ten", "practice");
      if (d.k === "hard") startSession(shuffle(ALLQ.filter(x => x.lvl === 3)).slice(0, 10).map(x => x.id), "Hard only", "practice");
      if (d.k === "mist") drill(wrongIds(), "My mistakes");
      if (d.k === "new") { const n = ALLQ.filter(x => !store.ans[x.id]).map(x => x.id); if (n.length) startSession(n.slice(0, 10), "Not yet solved", "practice"); }
      break; }
    case "drill": drill(skillQs(d.sk).map(x => x.id), "Skill: " + SKILLS[d.sk].n); break;
    case "errdrill": drill(errQs(d.k).map(x => x.id).slice(0, 400), "Trap: " + ERR[d.k].n); break;
    case "pick": if (q && !shown(s, q.id)) {
      keep(() => { if (s.mode === "exam") s.ans[q.id] = s.ans[q.id] === d.k ? "" : d.k; else s.pick[q.id] = d.k; });
      const f = document.querySelector('.hopt[data-k="' + d.k + '"]'); if (f) f.focus({ preventScroll:true });
    } break;
    case "check": if (q && s.mode === "practice" && s.pick[q.id] && !s.ans[q.id]) {
      keep(() => { s.ans[q.id] = s.pick[q.id]; record(q, s.pick[q.id]); });
      if (narrow()) { const vd = document.querySelector(".verdict"); if (vd) vd.scrollIntoView({ block:"start" }); }
    } break;
    case "hint": if (q) keep(() => { s.hint[q.id] = !s.hint[q.id]; }); break;
    case "flag": if (q) keep(() => { s.flag[q.id] = !s.flag[q.id]; }); break;
    case "next": if (s.idx < s.ids.length - 1) { s.idx++; goQ(); } break;
    case "prev": if (s.idx > 0) { s.idx--; goQ(); } break;
    case "goto": s.idx = +d.i; S.view = "sess"; goQ(); break;
    case "finish": S.view = "fin"; render(); window.scrollTo(0, 0); break;
    case "redowrong": { const w = s.ids.filter(id => !isOk(s, id) && (s.mode === "exam" || s.ans[id])); if (w.length) startSession(w, "Redo the mistakes", "practice"); break; }
    case "submit": if (s.ids.some(id => !s.ans[id])) keep(() => { s.warn = true; }); else submitExam(false); break;
    case "submit2": submitExam(false); break;
    case "nowarn": keep(() => { s.warn = false; }); break;
    case "rule": keep(() => { s.ro[d.uid] = !s.ro[d.uid]; }); break;
    case "reason": keep(() => { const r = store.ans[d.id]; if (r) { r.r = r.r === d.r ? "" : d.r; save(); } }); break;
    case "reset1": keep(() => { S.confirmReset = true; }); break;
    case "reset0": keep(() => { S.confirmReset = false; }); break;
    case "reset2": stopTimer(); store = fresh(); save(); S.sess = null; S.confirmReset = false; render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "sess" || !S.sess || e.metaKey || e.ctrlKey || e.altKey) return;
  const el = e.target; if (el.matches && el.matches("select, textarea, input")) return;
  const s = S.sess, q = curQ(), free = s.mode === "exam" || s.ans[q.id];
  if (e.key === "ArrowRight" && free && s.idx < s.ids.length - 1) { s.idx++; goQ(); }
  else if (e.key === "ArrowLeft" && s.idx > 0) { s.idx--; goQ(); }
  else if (/^[a-dA-D]$/.test(e.key) && !shown(s, q.id)) { const L = e.key.toUpperCase(); keep(() => { if (s.mode === "exam") s.ans[q.id] = L; else s.pick[q.id] = L; }); }
});
window.addEventListener("hashchange", () => { const v = Object.keys(VIEWS).find(k => "#" + VIEWS[k] === location.hash); if (v && v !== S.view && S.view !== "sess") { S.view = v; render(); window.scrollTo(0, 0); } });

/* Links to the sibling trainers show only where the files sit side by side (a site or a local folder) */
(function(){ if (/\.github\.io$/.test(location.hostname) || location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) ["xlink1", "xlink2", "xlink3"].forEach(id => { const x = document.getElementById(id); if (x) x.hidden = false; }); })();

/* An open session survives an update of the page */
function boot(data){
  if (data && data.sess) { S.sess = data.sess; S.view = data.view || "lib"; if (S.sess.mode === "exam" && !S.sess.submitted) S.timer = setInterval(tick, 1000); }
  else { const v = Object.keys(VIEWS).find(k => "#" + VIEWS[k] === location.hash); if (v) S.view = v; }
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ view:S.view, sess:S.sess }));
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);

</script>
