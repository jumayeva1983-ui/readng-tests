["i-detail","A coffee tree grown in full sun produces more beans than one grown in shade, and since the 1970s many farms have cut down their shade trees. Agronomist Luz Herrera compared the two systems over fifteen years. Sun farms produced a third more coffee at first, but their soil lost nutrients, their yields declined after year eight, and they needed three times as much fertilizer.",["Their soil became poorer and their harvests eventually shrank.","They produced less coffee than shade farms from the first year.","Their trees were destroyed by insects.","They used less fertilizer than shade farms."],"Herrera found that on sun farms the “soil lost nutrients” and “yields declined after year eight”.",["opp|Sun farms produced a third more coffee at first.","oos|Insects are not mentioned.","opp|Sun farms needed three times as much fertilizer."],"According to the text, what happened on the sun farms over time?"],
["i-main","We speak of “the” scientific method as if there were one. A geologist reading layers of rock cannot run an experiment on a mountain range; an astronomer cannot place a star in a laboratory. What unites the sciences, philosopher Ana Duarte suggests, is not a single procedure but a shared habit: stating claims in a form that evidence could show to be wrong.",["The sciences share a commitment to testable claims, not one uniform method.","Geology and astronomy are less reliable than laboratory sciences.","Philosophers and scientists disagree about what science is.","Experiments are impossible in most sciences."],"The text questions the idea of one method, gives examples of sciences without experiments and ends with what Duarte says unites them: claims that evidence could prove wrong.",["oos|The examples show different methods. They are not called less reliable.","oos|No disagreement between philosophers and scientists is described.","ext|Two fields are given as examples. The text does not say “most sciences”."]],
["i-detail","In a long-running study in Scotland, ecologists counted the plant species in meadows cut for hay once a year and in meadows left uncut. The mown meadows held nearly twice as many species. Without cutting, a few tall grasses shaded out the smaller flowering plants; the yearly mowing kept any one species from taking over.",["It prevents a few tall grasses from crowding out smaller plants.","It adds nutrients to the soil.","It spreads the seeds of rare plants.","It keeps grazing animals out of the meadow."],"The last sentence explains that without cutting, tall grasses shaded out smaller plants, and that mowing “kept any one species from taking over”.",["oos|Soil nutrients are not mentioned.","oos|The spreading of seeds is not mentioned.","oos|Grazing animals are not mentioned."],"According to the text, why do the mown meadows contain more species?"],
["i-main","The composer Florence Price wrote more than 300 works, and in 1933 the Chicago Symphony performed her first symphony, the first time a major American orchestra had played music by a Black woman. After her death in 1953, much of her music went unpublished and unheard. In 2009, dozens of her manuscripts were found in an abandoned house in Illinois, and orchestras have since begun to perform and record them.",["Much of Price’s music, long neglected after her death, is being rediscovered.","Price wrote her most important music after 1933.","Price’s manuscripts were damaged beyond repair.","The Chicago Symphony has performed all of Price’s works."],"The text moves from Price’s achievement to decades of neglect and then to the discovery of her manuscripts and new performances. The main idea is that rediscovery.",["oos|The text does not say which of her works are most important.","opp|The manuscripts are being performed and recorded.","oos|Only one performance by that orchestra is mentioned."]],
["i-detail","When her aunt asked what she wanted for her birthday, Daniela said a telescope, and then wished she had not. Her cousins had asked for shoes and games. But her aunt only nodded, wrote something on the back of an envelope and said, “Then you will have to show me Saturn.”",["She accepts it seriously and expects to share in it.","She laughs at it and suggests shoes instead.","She refuses because a telescope costs too much.","She tells Daniela to ask her cousins for advice."],"The aunt nods, writes it down and says “you will have to show me Saturn”. She takes the request seriously and plans to look through the telescope herself.",["opp|She does not laugh, and shoes are what the cousins asked for.","oos|Cost is never mentioned.","oos|She gives no such advice."],"Based on the text, how does Daniela’s aunt respond to the request?"],
["i-main","Urban historian Kwame Boateng argues that the suburban shopping mall was not a simple response to what consumers wanted. Tax rules introduced in the United States in 1954 let developers deduct the cost of new buildings far faster than before, which made large retail projects on cheap land suddenly profitable. Mall construction tripled within a few years, well before surveys showed any change in where people preferred to shop.",["According to Boateng, a change in tax rules, more than consumer demand, drove the spread of shopping malls.","According to Boateng, consumers disliked shopping malls when they first appeared.","According to Boateng, shopping malls were built mainly on expensive land.","According to Boateng, tax rules in 1954 were designed to help small shops."],"Boateng denies that malls simply answered consumer wishes and points to tax rules that made them profitable, with building rising before preferences changed.",["oos|The text says preferences had not yet changed. It does not say consumers disliked malls.","opp|The projects were built on cheap land.","oos|Nothing is said about small shops or the aim of the rules."]],

["i-main","The ink on a medieval manuscript can reveal where it has traveled. Chemist Idris Bello analyzes the trace metals in iron-based inks, which differ according to the mine that supplied the iron. In one prayer book, the main text matched inks used in northern France, while notes in the margins matched inks from southern England, written, the handwriting suggests, a generation later.",["Chemical analysis of ink can trace the movement of a manuscript between regions.","Medieval inks were made mainly from iron.","The prayer book was written in southern England.","Handwriting is a more reliable guide than ink to a manuscript’s age."],"The first sentence states the idea, and the prayer book illustrates it: French ink in the main text, English ink in later notes. Ink analysis shows where a manuscript has been.",["narrow|The iron base of the inks is what makes the method possible, not the main point.","opp|The main text matched inks from northern France.","oos|Handwriting and ink are used together and are not ranked."]],
["i-detail","Psychologist Naomi Geller asked two groups to estimate how long a task would take them. One group simply gave an estimate. The other first listed each step the task involved. The second group’s estimates were longer and much closer to the time actually needed, though they still fell short by about ten percent.",["They remained somewhat too low.","They were longer than the time actually needed.","They were less accurate than the first group’s estimates.","They matched the actual time exactly."],"The second group’s estimates were “much closer” but “still fell short by about ten percent”, so they were still too low.",["opp|Estimates that “fell short” were shorter than the real time.","opp|They were much closer to the actual time than the first group’s.","ext|“Closer” is not exact. They missed by about ten percent."],"According to the text, what was true of the estimates made by the group that listed the steps?"],
["i-main","The following text is from a poem written for this trainer.\nMy father never said the word for love.\nHe said, The tires are low, I filled them up.\nHe said, It’s cold, you ought to take the coat.\nHe stood outside at five to clear the snow\nfrom steps that I would not come down till eight,\nand what he had to say was said by then.",["The speaker’s father expressed his love through practical acts of care.","The speaker’s father was a quiet man who disliked conversation.","The speaker regrets never having thanked the father.","The speaker and the father often argued about small things."],"The father never says “love”, but he fills the tires, offers the coat and clears the snow. The last line states that these acts were what he “had to say”.",["oos|The father speaks several times. The poem is about what his acts mean.","oos|No regret and no thanks are mentioned.","oos|No argument appears in the poem."]],
["i-detail","Deep-sea anglerfish live in darkness so complete that finding a mate is a matter of chance. In some species the tiny male, on meeting a female, bites into her skin and never lets go. His tissues fuse with hers; his eyes and most of his organs waste away, and he draws his nourishment from her blood. Some females carry several males.",["He becomes permanently joined to her and depends on her for food.","He guards her eggs until they hatch.","He grows until he is as large as the female.","He leaves in search of other females."],"The male “never lets go”, his tissues fuse with hers and he “draws his nourishment from her blood”.",["oos|Guarding eggs is not mentioned.","opp|The male is tiny, and his organs waste away.","opp|He “never lets go”."],"According to the text, what happens to the male after he attaches to a female in some species of anglerfish?"],
["i-main","Standard accounts say that writing was invented to record language. Archaeologist Denise Schmandt-Besserat proposed that in Mesopotamia it began with counting. For thousands of years, people there tracked grain and livestock with small clay tokens. Later the tokens were sealed in clay envelopes marked on the outside to show the contents, and eventually the marks alone, pressed into tablets, did the work. Only afterward were signs adapted to record names and speech.",["According to one proposal, writing in Mesopotamia developed from a system of accounting and was only later used for language.","Clay tokens were the first form of money in Mesopotamia.","Writing was invented at about the same time in several regions.","Mesopotamian tablets mainly recorded the names of rulers."],"The text contrasts the standard account with a proposal that writing grew out of counting tokens and was applied to language only later.",["oos|Tokens tracked goods. The text does not call them money.","oos|Only Mesopotamia is discussed.","opp|Names came “only afterward”. The early marks recorded goods."]],
["i-detail","Ecologist Soo-ah Kim tested whether city noise changes birdsong by recording great tits in ten cities and in nearby forests. City birds sang at a higher pitch, above the low rumble of traffic. When Kim played traffic noise to forest birds, they raised their pitch within minutes, which suggests that the difference reflects flexible behavior and not inherited change.",["Forest birds quickly sang higher when they were exposed to traffic noise.","City birds sing at a higher pitch than forest birds.","Great tits live in both cities and forests.","Traffic noise is low in pitch."],"Forest birds changed “within minutes” when they heard traffic noise. A change that fast must be behavior, not inheritance, which is what the text concludes from it.",["half|This is the difference being explained. It does not show whether the cause is behavior or inheritance.","irr|This is true in the text but says nothing about the cause of the difference.","irr|This explains why a higher pitch helps, not whether the change is flexible."],"According to the text, which finding suggests that the higher pitch of city birds is a flexible behavior?"],
["i-main","In the eighteenth century, sailors feared scurvy more than storms. Naval surgeon James Lind showed in 1747 that oranges and lemons cured it, yet the British navy did not issue citrus juice to its crews until 1795. Lind himself had muddied the result, burying it in a long book that recommended several other treatments, and a concentrated lemon syrup he promoted turned out to be useless because it had been boiled.",["A proven cure for scurvy was adopted slowly, in part because its discoverer presented it unclearly.","James Lind did not really discover a cure for scurvy.","Storms killed more sailors than scurvy did in the eighteenth century.","The British navy refused to accept advice from surgeons."],"The text gives the cure, the long delay and reasons for it that trace back to Lind’s own presentation. The main idea joins the delay and that cause.",["opp|The text says he showed that citrus fruit cured it.","oos|The text compares what sailors feared, not what killed more of them.","ext|The delay is explained by Lind’s muddled presentation, not by a refusal to listen."]],
["i-detail","Economist Bao Tran studied what happens when a rural area gains mobile phone coverage. In the fishing villages he examined, fishers began calling ahead to learn which market was short of fish that day. Prices, which had differed widely from one market to the next, converged; the share of the catch left unsold fell from about six percent to nearly zero; and fishers’ profits rose even though the average price paid by consumers fell slightly.",["They became more similar across markets.","They rose sharply in every market.","They began to differ more from market to market.","They stayed the same while profits fell."],"The text says prices “converged”, which means they moved toward one another.",["opp|The average consumer price fell slightly.","opp|Prices had differed widely before and converged afterward.","opp|Fishers’ profits rose."],"According to the text, what happened to fish prices after mobile phone coverage arrived?"],
["i-main","Rahel’s mother had a rule about bad news: it was never to be delivered standing up. So when Rahel came in and found her mother already seated at the table, hands folded, the good cups set out, she put down her bag and sat without being asked, and the two of them looked at the steam for a while before either spoke.",["Rahel understands from her mother’s preparations that something serious is about to be said.","Rahel and her mother have had a serious disagreement.","Rahel’s mother is preparing to welcome guests.","Rahel is annoyed by her mother’s rules."],"Because of the rule about bad news, the seated mother and the good cups tell Rahel what is coming. She sits “without being asked”, which shows that she understands.",["oos|No disagreement is described.","rec|The good cups belong to the mother’s preparation for the talk. No guests are mentioned.","oos|Rahel follows the rule without any sign of annoyance."]],
["i-detail","Geologist Marco Vidal notes that the Mediterranean Sea nearly dried up about six million years ago. Movement of the Earth’s crust closed the channel that connected it to the Atlantic, and because the rivers that feed the Mediterranean supply less water than evaporation removes, the level fell by more than a kilometer. The evidence is a layer of salt up to two kilometers thick beneath the present seafloor.",["Its rivers bring in less water than it loses to evaporation.","Its rivers stopped flowing six million years ago.","The Atlantic Ocean was lower than the Mediterranean.","A thick layer of salt absorbed the water."],"With the channel closed, the level fell “because the rivers … supply less water than evaporation removes”.",["oos|The rivers still supplied water, only less than was lost.","oos|The level of the Atlantic is not discussed.","swap|The salt layer is evidence left by the drying, not its cause."],"According to the text, why did the level of the Mediterranean fall once the connection to the Atlantic was closed?"]

["e-support","Biologist Hannah Kruger hypothesized that street lighting disrupts the feeding of bats. She predicted that bats would visit a hedgerow less often after lamps were installed beside it.",["After lamps were installed, the number of bat visits to the hedgerow fell by half, while visits to a nearby unlit hedgerow did not change.","Bats visited the hedgerow more often in summer than in spring.","The hedgerow contained more insects than a nearby field.","After lamps were installed, the number of bat visits to the hedgerow rose slightly."],"The prediction is fewer visits after lighting. A drop at the lit hedgerow, with no change at an unlit one, is exactly that result, and the comparison rules out other causes.",["irr|A seasonal difference says nothing about the effect of the lamps.","irr|The number of insects does not show how bats reacted to lighting.","opp|A rise in visits would contradict the prediction."],"Which finding, if true, would most directly support Kruger’s hypothesis?"],

["q-table",[{t:"Bird species recorded in four wetlands",h:["Wetland","Area (hectares)","Bird species"],r:[["Alder Marsh",12,48],["Brook Fen",30,61],["Cray Pool",45,75],["Dunmore",80,92]]},"Ecologists surveying four wetlands found that larger wetlands tended to hold more bird species. For example, Dunmore, the largest wetland at 80 hectares, had ____"],["92 species, the most of any wetland surveyed.","48 species, the fewest of any wetland surveyed.","75 species, fewer than Brook Fen.","61 species, the same number as Cray Pool."],"The Dunmore row shows 92 species, the highest number in the table. That fits the claim that larger wetlands hold more species.",["data|48 is the figure for Alder Marsh, the smallest wetland.","data|75 is the figure for Cray Pool, and it is more than Brook Fen’s 61.","data|61 is the figure for Brook Fen, and Cray Pool has 75."]],
["q-table",[{t:"Average commute time by mode of transport (minutes)",h:["Mode","2015","2023"],r:[["Car",34,41],["Bus",45,43],["Bicycle",22,21],["Train",38,36]]},"A city’s transport survey suggests that congestion has affected drivers more than other commuters: between 2015 and 2023, ____"],["the average car commute lengthened by 7 minutes, while commutes by the other modes became slightly shorter.","the average bus commute remained the longest of the four.","the average bicycle commute lengthened more than the average car commute.","the average train commute lengthened from 36 to 38 minutes."],"Car commutes went from 34 to 41 minutes, while bus, bicycle and train commutes each fell by 1 or 2 minutes. Only drivers lost time, which supports the claim.",["irr|This is accurate, but it does not show that drivers were affected more than others.","opp|The bicycle commute fell from 22 to 21 minutes.","data|The years are reversed: the train commute fell from 38 to 36 minutes."]],
["q-graph",[{t:"Households owning at least one bicycle",h:["Region","Households (%)"],r:[["North",30],["South",50],["East",70],["West",40]],g:1,y:"Households (%)"},"A national survey found large regional differences in bicycle ownership. The share of households owning a bicycle was highest in ____"],["the East, at about 70 percent, and lowest in the North, at about 30 percent.","the South, at about 50 percent, and lowest in the West, at about 40 percent.","the East, at about 50 percent, and lowest in the North, at about 40 percent.","the West, at about 70 percent, and lowest in the East, at about 30 percent."],"The tallest bar is the East (about 70) and the shortest is the North (about 30).",["data|The South and West bars are the two middle values, not the highest and lowest.","data|The regions are right but the values are not: the East is about 70 and the North about 30.","data|The West is about 40, and the East is the highest, not the lowest."]],
["q-table",[{t:"Bean seedlings grown under colored lamps",h:["Color of light","Average height after 4 weeks (cm)"],r:[["White",18],["Red",15],["Blue",12],["Green",6]]},"Students grew bean seedlings under lamps of four colors. They concluded that green light is the least effective for growth, since seedlings under green light ____"],["reached an average height of only 6 cm, half the height of the next-shortest group.","reached an average height of 12 cm, less than seedlings under red light.","grew taller than seedlings under blue light.","reached an average height of 18 cm, the greatest of the four groups."],"The green row shows 6 cm. The next-shortest group, blue, reached 12 cm, so green is half of that and clearly the least effective.",["data|12 cm is the figure for blue light.","opp|Seedlings under green light (6 cm) were shorter than those under blue light (12 cm).","data|18 cm is the figure for white light."]],
["q-table",[{t:"Loans from the city library, by type (thousands)",h:["Type","2019","2023"],r:[["Printed books",120,95],["E-books",30,70],["Audiobooks",10,35]]},"The library’s director says that borrowing has shifted toward digital formats. From 2019 to 2023, ____"],["loans of printed books fell, while loans of e-books and audiobooks each more than doubled.","printed books remained the most borrowed type.","loans of all three types increased.","loans of audiobooks overtook loans of e-books."],"Printed books fell from 120 to 95 thousand. E-books rose from 30 to 70 and audiobooks from 10 to 35, each more than double. That is a shift toward digital formats.",["irr|This is true (95 is still the largest figure), but it does not show a shift toward digital formats.","data|Loans of printed books fell from 120 to 95 thousand.","data|In 2023 audiobooks (35) were still below e-books (70)."]],
["q-graph",[{t:"Average monthly rainfall in two towns",h:["Month","Coastal town","Inland town"],r:[["January",80,30],["April",60,40],["July",20,50],["October",70,30]],g:1,y:"Rainfall (mm)"},"The two towns have opposite rainfall patterns. In July, for instance, ____"],["the inland town receives the most rain of the four months shown, while the coastal town receives the least.","both towns receive less rain than they do in January.","the coastal town receives more rain than the inland town.","the two towns receive about the same amount of rain."],"In July the inland bar is at its highest (about 50 mm) and the coastal bar at its lowest (about 20 mm). That contrast illustrates opposite patterns.",["data|The inland town receives more rain in July (about 50 mm) than in January (about 30 mm).","opp|In July the inland town (about 50 mm) receives more than the coastal town (about 20 mm).","data|The July bars differ by about 30 mm."]],
["q-table",[{t:"Performance on an attention task after different amounts of sleep",h:["Sleep the night before","Average reaction time (ms)","Errors per 100 trials"],r:[["8 hours",250,2],["6 hours",280,4],["4 hours",340,9]]},"Researchers found that less sleep was associated with worse performance on both measures: participants who slept 4 hours ____"],["responded more slowly and made more errors than participants in either of the other groups.","responded in 250 milliseconds on average.","made fewer errors than participants who slept 6 hours.","responded more slowly than participants who slept 8 hours but made the same number of errors."],"The 4-hour row has the longest reaction time (340 ms) and the most errors (9). Both measures are worse, as the claim says.",["data|250 ms is the figure for the 8-hour group.","opp|The 4-hour group made 9 errors, more than the 6-hour group’s 4.","half|The reaction time is right, but the errors differ: 9 against 2."]],
["q-table",[{t:"Household recycling rates in three districts",h:["District","Curbside program","2020 rate (%)","2022 rate (%)"],r:[["Ashton","Yes",20,35],["Barlow","No",25,27],["Coombe","Yes",30,45]]},"City officials argue that the curbside collection program increased recycling. In the two districts that received the program, ____"],["recycling rates rose by 15 percentage points, compared with 2 points in the district that did not.","recycling rates in 2020 were 20 and 30 percent.","recycling rates rose by 2 percentage points.","recycling rates were lower in 2022 than in 2020."],"Ashton rose from 20 to 35 and Coombe from 30 to 45, each by 15 points. Barlow, without the program, rose only from 25 to 27. The comparison supports the officials.",["irr|These starting rates are accurate, but they show no change and so no effect of the program.","data|A rise of 2 points is the figure for Barlow, which had no program.","opp|Rates in both program districts rose."]],
["q-graph",[{t:"New titles published by a small press",h:["Year","New titles"],r:[["2019",10],["2020",5],["2021",15],["2022",20],["2023",25]],g:1,y:"New titles"},"After a drop in 2020, the press expanded steadily: ____"],["the number of new titles rose each year from 2021 to 2023, reaching about 25.","the number of new titles fell each year from 2021 to 2023.","the number of new titles in 2021 was lower than in 2020.","the number of new titles reached its highest level in 2019."],"The bars rise from about 15 in 2021 to 20 in 2022 and 25 in 2023. That is steady expansion after the low of 2020.",["opp|The bars rise from 2021 to 2023.","data|The 2021 bar (about 15) is higher than the 2020 bar (about 5).","data|The highest bar is 2023, at about 25."]],
["q-table",[{t:"Caffeine in a cup of tea",h:["Tea","Steeping time (minutes)","Caffeine (mg)"],r:[["Green",2,25],["Green",5,40],["Black",2,40],["Black",5,65]]},"A food chemist notes that steeping time matters as well as the type of tea. A cup of green tea steeped for 5 minutes, for example, ____"],["contained as much caffeine as a cup of black tea steeped for 2 minutes.","contained more caffeine than any cup of black tea.","contained 25 mg of caffeine.","contained less caffeine than green tea steeped for 2 minutes."],"Green tea at 5 minutes and black tea at 2 minutes both show 40 mg. A longer steeping time made up for the difference in tea type.",["opp|Black tea steeped for 5 minutes had 65 mg, more than the 40 mg in the green tea.","data|25 mg is the figure for green tea steeped for 2 minutes.","opp|40 mg at 5 minutes is more than 25 mg at 2 minutes."]],

["q-table",[{t:"Four mammal species",h:["Species","Average body mass (kg)","Resting heart rate (beats per minute)","Typical lifespan (years)"],r:[["Mouse",0.02,600,2],["Rabbit",2,200,9],["Dog",20,90,12],["Horse",500,40,28]]},"Biologists have long noted that among mammals, larger species tend to have slower heart rates and longer lives. The data in the table are consistent with this pattern: ____"],["the horse, the heaviest animal listed, has the lowest heart rate and the longest lifespan.","the dog has a heart rate of 90 beats per minute and a lifespan of 12 years.","the rabbit, which weighs less than the dog, has a longer lifespan than the dog.","the mouse has a slower heart rate than the rabbit."],"The horse is the heaviest (500 kg) and has the slowest heart (40) and the longest life (28 years). All three parts of the pattern appear in one comparison.",["irr|These figures are accurate, but without a comparison to another species they show no pattern.","data|The rabbit lives 9 years and the dog 12.","opp|The mouse’s heart rate (600) is faster than the rabbit’s (200)."]],
["q-graph",[{t:"Students choosing each elective",h:["Elective","2015","2023"],r:[["Art",30,20],["Music",25,25],["Coding",10,35],["Drama",20,10]],g:1,y:"Students (%)"},"The school’s report concludes that interest has moved toward technical subjects. Between 2015 and 2023, ____"],["the share of students choosing coding more than tripled, while the shares choosing art and drama fell.","the share of students choosing music stayed at about 25 percent.","art remained the most popular elective.","the share of students choosing coding fell by about 25 percentage points."],"Coding rose from about 10 to about 35 percent, more than three times as much, while art and drama each fell by about 10 points. That is a move toward a technical subject.",["irr|This is accurate, but an unchanged share for music shows no move toward technical subjects.","data|In 2023 coding (about 35) was above art (about 20).","opp|Coding rose by about 25 points."]],
["q-table",[{t:"Results of a maize fertilizer trial",h:["Treatment","Yield (tonnes per hectare)","Cost ($ per hectare)"],r:[["None","3.0",0],["Compost","4.2",40],["Chemical fertilizer","4.5",120],["Both","4.6",160]]},"The agronomists conclude that compost offers the best value: ____"],["it raised the yield by 1.2 tonnes per hectare for $40, whereas chemical fertilizer added only 0.3 tonnes more at three times the cost.","using both treatments produced the highest yield, 4.6 tonnes per hectare.","compost produced a higher yield than chemical fertilizer.","plots with no treatment yielded 3.0 tonnes per hectare at no cost."],"Value compares gain with cost. Compost lifted the yield from 3.0 to 4.2 for $40. Chemical fertilizer reached 4.5, only 0.3 more, for $120.",["irr|This is about the highest yield, not about value for money.","data|Compost yielded 4.2 and chemical fertilizer 4.5.","irr|The untreated plots are the baseline. They say nothing about the value of compost."]],
["q-table",[{t:"Vocabulary test scores by study method",h:["Study method","Immediate test (%)","Test one week later (%)"],r:[["Rereading",80,45],["Flashcards",78,60],["Self-testing",75,70]]},"The researchers argue that a method’s short-term results can be misleading. Rereading, for example, ____"],["produced the highest score on the immediate test but the lowest score a week later.","produced a lower score after a week than on the immediate test.","produced the highest score on both tests.","produced a score of 70 percent after a week."],"Rereading led on the immediate test (80) and came last a week later (45). A method that looks best at first and worst later is the misleading case the researchers describe.",["half|This is true of every method in the table, so it does not show why rereading is misleading.","data|A week later rereading (45) was below both other methods.","data|70 percent is the one-week figure for self-testing."]],
["q-graph",[{t:"Fish species at reef sites",h:["Distance from the port","Average number of fish species"],r:[["1 km",12],["5 km",20],["10 km",28],["20 km",30]],g:1,y:"Fish species"},"Marine ecologists report that reefs farther from the port support more fish species, although the gain levels off: ____"],["sites 10 km away had many more species than sites 1 km away, but sites 20 km away had only slightly more than sites at 10 km.","sites 20 km away had about 30 species.","sites 5 km away had more species than sites 10 km away.","the number of species doubled between 10 km and 20 km."],"The bars climb from about 12 to about 28 over the first 10 km and then rise only to about 30 at 20 km. That shows both the increase and the leveling off.",["half|One value shows neither the increase nor the leveling off.","opp|The 5 km bar (about 20) is lower than the 10 km bar (about 28).","data|The rise from 10 km to 20 km is from about 28 to about 30, far from double."]],
["q-table",[{t:"Turnout in two town elections, by age group (%)",h:["Age group","2018","2022"],r:[["18–29",22,38],["30–44",41,44],["45–64",55,56],["65 and over",63,62]]},"Analysts attribute the higher overall turnout in 2022 mainly to younger voters: ____"],["turnout among voters aged 18–29 rose by 16 percentage points, far more than in any other age group.","turnout among voters aged 65 and over remained the highest of any group.","turnout rose in every age group.","turnout among voters aged 18–29 in 2022 was higher than among voters aged 30–44."],"The youngest group went from 22 to 38, a rise of 16 points. The other groups changed by 3 points or less. The increase came mainly from young voters.",["irr|This is accurate, but that group’s turnout fell slightly, so it does not explain the overall rise.","data|Turnout among voters aged 65 and over fell from 63 to 62.","data|In 2022, turnout was 38 for ages 18–29 and 44 for ages 30–44."]],
["q-table",[{t:"Properties of four alloys",h:["Alloy","Density (g/cm³)","Strength (megapascals)"],r:[["A",2.7,310],["B",4.4,900],["C",7.8,520],["D",1.8,260]]},"Engineers designing an aircraft part needed a material that is both strong and light. They selected alloy B because ____"],["it is the strongest of the four and is much less dense than alloy C, the next strongest.","it is the least dense of the four.","it has a density of 4.4 grams per cubic centimeter.","it is stronger than alloy A but weaker than alloy C."],"B has the highest strength (900). The next strongest, C (520), is much denser (7.8 against 4.4). B therefore combines strength with relatively low weight.",["data|The least dense alloy is D, at 1.8.","irr|A single figure with no comparison does not explain the choice.","data|B (900) is stronger than C (520)."]],
["q-graph",[{t:"Average test scores before and after a tutoring program",h:["School","Before","After"],r:[["Elm",60,75],["Oak",65,70],["Pine",55,75],["Ash",70,70]],g:1,y:"Average score"},"The program’s effect varied from school to school. The largest gain occurred at ____"],["Pine, where the average score rose by about 20 points.","Elm, where the average score rose by about 20 points.","Ash, where the average score was highest before the program.","Oak, where the average score rose by about 15 points."],"Pine’s bars go from about 55 to about 75, a gain of about 20. That is the largest difference between any pair of bars.",["data|Elm rose from about 60 to about 75, which is about 15 points.","irr|Ash started highest but did not gain at all.","data|Oak rose from about 65 to about 70, which is about 5 points."]],
["q-table",[{t:"Honeybees released one kilometer from their hive",h:["Pesticide exposure","Bees that returned (%)","Average time to return (minutes)"],r:[["None",85,12],["Low",70,18],["High",45,30]]},"The researchers conclude that the pesticide impairs bees’ ability to find their way, noting that as exposure increased, ____"],["fewer bees returned to the hive, and those that returned took longer.","85 percent of unexposed bees returned to the hive.","more bees returned to the hive, but they took longer.","bees returned to the hive more quickly."],"From none to high exposure, the share returning falls (85, 70, 45) and the time rises (12, 18, 30). Both trends point to impaired navigation.",["irr|The figure for unexposed bees shows no trend with exposure.","half|The time is right, but the share that returned fell.","opp|Return times rose from 12 to 30 minutes."]],
["q-table",[{t:"Employees working mainly from home (%)",h:["Industry","2019","2023"],r:[["Finance",8,35],["Retail",2,4],["Software",20,60],["Health care",3,6]]},"The shift to remote work has been uneven. While ____ the share in retail and health care remained in single digits."],["the share in software tripled to 60 percent and the share in finance more than quadrupled,","the share in software fell from 60 to 20 percent,","finance had a larger share of remote employees than software in 2023,","the share in software rose by 15 percentage points,"],"Software went from 20 to 60 (three times as much) and finance from 8 to 35 (more than four times). Retail and health care reached only 4 and 6. That contrast shows an uneven shift.",["data|The years are reversed: software rose from 20 to 60.","data|In 2023 finance was at 35 and software at 60.","data|Software rose by 40 points."]],

["q-table",[{t:"Results of a seven-day drug trial",h:["Group","Participants","Recovered within 7 days"],r:[["Treatment",200,150],["Placebo",200,140]]},"The trial’s authors caution that the drug’s benefit appears to be modest: ____"],["75 percent of the treatment group recovered within 7 days, compared with 70 percent of the placebo group.","150 participants in the treatment group recovered within 7 days.","participants in the treatment group were twice as likely to recover as those in the placebo group.","fewer participants recovered in the treatment group than in the placebo group."],"150 of 200 is 75 percent and 140 of 200 is 70 percent. A difference of 5 points is a benefit, but a modest one.",["half|Without the placebo figure there is no way to judge the size of the benefit.","data|150 against 140 is far from twice as many.","opp|More recovered in the treatment group (150) than in the placebo group (140)."]],
["q-graph",[{t:"Birds counted at two kinds of feeder",h:["Species","Feeder near shrubs","Feeder in the open"],r:[["Sparrow",40,20],["Wren",30,10],["Jay",10,25],["Crow",15,30]],g:1,y:"Birds counted"},"An ornithologist predicted that small birds, which are vulnerable to hawks, would prefer feeders near shrubs, whereas larger birds would not. Consistent with the prediction, ____"],["sparrows and wrens were counted more often at feeders near shrubs, while jays and crows were counted more often at feeders in the open.","sparrows were the species most often counted at feeders near shrubs.","all four species were counted more often at feeders near shrubs.","jays and crows were counted more often near shrubs than sparrows and wrens were."],"For the small birds the shrub bars are taller (about 40 against 20, and 30 against 10). For the large birds the open bars are taller. That is the predicted split.",["half|This covers one small species and says nothing about the larger birds.","data|Jays and crows have taller bars for feeders in the open.","opp|Near shrubs, jays (about 10) and crows (about 15) were counted less often than sparrows and wrens."]],
["q-table",[{t:"Cycling in three cities",h:["City","Commuters who cycle (%)","Injuries per million bicycle trips"],r:[["Avon",3,12],["Brent",9,6],["Calder",18,3]]},"Researchers describe a “safety in numbers” effect: where more people cycle, each trip is safer. In Calder, for instance, ____"],["the share of commuters who cycle is six times that in Avon, yet the injury rate per trip is only a quarter as high.","18 percent of commuters cycle.","the injury rate per trip is higher than in Brent.","the share of commuters who cycle is 9 percent."],"Calder has 18 percent against Avon’s 3 (six times as many) and 3 injuries per million trips against 12 (a quarter). More cycling goes with safer trips.",["half|This gives the amount of cycling but nothing about safety.","opp|Calder’s rate (3) is lower than Brent’s (6).","data|9 percent is the figure for Brent."]],
["q-table",[{t:"Words recalled from a list of 30",h:["Learned in","Tested in","Average words recalled"],r:[["Quiet room","Quiet room",14],["Quiet room","Noisy room",9],["Noisy room","Noisy room",12],["Noisy room","Quiet room",9]]},"The psychologists conclude that recall depends on a match between the conditions of learning and testing and not simply on how quiet the test room is: participants who learned in a noisy room ____"],["recalled more words when tested in a noisy room (12) than when tested in a quiet room (9).","recalled fewer words than participants who learned and were tested in a quiet room.","recalled 14 words when tested in a quiet room.","recalled the same number of words in both test rooms."],"If quiet alone mattered, the noisy-room learners would do better in the quiet room. They did better in the noisy one (12 against 9), where conditions matched.",["irr|This is accurate, but it compares different learners and would fit the idea that quiet is simply better.","data|14 is the figure for those who learned and were tested in a quiet room.","data|They recalled 12 words in one room and 9 in the other."]],
["q-table",[{t:"Length of three glaciers (km)",h:["Glacier","1950","2020"],r:[["Aster","12.0","10.8"],["Borel","6.0","4.2"],["Cime","20.0","19.0"]]},"A glaciologist points out that small glaciers are shrinking faster in proportion to their size: ____"],["Borel lost 1.8 km, or 30 percent of its length, whereas Cime lost 1.0 km, or 5 percent.","Cime lost 1.0 km, less than either Aster or Borel.","Borel was 6.0 km long in 1950, and Cime was 20.0 km long.","Aster lost 30 percent of its length, and Borel lost 10 percent."],"Borel, the smallest, lost 1.8 of 6.0 km (30 percent). Cime, the largest, lost 1.0 of 20.0 km (5 percent). The claim is about proportion, and these percentages show it.",["half|This compares kilometers lost, not the proportion of each glacier’s length.","irr|Starting lengths show which glaciers are small but not how fast they shrank.","data|The figures are swapped: Aster lost 10 percent and Borel 30 percent."]],
["q-graph",[{t:"Time for seeds to sprout after storage",h:["Storage temperature","Median days to sprout"],r:[["5°C",6],["15°C",8],["25°C",14],["35°C",20]],g:1,y:"Days"},"Seeds that had been stored in warmer conditions sprouted more slowly. Seeds stored at 35°C, for example, ____"],["took about 20 days to sprout, more than three times as long as seeds stored at 5°C.","took about 14 days to sprout.","sprouted sooner than seeds stored at 25°C.","took about 20 days to sprout, twice as long as seeds stored at 25°C."],"The 35°C bar is at about 20 days and the 5°C bar at about 6. Twenty is more than three times six.",["data|About 14 days is the value for 25°C.","opp|Seeds stored at 35°C (about 20 days) were slower than those stored at 25°C (about 14).","data|The 25°C bar is at about 14 days, and 20 is not twice 14."]],
["q-table",[{t:"Main source of news, by age group (% of respondents)",h:["Source","Under 30","30–59","60 and over"],r:[["Television",15,40,70],["Social media",60,30,8],["Printed newspapers",5,12,14],["Other",20,18,8]]},"The survey suggests that the main source of news differs sharply by generation: ____"],["a majority of respondents under 30 named social media, while a majority of those 60 and over named television.","television was named by 40 percent of respondents aged 30–59.","printed newspapers were the least-named source among respondents under 30.","social media was named more often than television in every age group."],"Social media has 60 percent among those under 30, and television has 70 percent among those 60 and over. Each is a majority, and the two groups differ sharply.",["irr|A figure for the middle group shows no contrast between generations.","irr|This is accurate, but it concerns one group only.","data|Among those 30–59 and those 60 and over, television was named more often."]],
["q-table",[{t:"Activity of an enzyme at different pH values",h:["pH","Activity (% of maximum)"],r:[[2,5],[4,30],[6,85],[7,100],[8,80],[10,10]]},"The enzyme works within a narrow range around neutral pH. Its activity ____"],["peaked at pH 7 and fell to 10 percent or less of the maximum at pH 2 and pH 10.","increased steadily as pH rose from 2 to 10.","was higher at pH 4 than at pH 6.","was 85 percent of the maximum at pH 6."],"Activity is 100 at pH 7 and drops to 5 at pH 2 and 10 at pH 10. A peak at neutral with steep losses on both sides is a narrow range.",["data|Activity falls after pH 7, from 100 to 80 to 10.","opp|Activity was 30 at pH 4 and 85 at pH 6.","half|One value near the peak does not show that the range is narrow."]],
["q-graph",[{t:"Weekly viewing by age group",h:["Age group","Television","Online video"],r:[["16–24",8,20],["25–44",12,14],["45–64",20,8],["65 and over",28,4]],g:1,y:"Hours per week"},"Media researchers observe that the two kinds of viewing trade places across age groups: ____"],["the youngest group watched far more online video than television, and the oldest group showed the reverse.","every age group watched more television than online video.","the 25–44 group watched about 12 hours of television per week.","online video viewing increased with age."],"For ages 16–24 the online bar (about 20) is far above the television bar (about 8). For 65 and over, television (about 28) is far above online video (about 4).",["data|The two youngest groups watched more online video than television.","irr|One value for one group does not show the two kinds of viewing trading places.","opp|The online video bars get shorter with age, from about 20 to about 4."]],
["q-table",[{t:"Antibiotic use and resistance in four hospitals",h:["Hospital","Antibiotic use (doses per 1,000 patient-days)","Infections resistant to the antibiotic (%)"],r:[["Northgate",300,8],["Eastfield",500,15],["Southmoor",700,24],["Westbury",900,31]]},"The investigators report a consistent relationship between how heavily a hospital used the antibiotic and how common resistance was: ____"],["each hospital that used more of the antibiotic than another also had a higher percentage of resistant infections.","Westbury used 900 doses per 1,000 patient-days.","Northgate had the highest percentage of resistant infections.","Eastfield and Southmoor had the same percentage of resistant infections."],"Use rises down the table (300, 500, 700, 900), and resistance rises with it (8, 15, 24, 31). The order is the same for both, which is a consistent relationship.",["half|One hospital’s use, without its resistance or a comparison, shows no relationship.","data|Northgate had the lowest percentage, 8.","data|Eastfield had 15 percent and Southmoor 24."]],

["q-table",[{t:"Plant species in meadow plots",h:["Grazing intensity","Average number of plant species per plot"],r:[["None",14],["Light",22],["Moderate",27],["Heavy",11]]},"The ecologists reject the idea that grazing simply reduces plant diversity. Their plots suggest instead that diversity is greatest at intermediate levels of disturbance: ____"],["moderately grazed plots had the most species, while both ungrazed and heavily grazed plots had far fewer.","heavily grazed plots had the fewest species.","lightly grazed plots had more species than ungrazed plots.","ungrazed plots had the most species."],"The peak is at moderate grazing (27), with low values at both ends (14 with none, 11 with heavy). A peak in the middle is what “greatest at intermediate levels” means.",["half|Taken alone this fits the rejected idea that grazing reduces diversity. It leaves out the low value for ungrazed plots.","half|This shows one side of the rise but not the fall under heavy grazing.","data|Ungrazed plots had 14 species, fewer than lightly and moderately grazed plots."]],
