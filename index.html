    ex:{t:"The fungus acts slowly, which limits its usefulness once a swarm is already on the move.", s:"The fungus is particularly useful against migrating swarms.", a:"F", w:"“usefulness” soʻzi bor, lekin u cheklanishi haqida."},
    check:"Bu soʻz matnda aynan nimaga tegishli?" }
};
const TRAP_ORDER = ["paraphrase","direct","quantifier","absolute","generalization","specificity","superlative","comparison","hedging","opinion","attribution","causal","assumption","time","sequence","negation","wordmatch"];

const MISS = {
  "T>F":"Siz FALSE dedingiz, lekin matn buni tasdiqlaydi. Koʻpincha paraphrase ni zidlik deb oʻqish yoki bitta soʻzni notoʻgʻri tushunish sababli boʻladi. Isbot jumlasini bayonot bilan soʻzma-soʻz emas, maʼno bilan solishtiring.",
  "T>NG":"Ortiqcha ehtiyotkorlik: maʼlumot matnda bor edi, faqat boshqa soʻzlar bilan aytilgan. Soʻzlar mos kelmasa ham, maʼno va mavzu mos boʻlsa — TRUE.",
  "F>T":"Matndagi oʻxshash soʻzlar aldadi: bitta soʻz (miqdor, inkor, kuchaytiruvchi soʻz yoki isbot darajasi) maʼnoni oʻzgartirgan. Jumlani oxirigacha, ayniqsa however, but, only dan keyingi qismini oʻqing.",
  "F>NG":"Zidlikni koʻrmay qoldingiz: matnda bayonotni inkor qiladigan jumla bor. Barmoq testi: isbot jumlasini koʻrsatib, “bu teskarisini aytyapti” deya olasizmi?",
  "NG>T":"Matnda yoʻq maʼlumotni bor deb oldingiz. Bayonotdagi qaysi qism (detal, sabab, “eng …”, miqdor) isbotsiz qolganini toping — aynan shu qism javobni NOT GIVEN qiladi.",
  "NG>F":"Barmoq testi oʻtmaydi: matnda bayonotga zid jumla yoʻq — faqat bu haqda maʼlumot yoʻq. FALSE uchun matn teskarisini aytishi shart; indamasa — NOT GIVEN."
};

const LBL = {T:"TRUE", F:"FALSE", NG:"NOT GIVEN"};
const EXAM = {IELTS:"IELTS Academic uslubi", TOEFL:"TOEFL uslubi", SAT:"SAT uslubi"};
const LETTERS = "ABCDEFGH";

/* ---------- Maʼlumotlarni tayyorlash ---------- */
const Q = {}, ALL = [], PBY = {};
PASSAGES.forEach(p => {
  PBY[p.id] = p;
  p.words = p.paras.join(" ").split(/\s+/).length;
  p.qs.forEach((q, i) => { q.id = p.id + "-" + (i+1); q.n = i+1; q.P = p; Q[q.id] = q; ALL.push(q); });
});

let store = { ans:{} };
try { const raw = localStorage.getItem("tfng-trenajor-v1"); if (raw) { const s = JSON.parse(raw); if (s && s.ans) store = s; } } catch(e) {}
function save(){ try { localStorage.setItem("tfng-trenajor-v1", JSON.stringify(store)); } catch(e) {} }
function record(q, v){
  const r = store.ans[q.id] || { n:0, wrong:0, hist:[] };
  r.n++; r.last = v; r.ok = (v === q.a); if (!r.ok) r.wrong++;
  r.hist = (r.hist || []).concat(v).slice(-10);
  store.ans[q.id] = r; save();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
const dots = lv => "●".repeat(lv) + "○".repeat(3-lv);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;

/* ---------- Holat ---------- */
const S = { view:"lib", exam:"ALL", level:0, sess:null, timer:null };
const view = document.getElementById("view");

/* ---------- Umumiy bloklar ---------- */
function passageHTML(p, opt){
  opt = opt || {};
  const body = p.paras.map((t, i) => {
    let html = esc(t);
    if (opt.ev && opt.evPara === i) {
      const k = t.indexOf(opt.ev);
      if (k >= 0) html = esc(t.slice(0,k)) + '<mark class="ev' + (opt.ng ? " ng" : "") + '" id="evmark">' + esc(opt.ev) + "</mark>" + esc(t.slice(k + opt.ev.length));
    }
    const focus = (opt.focus === i) ? " focus" : "";
    return '<p class="para' + focus + '"><span class="pl" aria-hidden="true">' + LETTERS[i] + "</span>" + html + "</p>";
  }).join("");
  return '<div class="ph"><span class="tag t-' + p.exam + '">' + EXAM[p.exam] + '</span><h2 class="ptitle">' + esc(p.title) + '</h2><div class="pmeta">' + esc(p.topic) + " · " + p.words + " soʻz · daraja " + dots(p.level) + "</div></div>" + body;
}

function treeHTML(a){
  const s1 = a === "F" ? "yes" : "no";
  const s2 = a === "F" ? "skip" : (a === "T" ? "yes" : "no");
  return '<ol class="tree">' +
    '<li class="st ' + s1 + '"><span class="q">Matnda bayonotga zid jumla bormi?</span><span class="r">' + (a==="F" ? "Ha → <b>FALSE</b>" : "Yoʻq → keyingi savol") + "</span></li>" +
    '<li class="st ' + s2 + '"><span class="q">Bayonotning barcha qismlari matnda isbotlanganmi?</span><span class="r">' + (a==="F" ? "—" : a==="T" ? "Ha → <b>TRUE</b>" : "Yoʻq → <b>NOT GIVEN</b>") + "</span></li></ol>";
}

function ruleHTML(k){
  const t = TRAPS[k];
  return t.body.map(b => "<p>" + esc(b) + "</p>").join("") +
    '<div class="sig"><span class="lab">Signal soʻzlar</span> ' + esc(t.signals) + "</div>" +
    '<div class="exbox"><div><span class="lab">Matn</span><span class="en">' + esc(t.ex.t) + '</span></div><div><span class="lab">Bayonot</span><span class="en">' + esc(t.ex.s) + '</span></div><div><span class="lab">Javob</span><b>' + LBL[t.ex.a] + "</b> — " + esc(t.ex.w) + "</div></div>" +
    '<p class="chk"><span class="lab">Tekshirish savoli</span> ' + esc(t.check) + "</p>";
}

function trapCount(k){ return ALL.filter(q => q.trap === k).length; }

function fbHTML(q, v, uid){
  const ok = v === q.a, t = TRAPS[q.trap];
  let h = '<div class="fb">';
  h += '<div class="verdict ' + (ok ? "ok" : "bad") + '">' + (ok ? "✓ Toʻgʻri — " + LBL[q.a] : "✗ Xato. Siz: " + LBL[v] + " · Toʻgʻri javob: <b>" + LBL[q.a] + "</b>") + "</div>";
  h += '<div class="fsec"><h4>' + (q.a === "NG" ? "Eng yaqin joy" : "Isbot") + " · " + LETTERS[q.p] + ' xatboshi</h4><blockquote class="' + (q.a === "NG" ? "ng" : "") + '">“' + esc(q.ev) + "”</blockquote>" +
       (q.a === "NG" ? '<p class="note">Matn shu mavzuga eng yaqin joyda ham bayonotni na tasdiqlaydi, na inkor qiladi.</p>' : "") + "</div>";
  h += '<div class="fsec"><h4>Tahlil</h4><p>' + esc(q.ex) + "</p></div>";
  if (!ok) h += '<div class="fsec miss"><h4>Qayerda adashdingiz</h4><p>' + esc(MISS[q.a + ">" + v]) + "</p></div>";
  h += '<div class="fsec"><h4>Qaror yoʻli</h4>' + treeHTML(q.a) + "</div>";
  h += '<div class="trapcard"><div class="th"><span class="eyebrow">Tuzoq</span><b>' + esc(t.uz) + '</b><span class="mono">' + esc(t.name) + "</span></div><p>" + esc(t.short) + "</p>" +
       '<div class="btns"><button class="btn ghost" data-act="rule" data-uid="' + uid + '">Qoidani batafsil oʻqish</button><button class="btn ghost" data-act="trapdrill" data-t="' + q.trap + '">Shu tuzoq boʻyicha mashq (' + trapCount(q.trap) + ")</button></div>" +
       '<div class="rulefull" id="rf-' + uid + '" hidden>' + ruleHTML(q.trap) + "</div></div>";
  return h + "</div>";
}

function bubbles(sel, done, correct, act, extra){
  return ["T","F","NG"].map((v, i) => {
    let c = "bub";
    if (sel === v) c += " sel";
    if (done && v === correct) c += " right";
    if (done && sel === v && v !== correct) c += " wrong";
    return '<button class="' + c + '" data-act="' + act + '" data-v="' + v + '"' + (extra || "") + (done ? " disabled" : "") + ' aria-pressed="' + (sel === v) + '"><span class="o">' + (v === "NG" ? "NG" : v) + '</span><span class="w">' + LBL[v] + '</span><kbd>' + (i+1) + "</kbd></button>";
  }).join("");
}

/* ---------- Kutubxona ---------- */
function libHTML(){
  const answered = Object.keys(store.ans).filter(k => Q[k]).length;
  const wrongIds = Object.keys(store.ans).filter(k => Q[k] && !store.ans[k].ok);
  const list = PASSAGES.filter(p => (S.exam === "ALL" || p.exam === S.exam) && (!S.level || p.level === S.level));
  let h = '<section class="intro"><h1>True / False / Not Given</h1><p class="lede">IELTS, TOEFL va SAT uslubidagi ' + PASSAGES.length + " ta matn, " + ALL.length + " ta savol va " + TRAP_ORDER.length + " ta tuzoq qoidasi. Har javobdan keyin matndagi isbot belgilanadi va tuzoq qoidasi batafsil tushuntiriladi.</p>" +
    '<div class="progress-line"><span>Yechilgan: <b class="num">' + answered + " / " + ALL.length + "</b></span><span>Toʻgʻri: <b class=\"num\">" + pct(answered - wrongIds.length, answered) + "%</b></span></div></section>";
  h += '<section class="quick">' +
    qcard("mix", "Aralash 20 savol", "Barcha matnlardan tasodifiy, har savol oʻz matni bilan") +
    qcard("hard", "Eng qiyin savollar", ALL.filter(q => q.lv === 3).length + " ta 3-darajali savol") +
    qcard("mist", "Xatolarim ustida", wrongIds.length ? wrongIds.length + " ta savol qayta yechiladi" : "Hozircha xato yoʻq", !wrongIds.length) +
    qcard("ng", "Faqat FALSE va NOT GIVEN", "Eng koʻp adashiladigan juftlik — 30 savol") + "</section>";
  h += '<section class="filters" aria-label="Filtr"><div class="seg" role="group">' +
    ["ALL","IELTS","TOEFL","SAT"].map(e => '<button data-act="fexam" data-v="' + e + '" aria-pressed="' + (S.exam === e) + '">' + (e === "ALL" ? "Hammasi" : e) + "</button>").join("") +
    '</div><div class="seg" role="group">' + [0,1,2,3].map(l => '<button data-act="flevel" data-v="' + l + '" aria-pressed="' + (S.level === l) + '">' + (l ? "Daraja " + l : "Har qanday daraja") + "</button>").join("") + "</div></section>";
  h += '<section class="plist">' + list.map(p => {
    const done = p.qs.filter(q => store.ans[q.id]).length, ok = p.qs.filter(q => store.ans[q.id] && store.ans[q.id].ok).length;
    return '<article class="prow"><div class="pinfo"><span class="tag t-' + p.exam + '">' + p.exam + '</span><h3>' + esc(p.title) + '</h3><div class="pmeta">' + esc(p.topic) + " · " + p.qs.length + " savol · " + p.words + " soʻz · daraja " + dots(p.level) + "</div>" +
      '<div class="bar" aria-label="Natija"><i style="width:' + pct(done, p.qs.length) + '%"></i></div><div class="pmeta num">' + (done ? done + " / " + p.qs.length + " yechilgan, " + ok + " toʻgʻri" : "Hali boshlanmagan") + "</div></div>" +
      '<div class="pact"><button class="btn primary" data-act="start" data-p="' + p.id + '" data-m="practice">Mashq</button><button class="btn" data-act="start" data-p="' + p.id + '" data-m="exam">Imtihon · ' + fmt(p.qs.length * 90) + "</button></div></article>";
  }).join("") + (list.length ? "" : '<p class="empty">Bu filtr boʻyicha matn yoʻq.</p>') + "</section>";
  h += '<p class="foot">Matnlar shu trenajor uchun IELTS, TOEFL va SAT Reading uslubida yozilgan original mashq matnlari; rasmiy imtihon materiallari emas. True / False / Not Given formati IELTS Readingga xos — TOEFL va SAT uslubidagi matnlar akademik va badiiy matnni oʻqish uchun qoʻshilgan.</p>';
  return h;
}
function qcard(k, t, d, dis){ return '<button class="qc" data-act="quick" data-k="' + k + '"' + (dis ? " disabled" : "") + '><b>' + t + "</b><span>" + d + "</span></button>"; }

/* ---------- Seans ---------- */
function startSession(ids, title, mode, pid){
  stopTimer();
  S.sess = { ids, title, mode, pid, idx:0, ans:{}, hint:{}, open:{}, submitted:false, left: ids.length * 90 };
  S.view = "sess"; render(); window.scrollTo(0,0);
  if (mode === "exam") startTimer();
}
function startTimer(){
  S.timer = setInterval(() => {
    const s = S.sess; if (!s || s.submitted) return stopTimer();
    s.left--; const el = document.getElementById("clock"); if (el) { el.textContent = fmt(s.left); el.classList.toggle("low", s.left <= 60); }
    if (s.left <= 0) { submitExam(true); }
  }, 1000);
}
function stopTimer(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }

function sessHTML(){
  const s = S.sess;
  const q = Q[s.ids[s.idx]];
  let evOpt = {};
  if (s.mode === "practice") {
    if (s.ans[q.id]) evOpt = { ev:q.ev, evPara:q.p, ng:q.a === "NG" };
    else if (s.hint[q.id]) evOpt = { focus:q.p };
  } else if (s.submitted && s.focusQ) {
    const fq = Q[s.focusQ]; evOpt = { ev:fq.ev, evPara:fq.p, ng:fq.a === "NG" };
  }
  const p = s.mode === "practice" ? q.P : PBY[s.pid];
  const correct = s.ids.filter(id => s.ans[id] === Q[id].a).length, answered = s.ids.filter(id => s.ans[id]).length;
  let h = '<div class="sbar"><button class="btn ghost" data-act="home">← Matnlar</button><div class="stitle"><b>' + esc(s.title) + '</b><span class="mono">' + (s.mode === "exam" ? "Imtihon rejimi" : "Mashq rejimi") + "</span></div>";
  if (s.mode === "exam") h += '<div class="clockwrap">' + (s.submitted ? '<span class="score num">' + correct + " / " + s.ids.length + "</span>" : '<span class="mono">Vaqt</span><span id="clock" class="clock num">' + fmt(s.left) + "</span>") + "</div>";
  else h += '<div class="clockwrap"><span class="mono">Toʻgʻri</span><span class="score num">' + correct + " / " + answered + "</span></div>";
  h += "</div>";
  if (s.mode === "practice") h += '<div class="strip" role="group" aria-label="Savollar">' + s.ids.map((id, i) => {
      let c = "sq"; if (s.ans[id]) c += s.ans[id] === Q[id].a ? " ok" : " bad"; if (i === s.idx) c += " cur";
      return '<button class="' + c + '" data-act="goto" data-i="' + i + '" aria-label="Savol ' + (i+1) + '">' + (i+1) + "</button>"; }).join("") + "</div>";
  h += '<div class="sgrid"><section class="passage" id="passage" aria-label="Matn">' + passageHTML(p, evOpt) + '</section><section class="qpane">' + (s.mode === "practice" ? practiceQ(q) : examList()) + "</section></div>";
  return h;
}

function practiceQ(q){
  const s = S.sess, v = s.ans[q.id], done = !!v;
  let h = '<div class="qcard"><div class="qh"><span class="mono">Savol ' + (s.idx+1) + " / " + s.ids.length + '</span><span class="mono">' + q.P.exam + " · daraja " + dots(q.lv) + "</span></div>";
  h += '<p class="instr">Bayonot matndagi maʼlumotga mosmi?</p><p class="stmt">' + esc(q.s) + "</p>";
  h += '<div class="bubbles">' + bubbles(v, done, q.a, "ans") + "</div>";
  if (!done) h += '<div class="hintrow"><button class="btn ghost" data-act="hint"' + (s.hint[q.id] ? " disabled" : "") + ">Maslahat</button>" + (s.hint[q.id] ? '<p class="hint">Kalit soʻz: <b>' + esc(q.kw) + "</b> — " + LETTERS[q.p] + " xatboshini diqqat bilan oʻqing. Jumlani oxirigacha oʻqishni unutmang.</p>" : '<span class="kbdnote">Klaviatura: 1 / 2 / 3 — javob, → — keyingi</span>') + "</div>";
  if (done) h += fbHTML(q, v, "p" + q.id);
  h += '<div class="nav"><button class="btn" data-act="prev"' + (s.idx === 0 ? " disabled" : "") + '>← Oldingi</button>' +
       (s.idx < s.ids.length - 1 ? '<button class="btn primary" data-act="next">Keyingi →</button>' : '<button class="btn primary" data-act="finish">Yakunlash</button>') + "</div>";
  return h + "</div>";
}

function examList(){
  const s = S.sess;
  let h = '<div class="qcard"><p class="instr">Do the following statements agree with the information given in the passage? Har savolga TRUE, FALSE yoki NOT GIVEN belgilang.</p>';
  h += s.ids.map((id, i) => {
    const q = Q[id], v = s.ans[id];
    let row = '<div class="erow' + (s.submitted ? (v === q.a ? " ok" : " bad") : "") + '"><div class="eq"><span class="en num">' + (i+1) + '</span><p>' + esc(q.s) + "</p></div>";
    row += '<div class="bubbles sm">' + bubbles(v, s.submitted, q.a, "eans", ' data-id="' + id + '"') + "</div>";
    if (s.submitted) {
      row += '<button class="btn ghost" data-act="eopen" data-id="' + id + '" aria-expanded="' + !!s.open[id] + '">' + (s.open[id] ? "Tahlilni yopish" : "Tahlil va isbot") + "</button>";
      if (s.open[id]) row += fbHTML(q, v || "none", "e" + id);
    }
    return row + "</div>";
  }).join("");
  if (!s.submitted) {
    const n = s.ids.filter(id => s.ans[id]).length;
    h += '<div class="nav"><span class="mono">' + n + " / " + s.ids.length + ' belgilangan</span><button class="btn primary" data-act="submit">Topshirish</button></div>';
  } else {
    h += '<div class="nav"><button class="btn" data-act="start" data-p="' + s.pid + '" data-m="practice">Shu matnni mashq rejimida</button><button class="btn primary" data-act="home">Boshqa matn</button></div>';
  }
  return h + "</div>";
}

function submitExam(auto){
  const s = S.sess; stopTimer(); s.submitted = true; s.auto = !!auto;
  s.ids.forEach(id => { if (s.ans[id]) record(Q[id], s.ans[id]); });
  render(); window.scrollTo(0,0);
}

function finishHTML(){
  const s = S.sess, n = s.ids.length, ok = s.ids.filter(id => s.ans[id] === Q[id].a).length, done = s.ids.filter(id => s.ans[id]).length;
  const bytrap = {};
  s.ids.forEach(id => { const q = Q[id]; if (s.ans[id] && s.ans[id] !== q.a) bytrap[q.trap] = (bytrap[q.trap] || 0) + 1; });
  const tops = Object.entries(bytrap).sort((a,b) => b[1]-a[1]).slice(0,3);
  let h = '<section class="finish"><span class="mono">Seans yakunlandi</span><h1 class="num">' + ok + " / " + done + "</h1><p>" + esc(s.title) + " · " + n + " ta savoldan " + done + " tasi yechildi, aniqlik " + pct(ok, done) + "%.</p>";
  if (tops.length) h += "<h3>Koʻp adashgan tuzoqlaringiz</h3><ul class='tlist'>" + tops.map(([k,c]) => "<li><b>" + esc(TRAPS[k].uz) + "</b> — " + c + " ta xato. " + esc(TRAPS[k].short) + ' <button class="link" data-act="trapdrill" data-t="' + k + '">Mashq qilish</button></li>').join("") + "</ul>";
  else if (done) h += "<p>Bu seansda xato boʻlmadi.</p>";
  h += '<div class="nav"><button class="btn" data-act="home">Matnlarga qaytish</button>' + (s.ids.some(id => s.ans[id] && s.ans[id] !== Q[id].a) ? '<button class="btn primary" data-act="redowrong">Xatolarni qayta yechish</button>' : "") + "</div></section>";
  return h;
}

/* ---------- Qoidalar ---------- */
function rulesHTML(){
  let h = '<section class="intro"><h1>Qoidalar</h1><p class="lede">Javob faqat matnga tayanadi — umumiy bilim, hayotiy tajriba va hisob-kitobli taxmin hisobga olinmaydi.</p></section>';
  h += '<section class="rsec"><h2>Uch javob</h2><div class="tbl"><table><thead><tr><th>Javob</th><th>Matnda nima bor</th><th>Oʻziga beriladigan savol</th></tr></thead><tbody>' +
    "<tr><td><b>TRUE</b></td><td>Bayonotdagi barcha maʼlumot matnda bor (koʻpincha boshqa soʻzlar bilan)</td><td>Matn aynan shuni aytyaptimi?</td></tr>" +
    "<tr><td><b>FALSE</b></td><td>Matnda bayonotga zid maʼlumot bor</td><td>Matn buning teskarisini aytyaptimi?</td></tr>" +
    "<tr><td><b>NOT GIVEN</b></td><td>Matnda tasdiq ham, inkor ham yoʻq</td><td>Buni matn asosida isbotlab ham, rad etib ham boʻlmaydimi?</td></tr></tbody></table></div>" +
    '<p class="small">YES / NO / NOT GIVEN — xuddi shu mantiq, lekin muallifning fikri (views, claims) haqida. Savollar matndagi maʼlumot tartibida keladi.</p></section>';
  h += '<section class="rsec"><h2>Qaror daraxti</h2><div class="dtree"><div class="node">Bayonotni qismlarga boʻling: kim / nima + amal + miqdor, vaqt, sabab, shart</div><div class="arrow">↓</div>' +
    '<div class="node dq">1. Matnda bayonotga zid jumla bormi?</div><div class="branch"><div class="leaf f"><span class="mono">Ha</span><b>FALSE</b><span>Barmoq bilan koʻrsata oladigan ziddiyat</span></div><div class="leaf go"><span class="mono">Yoʻq</span>↓</div></div>' +
    '<div class="node dq">2. Bayonotning barcha qismlari matnda isbotlanganmi?</div><div class="branch"><div class="leaf t"><span class="mono">Ha</span><b>TRUE</b><span>Paraphrase bilan boʻlsa ham</span></div><div class="leaf ng"><span class="mono">Yoʻq</span><b>NOT GIVEN</b><span>Kamida bitta qism isbotsiz</span></div></div></div></section>';
  h += '<section class="rsec"><h2>Ishlash algoritmi</h2><ol class="algo">' + [
    "Barcha bayonotlarni oʻqing va langar soʻzlarni belgilang: ismlar, raqamlar, sanalar, atamalar.",
    "Har bayonotdagi xavfli soʻzlarni aylana ichiga oling: all, only, always, the most, proven, caused, still.",
    "Matndan langar soʻzni yoki uning sinonimini toping; savollar matn tartibida kelishini unutmang.",
    "Topilgan jumlani, undan oldingi va keyingi jumlani oʻqing — chegaralovchi shart (however, only, except) koʻpincha keyingi jumlada boʻladi.",
    "Bayonotni qismlarga boʻling va har qismni matn bilan alohida solishtiring.",
    "Qaror qabul qiling: bitta qism zid → FALSE; zid qism yoʻq, lekin bitta qism isbotsiz → NOT GIVEN; hammasi mos → TRUE.",
    "Bitta savolga 1,5 daqiqadan ortiq sarflamang. Topilmasa, vaqtincha NOT GIVEN deb belgilang va keyingisiga oʻting."
  ].map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></section>";
  h += '<section class="rsec"><h2>Tuzoqlar</h2><p class="small">Har bir tuzoq qoidasi, signal soʻzlari, namunasi va tekshirish savoli. Natijalaringiz shu yerda ham koʻrinadi.</p><div class="traps">' +
    TRAP_ORDER.map(k => {
      const t = TRAPS[k], st = trapStat(k);
      return '<details class="trap"><summary><span class="tn"><b>' + esc(t.uz) + '</b><span class="mono">' + esc(t.name) + '</span></span><span class="ts num">' + (st.n ? pct(st.ok, st.n) + "% · " + st.n + " urinish" : trapCount(k) + " savol") + '</span></summary><div class="tb"><p class="short">' + esc(t.short) + "</p>" + ruleHTML(k) +
        '<button class="btn primary" data-act="trapdrill" data-t="' + k + '">Shu tuzoq boʻyicha mashq (' + trapCount(k) + " savol)</button></div></details>";
    }).join("") + "</div></section>";
  return h;
}
function trapStat(k){
  let n = 0, ok = 0;
  ALL.forEach(q => { if (q.trap === k && store.ans[q.id]) { n++; if (store.ans[q.id].ok) ok++; } });
  return { n, ok };
}

/* ---------- Natijalar ---------- */
function statsHTML(){
  const ids = Object.keys(store.ans).filter(k => Q[k]);
  const ok = ids.filter(k => store.ans[k].ok).length;
  let h = '<section class="intro"><h1>Natijalar</h1><p class="lede">Har savol boʻyicha oxirgi javobingiz hisobga olinadi. Maʼlumot faqat shu brauzerda saqlanadi.</p></section>';
  if (!ids.length) return h + '<section class="rsec"><p>Hali birorta savol yechilmagan. Matnlar boʻlimidan mashqni boshlang — natijalar shu yerda paydo boʻladi.</p><button class="btn primary" data-act="home">Matnlarga oʻtish</button></section>';
  h += '<section class="kpis"><div><span class="mono">Yechilgan</span><b class="num">' + ids.length + " / " + ALL.length + '</b></div><div><span class="mono">Aniqlik</span><b class="num">' + pct(ok, ids.length) + '%</b></div><div><span class="mono">Hozir xato</span><b class="num">' + (ids.length - ok) + "</b></div></section>";
  // javob turi boʻyicha
  const conf = {};
  ids.forEach(k => { const r = store.ans[k], a = Q[k].a; if (!r.ok) { const key = a + ">" + r.last; conf[key] = (conf[key] || 0) + 1; } });
  h += '<section class="rsec"><h2>Javob turi boʻyicha</h2><div class="hbars">' + ["T","F","NG"].map(a => {
    const xs = ids.filter(k => Q[k].a === a), o = xs.filter(k => store.ans[k].ok).length;
    return '<div class="hb"><span class="hl">' + LBL[a] + ' savollar</span><span class="track"><i style="width:' + pct(o, xs.length) + '%"></i></span><span class="hv num">' + (xs.length ? pct(o, xs.length) + "% · " + o + "/" + xs.length : "—") + "</span></div>";
  }).join("") + "</div>";
  const top = Object.entries(conf).sort((a,b) => b[1]-a[1])[0];
  if (top) { const [ca, ua] = top[0].split(">"); h += '<div class="insight"><span class="eyebrow">Eng koʻp takrorlanayotgan xato</span><p><b>' + LBL[ca] + " javobli savolga " + LBL[ua] + "</b> deyapsiz — " + top[1] + " marta. " + esc(MISS[top[0]]) + "</p></div>"; }
  h += "</section>";
  h += '<section class="rsec"><h2>Tuzoqlar boʻyicha</h2><div class="hbars">' + TRAP_ORDER.map(k => ({ k, st:trapStat(k) })).filter(x => x.st.n).sort((a,b) => pct(a.st.ok,a.st.n) - pct(b.st.ok,b.st.n)).map(x =>
    '<div class="hb"><span class="hl">' + esc(TRAPS[x.k].uz) + '</span><span class="track' + (pct(x.st.ok,x.st.n) < 60 ? " weak" : "") + '"><i style="width:' + pct(x.st.ok, x.st.n) + '%"></i></span><span class="hv num">' + pct(x.st.ok, x.st.n) + "% · " + x.st.ok + "/" + x.st.n + '</span><button class="link" data-act="trapdrill" data-t="' + x.k + '">Mashq</button></div>').join("") + "</div></section>";
  const wrong = ids.filter(k => !store.ans[k].ok);
  h += '<section class="rsec"><h2>Xatolar daftari</h2>';
  if (wrong.length) {
    h += '<button class="btn primary" data-act="quick" data-k="mist">Hammasini qayta yechish (' + wrong.length + ")</button><ul class=\"wlist\">" + wrong.map(k => { const q = Q[k], r = store.ans[k];
      return "<li><span class='mono'>" + q.P.exam + " · " + esc(q.P.title) + " · " + q.n + "-savol</span><p>" + esc(q.s) + "</p><span class='small'>Siz: " + LBL[r.last] + " · Toʻgʻri: <b>" + LBL[q.a] + "</b> · Tuzoq: " + esc(TRAPS[q.trap].uz) + "</span></li>"; }).join("") + "</ul>";
  } else h += "<p>Hozir xato javob yoʻq.</p>";
  h += "</section>";
  h += '<section class="rsec reset">' + (S.confirmReset ? '<p>Barcha natijalar oʻchiriladi. Davom etasizmi?</p><button class="btn danger" data-act="reset2">Ha, oʻchirish</button> <button class="btn" data-act="reset0">Bekor qilish</button>' : '<button class="btn ghost" data-act="reset1">Natijalarni tozalash</button>') + "</section>";
  return h;
}

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.v === S.view || (S.view === "sess" && b.dataset.v === "lib") || (S.view === "fin" && b.dataset.v === "lib") ? "page" : "false"));
  document.body.classList.toggle("in-sess", S.view === "sess");
  if (S.view === "lib") view.innerHTML = libHTML();
  else if (S.view === "rules") view.innerHTML = rulesHTML();
  else if (S.view === "stats") view.innerHTML = statsHTML();
  else if (S.view === "fin") view.innerHTML = finishHTML();
  else if (S.view === "sess") {
    view.innerHTML = sessHTML();
    const m = document.getElementById("evmark"), pane = document.getElementById("passage");
    if (m && pane) { const top = m.offsetTop - pane.clientHeight / 3; pane.scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
    const f = document.querySelector(".para.focus"); if (f && pane) pane.scrollTo({ top: Math.max(0, f.offsetTop - 12) });
  }
}

/* ---------- Hodisalar ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, s = S.sess;
  switch (a) {
    case "tab": stopTimer(); S.view = b.dataset.v; S.confirmReset = false; render(); window.scrollTo(0,0); break;
    case "home": stopTimer(); S.view = "lib"; render(); window.scrollTo(0,0); break;
    case "fexam": S.exam = b.dataset.v; render(); break;
    case "flevel": S.level = +b.dataset.v; render(); break;
    case "start": { const p = PBY[b.dataset.p]; startSession(p.qs.map(q => q.id), p.title, b.dataset.m, p.id); break; }
    case "quick": {
      const k = b.dataset.k;
      if (k === "mix") startSession(shuffle(ALL).slice(0,20).map(q => q.id), "Aralash 20 savol", "practice");
      if (k === "hard") startSession(shuffle(ALL.filter(q => q.lv === 3)).map(q => q.id), "Eng qiyin savollar", "practice");
      if (k === "mist") { const w = Object.keys(store.ans).filter(id => Q[id] && !store.ans[id].ok); if (w.length) startSession(shuffle(w), "Xatolarim ustida", "practice"); }
      if (k === "ng") startSession(shuffle(ALL.filter(q => q.a !== "T")).slice(0,30).map(q => q.id), "FALSE va NOT GIVEN", "practice");
      break; }
    case "trapdrill": { const k = b.dataset.t; startSession(shuffle(ALL.filter(q => q.trap === k)).map(q => q.id), "Tuzoq: " + TRAPS[k].uz, "practice"); break; }
    case "ans": { const q = Q[s.ids[s.idx]]; if (s.ans[q.id]) break; s.ans[q.id] = b.dataset.v; record(q, b.dataset.v); render(); break; }
    case "hint": s.hint[s.ids[s.idx]] = true; render(); break;
    case "next": if (s.idx < s.ids.length - 1) { s.idx++; render(); scrollQ(); } break;
    case "prev": if (s.idx > 0) { s.idx--; render(); scrollQ(); } break;
    case "goto": s.idx = +b.dataset.i; render(); scrollQ(); break;
    case "finish": S.view = "fin"; render(); window.scrollTo(0,0); break;
    case "redowrong": { const w = s.ids.filter(id => s.ans[id] && s.ans[id] !== Q[id].a); startSession(w, "Xatolarni qayta yechish", "practice"); break; }
    case "eans": if (!s.submitted) { s.ans[b.dataset.id] = b.dataset.v; const keep = window.scrollY; render(); window.scrollTo(0, keep); } break;
    case "submit": submitExam(false); break;
    case "eopen": { const id = b.dataset.id; s.open[id] = !s.open[id]; if (s.open[id]) s.focusQ = id; const keep = window.scrollY; render(); window.scrollTo(0, keep); break; }
    case "rule": { const el = document.getElementById("rf-" + b.dataset.uid); if (el) { el.hidden = !el.hidden; b.textContent = el.hidden ? "Qoidani batafsil oʻqish" : "Qoidani yopish"; } break; }
    case "reset1": S.confirmReset = true; render(); break;
    case "reset0": S.confirmReset = false; render(); break;
    case "reset2": store = { ans:{} }; save(); S.confirmReset = false; render(); break;
  }
});
function scrollQ(){ const el = document.querySelector(".qpane"); if (el && window.innerWidth < 900) el.scrollIntoView({ block:"start" }); }

document.addEventListener("keydown", e => {
  if (S.view !== "sess" || !S.sess || S.sess.mode !== "practice" || e.metaKey || e.ctrlKey || e.altKey) return;
  const s = S.sess, q = Q[s.ids[s.idx]], k = e.key.toLowerCase();
  const map = { "1":"T", "2":"F", "3":"NG", t:"T", f:"F", n:"NG" };
  if (map[k] && !s.ans[q.id]) { s.ans[q.id] = map[k]; record(q, map[k]); render(); }
  else if ((k === "arrowright" || k === "enter") && s.ans[q.id] && s.idx < s.ids.length - 1) { s.idx++; render(); }
  else if (k === "arrowleft" && s.idx > 0) { s.idx--; render(); }
  else if (k === "h" && !s.ans[q.id]) { s.hint[q.id] = true; render(); }
});

render();

</script>

</body>
</html>
