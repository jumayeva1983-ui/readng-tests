<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFNG Reading Trenajori</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: imtihon kitobchasi — chapda matn varagʻi, oʻngda OMR javoblar varagʻi; isbot marker bilan belgilanadi */
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#151D2C; --muted:#586376; --line:#D5DBE4; --soft:#E6EAF0;
  --pencil:#2B4BD3; --pencil-ink:#FFFFFF; --pencil-soft:#E3E8FC;
  --marker:#FFE27A; --marker-ink:#2E2500; --ngmark:#D8E3F4;
  --ok:#17744B; --ok-soft:#DDF2E6; --bad:#B23C27; --bad-soft:#FAE4DE;
  --f-read:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F131B; --sheet:#171C27; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2B3345; --soft:#1F2533;
  --pencil:#8AA2FF; --pencil-ink:#0F131B; --pencil-soft:#222B4A;
  --marker:#6A5717; --marker-ink:#FFF3CC; --ngmark:#22304A;
  --ok:#55C792; --ok-soft:#17301F; --bad:#F08C76; --bad-soft:#3A1F1A; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F131B; --sheet:#171C27; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2B3345; --soft:#1F2533;
  --pencil:#8AA2FF; --pencil-ink:#0F131B; --pencil-soft:#222B4A;
  --marker:#6A5717; --marker-ink:#FFF3CC; --ngmark:#22304A;
  --ok:#55C792; --ok-soft:#17301F; --bad:#F08C76; --bad-soft:#3A1F1A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-ui);margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.mono{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:600 19px/1 var(--f-read);letter-spacing:-.01em}
.brand .key{display:inline-flex;gap:3px}
.brand .key i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.brand .key i:nth-child(2){background:var(--ink)}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tabs button:hover{color:var(--ink)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:none;color:var(--pencil);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* library */
.intro{padding-block:32px 8px;max-width:760px}
.intro h1{font:600 clamp(30px,5vw,46px)/1.05 var(--f-read);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.lede{font-size:16.5px;color:var(--muted);margin:0;max-width:62ch}
.progress-line{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.progress-line b{color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-block:24px}
.qc{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.qc b{font-weight:600}
.qc span{font-size:13.5px;color:var(--muted)}
.qc:hover:not(:disabled){border-color:var(--pencil)}
.qc:disabled{opacity:.55;cursor:default}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sheet);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.prow{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-child{border-top:0}
.pinfo{min-width:0;flex:1 1 320px}
.pinfo h3{font:500 20px/1.25 var(--f-read);margin:6px 0 2px}
.pmeta{font-size:13px;color:var(--muted)}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:4px;background:var(--soft);border-radius:2px;margin:10px 0 4px;max-width:280px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pencil)}
.tag{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid currentColor;display:inline-block}
.t-IELTS{color:var(--pencil)} .t-TOEFL{color:var(--ok)} .t-SAT{color:var(--bad)}
.foot{font-size:12.5px;color:var(--muted);max-width:80ch;margin-top:24px}
.empty{padding:20px;color:var(--muted)}

/* session */
.sbar{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.stitle{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.stitle b{font:500 17px/1.2 var(--f-read)}
.clockwrap{display:flex;align-items:baseline;gap:8px}
.clock,.score{font:500 22px/1 var(--f-mono)}
.clock.low{color:var(--bad)}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.sq{width:30px;height:30px;border:1px solid var(--line);background:var(--sheet);border-radius:4px;font:500 12px/1 var(--f-mono);cursor:pointer;color:var(--muted)}
.sq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sq.cur{box-shadow:0 0 0 2px var(--ink)}
.sgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.passage{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 72px);max-height:calc(100vh - 96px);overflow:auto;min-width:0}
.ph{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:6px}
.ptitle{font:600 24px/1.2 var(--f-read);margin:10px 0 4px;text-wrap:balance}
.para{font:400 17.5px/1.62 var(--f-read);margin:14px 0;position:relative;padding-left:30px;max-width:66ch;border-radius:4px;transition:background .2s}
.para .pl{position:absolute;left:0;top:3px;font:600 12px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.para.focus{background:var(--pencil-soft);box-shadow:-6px 0 0 var(--pencil-soft),6px 0 0 var(--pencil-soft)}
mark.ev{background:var(--marker);color:var(--marker-ink);padding:1px 2px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.ev.ng{background:var(--ngmark);color:var(--ink);text-decoration:underline dashed var(--muted);text-underline-offset:4px}
.qpane{min-width:0}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.qh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.instr{font-size:13.5px;color:var(--muted);margin:0 0 6px}
.stmt{font:500 21px/1.4 var(--f-read);margin:0 0 18px;text-wrap:pretty}
.bubbles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bub{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;position:relative}
.bub .o{width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:600 11px/1 var(--f-mono)}
.bub .w{font-weight:600;font-size:13.5px;letter-spacing:.02em}
.bub kbd{position:absolute;right:8px;top:6px;font:400 10px/1 var(--f-mono);color:var(--muted)}
.bub:hover:not(:disabled){border-color:var(--ink)}
.bub.sel .o{background:var(--ink);color:var(--sheet)}
.bub.right{border-color:var(--ok);background:var(--ok-soft)}
.bub.right .o{border-color:var(--ok);background:var(--ok);color:var(--sheet)}
.bub.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bub.wrong .o{border-color:var(--bad);background:var(--bad);color:var(--sheet)}
.bub:disabled{cursor:default}
.bubbles.sm .bub{padding:6px 8px;gap:6px}
.bubbles.sm .bub .o{width:24px;height:24px;font-size:10px}
.bubbles.sm .bub .w{font-size:12px}
.bubbles.sm kbd{display:none}
.hintrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.hint{margin:0;font-size:14px;flex:1 1 240px}
.kbdnote{font-size:12px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}

/* feedback */
.fb{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px}
.verdict{font-weight:600;padding:9px 12px;border-radius:var(--r)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.fsec h4{margin:0 0 6px;font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fsec p{margin:0;max-width:65ch}
.fsec blockquote{margin:0;font:400 16.5px/1.5 var(--f-read);padding:8px 12px;background:var(--marker);color:var(--marker-ink);border-radius:4px}
.fsec blockquote.ng{background:var(--ngmark);color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);margin-top:6px!important}
.miss p{border-left:3px solid var(--bad);padding-left:10px}
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.tree .st{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:14px;counter-increment:s}
.tree .q::before{content:counter(s) ". ";font-family:var(--f-mono);color:var(--muted)}
.tree .st.yes{border-color:var(--pencil);background:var(--pencil-soft)}
.tree .st.skip{opacity:.45}
.tree .r b{font-family:var(--f-mono);font-weight:600}
.trapcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper)}
.trapcard .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.trapcard p{margin:6px 0 10px}
.eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--pencil)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.rulefull{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.rulefull p,.tb p{margin:0 0 10px;max-width:68ch}
.lab{display:inline-block;font:500 10.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:6px;min-width:62px}
.sig{font-size:14px;margin-bottom:10px}
.exbox{border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px;margin-bottom:10px}
.exbox .en{font-family:var(--f-read);font-size:15.5px}
.chk{font-size:14px}

/* exam list */
.erow{border-top:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:10px}
.erow:first-of-type{border-top:0}
.erow.ok .en{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.erow.bad .en{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.eq{display:flex;gap:10px;align-items:flex-start}
.eq p{margin:0;font:400 17px/1.45 var(--f-read)}
.eq .en{flex:none;width:26px;height:26px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font:500 12px/1 var(--f-mono)}
.erow .btn{align-self:flex-start}

/* finish & stats */
.finish{padding-block:32px;max-width:720px}
.finish h1{font:600 64px/1 var(--f-read);margin:8px 0}
.tlist{padding-left:18px} .tlist li{margin-bottom:8px}
.rsec{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:16px}
.rsec h2{font:600 22px/1.2 var(--f-read);margin:0 0 12px}
.rsec.reset{background:transparent;border-style:dashed}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dtree{display:flex;flex-direction:column;align-items:center;gap:8px}
.node{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;text-align:center;max-width:520px;background:var(--paper);font-size:14.5px}
.node.dq{border-color:var(--ink);font-weight:600;background:var(--sheet)}
.arrow{color:var(--muted)}
.branch{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px}
.leaf{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:13px;color:var(--muted)}
.leaf b{font:600 15px/1.2 var(--f-mono);color:var(--ink)}
.leaf.f{border-color:var(--bad);background:var(--bad-soft)} .leaf.t{border-color:var(--ok);background:var(--ok-soft)} .leaf.ng{border-color:var(--pencil);background:var(--pencil-soft)}
.leaf.go{justify-content:center;font-size:18px}
.algo{padding-left:22px;margin:0;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.traps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r)}
.trap{border-top:1px solid var(--line)} .trap:first-child{border-top:0}
.trap summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:12px 14px;list-style:none;align-items:baseline;flex-wrap:wrap}
.trap summary::-webkit-details-marker{display:none}
.trap summary .tn{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.trap summary .tn::before{content:"+";font-family:var(--f-mono);color:var(--muted);width:12px}
.trap[open] summary .tn::before{content:"−"}
.trap .ts{font-size:12.5px;color:var(--muted)}
.trap .tb{padding:0 14px 16px 36px}
.trap .short{font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.kpis div{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpis b{font:600 30px/1 var(--f-read)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(120px,190px) minmax(60px,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ok)}
.track.weak i{background:var(--bad)}
.hv{font-size:13px;color:var(--muted);white-space:nowrap}
.insight{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper)}
.insight p{margin:6px 0 0}
.wlist{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column}
.wlist li{border-top:1px solid var(--line);padding-block:10px}
.wlist p{margin:4px 0;font-family:var(--f-read);font-size:16px}

@media (max-width: 900px){
  .sgrid{grid-template-columns:minmax(0,1fr)}
  .passage{position:relative;top:0;max-height:52vh;padding:16px 18px}
  .para{font-size:16.5px}
  .stmt{font-size:19px}
}
@media (max-width: 560px){
  .bubbles{grid-template-columns:1fr}
  .bubbles.sm{grid-template-columns:repeat(3,1fr)}
  .bubbles.sm .bub .w{display:none}
  .bubbles.sm .bub{justify-content:center}
  .kpis{grid-template-columns:1fr}
  .hb{grid-template-columns:1fr auto auto}
  .hb .track{grid-column:1 / -1;grid-row:2}
  .branch{grid-template-columns:1fr}
  .tabs button{padding:7px 9px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><span class="key" aria-hidden="true"><i></i><i></i><i></i></span><b>TFNG Trenajori</b></div>
    <nav class="tabs" aria-label="Boʻlimlar">
      <button data-act="tab" data-v="lib">Matnlar</button>
      <button data-act="tab" data-v="rules">Qoidalar</button>
      <button data-act="tab" data-v="stats">Natijalar</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<script>
// Barcha matnlar ushbu trenajor uchun yozilgan original matnlar (IELTS, TOEFL va SAT uslubida).
const PASSAGES = [
{
  id: "p1", exam: "IELTS", level: 2, title: "The Revival of Ancient Grains", topic: "Qishloq xoʻjaligi",
  paras: [
    "Over the past fifteen years, grains such as emmer, einkorn and spelt — collectively described as “ancient grains” because they have changed little through selective breeding — have moved from health-food shops into mainstream supermarkets. Sales in the United Kingdom alone rose almost threefold between 2010 and 2020, although they still represent less than two per cent of the total flour market.",
    "Much of the appeal is nutritional. Einkorn, for instance, contains higher levels of protein and of the antioxidant lutein than modern bread wheat. Many consumers also believe that ancient grains are easier to digest, and some people who report sensitivity to modern wheat say they tolerate spelt better. Clinical trials, however, have so far produced inconsistent results, and spelt contains gluten in quantities comparable to those in ordinary wheat, making it unsuitable for people with coeliac disease.",
    "For farmers, the picture is more complicated. Ancient grains generally yield between a third and a half less than modern varieties, and their tall, slender stalks are prone to falling over in heavy rain. Their husks must also be removed in a separate process before milling, which adds to costs. On the other hand, they typically require less fertiliser and can thrive on poorer soils where modern wheat would struggle.",
    "Some agricultural scientists see these grains as a genetic resource rather than a commercial crop in their own right. By crossing them with modern wheat, breeders hope to introduce traits such as drought tolerance into high-yielding varieties. Whether consumers will continue to pay premium prices for the original grains once such hybrids are available remains an open question."
  ],
  qs: [
    {s:"Ancient grains have been altered relatively little by selective breeding.", a:"T", p:0, kw:"selective breeding", ev:"because they have changed little through selective breeding", trap:"paraphrase", lv:1,
     ex:"Matn: “changed little through selective breeding”. Bayonot: “altered relatively little” — “changed little” ning sinonimi. Mavzu ham, maʼno ham bir xil, faqat soʻzlar almashgan."},
    {s:"UK sales of ancient grains more than tripled between 2010 and 2020.", a:"F", p:0, kw:"2010", ev:"rose almost threefold between 2010 and 2020", trap:"quantifier", lv:3,
     ex:"“almost threefold” — deyarli uch barobar, yaʼni uch barobardan sal KAM. “more than tripled” — uch barobardan KOʻP. Bitta kichik soʻz (almost ↔ more than) miqdorni teskari qilgan → FALSE."},
    {s:"Einkorn contains more protein than any other ancient grain.", a:"NG", p:1, kw:"protein", ev:"Einkorn, for instance, contains higher levels of protein and of the antioxidant lutein than modern bread wheat.", trap:"superlative", lv:2,

{
  id: "p2", exam: "IELTS", level: 2, title: "Ice Cores: Archives of Past Climates", topic: "Iqlimshunoslik",
  paras: [
    "Deep beneath the surface of Antarctica and Greenland lie layers of ice that have accumulated, snowfall by snowfall, over hundreds of thousands of years. By drilling cylinders of this ice — known as ice cores — and analysing them in laboratories, scientists can reconstruct the planet's climate across timescales far longer than any written record. The oldest continuous core so far recovered, drilled at Dome C in East Antarctica, covers roughly 800,000 years.",
    "The value of ice cores lies partly in the air they contain. As snow is compressed into ice, tiny bubbles of atmosphere become trapped, preserving a sample of the air at the time. Measurements from these bubbles show that carbon dioxide concentrations rose and fell in step with temperature through successive ice ages, but at no point in the 800,000-year record did they approach present-day levels.",
    "Temperature itself is estimated indirectly, from the ratio of heavy to light forms of oxygen and hydrogen in the ice. This method is generally reliable, but it becomes less precise in the deepest sections, where the layers are thinned and distorted by the weight of the ice above. Dating these sections therefore relies partly on computer models of ice flow.",
    "Ice cores also record more sudden events. Layers of volcanic ash and sulphate allow researchers to identify major eruptions, sometimes to within a single year, while spikes in dust indicate periods when the climate was drier and windier. Several research teams are now searching for sites where ice older than one million years may survive, though no such core has yet been extracted."
  ],
  qs: [
    {s:"Ice cores can provide information about periods far earlier than human written records.", a:"T", p:0, kw:"written record", ev:"across timescales far longer than any written record", trap:"paraphrase", lv:1,
     ex:"“far longer than any written record” — har qanday yozma manbadan ancha uzoq davr. Bayonot buni “far earlier than written records” deb qayta ifodalagan → TRUE."},
    {s:"The Dome C core was the first ice core to be drilled in East Antarctica.", a:"NG", p:0, kw:"Dome C", ev:"The oldest continuous core so far recovered, drilled at Dome C in East Antarctica, covers roughly 800,000 years.", trap:"sequence", lv:2,
     ex:"Matn Dome C yadrosini “eng qadimgi” (oldest) deydi — bu muzning yoshi haqida. “first ... to be drilled” esa burgʻulash tartibi haqida. Eng qadimgi ≠ birinchi burgʻulangan. Tartib aytilmagan → NOT GIVEN."},
    {s:"Carbon dioxide levels over the past 800,000 years were at times higher than they are today.", a:"F", p:1, kw:"present-day", ev:"at no point in the 800,000-year record did they approach present-day levels", trap:"negation", lv:2,
     ex:"“at no point ... did they approach” — hech qachon hozirgi darajaga hatto yaqinlashmagan. Demak, undan yuqori boʻlishi umuman mumkin emas. Inkor (at no point) bayonotga zid → FALSE."},
    {s:"Carbon dioxide and temperature changed together during past ice ages.", a:"T", p:1, kw:"in step", ev:"carbon dioxide concentrations rose and fell in step with temperature through successive ice ages", trap:"paraphrase", lv:1,
     ex:"“rose and fell in step with” — birga oʻsib, birga kamaygan = “changed together” → TRUE."},
    {s:"Rising carbon dioxide caused the temperature increases at the end of each ice age.", a:"NG", p:1, kw:"in step", ev:"carbon dioxide concentrations rose and fell in step with temperature through successive ice ages", trap:"causal", lv:3,
     ex:"Matn faqat ikkisi BIRGA oʻzgarganini aytadi (in step). Qaysi biri sabab, qaysi biri oqibat — aytilmagan. Bogʻliqlik ≠ sabab. Bayonot matnda yoʻq sabab–oqibat munosabatini qoʻshgan → NOT GIVEN."},
    {s:"The method used to estimate past temperatures is equally accurate throughout the core.", a:"F", p:2, kw:"precise", ev:"it becomes less precise in the deepest sections", trap:"generalization", lv:2,
     ex:"Matn: eng chuqur qismlarda usul aniqligi pasayadi. “equally accurate throughout” — butun yadro boʻylab bir xil aniq. Bu umumlashtirish matndagi istisnoga zid → FALSE."},
    {s:"The age of the deepest ice is determined entirely by computer models.", a:"F", p:2, kw:"computer models", ev:"Dating these sections therefore relies partly on computer models of ice flow.", trap:"absolute", lv:2,
     ex:"partly = qisman; entirely = butunlay. Kuchaytiruvchi soʻz matndagi chegarani buzgan → FALSE."},
    {s:"A high concentration of dust in the ice points to a time of drier weather.", a:"T", p:3, kw:"dust", ev:"spikes in dust indicate periods when the climate was drier and windier", trap:"paraphrase", lv:1,
     ex:"spikes in dust = chang miqdorining keskin ortishi; indicate = points to. Bayonot matndagi ikki belgidan bittasini (drier) olgan — bu yetarli, chunki aytilgani matnda bor → TRUE."},
    {s:"Scientists expect to find ice older than one million years within the next decade.", a:"NG", p:3, kw:"one million", ev:"Several research teams are now searching for sites where ice older than one million years may survive, though no such core has yet been extracted.", trap:"time", lv:2,
     ex:"Matn faqat qidiruv davom etayotganini va hali topilmaganini aytadi. Qachon topilish kutilishi (within the next decade) haqida hech narsa yoʻq → NOT GIVEN."}
  ]
},
{
  id: "p3", exam: "IELTS", level: 3, title: "The Psychology of Choice Overload", topic: "Psixologiya",
  paras: [
    "In a widely cited experiment conducted in a Californian supermarket in 1995, shoppers were offered samples of jam from a display of either six or twenty-four varieties. The larger display attracted more visitors, yet those who saw only six varieties were roughly ten times more likely to make a purchase. The finding was quickly taken up in business books and marketing seminars as evidence that offering too many options discourages people from choosing at all — a phenomenon labelled “choice overload”.",
    "Subsequent research has complicated this picture. A 2010 analysis that combined the results of fifty studies found that, on average, the size of an assortment had virtually no effect on whether people made a choice or how satisfied they were with it. The effect appeared in some studies, disappeared in others, and occasionally reversed, with larger assortments leading to greater satisfaction.",
    "More recent work has therefore shifted from asking whether choice overload exists to asking when it occurs. A later review identified several conditions that make it more likely: when the options are difficult to compare, when the decision-maker has no clear prior preference, and when the person feels under time pressure. Experts in a field, by contrast, appear largely immune, since they can quickly discard unsuitable options.",
    "Not all psychologists accept this conditional view. Some argue that the original effect was inflated by small sample sizes and that, once these are taken into account, little remains to be explained. Others maintain that the phenomenon is real but too context-dependent to offer reliable guidance to retailers."
  ],
  qs: [
    {s:"More shoppers stopped at the display offering twenty-four varieties.", a:"T", p:0, kw:"larger display", ev:"The larger display attracted more visitors", trap:"paraphrase", lv:1,
     ex:"The larger display — 24 xil murabbo qoʻyilgan stend. “attracted more visitors” — koʻproq xaridor yaqinlashgan (= stopped at) → TRUE."},
    {s:"The smaller display resulted in more jam being sold overall.", a:"NG", p:0, kw:"ten times", ev:"those who saw only six varieties were roughly ten times more likely to make a purchase", trap:"assumption", lv:3,
     ex:"Matn sotib olish EHTIMOLI haqida gapiradi, umumiy sotuv hajmi haqida emas. Katta stendga koʻproq odam kelgan, lekin qancha koʻp — nomaʼlum. Umumiy sotuv matnda tilga olinmagan; uni hisob-kitob bilan ham topib boʻlmaydi → NOT GIVEN. Qoida: bayonot matnda tilga olinmagan mavzu haqida boʻlsa — NOT GIVEN tomonga qarang."},
    {s:"The 1995 jam study was the first experiment to investigate choice overload.", a:"NG", p:0, kw:"1995", ev:"In a widely cited experiment conducted in a Californian supermarket in 1995", trap:"sequence", lv:2,
     ex:"Matn tajribani “widely cited” (koʻp iqtibos keltirilgan, mashhur) deydi, “birinchi” demaydi. Mashhur ≠ birinchi. Undan oldin boshqa tajriba boʻlganmi — aytilmagan → NOT GIVEN."},
    {s:"The 2010 analysis found that larger assortments consistently reduced customer satisfaction.", a:"F", p:1, kw:"2010", ev:"the size of an assortment had virtually no effect on whether people made a choice or how satisfied they were with it", trap:"generalization", lv:2,
     ex:"Tahlil natijasi: ortacha deyarli hech qanday taʼsir yoʻq, baʼzan esa teskari natija boʻlgan. “consistently reduced” — doimo kamaytirgan — matnga zid → FALSE."},
    {s:"In a few studies, people were more satisfied when offered more options.", a:"T", p:1, kw:"reversed", ev:"occasionally reversed, with larger assortments leading to greater satisfaction", trap:"paraphrase", lv:2,
     ex:"occasionally = baʼzan (= in a few studies); larger assortments leading to greater satisfaction = tanlov koʻp boʻlganda qoniqish yuqoriroq → TRUE."},
    {s:"Choice overload is less likely to occur when people already know what they want.", a:"T", p:2, kw:"prior preference", ev:"when the decision-maker has no clear prior preference", trap:"negation", lv:3,
     ex:"Matn: oldindan aniq tanlov boʻlmasa (no clear prior preference), choice overload ehtimoli ORTADI. Bayonot buni teskari tomondan aytadi: odam nima istashini bilsa, ehtimol KAMROQ. Mavzu bir xil — choice overload yuz berish sharti; faqat inkor orqali ifodalangan → TRUE."},
    {s:"Experts are completely unaffected by choice overload.", a:"F", p:2, kw:"Experts", ev:"Experts in a field, by contrast, appear largely immune", trap:"absolute", lv:2,
     ex:"largely immune = asosan taʼsirlanmaydi; completely = butunlay. “largely” istisnoga joy qoldiradi, “completely” uni yoʻqqa chiqaradi. Ustiga “appear” — ehtiyotkor ifoda → FALSE."},
    {s:"All psychologists now agree that choice overload occurs only under certain conditions.", a:"F", p:3, kw:"Not all", ev:"Not all psychologists accept this conditional view.", trap:"quantifier", lv:1,
     ex:"Matn ochiq aytadi: hamma psixologlar emas (Not all). “All ... agree” — zid → FALSE."},
    {s:"Small sample sizes exaggerated the results of the original jam study.", a:"NG", p:3, kw:"sample sizes", ev:"Some argue that the original effect was inflated by small sample sizes", trap:"opinion", lv:3,
     ex:"Bu baʼzi psixologlarning FIKRI (Some argue). Matn bu fikrni na tasdiqlaydi, na rad etadi; yonida qarshi fikr ham keltirilgan. Bayonot fikrni fakt sifatida bergan → NOT GIVEN. (Agar bayonot “Some psychologists think...” deb boshlanganda edi — TRUE boʻlardi.)"},
    {s:"Some psychologists believe the effect exists but is of limited practical use to shops.", a:"T", p:3, kw:"retailers", ev:"Others maintain that the phenomenon is real but too context-dependent to offer reliable guidance to retailers.", trap:"attribution", lv:2,
     ex:"Fikr egasi toʻgʻri: Others (= some psychologists) maintain (= believe). is real = exists; too context-dependent to offer reliable guidance to retailers = doʻkonlar uchun amaliy foydasi cheklangan → TRUE."}
  ]
},
{
  id: "p4", exam: "IELTS", level: 2, title: "Desert Locusts", topic: "Biologiya",
  paras: [
    "For most of their lives, desert locusts are solitary insects, avoiding one another and causing little damage. When rain follows a prolonged drought, however, vegetation grows rapidly and locust numbers increase. As the vegetation later dries out, the insects are forced into ever smaller patches of green, and the frequent physical contact triggers a remarkable transformation: within a few hours their behaviour changes, and over successive generations their colour and body shape alter as well. They become “gregarious”, seeking each other out and eventually forming swarms.",
    "Swarms vary greatly in size, from less than one square kilometre to several hundred, and can contain up to 80 million locusts per square kilometre. Carried by the wind, swarms may travel more than 100 kilometres in a day, and each locust can consume roughly its own body weight in fresh vegetation daily. The upsurge of 2019–2021, which affected more than twenty countries across East Africa and South-West Asia, was the worst in Kenya for seventy years.",
    "Control currently depends mainly on chemical pesticides sprayed from vehicles or aircraft. Because these chemicals can harm other wildlife and contaminate water supplies, biological alternatives have been developed, most notably a fungus that infects locusts but is harmless to other animals. The fungus acts more slowly than chemicals, typically taking a week or more to kill, which limits its usefulness once a swarm is already on the move.",
    "Most specialists agree that the most effective strategy is prevention: detecting and treating locust populations in the early stages, before swarms form. This depends on regular monitoring in remote breeding areas, some of which are difficult to reach because of insecurity."
  ],
  qs: [
    {s:"Solitary locusts actively seek out other locusts.", a:"F", p:0, kw:"solitary", ev:"avoiding one another", trap:"wordmatch", lv:1,
     ex:"Matn: yolgʻiz chigirtkalar bir-biridan qochadi (avoiding one another). “seeking each other out” — bu gregar bosqichdagi xulq. Bayonot ikki bosqichni aralashtirgan → FALSE."},
    {s:"A locust's behaviour changes more quickly than its physical appearance.", a:"T", p:0, kw:"few hours", ev:"within a few hours their behaviour changes, and over successive generations their colour and body shape alter as well", trap:"comparison", lv:3,
     ex:"Xulq: bir necha soatda oʻzgaradi. Rang va tana shakli: bir necha avlod davomida. Ikkala muddat ham bitta jumlada aytilgan, ularni solishtirishning oʻzi yetarli: xulq tezroq → TRUE."},
    {s:"The transformation into the gregarious phase is set off by repeated physical contact between locusts.", a:"T", p:0, kw:"physical contact", ev:"the frequent physical contact triggers a remarkable transformation", trap:"paraphrase", lv:1,
     ex:"frequent = repeated; triggers = sets off → TRUE."},
    {s:"Every locust swarm covers several hundred square kilometres.", a:"F", p:1, kw:"vary greatly", ev:"Swarms vary greatly in size, from less than one square kilometre to several hundred", trap:"generalization", lv:2,
     ex:"Matn: galalar hajmi juda farq qiladi — bir kvadrat kilometrdan kamdan bir necha yuzgacha. “Every swarm covers several hundred” — eng katta holatni hammaga yoyish. Matndagi kichik galalar bunga zid → FALSE."},
    {s:"Locust swarms usually travel at night.", a:"NG", p:1, kw:"100 kilometres", ev:"Carried by the wind, swarms may travel more than 100 kilometres in a day", trap:"specificity", lv:1,
     ex:"Matn masofa va shamol haqida gapiradi, sutkaning qaysi vaqtida uchishini aytmaydi. Diqqat: “in a day” = bir sutkada, kunduzi degani emas → NOT GIVEN."},
    {s:"The 2019–2021 upsurge was the most severe ever recorded in East Africa.", a:"NG", p:1, kw:"2019–2021", ev:"was the worst in Kenya for seventy years", trap:"superlative", lv:3,
     ex:"Matn: Keniyada 70 yil ichidagi eng yomoni. Bayonot: butun Sharqiy Afrikada, tarixdagi eng yomoni. Ikki chegara kengaytirilgan (Keniya → Sharqiy Afrika, 70 yil → ever). Lekin matn bunga zid gap ham aytmaydi → NOT GIVEN."},
    {s:"The fungus used against locusts poses no danger to other animals.", a:"T", p:2, kw:"fungus", ev:"a fungus that infects locusts but is harmless to other animals", trap:"paraphrase", lv:1,
     ex:"harmless to other animals = poses no danger to other animals → TRUE."},
    {s:"The biological method is more expensive than chemical spraying.", a:"NG", p:2, kw:"biological alternatives", ev:"The fungus acts more slowly than chemicals, typically taking a week or more to kill", trap:"specificity", lv:2,
     ex:"Biologik usulning kamchiligi sifatida faqat SEKINLIGI aytilgan. Narx haqida hech narsa yoʻq. Bayonot yangi detal (narx) qoʻshgan → NOT GIVEN."},
    {s:"The fungus is particularly useful against swarms that are already migrating.", a:"F", p:2, kw:"on the move", ev:"which limits its usefulness once a swarm is already on the move", trap:"wordmatch", lv:2,
     ex:"“usefulness” soʻzi ikkalasida ham bor, lekin matnda “limits its usefulness” — foydasini cheklaydi. Soʻz bir xil, maʼno teskari → FALSE."},
    {s:"All specialists believe prevention is the best approach to locust control.", a:"F", p:3, kw:"specialists", ev:"Most specialists agree that the most effective strategy is prevention", trap:"quantifier", lv:2,
     ex:"Most ≠ All. Matn koʻpchilik deydi, demak baʼzi mutaxassislar boshqacha oʻylaydi → FALSE."}
  ]

{
  id: "p5", exam: "IELTS", level: 3, title: "The Origins of Writing", topic: "Tarix",
  paras: [
    "For much of the twentieth century, scholars assumed that writing had been invented only once, in Mesopotamia, and had spread from there to other parts of the world. Most now accept that it emerged independently in at least three, and probably four, places: Mesopotamia, Egypt, China and Mesoamerica.",
    "The earliest Mesopotamian writing, dating from around 3300 BCE, was not used to record speech, literature or history. Clay tablets from the city of Uruk list quantities of grain, livestock and labour, suggesting that writing developed from accounting practices in increasingly complex urban economies. Indeed, some archaeologists trace its roots to small clay tokens, used for thousands of years earlier to represent goods, although this theory is not universally accepted.",
    "Egyptian hieroglyphs appear only slightly later than the first Mesopotamian signs, and the closeness in dates once led researchers to assume that the idea of writing had passed from one region to the other. The discovery in the 1980s of inscribed labels at Abydos, dated to about 3250 BCE, weakened this view, since the Egyptian system differs from the Mesopotamian one in both its signs and its structure.",
    "Chinese writing is first attested in inscriptions on bones and turtle shells from around 1200 BCE, used for divination at the court of the Shang kings. The script is already so developed at this stage that many specialists believe earlier forms must have existed, written perhaps on bamboo or other perishable materials that have not survived."
  ],
  qs: [
    {s:"Scholars today generally agree that writing was invented in more than one place.", a:"T", p:0, kw:"Most now accept", ev:"Most now accept that it emerged independently in at least three, and probably four, places", trap:"paraphrase", lv:1,
     ex:"Most now accept = bugun koʻpchilik qabul qiladi = generally agree. at least three = birdan ortiq joy → TRUE."},
    {s:"It is known for certain that writing arose independently in exactly four regions.", a:"F", p:0, kw:"probably four", ev:"at least three, and probably four", trap:"hedging", lv:3,
     ex:"Matn: kamida uchta, EHTIMOL toʻrtta. “probably” — aniq emas. Matnning oʻzi bu raqam taxminiy ekanini aytgan, shuning uchun “known for certain ... exactly four” daʼvosi unga zid → FALSE."},
    {s:"The earliest Mesopotamian texts were mainly concerned with economic matters.", a:"T", p:1, kw:"Uruk", ev:"Clay tablets from the city of Uruk list quantities of grain, livestock and labour, suggesting that writing developed from accounting practices", trap:"paraphrase", lv:2,
     ex:"Don, chorva va ishchi kuchi miqdori roʻyxati — xoʻjalik hisobi (accounting). Bayonot buni umumiy soʻz bilan “economic matters” deb atagan. Bundan tashqari, matn adabiyot va tarix yozilmaganini ham aytadi → TRUE."},
    {s:"All archaeologists believe that writing grew out of the use of clay tokens.", a:"F", p:1, kw:"tokens", ev:"although this theory is not universally accepted", trap:"quantifier", lv:1,
     ex:"“some archaeologists” va “not universally accepted” — hamma emas. “All” → FALSE."},
    {s:"The clay tokens were made by the same people who later built Uruk.", a:"NG", p:1, kw:"tokens", ev:"some archaeologists trace its roots to small clay tokens, used for thousands of years earlier to represent goods", trap:"specificity", lv:2,
     ex:"Matn tokenlar nima uchun ishlatilganini aytadi, kim yasaganini emas. Bayonot yangi detal qoʻshgan → NOT GIVEN."},
    {s:"Egyptian hieroglyphs appeared considerably earlier than Mesopotamian writing.", a:"F", p:2, kw:"slightly later", ev:"Egyptian hieroglyphs appear only slightly later than the first Mesopotamian signs", trap:"sequence", lv:2,
     ex:"Matn: biroz KEYIN (slightly later). Bayonot: ancha OLDIN. Ham tartib, ham farq miqdori zid → FALSE."},
    {s:"The Abydos labels were discovered by a British expedition.", a:"NG", p:2, kw:"Abydos", ev:"The discovery in the 1980s of inscribed labels at Abydos, dated to about 3250 BCE, weakened this view", trap:"specificity", lv:1,
     ex:"Matn topilma vaqti (1980-yillar) va yoshini aytadi; kim topgani aytilmagan → NOT GIVEN."},
    {s:"The Shang inscriptions are the oldest known examples of Chinese writing.", a:"T", p:3, kw:"first attested", ev:"Chinese writing is first attested in inscriptions on bones and turtle shells from around 1200 BCE", trap:"paraphrase", lv:3,
     ex:"“first attested” — ilk bor qayd etilgan, yaʼni bizgacha yetib kelgan eng qadimgi namunalar = “oldest known”. “known” soʻzi muhim: mutaxassislar bundan oldin ham yozuv boʻlgan deb hisoblaydi, lekin u saqlanmagan. Shuning uchun “oldest EVER” emas, “oldest KNOWN” → TRUE."},
    {s:"Examples of pre-Shang Chinese writing on bamboo have been found.", a:"F", p:3, kw:"bamboo", ev:"written perhaps on bamboo or other perishable materials that have not survived", trap:"wordmatch", lv:2,
     ex:"“bamboo” soʻzi matnda bor, lekin u yerda bunday materiallar SAQLANMAGANI (have not survived) aytilgan. Topilgan boʻlishi mumkin emas → FALSE."},
    {s:"Divination was the most important activity at the Shang court.", a:"NG", p:3, kw:"divination", ev:"used for divination at the court of the Shang kings", trap:"superlative", lv:2,
     ex:"Matn yozuv fol ochish uchun ishlatilganini aytadi. Bu saroydagi eng muhim faoliyatmi — baho yoʻq → NOT GIVEN."}
  ]
},
{
  id: "p6", exam: "TOEFL", level: 2, title: "Coral Bleaching", topic: "Ekologiya",
  paras: [
    "Reef-building corals depend on a partnership with microscopic algae called zooxanthellae, which live inside the coral's tissues. Through photosynthesis, the algae supply the coral with as much as 90 percent of its energy, and in return they receive shelter and nutrients. The algae are also responsible for much of the coral's color.",
    "When water temperatures rise even 1°C above the usual summer maximum for several weeks, this partnership can break down. The stressed algae begin producing harmful chemicals, and the coral expels them, leaving its tissue transparent so that the white limestone skeleton shows through — a process known as bleaching. A bleached coral is not dead. If temperatures return to normal fairly quickly, it may regain algae and recover; if the stress continues, it is likely to starve.",
    "Mass bleaching events were virtually unknown before the 1980s. Since then they have become more frequent, and the intervals between them have shortened, leaving reefs less time to recover. The Great Barrier Reef experienced severe bleaching in 2016 and 2017, the first time it had been affected in consecutive years.",
    "Not all corals are equally vulnerable. Some species, and some populations within a species, tolerate heat better, possibly because they host more heat-resistant types of algae. Researchers are investigating whether such corals could be bred and transplanted to restore damaged reefs, although critics warn that this approach cannot keep pace with the scale of warming."
  ],
  qs: [
    {s:"Corals obtain all of their energy from the algae living in their tissues.", a:"F", p:0, kw:"90 percent", ev:"the algae supply the coral with as much as 90 percent of its energy", trap:"quantifier", lv:1,

    {s:"The relationship between corals and algae benefits both partners.", a:"T", p:0, kw:"in return", ev:"and in return they receive shelter and nutrients", trap:"paraphrase", lv:1,

  paras: [
    "The Hudson River School was a loosely connected group of American landscape painters active from about 1825 to 1875. Although the name refers to the valley north of New York City where its earliest members worked, later artists associated with the movement painted scenes as far away as the Rocky Mountains, the Arctic and South America. The term itself was originally used by a critic in the 1870s, by which time the style had begun to seem old-fashioned.",
    "Thomas Cole, usually regarded as the group's founder, emigrated from England as a young man. His paintings combined carefully observed natural detail with dramatic lighting and, frequently, moral or religious themes. Cole was deeply concerned about the spread of railways and logging into the wilderness, and several of his works contrast untouched landscapes with signs of human intrusion.",
    "The second generation, including Frederic Church and Albert Bierstadt, produced enormous canvases that were exhibited individually, often in darkened rooms with dramatic lighting, to paying audiences. Church's Heart of the Andes, shown in New York in 1859, attracted thousands of visitors. Some historians argue that these paintings helped persuade the public and politicians to protect wild areas, contributing to the creation of the first national parks; others regard this link as speculative.",
    "By the 1880s, critics and collectors increasingly favored the looser brushwork of French-influenced painters, and Hudson River School works fell out of fashion. Interest revived only in the mid-twentieth century, and today their paintings are among the most sought-after American works of the nineteenth century."
  ],

{
  id: "p8", exam: "TOEFL", level: 2, title: "Sleep in Migrating Birds", topic: "Biologiya",
  paras: [
    "Many songbirds migrate thousands of kilometers twice a year, often flying at night and feeding during the day. This schedule leaves little opportunity for sleep, yet birds in migration show few of the signs of sleep deprivation that would be expected in mammals. How they cope has long puzzled biologists.",
    "Laboratory studies of Swainson's thrushes, a North American species, offered one answer. During the migratory season, captive thrushes reduced their total sleep by roughly two-thirds, and they increasingly relied on very brief naps, some lasting only a few seconds, taken with one or both eyes closed. Their performance on learning tasks remained almost unchanged, whereas thrushes deprived of the same amount of sleep outside the migratory season performed considerably worse.",
    "Some birds may also sleep while flying. Recordings of brain activity in frigatebirds, large seabirds that can stay aloft for weeks, showed that they sometimes sleep with one half of the brain at a time, keeping one eye open in the direction of travel. However, they slept on average for less than 45 minutes a day in flight, compared with over 12 hours on land.",
    "These findings suggest that migratory birds possess a seasonal ability to resist the effects of sleep loss. Whether the same mechanism operates in all migratory species is not yet known, and the frigatebird data come from a species that, unlike most songbirds, glides for long periods rather than flapping continuously."
  ],
  qs: [

    "The most widely accepted explanation for the Moon's origin is the giant-impact hypothesis. According to this model, roughly 4.5 billion years ago, shortly after the Earth formed, a body about the size of Mars — sometimes called Theia — struck the young planet at an angle. Debris from both bodies was thrown into orbit around the Earth and gradually gathered to form the Moon.",
    "The hypothesis accounts for several features that earlier theories could not. The Moon has a relatively small iron core, consistent with its formation mainly from the outer, rocky layers of the two colliding bodies. It also explains why the Earth–Moon system has an unusually large amount of rotational energy.",
    "One observation, however, has proved difficult to reconcile with the standard model. Simulations predict that most of the Moon's material should have come from Theia, yet rock samples returned by the Apollo missions show that the chemical composition of lunar rocks is almost identical to that of the Earth's mantle. Since bodies that formed in different parts of the solar system typically differ in composition, this similarity is surprising.",
    "Several modified versions of the hypothesis have been proposed to resolve the problem. One suggests that the impact was so energetic that the two bodies were almost completely vaporized and mixed together before the Moon condensed. Another proposes that Theia formed close to the Earth and therefore had a similar composition from the start. Neither has yet been confirmed, and some researchers have revived the idea that the Moon formed from a series of smaller impacts rather than a single giant one."
  ],

    "The letter arrived on a Tuesday, which Margaret would later think was fitting, since nothing of consequence had ever happened to her on a Tuesday. She recognized her brother's handwriting at once — the cramped, leftward-leaning letters he had refused to correct despite years of reprimands from their schoolmaster — and for a long moment she simply held the envelope, turning it over as if its weight might tell her something its contents could not.",

{
  id: "p11", exam: "SAT", level: 2, title: "An Address on Education (19th-century style)", topic: "Tarixiy nutq",
  paras: [
    "It is often said that the education of the working man is a luxury which the nation cannot afford. I would answer that it is a necessity which the nation cannot afford to neglect. The machines that now fill our factories were not invented by idle gentlemen; a great many of them were devised by men who began life at the bench, and who learned their science, such as it was, by candlelight after a day's labour.",
    "I do not pretend that every apprentice who attends our evening classes will become an inventor. Most will not. But the man who understands the principles of the engine he tends is less likely to injure himself or to damage it, and more likely to notice when it may be improved. His employer gains by his knowledge, whether or not he acknowledges the debt.",
    "There are those who fear that education will make the labouring classes discontented with their station. I confess I cannot share this fear. A man who knows his own worth may indeed ask for better wages, but he is also more likely to seek them by honest means. Ignorance, not knowledge, is the soil in which disorder grows.",
    "I ask, therefore, not for charity but for investment. Let the manufacturers of this town contribute to our library and our lecture hall as they would to any enterprise from which they expect a return. The return may be slow, but it will be certain."

{
  id: "p12", exam: "SAT", level: 3, title: "Language and Color Perception", topic: "Tilshunoslik",
  paras: [
    "Does the language a person speaks influence how they perceive the world? The idea, associated with the linguists Edward Sapir and Benjamin Lee Whorf, fell out of favor in the 1960s and 1970s, partly because of studies on color. Researchers found that speakers of languages with very few basic color terms could nonetheless distinguish and remember colors much as English speakers did, suggesting that perception was largely universal.",
    "Interest revived in the 2000s. Russian, unlike English, has two basic terms for blue: goluboy for lighter shades and siniy for darker ones. In one experiment, Russian speakers were faster at telling two blues apart when the shades fell on opposite sides of this linguistic boundary than when they belonged to the same category; English speakers showed no such difference.",
    "Crucially, the Russian speakers' advantage disappeared when they were asked to perform a verbal task, such as silently rehearsing a string of numbers, at the same time. This suggests that language influences perception in real time, by providing labels that the mind draws on during the task, rather than permanently reshaping how colors are seen.",
    "The effect is modest — a difference of a fraction of a second — and its practical significance is debated. Nonetheless, it has encouraged researchers to look for similar effects in other domains, such as how speakers of different languages describe and remember spatial relations or the passage of time."
  ],
  qs: [
    {s:"The Sapir–Whorf idea lost popularity partly because of research into color.", a:"T", p:0, kw:"fell out of favor", ev:"fell out of favor in the 1960s and 1970s, partly because of studies on color", trap:"paraphrase", lv:1,
     ex:"fell out of favor = lost popularity; studies on color = research into color. “partly” ikkalasida ham bor → TRUE."},
    {s:"Early studies found that people whose languages had few color words could not tell many colors apart.", a:"F", p:0, kw:"nonetheless", ev:"could nonetheless distinguish and remember colors much as English speakers did", trap:"direct", lv:1,

    {s:"Russian has more basic color terms than any other language.", a:"NG", p:1, kw:"two basic terms", ev:"Russian, unlike English, has two basic terms for blue", trap:"superlative", lv:1,

    {s:"Russian uses separate basic words for lighter and darker shades of blue.", a:"T", p:1, kw:"goluboy", ev:"goluboy for lighter shades and siniy for darker ones", trap:"paraphrase", lv:1,

     ex:"debated — munozarali. Kelishuv yoʻq, demak “agree” daʼvosi zid → FALSE (“Everyone agrees” turi)."},
    {s:"Similar effects have been found in how people remember time.", a:"NG", p:3, kw:"look for", ev:"it has encouraged researchers to look for similar effects in other domains", trap:"hedging", lv:3,

{
  id: "p13", exam: "SAT", level: 2, title: "How Monarch Butterflies Navigate", topic: "Tabiiy fanlar",
  paras: [
    "Each autumn, monarch butterflies from eastern North America fly up to several thousand kilometres to a small number of forested mountain sites in central Mexico, where they spend the winter in dense clusters. None of the butterflies that make this journey has done it before: the generation that migrates south lives for several months, whereas the summer generations that precede it survive only a few weeks.",
    "How monarchs find their way without experience has been studied for decades. Experiments in flight simulators have shown that they use the position of the sun, correcting for its movement across the sky with an internal clock. Surprisingly, an important part of this clock is located not in the brain but in the antennae: butterflies whose antennae had been painted to block light lost the ability to keep a consistent southward heading.",
    "The sun compass cannot work on overcast days, and researchers have found evidence that monarchs also possess a magnetic sense that may serve as a backup. This sense appears to depend on ultraviolet light, which can penetrate cloud cover.",
    "The eastern monarch population has declined substantially since the 1990s. Loss of milkweed — the only plant on which monarch caterpillars feed — is widely cited as a major cause, although the relative importance of other factors, such as habitat loss in Mexico and extreme weather, continues to be debated."
  ],
  qs: [

    {s:"Painting the antennae interfered with the butterflies' sense of direction.", a:"T", p:1, kw:"painted", ev:"butterflies whose antennae had been painted to block light lost the ability to keep a consistent southward heading", trap:"paraphrase", lv:2,
     ex:"lost the ability to keep a consistent southward heading = janub yoʻnalishini saqlay olmay qolgan = sense of direction buzilgan (interfered) → TRUE."},
    {s:"Ultraviolet light is able to pass through clouds.", a:"T", p:2, kw:"ultraviolet", ev:"ultraviolet light, which can penetrate cloud cover", trap:"paraphrase", lv:1,

     ex:"Matn magnit sezgini bulutli kunlarda zaxira boʻlishi mumkinligini aytadi. Tunda ishlatilishi haqida hech narsa yoʻq → NOT GIVEN."},

    {s:"The western monarch population has also declined since the 1990s.", a:"NG", p:3, kw:"eastern", ev:"The eastern monarch population has declined substantially since the 1990s.", trap:"specificity", lv:2,

  assumption: { name:"Assumption", uz:"Taxmin va fon bilim", short:"Mantiqiy koʻrinsa ham, matnda yoʻq boʻlsa — NOT GIVEN.",
    body:["Bayonot hayotiy tajriba, umumiy bilim yoki voqeani davom ettirishga tayanadi. U ehtimolga yaqin boʻlishi mumkin, lekin javob faqat matnga tayanadi.",
          "Badiiy matnlarda eng koʻp uchraydi: qahramon xatni koʻrinadigan joyga qoʻydi — demak, akasinikiga borish qaroriga keldimi? Matn buni aytmaydi.",
          "Asosiy test: “Matn toʻgʻri boʻlib, bayonot notoʻgʻri boʻlishi mumkinmi?” Mumkin boʻlsa — NOT GIVEN (matnga zid boʻlsa — FALSE). Hisob-kitob bilan topiladigan, lekin mavzusi matnda tilga olinmagan xulosa ham shu guruhga kiradi."],

          "Matn “hali emas” desa (are investigating whether, will soon be able, not yet), “allaqachon” degan bayonot → FALSE.",
          "Kelajak haqidagi bayonot (is expected to, within the next decade) matnda muddat boʻlmasa → NOT GIVEN. Uzluksizlik (consistently, have remained) matndagi uzilishga (fell out of fashion … revived) zid boʻlsa → FALSE."],
    signals:"still, no longer, already, yet, soon, now, once, consistently, since",
    ex:{t:"Researchers are investigating whether such corals could be bred and transplanted.", s:"Breeding corals is already being used on a large scale.", a:"F", w:"Hozircha faqat oʻrganilmoqda."},
    check:"Bayonot va matn bir xil vaqt haqida gapiryaptimi?" },
  sequence: { name:"Sequence", uz:"Ketma-ketlik va tartib", short:"first / before / after / oldest — tartib aniq aytilmagan boʻlsa NOT GIVEN.",
    body:["“Eng qadimgi” ≠ “birinchi burgʻulangan”; “mashhur” ≠ “birinchi”. Matndagi soʻz boshqa tartib haqida boʻlishi mumkin.",
          "Matnda ikkala voqea va ularning tartibi bor boʻlsa — solishtiring (slightly later ↔ considerably earlier → FALSE).",

    signals:"first, earlier, later, before, after, prior to, by which time, not until, subsequently",

    body:["Inkor kichik koʻrinadi, lekin butun maʼnoni teskari qiladi: “unlike most songbirds” — sayroqi qushlar bunday emas; “rather than permanently reshaping” — doimiy oʻzgarish emas.",
          "Ikki inkor tasdiqqa teng: not uncommon = fairly common; “no clear preference → more likely” degani “clear preference → less likely” degani.",
          "“at no point … did they approach” — hech qachon hatto yaqinlashmagan: undan oshishi ham mumkin emas."],
    signals:"not, no, never, none, at no point, unlike, rather than, without, un-, in-, -less",
    ex:{t:"Unlike earlier models, the new engine does not rely on fossil fuels.", s:"Earlier engine models did not rely on fossil fuels.", a:"F", w:"Soʻzlar bir xil, “unlike” maʼnoni teskari qiladi."},
    check:"Matndagi har bir inkor nimaga tegishli?" },

    body:["Savol tuzuvchi ataylab matndagi soʻzni bayonotga qoʻyadi. Siz uni koʻrib TRUE deysiz — lekin soʻz boshqa narsaga tegishli yoki maʼno teskari boʻlib chiqadi.",
          "Misollar: “more heat-resistant TYPES” ↔ “a larger NUMBER of algae”; “first time … in consecutive years” ↔ “never before”; “revived the idea” ↔ “for the first time”; “limits its usefulness” ↔ “particularly useful”.",
          "TRUE yozishdan oldin oʻzingizdan soʻring: matn buni xuddi shu kuch bilan va xuddi shu narsa haqida aytyaptimi?"],
