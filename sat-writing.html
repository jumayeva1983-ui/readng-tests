["f077","f","f-poss",2,"____ no single explanation for why the ancient city was abandoned.",["Theirs is","They’re","Their is","There is"],3,"“There is” states that something exists. “Their” is possessive and “they’re” means “they are”.",["pform|“Theirs” means “the one belonging to them”; nothing has been mentioned that could belong to anyone.","pform|“They’re” means “they are”, which does not fit before “no single explanation”.","pform|“Their” is a possessive and cannot be the subject of “is”.",null]],
["f091","f","f-mod",2,"Weighing barely twelve grams, ____ each autumn.",["the tiny blackpoll warbler flies nonstop over the Atlantic for up to three days","the Atlantic is crossed nonstop in up to three days by the blackpoll warbler","a nonstop flight over the Atlantic of up to three days is made by the blackpoll warbler","the blackpoll warbler’s nonstop flight over the Atlantic lasts up to three days"],0,"The thing that weighs twelve grams is the bird, so “the blackpoll warbler” must follow the comma as the subject.",[null,"dangle|The subject is “the Atlantic”.","dangle|The subject is “a nonstop flight”, which does not weigh twelve grams.","dangle|The subject is “flight”; the possessive “warbler’s” is not the bird itself."]],
["f007","f","f-sva",2,"Mapping the ocean floor with ship-mounted sonar ____ years of slow work: a single vessel can survey only a narrow strip on each pass.",["takes","taking","take","have taken"],0,"The subject is the -ing phrase “Mapping the ocean floor…”. A phrase of this kind counts as one activity and is singular.",[null,"nonfin","agr|The subject is the activity “mapping”, which is singular.","agr|The subject “mapping” is singular and cannot take “have”."]],
["f029","f","f-tense",2,"Every spring, the river floods the plain, deposits a layer of silt, and then ____ to its channel, leaving the soil richer than before.",["had returned","returning","returns","returned"],2,"The three verbs form a series describing what happens every spring: “floods”, “deposits”, “returns”. All must be in the present.",["tense|The past perfect breaks the series of present-tense verbs.","nonfin|The third item in the series must be a finite verb like “floods” and “deposits”.",null,"tense|The other verbs in the series are in the present."]],
["f047","f","f-finite",2,"Although the dialect ____ a common ancestor with standard Italian, speakers of the two can no longer understand one another.",["share","shares","sharing","to share"],1,"A clause that begins with “although” needs its own subject and finite verb. The subject “dialect” is singular, so the verb is “shares”.",["agr|“The dialect” is singular.",null,"nonfin","nonfin"]],
["f065","f","f-pron",2,"Although both poets wrote about the sea, ____ approaches to the subject could hardly be more different.",["its","they’re","there","their"],3,"The pronoun refers to “both poets”, which is plural, and it shows possession of “approaches”.",["pnum|“Both poets” is plural.","pform|“They’re” means “they are”.","pform|“There” refers to place, not possession.",null]],
["f079","f","f-poss",2,"The ____ most valuable holdings are its medieval maps.",["libraries’","libraries","librarys","library’s"],3,"The later pronoun “its” shows that one library is meant. One owner takes ’s: “library’s”.",["apos|“Libraries’” refers to several libraries, but “its” shows there is only one.","apos|“Libraries” is a plural with no possessive mark.","apos|“Librarys” is not a correct form.",null]],
["f094","f","f-mod",2,"Published in 1962, ____.",["Rachel Carson alerted the public to the dangers of pesticides with Silent Spring","Rachel Carson’s Silent Spring alerted the public to the dangers of pesticides","the dangers of pesticides were brought to public attention by Rachel Carson","the public was alerted to the dangers of pesticides by Rachel Carson’s Silent Spring"],1,"What was published in 1962 is the book. In “Rachel Carson’s Silent Spring” the subject is the title Silent Spring, so this choice places the book right after the comma.",["dangle|The subject is “Rachel Carson”, a person, who was not published in 1962.",null,"dangle|The subject is “the dangers of pesticides”.","dangle|The subject is “the public”."]],
["f008","f","f-sva",2,"The number of languages spoken on the island of New Guinea ____ 800, more than in any other region of comparable size.",["have exceeded","exceeding","exceeds","exceed"],2,"The subject is “The number”, which is singular. “Of languages spoken on the island” describes it.",["agr|“The number” is singular and cannot take “have”.","nonfin",null,"agr|The verb agrees with “number”, not with “languages”."]],
["f031","f","f-tense",2,"The orbiter is scheduled to reach Jupiter’s moon Europa in 2030, when it ____ a series of close flybys of the icy surface.",["has begun","began","will begin","had begun"],2,"“Is scheduled to reach … in 2030” places the arrival in the future, so the flybys are also in the future.",["tense|The present perfect describes something already begun.","tense|The flybys have not happened yet.",null,"tense|The past perfect describes something completed before a past event."]],
["f049","f","f-finite",2,"Drawing on interviews with more than two hundred farmers, the report ____ that small changes in planting dates could offset much of the expected loss in yields.",["to conclude","concludes","conclude","concluding"],1,"After the opening phrase, the subject “the report” needs a finite verb. “Report” is singular, so the verb is “concludes”.",["nonfin",null,"agr|“The report” is singular.","nonfin"]],

["f096","f","f-mod",2,"While excavating a Bronze Age settlement in northern Greece, ____.",["the uncovering of a workshop for making purple dye surprised archaeologists","there was a workshop for making purple dye that archaeologists uncovered","a workshop for making purple dye was uncovered by archaeologists","a team of archaeologists uncovered a workshop for making purple dye"],3,"The people who were excavating are the archaeologists, so “a team of archaeologists” must follow the comma.",["dangle|The subject is “the uncovering”.","dangle|The subject is “there”, which names no one who could excavate.","dangle|The subject is “a workshop”, which was not excavating.",null]],

["f033","f","f-tense",2,"The astronomers ____ a routine survey of nearby stars when they noticed that one of them dimmed slightly every three days.",["were conducting","are conducting","have conducted","will conduct"],0,"The survey was in progress when another past action (“noticed”) occurred. The past progressive expresses an ongoing past action.",[null,"tense|“Noticed” places the events in the past.","tense|The present perfect does not fit with the past-tense “noticed”.","tense|The events are in the past."]],
["f052","f","f-finite",2,"The telescope’s enormous mirror allows astronomers ____ light from galaxies that formed more than thirteen billion years ago.",["detect","detected","to detect","detecting"],2,"“Allows” plus an object is followed by a to-infinitive: “allows astronomers to detect”.",["vform|The construction requires “to” before the verb.","vform|A past form cannot follow “allows astronomers”.",null,"vform|“Allows someone” is followed by “to” plus a verb, not by an -ing form."]],
["f069","f","f-pron",2,"The climate of the island’s western coast is much wetter than ____ of its eastern coast.",["that","these","they","those"],0,"The pronoun stands for “the climate”, which is singular: one climate is compared with another.",[null,"pnum|“These” is plural.","pnum|“They” is plural and cannot be followed by “of its eastern coast”.","pnum|“Those” is plural, but it must stand for the singular “climate”."]],

["f098","f","f-mod",2,"Inspired by the way burrs clung to his dog’s fur, ____.",["the hook-and-loop fastener was invented by the Swiss engineer George de Mestral","George de Mestral’s invention of the hook-and-loop fastener followed","the invention of the hook-and-loop fastener is credited to George de Mestral","the Swiss engineer George de Mestral invented the hook-and-loop fastener"],3,"The person who was inspired, and whose dog is mentioned, is George de Mestral. He must be the subject after the comma.",["dangle|The subject is “the hook-and-loop fastener”, which was not inspired and has no dog.","dangle|The subject is “invention”; the possessive “George de Mestral’s” is not the person.","dangle|The subject is “the invention”.",null]],
["f013","f","f-sva",2,"The museum has acquired a notebook containing a sketch that ____ the artist’s earliest idea for the mural.",["recording","record","were recording","records"],3,"“That” refers to “a sketch”, so the verb of the relative clause must be singular: “a sketch that records”.",["nonfin|After “that”, the clause needs a finite verb.","agr|It is the sketch that records the idea, and “sketch” is singular.","agr|“That” stands for the singular “sketch”.",null]],
["f036","f","f-tense",2,"The Library of Alexandria was destroyed in antiquity, but scholars today still ____ how many scrolls it actually held.",["debated","had debated","debate","were debating"],2,"“Today” and “still” place the debate in the present, in contrast to the past destruction.",["tense|“Today still” signals an action that continues now.","tense|The past perfect would place the debate before the destruction.",null,"tense|“Today still” signals the present, not an ongoing past action."]],

["f070","f","f-pron",2,"Many towns along the river built levees to protect ____ from spring floods.",["oneself","it","itself","themselves"],3,"The towns are both doing the protecting and being protected, so a reflexive pronoun is needed, and “towns” is plural.",["pnum|“Oneself” is singular and impersonal.","pnum|“It” is singular and would have to refer to the river, which changes the meaning.","pnum|“Towns” is plural.",null]],

["f100","f","f-mod",2,"Composed of ice and dust left over from the formation of the solar system, ____.",["comets preserve a record of the chemistry of that early period","astronomers study comets as a record of the chemistry of that early period","the chemistry of that early period is recorded in comets","a comet’s tail can stretch for millions of kilometers"],0,"The things composed of ancient ice and dust are comets, so “comets” must follow the comma.",[null,"dangle|The subject is “astronomers”, who are not composed of ice and dust.","dangle|The subject is “the chemistry”.","dangle|The subject is “tail”; the possessive “a comet’s” is not the comet itself."]],
["f015","f","f-sva",2,"Every painting and sketch in the exhibition ____ with a short note written by the artist’s daughter.",["coming","comes","have come","come"],1,"When “every” comes before nouns joined by “and”, the subject is treated as singular: every single item is accompanied by a note.",["nonfin",null,"agr|“Every … and …” is singular and cannot take “have”.","agr|“Every painting and sketch” refers to each item individually and is singular."]],
["f038","f","f-tense",2,"The novelist recalled that as a child she ____ every book in the town’s small library before she turned twelve.",["reads","has read","had read","will have read"],2,"The reading was completed before another past moment (“before she turned twelve”) and is reported from a past viewpoint (“recalled”). That requires the past perfect.",["tense|The action took place in the past.","tense|The present perfect links the action to the present, not to her childhood.",null,"tense|The future perfect looks ahead, but the events are long past."]],

["f064","f","f-pron",3,"The population of snow leopards in the region has stabilized, though ____ remains far smaller than it was a century ago.",["those","they","it","these"],2,"The pronoun refers to “The population”, which is singular; the verb “remains” and the later “it was” confirm this.",["pnum|“Those” is plural; the verb “remains” is singular.","pnum|The antecedent is “population”, not “snow leopards”, and “remains” is singular.",null,"pnum|“These” is plural; the verb “remains” is singular."]],

["f092","f","f-mod",3,"Having studied the songs of humpback whales for two decades, ____.",["the biologist was able to identify individual animals by their voices","individual animals could be identified by the biologist from their voices","the biologist’s ability to identify individual animals by voice was well developed","the voices of individual animals were identifiable to the biologist"],0,"The one who studied the songs is the biologist, so “the biologist” must be the subject after the comma.",[null,"dangle|The subject is “individual animals”, which did not study the songs.","dangle|The subject is “ability”; the possessive “the biologist’s” is not the person.","dangle|The subject is “the voices”."]],
["f011","f","f-sva",3,"There ____, according to the survey’s authors, several reasons that commuters in the region have been slow to adopt electric bicycles.",["is","are","has been","being"],1,"In a sentence that begins with “There”, the subject follows the verb. The subject is “several reasons”, which is plural.",["agr|The subject is “several reasons”, not “there” or “survey”.",null,"agr|“Several reasons” is plural and cannot take “has”.","nonfin"]],
["f032","f","f-tense",3,"Since the mid-1800s, when it first crossed the Rio Grande, the nine-banded armadillo ____ its range steadily northward.",["expands","expanded","has expanded","had expanded"],2,"“Since the mid-1800s” describes a process that began in the past and is still going on, which calls for the present perfect.",["tense|The simple present cannot be used with “since” for a continuing process.","tense|The simple past treats the expansion as finished, but “since” reaches to the present.",null,"tense|The past perfect would place the whole expansion before some other past event, and none is given."]],

["r001","r","r-sim",1,{"n":["The kora is a stringed instrument from West Africa.","It has 21 strings and a large gourd resonator.","The ngoni is a stringed instrument from West Africa.","It has a narrow wooden body and usually four to seven strings.","Both are traditionally played by griots, hereditary musicians and storytellers."],"g":"The student wants to emphasize a similarity between the two instruments."},["The kora has 21 strings and a gourd resonator, whereas the ngoni has a narrow wooden body and fewer strings.","The kora and the ngoni are both West African stringed instruments traditionally played by griots.","The kora, a West African stringed instrument played by griots, has 21 strings and a large gourd resonator.","Griots, the hereditary musicians of West Africa, play the ngoni, which usually has four to seven strings."],1,"The sentence names features that the two instruments share (region, type, players) and says that both have them.",["r-opp|“Whereas” sets the instruments against each other; the sentence emphasizes how they differ.",null,"r-part|Only the kora is described, so no similarity can be shown.","r-part|Only the ngoni is described, so no similarity can be shown."]],
["r013","r","r-diff",1,{"n":["African savanna elephants are the largest land animals.","Their ears are very large and shaped somewhat like the continent of Africa.","Asian elephants are smaller than African savanna elephants.","Their ears are small and rounded.","Both species live in herds led by an older female."],"g":"The student wants to emphasize a difference between the two kinds of elephant."},["African savanna elephants have very large ears, whereas Asian elephants have small, rounded ones.","African savanna elephants, the largest land animals, have ears shaped somewhat like the continent of Africa.","Both African savanna elephants and Asian elephants live in herds that are led by an older female.","Asian elephants have small, rounded ears and live in herds led by an older female."],0,"The sentence compares the two elephants on one feature, their ears, and marks the contrast with “whereas”.",[null,"r-part|Only African savanna elephants are described.","r-opp|“Both” introduces something the two elephants share.","r-part|Only Asian elephants are described."]],
["r027","r","r-intro",1,{"n":["Sandra Cisneros is a Mexican American writer born in Chicago in 1954.","Her novel The House on Mango Street was published in 1984.","The novel is told in short vignettes.","Its narrator is Esperanza Cordero, a girl growing up in a Latino neighborhood of Chicago.","The book has sold millions of copies."],"g":"The student wants to introduce the novel to an audience unfamiliar with it."},["Esperanza Cordero’s vignettes about her Latino neighborhood in Chicago have helped The House on Mango Street sell millions of copies.","The House on Mango Street, a 1984 novel by Sandra Cisneros, is narrated in short vignettes by a girl growing up in Chicago.","Sandra Cisneros, a Mexican American writer, was born in Chicago in 1954 and published a novel thirty years later.","Since 1984, The House on Mango Street has sold millions of copies, and its narrator has become known to a great many readers."],1,"An unfamiliar audience needs the basics. The sentence gives the title, the date, the author, the kind of work and what it is about.",["r-aud|It assumes the reader already knows what the book is and who wrote it.",null,"r-off|It introduces the author, and never names or describes the novel.","r-aud|It reports the book’s sales without saying who wrote it or what it is about."]],
["r045","r","r-aim",1,{"n":["In the 1960s, the ecologist Robert Paine studied a rocky shore in Washington State.","He wanted to know how a single predator affects the variety of species around it.","He removed all the sea stars from one area and left a nearby area untouched.","Within a few years, the number of species in the cleared area fell from fifteen to eight."],"g":"The student wants to present the aim of Paine’s study."},["Paine removed all the sea stars from one area of the shore and left a nearby area untouched.","Paine wanted to find out how a single predator affects the variety of species that live around it.","In the 1960s, Robert Paine carried out a study of sea stars on a rocky shore in Washington State.","In the area that Paine had cleared of sea stars, the number of species fell from fifteen to eight within a few years."],1,"The aim is the question the researcher wanted to answer. “Wanted to find out how…” states that question.",["r-off|It describes what Paine did (the method), not what he wanted to learn.",null,"r-vague|It says that a study took place but not what it was meant to discover.","r-off|It reports the result, not the aim."]],
["r053","r","r-method",1,{"n":["In 1668, the Italian physician Francesco Redi investigated where maggots come from.","Many people believed that maggots arose spontaneously from rotting meat.","Redi placed meat in jars, leaving some open and covering others with gauze.","Maggots appeared only on the meat in the open jars, which flies could reach."],"g":"The student wants to present the method Redi used."},["Redi investigated where maggots come from at a time when many believed they arose from rotting meat.","Redi, an Italian physician, challenged a common belief about maggots with an experiment he conducted in 1668.","Redi placed meat in jars, leaving some of them open and covering the others with gauze.","Redi found that maggots appeared only on meat in the open jars, which flies were able to reach."],2,"Method means what the researcher did. The sentence describes the setup: meat in open and covered jars.",["r-off|It gives the question and its background, not the method.","r-vague|It says that an experiment took place without describing it.",null,"r-off|It reports the result, not the method."]],
["r061","r","r-find",1,{"n":["In 1847, the physician Ignaz Semmelweis worked in a maternity clinic in Vienna.","He suspected that doctors were carrying infection to patients on their hands.","He required doctors to wash their hands in a chlorine solution before examining patients.","The death rate in the clinic fell from about 18 percent to about 2 percent."],"g":"The student wants to present the result of Semmelweis’s intervention."},["Semmelweis, a physician, was working in a maternity clinic in Vienna in 1847 when he introduced a new rule.","After Semmelweis made doctors wash their hands, the clinic’s death rate fell from about 18 percent to about 2 percent.","Semmelweis required the doctors in his clinic to wash their hands in a chlorine solution before they examined patients.","Semmelweis suspected that the doctors in his Vienna maternity clinic were carrying infection to patients on their hands."],1,"The result is what happened afterward: the fall in the death rate.",["r-vague|It mentions a new rule without saying what followed from it.",null,"r-off|It describes the intervention itself, not its result.","r-off|It gives the suspicion that led to the intervention, not the result."]],
["r071","r","r-spec",1,{"n":["The blue whale is the largest animal known to have lived.","Adults can reach 30 meters in length.","They feed almost entirely on krill, small shrimp-like animals.","Blue whales are found in every ocean except the Arctic."],"g":"The student wants to emphasize the size of the blue whale."},["At up to 30 meters long, the blue whale is the largest animal known to have lived.","Blue whales can be found in every one of the world’s oceans with the exception of the Arctic.","The blue whale feeds almost entirely on krill, which are small animals that resemble shrimp.","The blue whale is found in every ocean except the Arctic and feeds almost entirely on krill."],0,"The goal names size. The sentence gives the whale’s length and its rank as the largest animal.",[null,"r-vague|It gives the whale’s range but not its size.","r-vague|It describes the whale’s diet and says nothing about its size.","r-vague|It gives range and diet but not size."]],
["r085","r","r-gen",1,{"n":["Monarch butterflies fly up to 4,000 kilometers to spend the winter in Mexico.","Gray whales swim from Arctic feeding grounds to lagoons in Mexico to give birth.","Caribou walk hundreds of kilometers between their summer and winter ranges.","Each of these journeys is repeated every year."],"g":"The student wants to make a generalization about animal migration."},["Monarch butterflies fly up to 4,000 kilometers each year in order to spend the winter in Mexico.","Caribou, unlike monarch butterflies, make their yearly journey of hundreds of kilometers on foot.","Animals as different as butterflies, whales, and caribou make long seasonal journeys that are repeated every year.","Gray whales give birth in the lagoons of Mexico after swimming there all the way from their feeding grounds in the Arctic."],2,"The sentence makes one broad statement that covers all the animals in the notes.",["r-off|It describes only monarch butterflies.","r-opp|It contrasts two animals when a general statement was asked for.",null,"r-off|It describes only gray whales."]],
["r093","r","r-adv",1,{"n":["Incandescent bulbs produce light by heating a wire filament.","About 90 percent of the energy they use is released as heat.","LED bulbs produce light by passing current through a semiconductor.","An LED bulb uses about 75 percent less energy than an incandescent bulb of the same brightness.","LED bulbs also last many times longer."],"g":"The student wants to explain an advantage of LED bulbs over incandescent bulbs."},["An LED bulb uses about 75 percent less energy than an equally bright incandescent bulb and lasts many times longer.","LED bulbs and incandescent bulbs both turn electricity into light, though they do so in two quite different ways.","An LED bulb produces light by passing current through a semiconductor, whereas an incandescent bulb heats a wire filament.","Incandescent bulbs release about 90 percent of the energy that they use in the form of heat."],0,"An advantage is a way in which one thing is better. The sentence gives two: lower energy use and longer life.",[null,"r-off|It states what the bulbs have in common, not an advantage of one.","r-off|It explains how each bulb works, not why one is better.","r-part|It gives a weakness of incandescent bulbs but says nothing about LED bulbs."]],
["r002","r","r-sim",1,{"n":["Curiosity is a NASA rover that landed in Gale Crater on Mars in 2012.","Perseverance is a NASA rover that landed in Jezero Crater on Mars in 2021.","Both rovers are about the size of a car.","Both are powered by the heat of decaying plutonium rather than by solar panels.","Perseverance carried a small helicopter, Ingenuity."],"g":"The student wants to emphasize a similarity between the two rovers."},["Unlike Curiosity, which landed on Mars in 2012, Perseverance carried a small helicopter called Ingenuity.","Perseverance, a car-sized NASA rover that is powered by decaying plutonium, landed in Jezero Crater on Mars in 2021.","Curiosity landed in Gale Crater on Mars in 2012, while Perseverance landed in Jezero Crater nine years later, in 2021.","Curiosity and Perseverance are both car-sized NASA rovers powered by decaying plutonium rather than by solar panels."],3,"The sentence states features shared by the two rovers: their size and their source of power.",["r-opp|“Unlike” introduces a difference: only one rover carried a helicopter.","r-part|Only Perseverance is described.","r-opp|“While” contrasts the two landing sites and dates.",null]],
["r014","r","r-diff",1,{"n":["Mercury is the planet closest to the Sun.","It has almost no atmosphere, so its night side is extremely cold.","Venus is the second planet from the Sun.","Its thick atmosphere of carbon dioxide traps heat.","Venus has the hottest surface of any planet in the solar system."],"g":"The student wants to emphasize a difference between the atmospheres of the two planets."},["Mercury and Venus are the two planets closest to the Sun, and each has extreme surface temperatures.","Mercury is the planet closest to the Sun, while Venus, the second closest, has the hottest surface in the solar system.","Venus has a thick atmosphere of carbon dioxide, which gives it the hottest surface of any planet in the solar system.","Mercury has almost no atmosphere, while Venus is wrapped in a thick layer of carbon dioxide that traps heat."],3,"The goal is a difference between atmospheres. The sentence gives each planet’s atmosphere and contrasts them with “while”.",["r-opp|The sentence states what the two planets have in common.","r-off|It contrasts the planets’ positions and temperatures, not their atmospheres.","r-part|Only the atmosphere of Venus is described.",null]],
["r028","r","r-intro",1,{"n":["Wangari Maathai (1940–2011) was a Kenyan environmentalist.","She founded the Green Belt Movement in 1977.","The movement pays rural women to plant trees.","She received the Nobel Peace Prize in 2004."],"g":"The student wants to introduce Wangari Maathai to an audience unfamiliar with her."},["The Green Belt Movement, which was founded in 1977, pays rural women in Kenya to plant trees.","Wangari Maathai was a Kenyan environmentalist who founded the Green Belt Movement in 1977 and received the Nobel Peace Prize in 2004.","By the time she received the Nobel Peace Prize in 2004, Maathai’s movement had been paying rural women to plant trees for nearly three decades.","Maathai’s Nobel Peace Prize came in 2004, twenty-seven years after she had started the Green Belt Movement."],1,"The sentence tells an unfamiliar reader who Maathai was (a Kenyan environmentalist) and what she is known for.",["r-off|It introduces the movement, and Maathai is not mentioned at all.",null,"r-aud|It refers to “Maathai’s movement” without identifying her or the movement.","r-aud|It never says who Maathai was; it assumes the reader knows."]],
["r009","r","r-sim",1,{"n":["Emperor penguins breed in Antarctica during the winter.","The male balances the single egg on his feet for about two months.","Seahorses live in shallow coastal waters.","The male carries the eggs in a pouch on his belly until they hatch."],"g":"The student wants to emphasize a similarity between the two animals."},["A male emperor penguin balances a single egg on his feet for about two months during the Antarctic winter.","Although they live in very different environments, emperor penguins and seahorses are alike in that the male carries the eggs until they hatch.","Emperor penguins breed in the Antarctic winter, while seahorses live in shallow coastal waters.","A male seahorse carries eggs in a pouch on his belly, whereas a male emperor penguin balances one egg on his feet."],1,"“Are alike in that” states the shared feature directly: in both species the male looks after the eggs.",["r-part|Only the emperor penguin is described.",null,"r-opp|“While” contrasts the animals’ environments.","r-opp|“Whereas” stresses how the two males differ in the way they carry eggs."]],
["r018","r","r-diff",1,{"n":["Stalactites and stalagmites are mineral formations found in limestone caves.","Both form when dripping water leaves behind tiny deposits of calcite.","Stalactites hang from the ceiling of a cave.","Stalagmites rise from the floor, often directly beneath a stalactite.","The two sometimes meet and join into a single column."],"g":"The student wants to emphasize a difference between stalactites and stalagmites."},["Stalactites and stalagmites both form when dripping water leaves behind tiny deposits of calcite.","A stalactite and the stalagmite beneath it sometimes meet and join into a single column.","Stalactites hang from a cave’s ceiling, while stalagmites rise from its floor.","Stalagmites, mineral formations found in limestone caves, often rise directly beneath a stalactite."],2,"The main clause contrasts where each formation is found, ceiling versus floor. The “although” clause only sets a shared feature aside.",["r-opp|The sentence states how the two formations are alike.","r-off|It describes what can happen to the two formations, not how they differ.",null,"r-part|Only stalagmites are described."]],
["r033","r","r-intro",1,{"n":["A quipu is a set of knotted cords made of cotton or wool.","Quipus were used by officials of the Inca Empire in the 1400s and 1500s.","The type and position of each knot recorded a number.","About 1,000 quipus survive in museums today."],"g":"The student wants to introduce the quipu to an audience unfamiliar with it."},["About 1,000 quipus, which were made in the 1400s and 1500s for Inca officials, survive in museums today.","Inca officials of the 1400s and 1500s recorded numbers by varying the type and position of each knot.","A quipu is a set of knotted cords that officials of the Inca Empire used to record numbers.","The knots on a quipu differ in type and position, and each one recorded a number for Inca officials."],2,"The sentence says what a quipu is, who used it and what it was for.",["r-aud|It says how many quipus survive but not what a quipu is.","r-vague|It describes a practice but never names the quipu or says that it is made of cords.",null,"r-aud|It mentions knots “on a quipu” without ever saying what a quipu is."]],
["r003","r","r-sim",2,{"n":["Things Fall Apart (1958) is a novel by the Nigerian writer Chinua Achebe.","It depicts an Igbo village disrupted by the arrival of British colonizers.","Nervous Conditions (1988) is a novel by the Zimbabwean writer Tsitsi Dangarembga.","It follows a girl seeking an education in British-ruled Rhodesia in the 1960s."],"g":"The student wants to emphasize a similarity between the two novels."},["Although they were published thirty years apart, Things Fall Apart and Nervous Conditions both portray African lives shaped by British colonialism.","Chinua Achebe published Things Fall Apart in 1958, three decades before Tsitsi Dangarembga published Nervous Conditions.","Things Fall Apart is set in an Igbo village in Nigeria, whereas Nervous Conditions takes place in Rhodesia in the 1960s.","Nervous Conditions, a 1988 novel by Tsitsi Dangarembga, follows a girl seeking an education in British-ruled Rhodesia."],0,"The main clause says what both novels do: portray African lives under British colonialism. The opening “although” clause only sets a difference aside.",[null,"r-opp|The sentence stresses the gap between the publication dates, which is a difference.","r-opp|“Whereas” contrasts the settings of the two novels.","r-part|Only one of the two novels is described."]],
["r015","r","r-diff",2,{"n":["The harpsichord was the leading keyboard instrument in Europe in the 1600s.","Pressing a harpsichord key causes a small plectrum to pluck a string.","The piano was invented in Italy around 1700.","Pressing a piano key causes a felt-covered hammer to strike a string.","A pianist can play louder or softer by pressing the keys harder or more gently."],"g":"The student wants to emphasize a difference in how the two instruments produce sound."},["In both the harpsichord and the piano, pressing a key sets a string vibrating to produce a note.","Because a piano’s hammers strike its strings, a pianist can play louder or softer by pressing the keys harder or more gently.","The harpsichord led European keyboard music in the 1600s, but the piano was not invented until around 1700.","A harpsichord’s strings are plucked by a plectrum, whereas a piano’s strings are struck by a felt-covered hammer."],3,"The goal is a difference in sound production. The sentence contrasts plucking with striking.",["r-opp|“In both” introduces what the instruments have in common.","r-part|Only the piano is described.","r-off|It contrasts the instruments’ dates, not the way they produce sound.",null]],
["r029","r","r-intro",2,{"n":["Jacob Lawrence (1917–2000) was an American painter.","He completed the Migration Series in 1941.","The series consists of 60 small panels with captions.","It depicts the movement of Black Americans from the rural South to northern cities.","The panels are now divided between two museums."],"g":"The student wants to introduce the Migration Series to an audience unfamiliar with the work."},["The Migration Series, completed in 1941 by the American painter Jacob Lawrence, depicts in 60 panels the movement of Black Americans from the rural South to northern cities.","The 60 small panels of the Migration Series, each of which is accompanied by a caption, have been divided between two museums.","Jacob Lawrence, an American painter who was born in 1917 and died in 2000, completed a series of 60 small panels with captions in 1941.","Lawrence’s panels follow Black Americans from the rural South to northern cities, a subject that he finished painting in 1941."],0,"The sentence identifies the work for a new audience: its title, its creator, its date, its form and its subject.",[null,"r-aud|It does not say who made the series or what it depicts.","r-vague|It introduces the painter but never names the series or says what it shows.","r-aud|It assumes the reader knows who Lawrence is and never gives the title of the work."]],
["r039","r","r-fam",2,{"n":["Toni Morrison (1931–2019) was an American novelist.","She received the Nobel Prize in Literature in 1993.","Her novel Beloved was published in 1987.","Beloved was inspired by the life of Margaret Garner, a woman who escaped slavery in 1856."],"g":"The student wants to explain the source of the novel’s story to an audience already familiar with Toni Morrison."},["Toni Morrison was an American novelist, and one of her novels, Beloved, drew on the life of a real woman.","Beloved was published in 1987, six years before its author received the Nobel Prize in Literature.","Morrison’s 1987 novel Beloved was inspired by the life of Margaret Garner, a woman who escaped slavery in 1856.","Toni Morrison, an American novelist who received the Nobel Prize in Literature in 1993, published Beloved in 1987."],2,"The audience knows Morrison, so the sentence goes straight to the source of the story: the life of Margaret Garner.",["r-aud|It re-introduces Morrison and leaves the source unnamed.","r-off|It gives dates, not the source of the story.",null,"r-aud|It spends its words identifying Morrison, whom the audience already knows, and never gives the source."]],
["r046","r","r-aim",2,{"n":["In 1974, the psychologists Elizabeth Loftus and John Palmer studied eyewitness memory.","They asked whether the wording of a question can change what a witness remembers.","Participants watched films of car collisions and then estimated the cars’ speed.","Those asked how fast the cars ‘smashed into’ each other gave higher estimates than those asked how fast the cars ‘hit’ each other."],"g":"The student wants to present the research question of the study."},["Loftus and Palmer, two psychologists, published a study of eyewitness memory involving films of car collisions in 1974.","Participants who heard the phrase ‘smashed into’ estimated higher speeds than participants who heard the word ‘hit.’","Loftus and Palmer showed participants films of car collisions and had them estimate how fast the cars were going.","Loftus and Palmer asked whether the wording of a question can change what an eyewitness remembers."],3,"The research question is stated directly: whether wording can change what a witness remembers.",["r-vague|It identifies the study without saying what it asked.","r-off|It reports the finding, not the question.","r-off|It describes the procedure, not the question.",null]],
["r054","r","r-method",2,{"n":["In 1854, cholera killed hundreds of people in the Soho district of London.","The physician John Snow suspected that the disease spread through contaminated water.","He marked the home of each victim on a map and noted the nearest public water pump.","Most of the deaths were clustered around a single pump on Broad Street."],"g":"The student wants to present the method Snow used."},["Snow discovered that most of the cholera deaths were clustered around a single pump on Broad Street.","Snow suspected that cholera, which killed hundreds in Soho in 1854, was spread by contaminated water.","Snow, a London physician, studied the outbreak of cholera that struck the Soho district in 1854.","Snow marked the home of each cholera victim on a map and noted which public water pump was nearest."],3,"The sentence describes the procedure: mapping each victim’s home and the nearest pump.",["r-off|It reports what Snow discovered, not how he worked.","r-off|It gives Snow’s hypothesis, not his method.","r-vague|It says that Snow studied the outbreak without saying how.",null]],
["r062","r","r-find",2,{"n":["In the 1850s and 1860s, Gregor Mendel bred pea plants in a monastery garden.","He crossed plants that produced round seeds with plants that produced wrinkled seeds.","All the offspring had round seeds.","When those offspring were bred with one another, about three-quarters of the next generation had round seeds and one-quarter had wrinkled seeds."],"g":"The student wants to present the results of Mendel’s crosses."},["Mendel found that the first generation all had round seeds, while about three-quarters of the next had round seeds and one-quarter had wrinkled ones.","Mendel then bred the offspring of his first cross with one another in order to produce a further generation.","Mendel crossed pea plants that produced round seeds with pea plants that produced wrinkled seeds.","Mendel carried out his breeding experiments with pea plants in a monastery garden in the 1850s and 1860s."],0,"The results are what the plants of each generation looked like, and the sentence reports both generations.",[null,"r-off|It describes the second step of the method, not a result.","r-off|It describes the first step of the method, not a result.","r-vague|It says where and when the experiments took place, not what they showed."]],
["r072","r","r-spec",2,{"n":["Great Basin bristlecone pines grow in the mountains of California, Nevada, and Utah.","One tree, named Methuselah, is more than 4,800 years old.","The trees grow very slowly in dry, rocky soil.","Their wood is dense and resistant to insects and rot."],"g":"The student wants to emphasize how old bristlecone pines can become."},["Great Basin bristlecone pines can be extremely old; one tree, named Methuselah, is more than 4,800 years old.","One Great Basin bristlecone pine, a tree that grows very slowly in dry, rocky soil, has been given the name Methuselah.","The wood of the Great Basin bristlecone pine is dense, and it is resistant to both insects and rot.","Great Basin bristlecone pines grow very slowly in the dry, rocky soil of mountains in California, Nevada, and Utah."],0,"The goal names age. The sentence gives the age of a specific tree: more than 4,800 years.",[null,"r-vague|It names Methuselah but leaves out the tree’s age.","r-vague|It describes the wood, not the trees’ age.","r-vague|It describes how and where the trees grow, not how old they become."]],
["r083","r","r-gen",2,{"n":["Many plants defend themselves chemically against animals that eat them.","Milkweed produces toxins that are poisonous to most insects.","Tobacco plants produce nicotine, which is toxic to insects.","Oak leaves contain tannins that make them hard to digest."],"g":"The student wants to make a generalization about plant defenses."},["Nicotine, a chemical produced by tobacco plants, is toxic to the insects that feed on them.","Tobacco plants produce nicotine, and oak leaves contain tannins that make them hard to digest.","Many plants defend themselves against plant-eating animals by producing harmful chemicals.","Milkweed protects itself from most insects by producing toxins that are poisonous to them."],2,"A generalization is a broad statement about the whole group. This sentence speaks of “many plants”, not of one species.",["r-off|It describes a single chemical in a single plant.","r-off|It lists two specific cases without stating the general point.",null,"r-off|It describes a single plant, milkweed, not plants in general."]],
["r094","r","r-adv",2,{"n":["Cross-laminated timber (CLT) is made by gluing layers of wood at right angles.","CLT panels are much lighter than concrete.","Buildings made with CLT therefore need smaller foundations.","Panels are cut in a factory and assembled quickly on site.","An 18-story CLT building, Mjøstårnet, opened in Norway in 2019."],"g":"The student wants to explain an advantage of building with CLT."},["CLT panels, which are made of layers of wood glued at right angles, are cut to size in a factory.","CLT panels are much lighter than concrete, so CLT buildings need smaller foundations.","Mjøstårnet, an 18-story building in Norway that opened in 2019, was constructed with CLT.","CLT is made by gluing together layers of wood so that each layer lies at right angles to the next."],1,"The sentence names a benefit (smaller foundations) and gives the reason for it (lighter panels).",["r-off|It describes how the panels are made and cut, not a benefit of building with them.",null,"r-off|It names a building made with CLT but states no advantage.","r-off|It describes how CLT is made, not what is gained by using it."]],
["r004","r","r-sim",2,{"n":["Sea otters live along the coasts of the northern Pacific Ocean.","They use stones to crack open the shells of clams and sea urchins.","Egyptian vultures live in southern Europe, Africa, and South Asia.","They throw stones at ostrich eggs to break the thick shells."],"g":"The student wants to emphasize a similarity between the two animals."},["Like sea otters, which crack shellfish with stones, Egyptian vultures use stones as tools to break open their food.","Sea otters use stones to crack open clams and sea urchins, a behavior seen along the coasts of the northern Pacific.","Egyptian vultures eat ostrich eggs, whereas sea otters feed on shellfish such as clams and sea urchins.","Sea otters live along the northern Pacific coast, while Egyptian vultures are found in southern Europe, Africa, and South Asia."],0,"“Like sea otters” announces a comparison, and the sentence then states the shared behavior: both use stones to open food.",[null,"r-part|Only sea otters are described.","r-opp|“Whereas” contrasts the diets of the two animals.","r-opp|The sentence contrasts where the two animals live."]],
["r016","r","r-diff",2,{"n":["Arabica and robusta are the two most widely grown species of coffee.","Arabica grows best at high altitudes and makes up most of the world’s production.","Robusta tolerates heat and grows at lower altitudes.","Robusta beans contain roughly twice as much caffeine as arabica beans."],"g":"The student wants to emphasize a difference between the growing conditions of the two species."},["Arabica, the species that makes up most of the world’s coffee production, grows best at high altitudes.","Arabica and robusta are the two species of coffee that are most widely grown around the world.","Arabica coffee grows best at high altitudes, while robusta tolerates heat and can be grown at lower ones.","Robusta beans contain roughly twice as much caffeine as arabica beans, which make up most of the world’s production."],2,"The goal is a difference in growing conditions. The sentence contrasts the altitude and heat each species needs.",["r-part|Only arabica’s growing conditions are given.","r-opp|The sentence states what the two species have in common.",null,"r-off|It contrasts caffeine content and production, not growing conditions."]],
["r030","r","r-intro",2,{"n":["The ecologist Robert Paine introduced the term ‘keystone species’ in 1969.","A keystone species has an effect on its ecosystem that is large relative to its numbers.","Paine removed sea stars from a stretch of rocky shore in Washington State.","Mussels then crowded out most other species there."],"g":"The student wants to introduce the concept of a keystone species to an audience unfamiliar with it."},["The sea stars that Paine removed from the shore are a keystone species, as the spread of mussels afterward showed.","A keystone species, a term introduced by Robert Paine in 1969, is one whose effect on its ecosystem is large relative to its numbers.","Robert Paine, the ecologist who introduced the term ‘keystone species’ in 1969, studied sea stars on a rocky shore in Washington State.","After the ecologist Robert Paine removed sea stars from a rocky shore in Washington State, mussels crowded out most of the other species."],1,"To introduce a concept, the sentence must define it. This choice says what a keystone species is.",["r-aud|It applies the term to sea stars as though the reader already knew its meaning.",null,"r-vague|It mentions the term but never says what it means.","r-off|It describes an experiment without naming or defining the concept."]],
["r040","r","r-fam",2,{"n":["The Great Barrier Reef lies off the northeastern coast of Australia.","It is the largest coral reef system in the world.","Unusually warm water causes corals to expel the algae that feed them, a process called bleaching.","Mass bleaching struck the reef in 2016, 2017, 2020, 2022, and 2024."],"g":"The student wants to explain a threat to the reef to an audience already familiar with the Great Barrier Reef."},["Bleaching is the name of a process that affects corals, including those of the largest reef system in the world.","The Great Barrier Reef is a coral reef system off Australia that has experienced mass bleaching five times since 2016.","The Great Barrier Reef, which is the largest coral reef system in the world, lies off the northeastern coast of Australia.","Unusually warm water has repeatedly caused the reef’s corals to bleach, that is, to expel the algae that feed them."],3,"The audience knows the reef, so the sentence explains the threat: warm water makes corals expel their algae.",["r-vague|It names bleaching without explaining what causes it or what it does.","r-aud|It re-introduces the reef and does not explain what bleaching is or what causes it.","r-aud|It only identifies the reef, which the audience already knows.",null]],
["r047","r","r-aim",2,{"n":["Peter and Rosemary Grant have studied finches on the Galápagos island of Daphne Major since 1973.","They set out to learn whether natural selection can be observed within a few generations.","They measured the beaks of nearly every finch on the island each year.","After a drought in 1977, the average beak of the medium ground finch became deeper."],"g":"The student wants to present the aim of the Grants’ research."},["The Grants set out to learn whether natural selection can be observed over just a few generations.","Since 1973, Peter and Rosemary Grant have been studying the finches of Daphne Major, a Galápagos island.","Each year, the Grants measured the beaks of nearly every finch living on the island of Daphne Major.","After the 1977 drought, the Grants found that the average beak of the medium ground finch had become deeper."],0,"“Set out to learn whether…” states what the researchers hoped to discover, which is the aim.",[null,"r-vague|It says where and when the research took place, not what it was for.","r-off|It describes the method, not the aim.","r-off|It reports a finding, not the aim."]],
["r055","r","r-method",2,{"n":["In 1747, the naval surgeon James Lind tested treatments for scurvy aboard a British ship.","He divided twelve sick sailors into six pairs.","Each pair received a different daily supplement, such as cider, vinegar, seawater, or oranges and lemons.","The two sailors given citrus fruit recovered within a week."],"g":"The student wants to present the design of Lind’s test."},["Lind divided twelve sailors with scurvy into six pairs and gave each pair a different daily supplement.","Lind’s test of scurvy treatments, carried out aboard a British ship in 1747, involved twelve sailors who were sick.","Lind observed that the two sailors who were given oranges and lemons each day recovered from scurvy within a week.","Lind, a naval surgeon serving aboard a British ship in 1747, wanted to find an effective treatment for scurvy."],0,"The design is how the test was organized: six pairs of sailors, each pair given a different supplement.",[null,"r-vague|It gives the place, date and number of sailors but not how the test was organized.","r-off|It reports the outcome, not the design.","r-off|It gives the purpose of the test, not its design."]],
["r063","r","r-find",2,{"n":["In the 1920s, the astronomer Edwin Hubble studied galaxies beyond the Milky Way.","He compared each galaxy’s distance with the speed at which it is moving away from Earth.","He reported his results in 1929.","The farther away a galaxy is, the faster it is receding."],"g":"The student wants to present Hubble’s conclusion."},["Hubble compared the distance of each galaxy with the speed at which it is moving away from Earth.","Hubble, an astronomer, spent the 1920s studying galaxies that lie beyond the Milky Way.","Hubble reported in 1929 that the farther away a galaxy is, the faster it is receding from Earth.","Hubble’s 1929 report drew on measurements of the distances and speeds of galaxies beyond the Milky Way."],2,"The conclusion is the relationship Hubble found: greater distance, greater speed of recession.",["r-off|It describes the comparison he made, not what the comparison showed.","r-vague|It says what he studied, not what he concluded.",null,"r-off|It says what the report was based on, not what it concluded."]],
["r073","r","r-spec",2,{"n":["Arctic terns breed in the Arctic and spend the northern winter near Antarctica.","A tern may fly more than 70,000 kilometers in a year.","They weigh about 100 grams.","They can live for 30 years."],"g":"The student wants to emphasize the distance that Arctic terns travel."},["Arctic terns, which breed in the far north, are small birds that weigh about 100 grams.","An Arctic tern weighs only about 100 grams, yet it is a bird that can live for as long as 30 years.","Arctic terns breed in the Arctic during the northern summer and then spend the northern winter far away, in the waters near Antarctica.","An Arctic tern, flying between the Arctic and the waters near Antarctica, may cover more than 70,000 kilometers in a single year."],3,"The goal names distance. The sentence gives the figure: more than 70,000 kilometers a year.",["r-vague|It gives the breeding area and weight, not distance.","r-vague|It gives weight and lifespan, not distance.","r-vague|It names the two ends of the journey but gives no distance.",null]],
["r084","r","r-gen",2,{"n":["Biomimicry is the practice of basing designs on structures found in nature.","The front of Japan’s Shinkansen bullet train was reshaped in the 1990s.","The new shape was modeled on the beak of the kingfisher.","The redesigned train was quieter and used less electricity."],"g":"The student wants to provide an example of biomimicry."},["One example of biomimicry is Japan’s Shinkansen bullet train, whose front was modeled on a kingfisher’s beak.","After its front was reshaped in the 1990s, Japan’s Shinkansen bullet train was quieter and used less electricity.","Biomimicry is the practice of basing the design of human-made objects on structures that are found in nature.","Designers who practice biomimicry look to structures found in nature when they create new objects."],0,"An example must be one specific case tied to the concept. The sentence names the train and the natural structure it copied.",[null,"r-part|It mentions the train without the link to nature that makes it an example of biomimicry.","r-off|It defines biomimicry but gives no example.","r-off|It describes the practice in general and gives no example."]],
["r095","r","r-adv",2,{"n":["Flamingo chicks hatch with gray feathers.","Flamingos eat algae and brine shrimp.","These foods contain pigments called carotenoids.","As the birds digest the pigments, their feathers gradually turn pink."],"g":"The student wants to explain why adult flamingos are pink."},["Adult flamingos are pink because the algae and brine shrimp they eat contain carotenoid pigments that color their feathers.","The feathers of a flamingo are gray when the chick hatches, but those of an adult are pink.","Flamingos eat algae and brine shrimp, foods that contain pigments known as carotenoids.","Flamingo chicks hatch with gray feathers, which gradually turn pink as the birds grow older."],0,"“Why” asks for a cause. The sentence gives it with “because”: pigments in the birds’ food color their feathers.",[null,"r-off|It contrasts chicks with adults and gives no reason.","r-part|It names the pigments in the food but never connects them to the color of the feathers.","r-vague|It says that the feathers change color but not what causes the change."]],
["r005","r","r-sim",2,{"n":["Katsushika Hokusai made the woodblock print The Great Wave off Kanagawa around 1831.","Utagawa Hiroshige made the woodblock print Sudden Shower over Shin-Ōhashi Bridge in 1857.","Hokusai’s print shows boats beneath a towering wave.","Hiroshige’s print shows people crossing a bridge in the rain.","Both prints were studied by European painters in the late 1800s, including Vincent van Gogh."],"g":"The student wants to emphasize a similarity between the two prints."},["Hokusai’s print shows boats beneath a towering wave, whereas Hiroshige’s shows people crossing a bridge in the rain.","Hokusai made The Great Wave off Kanagawa around 1831, roughly a quarter of a century before Hiroshige made Sudden Shower over Shin-Ōhashi Bridge in 1857.","Hokusai’s The Great Wave off Kanagawa and Hiroshige’s Sudden Shower over Shin-Ōhashi Bridge are woodblock prints that European painters later studied.","Vincent van Gogh was among the European painters who studied Hiroshige’s 1857 print of people crossing a bridge in the rain."],2,"The sentence names both prints and states two things they have in common: the medium and their influence on European painters.",["r-opp|“Whereas” contrasts the subjects of the two prints.","r-opp|The sentence stresses the difference in their dates.",null,"r-part|Only Hiroshige’s print is discussed."]],
["r017","r","r-diff",2,{"n":["Alligators and crocodiles are large reptiles that belong to the same order.","An alligator has a broad, U-shaped snout.","A crocodile has a narrower, V-shaped snout.","Alligators live mainly in fresh water.","Many crocodiles can live in salt water."],"g":"The student wants to emphasize a difference in the appearance of the two animals."},["Alligators live mainly in fresh water, whereas many crocodiles are able to live in salt water.","An alligator’s snout is broad and U-shaped, but a crocodile’s is narrower and V-shaped.","A crocodile, a large reptile that can often live in salt water, has a narrow, V-shaped snout.","Alligators and crocodiles are both large reptiles, and they belong to the same order."],1,"The goal is a difference in appearance. The sentence contrasts the shapes of the two snouts.",["r-off|It contrasts the animals’ habitats, not their appearance.",null,"r-part|Only the crocodile is described.","r-opp|“Both” introduces what the animals have in common."]],
["r031","r","r-intro",2,{"n":["Göbekli Tepe is an archaeological site in southeastern Turkey.","It contains rings of carved stone pillars up to 5.5 meters tall.","The oldest structures there were built more than 11,000 years ago.","Excavations began in 1995 under the archaeologist Klaus Schmidt."],"g":"The student wants to introduce Göbekli Tepe to an audience unfamiliar with the site."},["When the archaeologist Klaus Schmidt began excavating Göbekli Tepe in 1995, he was working among carved pillars that stand up to 5.5 meters tall.","The pillars at Göbekli Tepe, some of them 5.5 meters tall, are arranged in rings and decorated with carvings.","Excavations led by the archaeologist Klaus Schmidt began in 1995 at a site in southeastern Turkey.","Göbekli Tepe is an archaeological site in southeastern Turkey where rings of carved stone pillars were erected more than 11,000 years ago."],3,"The sentence tells a new audience what Göbekli Tepe is, where it is, what is there and how old it is.",["r-aud|It does not say what or where Göbekli Tepe is.","r-aud|It describes the pillars without saying what kind of place Göbekli Tepe is, where it is or how old.","r-vague|It never names the site or says what was found there.",null]],
["r042","r","r-fam",2,{"n":["Frida Kahlo (1907–1954) was a Mexican painter.","She is known for her self-portraits.","The Two Fridas (1939) is a double self-portrait.","In it, one Frida wears a European-style dress and the other a traditional Tehuana dress.","The two figures hold hands."],"g":"The student wants to describe The Two Fridas to an audience already familiar with Frida Kahlo."},["The Two Fridas is a painting by Frida Kahlo, a Mexican painter who is known for her many self-portraits.","Kahlo, who is known for her self-portraits, completed The Two Fridas in 1939, fifteen years before her death.","Frida Kahlo, a Mexican painter who lived from 1907 to 1954, is known for her self-portraits, among them the double self-portrait The Two Fridas.","In The Two Fridas (1939), two figures of the artist hold hands, one in a European-style dress and the other in a traditional Tehuana dress."],3,"The audience knows Kahlo, so the sentence uses its words to describe what the painting shows.",["r-aud|It explains who Kahlo is and gives no description of the painting.","r-off|It gives dates but does not describe the painting.","r-aud|It identifies Kahlo for readers who already know her and does not describe the painting.",null]],
["r049","r","r-aim",2,{"n":["The forest ecologist Suzanne Simard published a field study in 1997.","She wanted to know whether trees of different species exchange carbon through fungi that connect their roots.","She exposed birch and fir seedlings to carbon dioxide containing different carbon isotopes.","The isotopes given to each species later appeared in the other."],"g":"The student wants to present the aim of Simard’s study."},["Simard exposed birch seedlings and fir seedlings to carbon dioxide that contained different isotopes of carbon.","Simard wanted to know whether trees of different species exchange carbon through root fungi.","Simard, a forest ecologist, published a field study involving birch and fir seedlings in 1997.","Simard found that the carbon isotopes given to each species of seedling later appeared in the other species."],1,"“Wanted to know whether…” states the question the study was designed to answer.",["r-off|It describes the method, not the aim.",null,"r-vague|It identifies the study without saying what it set out to learn.","r-off|It reports the finding, not the aim."]],
["r057","r","r-method",2,{"n":["In 1951, the psychologist Solomon Asch studied conformity.","Each participant sat in a group whose other members were secretly working with Asch.","The group was shown a line and asked which of three other lines matched it in length.","On certain trials the other members all gave the same wrong answer.","About three-quarters of participants went along with the wrong answer at least once."],"g":"The student wants to present the method of Asch’s study."},["Asch, a psychologist, was interested in whether people conform to the judgments of the group around them.","Asch’s study of conformity, which he carried out in 1951, asked people to compare the lengths of lines.","Asch seated each participant among people who were secretly working with him and who, on certain trials, all gave the same wrong answer about the length of a line.","Asch reported that about three-quarters of the participants went along with a wrong answer at least once."],2,"The sentence describes the essential setup: a real participant among planted group members who gave wrong answers.",["r-off|It gives the topic of interest, not the method.","r-part|It mentions the task but leaves out the key part of the design: the planted wrong answers.",null,"r-off|It reports the finding, not the method."]],
["r065","r","r-find",2,{"n":["In 1859, Louis Pasteur tested whether microbes arise spontaneously in broth.","He boiled broth in flasks whose long necks were bent into an S shape.","The bend let air in but trapped dust.","The broth stayed clear for months.","When he broke off a neck, the broth clouded with microbes within days."],"g":"The student wants to present the results of Pasteur’s experiment."},["Pasteur boiled broth in flasks whose long necks had been bent into an S shape, a bend that let air reach the broth but trapped any dust.","Pasteur’s 1859 experiment made use of broth, heat, and flasks with unusually long, curved necks.","The broth in Pasteur’s bent-necked flasks stayed clear for months but clouded with microbes within days once a neck was broken off.","Pasteur wanted to test whether microbes can arise spontaneously in broth that has been boiled."],2,"The results are what happened to the broth: clear with the neck intact, cloudy once it was broken.",["r-off|It describes the apparatus and procedure, not the results.","r-vague|It lists the materials without saying what happened.",null,"r-off|It states the question, not the results."]],
["r074","r","r-spec",2,{"n":["The Dead Sea Scrolls are ancient manuscripts written mostly in Hebrew.","The first scrolls were found in 1947 by Bedouin shepherds.","They were found in caves near Qumran, on the northwestern shore of the Dead Sea.","The scrolls date from the third century BCE to the first century CE."],"g":"The student wants to indicate where the scrolls were discovered."},["The Dead Sea Scrolls, ancient manuscripts discovered in 1947, were written mostly in Hebrew.","The Dead Sea Scrolls were discovered in caves near Qumran, on the northwestern shore of the Dead Sea.","The Dead Sea Scrolls, written mostly in Hebrew, date from the third century BCE to the first century CE.","The first of the Dead Sea Scrolls were discovered by Bedouin shepherds in the year 1947."],1,"“Where” asks for a place. The sentence gives it: caves near Qumran, on the shore of the Dead Sea.",["r-vague|It gives the year of discovery and the language, not the place.",null,"r-vague|It gives the language and age of the scrolls, not the place of discovery.","r-vague|It says who found the scrolls and when, not where."]],
["r087","r","r-gen",2,{"n":["English borrowed ‘algebra’ from Arabic.","English borrowed ‘tsunami’ from Japanese.","English borrowed ‘kayak’ from Inuit languages.","English borrowed ‘safari’ from Swahili."],"g":"The student wants to make a generalization about English vocabulary."},["‘Tsunami,’ a word that English speakers use today, was originally borrowed from Japanese.","The word ‘kayak’ entered English from Inuit languages, and ‘safari’ came from Swahili.","English has taken words from languages spoken in many different parts of the world.","English borrowed the word ‘algebra’ from Arabic and the word ‘tsunami’ from Japanese."],2,"The sentence makes a broad statement about English as a whole, which the four notes support.",["r-off|It describes a single word.","r-off|It gives two specific borrowings, not a general statement.",null,"r-off|It gives two specific borrowings, not a general statement."]],
["r097","r","r-adv",2,{"n":["Sprinkler irrigation sprays water over a whole field.","Much of that water evaporates or lands between plants.","Drip irrigation delivers water through tubes directly to the base of each plant.","Drip systems can use 30 to 50 percent less water than sprinklers."],"g":"The student wants to explain an advantage of drip irrigation."},["Drip irrigation delivers water through tubes to the base of each plant, whereas sprinkler irrigation sprays it over a whole field.","By delivering water directly to the base of each plant, drip irrigation can use 30 to 50 percent less water than sprinklers.","Drip irrigation is a system in which tubes carry water to the base of each plant in a field.","Much of the water sprayed by sprinklers evaporates or lands in the spaces between plants."],1,"The sentence states the benefit of drip irrigation, a large saving of water, and connects it to how the system works.",["r-off|It contrasts how the two systems work without saying which is better or why.",null,"r-off|It defines drip irrigation without stating a benefit.","r-part|It gives a weakness of sprinklers but says nothing about drip irrigation."]],
["r006","r","r-sim",2,{"n":["Barbara McClintock proposed in the 1940s that genes can move within a chromosome.","Many geneticists doubted her idea for decades.","Subrahmanyan Chandrasekhar calculated in the 1930s that massive dying stars must collapse.","Leading astronomers of the time rejected his conclusion.","McClintock and Chandrasekhar each received a Nobel Prize in 1983."],"g":"The student wants to emphasize a similarity between the two scientists."},["McClintock studied how genes move within chromosomes, whereas Chandrasekhar studied what happens to massive stars when they die.","Chandrasekhar’s 1930s calculation that massive dying stars must collapse was rejected by the leading astronomers of his time.","McClintock proposed her idea about genes in the 1940s, a decade after Chandrasekhar made his calculation about stars.","Both McClintock and Chandrasekhar proposed ideas that other scientists at first doubted, and both later received Nobel Prizes."],3,"The sentence states two things true of both scientists: early doubt about their ideas and a Nobel Prize in 1983.",["r-opp|“Whereas” contrasts the scientists’ fields of study.","r-part|Only Chandrasekhar is discussed.","r-opp|The sentence stresses a difference in timing.",null]],
["r019","r","r-diff",2,{"n":["Claude Monet and Georges Seurat were French painters of the late 1800s.","Monet often finished a canvas outdoors in a few sessions, using quick, loose brushstrokes.","Seurat worked in his studio, building images from thousands of tiny dots of color.","Seurat spent about two years on A Sunday on La Grande Jatte.","Both painters were interested in the effects of light."],"g":"The student wants to emphasize a difference between the two painters’ methods."},["Monet, a French painter of the late 1800s, often finished a canvas outdoors in just a few sessions.","Monet painted quickly with loose brushstrokes, often outdoors, whereas Seurat slowly built his images from tiny dots in the studio.","Monet and Seurat, French painters of the late 1800s, were both interested in the effects of light.","Seurat spent about two years completing A Sunday on La Grande Jatte, a painting that is made up of thousands of tiny dots of color."],1,"The sentence sets Monet’s method against Seurat’s: fast and loose outdoors versus slow and dotted in the studio.",["r-part|Only Monet’s method is described.",null,"r-opp|“Both” introduces an interest the painters shared.","r-part|Only Seurat’s method is described."]],
["r034","r","r-intro",2,{"n":["Charles David Keeling was an American geochemist.","In 1958 he began measuring carbon dioxide in the air at Mauna Loa Observatory in Hawaii.","The graph of his measurements is known as the Keeling Curve.","It shows carbon dioxide rising from about 315 parts per million in 1958 to more than 420 today."],"g":"The student wants to introduce the Keeling Curve to an audience unfamiliar with it."},["The Keeling Curve is a graph of carbon dioxide in the air at Mauna Loa Observatory in Hawaii, where the geochemist Charles David Keeling began measurements in 1958.","Charles David Keeling, an American geochemist, began taking measurements at Mauna Loa Observatory in Hawaii in 1958.","Carbon dioxide at Mauna Loa has risen from about 315 parts per million to more than 420 since Keeling’s first measurements.","The Keeling Curve has climbed from about 315 parts per million in 1958 to more than 420 parts per million today."],0,"The sentence tells a new audience what the Keeling Curve is: a graph of carbon dioxide measured at a named place since a named date.",[null,"r-vague|It introduces Keeling but never mentions the curve.","r-aud|It never names the curve and assumes the reader knows who Keeling is.","r-aud|It gives the curve’s values without saying what the curve measures."]],
["r044","r","r-fam",2,{"n":["Duke Ellington (1899–1974) was an American jazz composer and bandleader.","He wrote more than a thousand compositions.","Black, Brown and Beige premiered at Carnegie Hall in 1943.","The work lasts about 45 minutes, far longer than a typical jazz piece of its time.","Ellington described it as a musical history of Black Americans."],"g":"The student wants to emphasize what was unusual about Black, Brown and Beige to an audience already familiar with Duke Ellington."},["Ellington, who wrote more than a thousand compositions, premiered Black, Brown and Beige, his musical history of Black Americans, at Carnegie Hall in 1943.","Black, Brown and Beige is a work by Duke Ellington, an American jazz composer who lived from 1899 to 1974.","At about 45 minutes, Black, Brown and Beige, which premiered at Carnegie Hall in 1943, was far longer than a typical jazz piece of its time.","Duke Ellington was an American jazz composer and bandleader who wrote more than a thousand compositions."],2,"The sentence states the unusual feature, the work’s length compared with other jazz of its time, and does not re-introduce Ellington.",["r-off|It reports the premiere but not what was unusual about the piece.","r-aud|It explains who Ellington was and says nothing unusual about the work.",null,"r-aud|It identifies Ellington for readers who already know him and does not mention the work."]],
["r051","r","r-aim",2,{"n":["In 1961, the psychologist Albert Bandura studied aggression in young children.","He aimed to discover whether children imitate aggressive behavior that they see in adults.","Some children watched an adult strike an inflatable doll; others watched an adult play quietly.","Children who had watched the aggressive adult were more likely to strike the doll themselves."],"g":"The student wants to present the aim of Bandura’s study."},["Bandura aimed to discover whether children imitate aggressive behavior that they have seen in adults.","Bandura had some children watch an adult strike an inflatable doll and others watch an adult play quietly.","Bandura’s 1961 study of aggression involved young children, adults, and an inflatable doll.","Bandura reported that children who had watched an aggressive adult were more likely to strike the doll themselves."],0,"“Aimed to discover whether…” states the question the study was designed to answer.",[null,"r-off|It describes the procedure, not the aim.","r-vague|It lists who and what was involved without saying what the study set out to learn.","r-off|It reports the finding, not the aim."]],
["r058","r","r-method",2,{"n":["In the 1910s, the zoologist Karl von Frisch asked whether honeybees can see color.","He trained bees to feed from a dish of sugar water set on a blue card.","He then set out a blue card among cards in many shades of gray, with no food on any of them.","The bees flew to the blue card."],"g":"The student wants to present the procedure von Frisch followed."},["Von Frisch, a zoologist, asked in the 1910s whether honeybees are able to see color.","Von Frisch worked with honeybees, sugar water, and colored cards in experiments conducted in the 1910s.","Von Frisch trained bees to feed at a blue card and then placed a blue card without food among gray cards of many shades.","Von Frisch found that the honeybees he had trained flew to the blue card and not to any of the many gray cards set out around it."],2,"The sentence gives the two steps of the procedure: training with a blue card, then testing among gray cards.",["r-off|It states the question, not the procedure.","r-vague|It lists the materials without saying what was done with them.",null,"r-off|It reports what the bees did, which is the result."]],
["r066","r","r-find",2,{"n":["In 1960, Jane Goodall began observing chimpanzees at Gombe Stream in what is now Tanzania.","At the time, scientists believed that only humans made tools.","Goodall watched a chimpanzee strip the leaves from a twig.","The chimpanzee then pushed the twig into a termite mound and ate the insects that clung to it."],"g":"The student wants to present Goodall’s discovery."},["When Goodall began her work, scientists believed that the making of tools was limited to human beings.","Goodall began observing the chimpanzees of Gombe Stream, in what is now Tanzania, in the year 1960.","Goodall spent her time at Gombe Stream watching chimpanzees, including one that she saw near a termite mound.","Goodall saw a chimpanzee strip a twig of its leaves and use it to draw termites from a mound, evidence that humans are not the only toolmakers."],3,"The discovery is what Goodall saw and what it showed: a chimpanzee making and using a tool.",["r-off|It gives the belief that her discovery overturned, not the discovery.","r-vague|It says when and where she worked, not what she discovered.","r-vague|It mentions the chimpanzee and the mound but not what the animal did.",null]],
["r076","r","r-spec",2,{"n":["Angel Falls is a waterfall in Venezuela.","It drops 979 meters, making it the tallest uninterrupted waterfall in the world.","It is named after Jimmie Angel, an American aviator who flew over it in 1933.","Its local name is Kerepakupai Merú."],"g":"The student wants to emphasize the height of Angel Falls."},["Angel Falls, a waterfall located in Venezuela, is known to local people by the name Kerepakupai Merú.","Jimmie Angel, the American aviator for whom Angel Falls is named, flew over the waterfall in 1933.","Angel Falls in Venezuela is named after Jimmie Angel, an American aviator who flew over it in 1933.","At 979 meters, Angel Falls in Venezuela is the tallest uninterrupted waterfall in the world."],3,"The goal names height. The sentence gives the figure, 979 meters, and the waterfall’s rank.",["r-vague|It gives the local name, not the height.","r-vague|It is about the aviator, not the height of the falls.","r-vague|It explains the name, not the height.",null]],
["r089","r","r-gen",2,{"n":["In mutualism, two species live together in a way that benefits both.","Clownfish live among the stinging tentacles of sea anemones.","The anemone protects the clownfish from predators.","The clownfish drives away fish that eat anemones."],"g":"The student wants to provide an example of mutualism."},["Mutualism is a relationship in which two species live together in a way that benefits both of them.","A sea anemone’s stinging tentacles protect the clownfish that live among them from predators.","Clownfish and sea anemones illustrate mutualism: the anemone shelters the fish from predators, and the fish drives away animals that eat the anemone.","Clownfish are able to live among the tentacles of sea anemones, even though those tentacles sting."],2,"An example of mutualism must show a benefit to each partner. The sentence names both benefits.",["r-off|It defines mutualism but gives no example.","r-part|It shows the benefit to the clownfish only, so the relationship is not shown to be mutual.",null,"r-part|It describes the pair without showing how either benefits."]],
["r099","r","r-adv",2,{"n":["An electric resistance heater turns one unit of electricity into one unit of heat.","A heat pump uses electricity to move heat from outdoor air into a building.","A typical heat pump delivers three to four units of heat for each unit of electricity.","Heat pumps can also run in reverse to cool a building."],"g":"The student wants to explain an advantage of heat pumps over electric resistance heaters."},["A heat pump moves heat from outdoor air into a building, while a resistance heater turns electricity directly into heat.","A heat pump delivers three to four units of heat per unit of electricity, while a resistance heater delivers only one.","A typical heat pump uses electricity, just as an electric resistance heater does, in order to warm the inside of a building.","An electric resistance heater turns each unit of electricity that it uses into one unit of heat."],1,"The sentence compares output per unit of electricity and shows that the heat pump delivers three to four times as much.",["r-off|It contrasts how the two devices work, not how well they perform.",null,"r-opp|It states what the two devices have in common.","r-part|It describes the resistance heater only."]],
["r010","r","r-sim",2,{"n":["Venice, Italy, was built on islands in a shallow lagoon.","Its buildings rest on wooden piles driven into the mud.","Amsterdam, in the Netherlands, was built on marshy ground.","Its older buildings rest on wooden piles driven down to a layer of firm sand.","Venice has about 150 canals; Amsterdam has about 165."],"g":"The student wants to emphasize a similarity in how the two cities were constructed."},["In Amsterdam, wooden piles had to be driven down to a layer of firm sand in order to support the older buildings.","Venice and Amsterdam are both known for their canals, with about 150 in the former and about 165 in the latter.","Venice was built on islands in a shallow lagoon, whereas Amsterdam was built on marshy ground in the Netherlands.","Like the buildings of Venice, Amsterdam’s older buildings stand on wooden piles driven into wet ground."],3,"The goal concerns construction. “Like the buildings of Venice” links the cities, and the sentence states the shared method: wooden piles.",["r-part|Only Amsterdam is described.","r-off|It gives a similarity (canals), but not one about how the cities were constructed.","r-opp|“Whereas” contrasts the sites of the two cities.",null]],
