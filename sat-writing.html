["r021","r","r-diff",2,{"n":["Hurricanes form over warm ocean water.","A hurricane can be hundreds of kilometers wide and last for more than a week.","Tornadoes form over land, usually from severe thunderstorms.","A tornado is rarely more than a kilometer or two wide and usually lasts only minutes.","Both storms have rotating winds."],"g":"The student wants to emphasize a difference in the scale of the two kinds of storm."},["A tornado, which usually forms from a severe thunderstorm, lasts only minutes and is rarely more than a kilometer or two wide.","Hurricanes form over warm ocean water, but tornadoes form over land, usually from severe thunderstorms.","Hurricanes and tornadoes are both storms with rotating winds, although they form in different places.","A hurricane can span hundreds of kilometers and last over a week, but a tornado is rarely wider than a kilometer or two and usually lasts minutes."],3,"The goal is a difference in scale. The sentence contrasts the width and duration of the two storms.",["r-part|Only the scale of a tornado is given.","r-off|It contrasts where the storms form, not how large or long-lasting they are.","r-opp|The main clause states what the storms have in common.",null]],
["r035","r","r-intro",2,{"n":["Florence Price (1887–1953) was an American composer.","Her Symphony No. 1 in E minor won a national competition in 1932.","The Chicago Symphony Orchestra performed it in 1933.","It was the first symphony by a Black woman to be played by a major American orchestra."],"g":"The student wants to introduce the symphony to an audience unfamiliar with it."},["Symphony No. 1 in E minor, by the American composer Florence Price, became in 1933 the first symphony by a Black woman to be played by a major American orchestra.","Florence Price, an American composer who was born in 1887, won a national competition in 1932 and died in 1953.","The Chicago Symphony Orchestra’s 1933 performance of Price’s work followed its success in a national competition.","After it won a national competition in 1932, the symphony was performed by the Chicago Symphony Orchestra the following year."],0,"The sentence gives the title, the composer and the reason the symphony matters.",[null,"r-off|It introduces the composer and never mentions the symphony.","r-aud|It refers to “Price’s work” without naming the symphony or identifying Price.","r-aud|It says “the symphony” without giving its title or composer."]],
["r060","r","r-method",2,{"n":["In the 1930s, the biologist Niko Tinbergen studied how digger wasps find their nests.","He placed a ring of pine cones around the entrance to a wasp’s burrow.","After the wasp flew off, he moved the ring a short distance away.","The returning wasp landed in the middle of the ring, not at the burrow."],"g":"The student wants to present the method Tinbergen used."},["Tinbergen, a biologist, wanted to understand how digger wasps manage to find their nests.","Tinbergen placed a ring of pine cones around a wasp’s burrow and, once the wasp had flown off, moved the ring a short distance away.","Tinbergen’s research in the 1930s concerned digger wasps, their burrows, and rings of pine cones.","Tinbergen saw that the returning wasp landed in the middle of the ring of pine cones, not at its burrow."],1,"The sentence describes what Tinbergen did: placing the ring and then moving it.",["r-off|It states the question, not the method.",null,"r-vague|It lists what the research involved without saying what was done.","r-off|It reports what the wasp did, which is the result."]],
["r068","r","r-find",2,{"n":["Einstein’s general theory of relativity predicts that the Sun’s gravity bends the light of stars.","During a total solar eclipse in 1919, Arthur Eddington photographed stars near the edge of the Sun.","He compared their positions with photographs taken at night months earlier.","The stars appeared shifted by about the amount Einstein had predicted."],"g":"The student wants to present the result of Eddington’s observations."},["According to Einstein’s general theory of relativity, the gravity of the Sun should bend the light coming from stars.","Eddington photographed stars near the edge of the Sun during the eclipse and compared them with earlier night photographs.","Eddington found that stars near the Sun’s edge appeared shifted by about the amount Einstein’s theory had predicted.","Eddington used the total solar eclipse of 1919 to photograph stars that lay near the edge of the Sun."],2,"The result is what the photographs showed: a shift matching Einstein’s prediction.",["r-off|It states the prediction being tested, not the result.","r-off|It describes what Eddington did, not what he found.",null,"r-off|It describes part of the method, not the result."]],
["r077","r","r-spec",2,{"n":["El Anatsui is a sculptor born in Ghana in 1944.","He has worked in Nigeria for most of his career.","His large wall sculptures are assembled from thousands of aluminum bottle caps.","The caps are flattened and joined with copper wire.","The finished sculptures drape like cloth."],"g":"The student wants to specify the materials that El Anatsui uses in his wall sculptures."},["El Anatsui makes his wall sculptures from flattened aluminum bottle caps joined with copper wire.","El Anatsui is a sculptor whose large wall sculptures are assembled from thousands of small pieces.","El Anatsui’s wall sculptures, which are very large, drape in folds in the same way that cloth does.","El Anatsui, a sculptor who was born in Ghana in 1944, has worked in Nigeria for most of his career."],0,"The goal asks for materials. The sentence names them: aluminum bottle caps and copper wire.",[null,"r-vague|“Small pieces” does not say what the materials are.","r-vague|It describes how the sculptures look, not what they are made of.","r-vague|It gives biography, not materials."]],
["r090","r","r-gen",2,{"n":["In hot, dry regions such as Yemen, traditional houses have thick mud-brick walls that keep interiors cool.","In rainy regions such as Sumatra, traditional houses have steep roofs that shed water quickly.","In the Arctic, traditional snow houses trap body heat."],"g":"The student wants to make a generalization about traditional houses."},["The steep roofs of traditional houses in Sumatra shed rain quickly, while snow houses in the Arctic trap heat.","Traditional houses in Yemen have thick walls of mud brick, which keep their interiors cool.","Traditional houses around the world are designed in ways that suit the climates in which they are built.","In the Arctic, traditional houses built of snow are able to trap the body heat of the people inside."],2,"The sentence states the general pattern that all three notes illustrate: design matched to climate.",["r-off|It sets two cases side by side without stating the general pattern.","r-off|It describes houses in one region only.",null,"r-off|It describes houses in one region only."]],
["r012","r","r-sim",2,{"n":["Adobe bricks are made from clay, sand, water, and straw and dried in the sun.","Rammed-earth walls are made by compacting damp soil between temporary wooden forms.","Thick walls of either material absorb heat during the day and release it slowly at night.","Adobe has been used for thousands of years in the Middle East and the Americas.","Rammed earth was used for parts of the Great Wall of China."],"g":"The student wants to emphasize a similarity between the two building materials."},["Rammed-earth walls, made by compacting damp soil between wooden forms, were used in parts of the Great Wall of China.","Adobe is formed into bricks and dried in the sun, whereas rammed earth is compacted in place between wooden forms.","Adobe has long been used in the Middle East and the Americas, while rammed earth was used for parts of the Great Wall of China.","Whether made of adobe or of rammed earth, thick walls absorb heat during the day and release it slowly at night."],3,"“Whether made of adobe or of rammed earth” covers both materials, and the sentence states the property they share.",["r-part|Only rammed earth is described.","r-opp|“Whereas” contrasts how the two materials are made.","r-opp|“While” sets the places where each material was used against each other.",null]],
["r023","r","r-diff",2,{"n":["Mandarin and Cantonese are both Chinese languages written with Chinese characters.","In both, the pitch pattern, or tone, of a syllable can change its meaning.","Mandarin has four main tones.","Cantonese has six tones.","Mandarin is the more widely spoken of the two."],"g":"The student wants to emphasize a difference between the two languages."},["In both Mandarin and Cantonese, the tone of a syllable can change the meaning of that syllable.","Cantonese, a Chinese language in which the tone of a syllable can change that syllable’s meaning, has a total of six tones.","Mandarin and Cantonese are both written with Chinese characters, and both make use of tones.","Although both languages use tone to distinguish meaning, Mandarin has four main tones, while Cantonese has six."],3,"The main clause contrasts the number of tones in each language. The “although” clause only sets a shared feature aside.",["r-opp|“In both” introduces what the languages have in common.","r-part|Only Cantonese is described.","r-opp|The sentence lists two things the languages share.",null]],
["r037","r","r-intro",2,{"n":["Hōkūle‘a is a double-hulled voyaging canoe launched in Hawaii in 1975.","It was built to resemble the canoes of early Polynesian voyagers.","In 1976 it sailed from Hawaii to Tahiti without navigational instruments.","Its navigator on that voyage was Mau Piailug of Micronesia."],"g":"The student wants to introduce Hōkūle‘a to an audience unfamiliar with the canoe."},["Hōkūle‘a, a double-hulled canoe modeled on those of early Polynesian voyagers, was launched in Hawaii in 1975 and sailed to Tahiti the next year without instruments.","On the 1976 voyage of Hōkūle‘a from Hawaii to Tahiti, Mau Piailug of Micronesia navigated without instruments.","Hōkūle‘a reached Tahiti in 1976, a year after its launch, with Mau Piailug of Micronesia serving as its navigator.","Mau Piailug, a navigator from Micronesia, guided a voyage from Hawaii to Tahiti in 1976 without using instruments."],0,"The sentence says what Hōkūle‘a is, what it was modeled on, and what it did.",[null,"r-aud|It does not say what Hōkūle‘a is.","r-aud|It does not say what kind of vessel Hōkūle‘a is or why it was built.","r-off|It introduces the navigator, and the canoe is never named."]],
["r070","r","r-find",2,{"n":["In 1928, the bacteriologist Alexander Fleming returned from a holiday to his London laboratory.","He examined dishes of bacteria that he had left on a bench.","One dish had been contaminated by a mold.","Around the mold was a clear ring in which no bacteria were growing."],"g":"The student wants to present what Fleming observed."},["Fleming, a bacteriologist, returned to his laboratory in London from a holiday in 1928.","Fleming noticed that one dish had been contaminated by a mold and that no bacteria were growing in a clear ring around it.","Fleming had left several dishes of bacteria on a bench in his laboratory while he was away.","Fleming examined the dishes of bacteria that had been sitting on a bench in his London laboratory during the holiday he took in 1928."],1,"The observation is the mold and the bacteria-free ring around it.",["r-vague|It sets the scene without reporting any observation.",null,"r-off|It gives the circumstances, not what he observed.","r-part|It says that he examined the dishes but not what he saw in them."]],
["r079","r","r-spec",2,{"n":["Hangul is the alphabet used to write Korean.","It was created under King Sejong.","It was completed in 1443 and made public in 1446.","It has 14 basic consonants and 10 basic vowels.","Before Hangul, Korean was written with Chinese characters."],"g":"The student wants to indicate when Hangul was created."},["Hangul, the Korean alphabet, was completed in 1443 and made public in 1446.","Before Hangul was created under King Sejong, Korean was written with Chinese characters.","Hangul, the alphabet used to write Korean, was created under the direction of King Sejong.","Hangul, which was created under King Sejong, has 14 basic consonants and 10 basic vowels."],0,"“When” asks for a date. The sentence gives the year of completion and the year of publication.",[null,"r-vague|“Before Hangul was created” refers to time but gives no date.","r-vague|It says under whom Hangul was created, not when.","r-vague|It describes the alphabet’s letters, not its date."]],
["r092","r","r-gen",2,{"n":["Hummingbirds have long, thin beaks for reaching nectar inside flowers.","Hawks have hooked beaks for tearing meat.","Finches have short, thick beaks for cracking seeds.","Pelicans have pouched beaks for scooping fish."],"g":"The student wants to make a generalization about the beaks of birds."},["A hawk tears meat with its hooked beak, whereas a finch cracks seeds with its short, thick one.","The shape of a bird’s beak is suited to the kind of food that the bird eats.","Hummingbirds have long, thin beaks, which they use to reach the nectar inside flowers.","Pelicans, which eat fish, have beaks with pouches that allow them to scoop up their prey."],1,"The sentence states the general rule that all four notes illustrate: beak shape matches diet.",["r-opp|It contrasts two birds when a general statement was asked for.",null,"r-off|It describes one kind of bird.","r-off|It describes one kind of bird."]],
["r025","r","r-diff",2,{"n":["The Sydney Harbour Bridge opened in Australia in 1932.","It is a steel arch bridge: the deck hangs from a single great arch.","The Golden Gate Bridge opened in California in 1937.","It is a suspension bridge: the deck hangs from cables strung between two towers.","Both bridges are made of steel and carry road traffic."],"g":"The student wants to emphasize a difference in the design of the two bridges."},["The Sydney Harbour Bridge opened in 1932, five years before the Golden Gate Bridge opened in California.","The Golden Gate Bridge, which opened in California in 1937, is a suspension bridge with two towers.","The Sydney Harbour Bridge and the Golden Gate Bridge are both steel structures that carry road traffic.","The deck of the Sydney Harbour Bridge hangs from a steel arch, while that of the Golden Gate Bridge hangs from cables strung between two towers."],3,"The goal is a difference in design. The sentence contrasts an arch with cables strung between towers.",["r-off|It contrasts the opening dates, not the designs.","r-part|Only the Golden Gate Bridge is described.","r-opp|“Both” introduces what the bridges have in common.",null]],
["r081","r","r-spec",2,{"n":["Lake Baikal is in southern Siberia.","It is about 25 million years old, making it the oldest lake in the world.","Its maximum depth is 1,642 meters, greater than that of any other lake.","It holds about one-fifth of the world’s unfrozen fresh surface water."],"g":"The student wants to emphasize the depth of Lake Baikal."},["Lake Baikal in southern Siberia holds about one-fifth of the world’s unfrozen fresh surface water.","At 1,642 meters at its deepest point, Lake Baikal is deeper than any other lake.","Lake Baikal, the world’s oldest lake, holds about one-fifth of all unfrozen fresh surface water.","At about 25 million years old, Lake Baikal in southern Siberia is the oldest lake in the world."],1,"The goal names depth. The sentence gives the maximum depth and says no other lake is deeper.",["r-vague|It emphasizes the volume of water, not the depth.",null,"r-vague|It gives age and volume, not depth.","r-vague|It emphasizes the lake’s age, not its depth."]],
["r007","r","r-sim",3,{"n":["Māori is a Polynesian language spoken in New Zealand.","Hawaiian is a Polynesian language spoken in Hawaii.","The number of fluent speakers of each language fell sharply during the twentieth century.","Māori immersion preschools called kōhanga reo opened in 1982.","Hawaiian immersion preschools called Pūnana Leo opened in 1984."],"g":"The student wants to emphasize a similarity in how the two languages have been revived."},["Supporters of both Māori and Hawaiian responded to falling numbers of speakers by opening immersion preschools.","Māori and Hawaiian are both Polynesian languages, the first spoken in New Zealand and the second in the islands of Hawaii.","Māori immersion preschools opened in New Zealand in 1982, two years before Hawaiian immersion preschools opened in Hawaii.","Hawaiian, a Polynesian language that lost most of its fluent speakers, has been taught in Pūnana Leo preschools since 1984."],0,"The goal concerns revival. The sentence names the method used for both languages: immersion preschools opened in the 1980s.",[null,"r-off|It states a similarity between the languages themselves, not between the ways they have been revived.","r-opp|The sentence stresses which preschools opened first, a difference.","r-part|Only Hawaiian is discussed."]],
["r020","r","r-diff",3,{"n":["Radiocarbon dating estimates the age of organic material from the decay of carbon-14.","It can be used on samples up to about 50,000 years old.","Its results are given as a range of years.","Tree-ring dating matches the pattern of rings in a piece of wood to a master sequence.","It can identify the exact year in which a ring formed."],"g":"The student wants to emphasize a difference in the precision of the two dating methods."},["Radiocarbon dating can be applied to any organic material, whereas tree-ring dating can be used only on pieces of wood.","Radiocarbon dating and tree-ring dating are both used to determine the age of material from the past.","Radiocarbon dating yields a range of years, whereas tree-ring dating can identify the exact year in which a ring formed.","Radiocarbon dating, which relies on the decay of carbon-14, can be used on organic samples up to about 50,000 years old."],2,"The goal is a difference in precision. The sentence contrasts a range of years with an exact year.",["r-off|It contrasts the materials the methods can be used on, not their precision.","r-opp|“Both” introduces what the methods have in common.",null,"r-part|Only radiocarbon dating is described, and its precision is not mentioned."]],
["r032","r","r-intro",3,{"n":["Chien-Shiung Wu (1912–1997) was a Chinese American physicist.","She worked at Columbia University.","In 1956 she designed an experiment using cobalt-60.","The experiment showed that a principle called parity conservation does not always hold.","Two theorists who had proposed the idea received the 1957 Nobel Prize in Physics."],"g":"The student wants to introduce Chien-Shiung Wu and her experiment to an audience unfamiliar with both."},["In 1956, an experiment that used cobalt-60 showed that parity conservation, a principle of physics, does not always hold.","Wu’s experiment with cobalt-60 confirmed an idea for which two theorists went on to receive the 1957 Nobel Prize in Physics.","Chien-Shiung Wu, who was born in 1912 and died in 1997, was a Chinese American physicist who worked at Columbia University.","Chien-Shiung Wu, a Chinese American physicist at Columbia University, designed a 1956 experiment showing that the principle of parity conservation does not always hold."],3,"The goal has two parts. The sentence identifies Wu (a Chinese American physicist at Columbia) and says what her experiment showed.",["r-part|It describes the experiment but never mentions Wu.","r-aud|It does not say who Wu was or what the experiment showed.","r-part|It introduces Wu but says nothing about her experiment.",null]],
["r041","r","r-fam",3,{"n":["Machu Picchu is an Inca site in the Andes of Peru.","It was long thought to have been built after 1440.","A 2021 study used radiocarbon dating on remains from the site.","The study concluded that the site was occupied by about 1420."],"g":"The student wants to present a recent finding about Machu Picchu to an audience already familiar with the site."},["A study published in 2021 applied radiocarbon dating, a technique for estimating the age of remains, to material from an Inca site in the Andes of Peru.","Radiocarbon dating of remains from Machu Picchu indicates that the site was occupied by about 1420, two decades earlier than long thought.","Machu Picchu is an Inca site in the Andes of Peru that researchers examined in a study published in 2021.","Machu Picchu, an Inca site located high in the Andes of Peru, was long thought to have been built after 1440."],1,"The sentence delivers the finding (occupied by about 1420, earlier than thought) without re-introducing the site.",["r-vague|It describes the method but not the finding.",null,"r-aud|It re-introduces the site and does not say what the study found.","r-aud|It identifies the site for readers who already know it and gives the old view, not the new finding."]],
["r048","r","r-aim",3,{"n":["In the 1950s, the psychologist Harry Harlow studied infant rhesus monkeys.","He sought to determine whether infants bond with a caregiver because it provides food or because it provides comfort.","Each infant was given two artificial ‘mothers’: one of bare wire with a milk bottle and one covered in soft cloth without a bottle.","The infants spent most of their time clinging to the cloth mother."],"g":"The student wants to present the aim of Harlow’s research."},["Harlow, a psychologist, conducted his experiments with infant rhesus monkeys and artificial ‘mothers’ in the 1950s.","Harlow gave each infant monkey a bare wire ‘mother’ that held a milk bottle and a cloth-covered ‘mother’ that did not.","Harlow observed that the infant monkeys spent most of their time clinging to the ‘mother’ covered in soft cloth.","Harlow sought to determine whether infants bond with a caregiver because of food or because of comfort."],3,"“Sought to determine whether…” states the question behind the research.",["r-vague|It identifies the research without saying what it was meant to determine.","r-off|It describes the experimental setup, not the aim.","r-off|It reports what was observed, not the aim.",null]],
["r056","r","r-method",3,{"n":["In 1887, Albert Michelson and Edward Morley tested whether Earth moves through a substance called the ether.","They split a beam of light into two beams traveling at right angles and then recombined them.","They looked for a shift in the resulting pattern as they rotated the apparatus.","They detected no significant shift."],"g":"The student wants to present the method of the experiment."},["Michelson and Morley split a beam of light into two beams at right angles, recombined them, and looked for a shift in the pattern as they rotated the apparatus.","Michelson and Morley detected no significant shift in the pattern of light, whichever way their apparatus was turned.","Michelson and Morley wanted to know whether Earth moves through a substance that physicists called the ether.","Michelson and Morley’s experiment, which they carried out in 1887, concerned light and a substance called the ether."],0,"The sentence lists the steps of the experiment: splitting, recombining, rotating and watching for a shift.",[null,"r-off|It reports the result, not the method.","r-off|It states the question, not the method.","r-vague|It names the topic of the experiment without describing what was done."]],
["r064","r","r-find",3,{"n":["In 1968, Robert Rosenthal and Lenore Jacobson published a study of teachers’ expectations.","They told teachers that certain pupils were about to make rapid progress.","In fact, those pupils had been chosen at random.","By the end of the year, the chosen pupils in the youngest classes had gained more on a test of reasoning than their classmates."],"g":"The student wants to present the findings of the study."},["Rosenthal and Jacobson published their study of how the expectations of teachers affect pupils in 1968.","Rosenthal and Jacobson told teachers that certain pupils, who had in fact been chosen at random, were about to make rapid progress.","Rosenthal and Jacobson found that, in the youngest classes, pupils whom teachers expected to progress gained more on a reasoning test than their classmates.","Rosenthal and Jacobson chose pupils at random, a fact that they did not share with the pupils’ teachers."],2,"The finding is the outcome at the end of the year: the chosen pupils gained more.",["r-vague|It identifies the study without reporting its findings.","r-off|It describes what the researchers did, not what they found.",null,"r-off|It describes part of the procedure, not a finding."]],
["r075","r","r-spec",3,{"n":["Construction of Cologne Cathedral in Germany began in 1248.","Work stopped in the 1500s with the building unfinished.","Construction resumed in 1842, following the original medieval plans.","The cathedral was completed in 1880.","Its two spires are 157 meters tall."],"g":"The student wants to emphasize how long the cathedral took to complete."},["Begun in 1248 and completed only in 1880, Cologne Cathedral took over six centuries to build.","Work on Cologne Cathedral in Germany stopped in the 1500s, when the building was still unfinished.","When work on Cologne Cathedral resumed in 1842, the builders followed the original medieval plans.","Cologne Cathedral, which was completed in 1880, has two spires that rise to a height of 157 meters."],0,"The goal names duration. The sentence gives the start and end dates and the total: more than six centuries.",[null,"r-vague|It mentions an interruption but gives no start date, end date or total.","r-vague|It describes one stage of the work, not the total time.","r-vague|It gives the completion date and the height, but not the length of time."]],
["r086","r","r-gen",3,{"n":["Some inventions were discovered by accident.","In 1945, Percy Spencer was working on radar equipment that used a magnetron.","He noticed that a candy bar in his pocket had melted.","His employer, Raytheon, sold the first microwave oven in 1947."],"g":"The student wants to support the claim that some inventions result from accidents with an example."},["Some inventions begin with accidents: the microwave oven grew out of Percy Spencer’s noticing that radar equipment had melted a candy bar in his pocket.","Percy Spencer was working on radar equipment that used a magnetron in 1945, two years before the first microwave oven was sold.","Raytheon, the company that employed Percy Spencer, sold the first microwave oven in the year 1947.","Not every invention was planned from the start; some inventions were discovered entirely by accident."],0,"The goal has two parts, a claim and an example. The sentence states the claim and then gives the microwave oven as the supporting case.",[null,"r-part|It gives facts about Spencer but never states the claim or mentions the accident.","r-off|It reports a sale, with neither the claim nor the accident.","r-part|It states the claim but offers no example."]],
["r096","r","r-adv",3,{"n":["Coelacanths are fish known from fossils more than 66 million years old.","Scientists believed they had gone extinct with the dinosaurs.","In 1938, a living coelacanth was caught off the coast of South Africa.","Museum curator Marjorie Courtenay-Latimer recognized that the fish was unusual."],"g":"The student wants to emphasize why the 1938 catch was significant."},["The coelacanth caught off South Africa in 1938 was recognized as unusual by Marjorie Courtenay-Latimer, a museum curator.","The 1938 catch showed that coelacanths, thought to have died out with the dinosaurs, were in fact still alive.","Coelacanths are fish that are known to scientists from fossils more than 66 million years old.","In 1938, a coelacanth was caught off the coast of South Africa and was examined there by a curator from a museum."],1,"Significance is why the event mattered: a fish believed extinct for millions of years turned out to be alive.",["r-off|It says who noticed the fish, not why the catch mattered.",null,"r-part|It gives the background on fossils but does not mention the catch.","r-vague|It reports the catch without saying why it was significant."]],
["r008","r","r-sim",3,{"n":["Mary Anning (1799–1847) collected fossils on the southern coast of England.","She found the first complete plesiosaur skeleton in 1823.","As a woman, she could not join the Geological Society of London.","Marie Tharp (1920–2006) mapped the floor of the Atlantic Ocean.","As a woman, she was not allowed aboard research ships until 1968."],"g":"The student wants to emphasize a similarity between the obstacles the two scientists faced."},["Anning and Tharp both made major contributions to the earth sciences, one by collecting fossils and the other by mapping the seafloor.","Because she was a woman, Tharp was not allowed aboard research ships until 1968, long after she had begun mapping the Atlantic.","Anning was barred from the Geological Society of London and Tharp from research ships, each excluded from part of scientific life because she was a woman.","Anning worked on the southern coast of England in the early 1800s, whereas Tharp mapped the Atlantic seafloor more than a century later."],2,"The goal is a similarity between obstacles. The sentence gives each woman’s obstacle and names what they share: exclusion because of gender.",["r-off|It states a similarity between their contributions, not between the obstacles they faced.","r-part|Only Tharp’s obstacle is described.",null,"r-opp|“Whereas” contrasts where and when the two worked."]],
["r022","r","r-diff",3,{"n":["Mary Shelley’s novel Frankenstein was first published in 1818.","The 1818 edition appeared in three volumes without the author’s name.","A revised edition was published in 1831.","The 1831 edition appeared in one volume under Shelley’s name.","For the 1831 edition, Shelley wrote an introduction explaining how she came to write the story."],"g":"The student wants to emphasize a difference between the two editions."},["Frankenstein, a novel by Mary Shelley, was first published in 1818 and then issued in a revised edition in 1831.","For the 1831 edition of Frankenstein, Mary Shelley wrote an introduction explaining how she came to write the story.","The 1818 edition of Frankenstein was published in three volumes and did not carry the name of its author.","The 1818 edition of Frankenstein was published anonymously, whereas the 1831 edition carried Mary Shelley’s name."],3,"The sentence compares the editions on one point, whether the author was named, and marks the contrast with “whereas”.",["r-off|It reports that two editions exist but does not say how they differ.","r-part|Only the 1831 edition is described.","r-part|Only the 1818 edition is described.",null]],
["r036","r","r-intro",3,{"n":["Rachel Carson was an American marine biologist and writer.","Her book Silent Spring was published in 1962.","It documents the harm that pesticides such as DDT cause to wildlife.","The United States banned most uses of DDT in 1972."],"g":"The student wants to introduce Silent Spring to an audience unfamiliar with the book."},["Carson’s account of what DDT does to wildlife was followed in 1972 by a ban on most uses of the pesticide.","Silent Spring, a 1962 book by the American marine biologist Rachel Carson, documents the harm that pesticides such as DDT cause to wildlife.","Rachel Carson, an American marine biologist and writer, published a book in 1962 about the harm that pesticides such as DDT cause to wildlife.","Ten years after Silent Spring was published, the United States banned most uses of the pesticide DDT."],1,"The sentence names the book, its author and date, and says what it is about.",["r-aud|It never names the book and assumes the reader knows who Carson is.",null,"r-vague|It describes the author and the subject but never gives the title of the book.","r-aud|It does not say who wrote Silent Spring or what the book contains."]],
["r043","r","r-fam",3,{"n":["Plate tectonics is the theory that Earth’s outer shell is divided into moving plates.","In the 1950s, Marie Tharp mapped the floor of the Atlantic Ocean from sonar data.","Her maps showed a rift valley running along the Mid-Atlantic Ridge.","The rift suggested that the seafloor was spreading apart there."],"g":"The student wants to explain the significance of Tharp’s maps to an audience already familiar with plate tectonics."},["In the 1950s, Marie Tharp used sonar data to draw maps of the floor of the Atlantic Ocean.","Plate tectonics, the theory that Earth’s outer shell is divided into moving plates, drew support from maps of the seafloor.","Marie Tharp’s maps of the Atlantic are relevant to plate tectonics, the theory that Earth’s outer shell consists of moving plates.","Tharp’s maps revealed a rift valley along the Mid-Atlantic Ridge, evidence that the seafloor was spreading apart there."],3,"The sentence states why the maps mattered: they showed a rift that pointed to seafloor spreading. It does not stop to define plate tectonics.",["r-off|It says how the maps were made, not why they were significant.","r-aud|It defines plate tectonics for an audience that knows it and does not say what the maps showed.","r-aud|It defines the theory again and calls the maps “relevant” without saying why.",null]],
["r050","r","r-aim",3,{"n":["In the 1950s, the biologist Bernard Kettlewell studied peppered moths in England.","He wished to test whether birds eat more of the moths that stand out against tree bark.","He released marked light and dark moths in a polluted wood and in an unpolluted wood, then recaptured the survivors.","In the polluted wood, where bark was darkened by soot, more dark moths survived; in the unpolluted wood, more light moths did."],"g":"The student wants to present the aim of Kettlewell’s study."},["Kettlewell wished to test whether birds eat more of the peppered moths that stand out against the bark of trees.","Kettlewell released marked light and dark moths in two woods, one polluted and one not, and later recaptured the survivors.","Kettlewell’s study, conducted in England in the 1950s, concerned light and dark forms of the peppered moth.","More dark moths survived in the polluted wood, Kettlewell found, while more light moths survived in the unpolluted one."],0,"“Wished to test whether…” states the hypothesis the study was designed to examine.",[null,"r-off|It describes the method, not the aim.","r-vague|It identifies the study without saying what it tested.","r-off|It reports the results, not the aim."]],
["r059","r","r-method",3,{"n":["Around 240 BCE, the Greek scholar Eratosthenes estimated the circumference of Earth.","He knew that at noon on the summer solstice the Sun stood directly overhead at Syene.","At the same moment in Alexandria, he measured the angle of a shadow cast by a vertical rod.","He combined that angle with the distance between the two cities.","His estimate was close to the modern value."],"g":"The student wants to explain how Eratosthenes made his estimate."},["Eratosthenes arrived at an estimate of Earth’s circumference that was close to the value accepted today.","Eratosthenes measured the angle of a noon shadow in Alexandria when the Sun was directly overhead at Syene and combined it with the distance between the cities.","Eratosthenes, a Greek scholar, set out around 240 BCE to estimate the circumference of Earth.","Eratosthenes knew that the Sun stood directly overhead at Syene at noon on the summer solstice."],1,"“How” asks for the method: measuring a shadow’s angle and combining it with a known distance.",["r-off|It reports how good the estimate was, not how it was made.",null,"r-off|It states what he set out to do, not how he did it.","r-part|It gives one fact he started from but none of the steps he took."]],
["r067","r","r-find",3,{"n":["In 1952, Stanley Miller and Harold Urey simulated conditions thought to exist on the early Earth.","They sealed water, methane, ammonia, and hydrogen in glass flasks.","They passed electric sparks through the mixture for a week.","Afterward, the water contained several amino acids, the building blocks of proteins."],"g":"The student wants to present the outcome of the experiment."},["Miller and Urey ran their experiment for a week, using sealed glass flasks and a source of electric sparks.","After a week of electric sparks, the water in Miller and Urey’s flasks contained several amino acids, the building blocks of proteins.","Miller and Urey set out in 1952 to simulate the conditions thought to have existed on the early Earth.","Miller and Urey sealed water, methane, ammonia, and hydrogen in glass flasks and passed electric sparks through the mixture for a week."],1,"The outcome is what the flasks contained at the end: amino acids.",["r-off|It gives details of the procedure, not the outcome.",null,"r-off|It states the purpose, not the outcome.","r-off|It describes the procedure, not the outcome."]],
["r078","r","r-spec",3,{"n":["The peregrine falcon is found on every continent except Antarctica.","It hunts other birds in flight.","In a hunting dive, it can exceed 300 kilometers per hour.","It strikes its prey with clenched feet."],"g":"The student wants to emphasize the speed of the peregrine falcon."},["The peregrine falcon dives on other birds in flight and strikes them with its clenched feet.","The peregrine falcon hunts other birds in flight, striking them hard with its clenched feet.","The peregrine falcon can be found on every continent in the world except Antarctica.","In a hunting dive, the peregrine falcon can exceed 300 kilometers per hour."],3,"The goal names speed. The sentence gives the figure: more than 300 kilometers per hour.",["r-vague|It mentions the dive but gives no speed.","r-vague|It describes how the falcon strikes, not how fast it flies.","r-vague|It gives the falcon’s range, not its speed.",null]],
["r088","r","r-gen",3,{"n":["The Colosseum in Rome was built of concrete nearly 2,000 years ago.","The Pantheon’s concrete dome was completed around 126 CE and is still intact.","Roman harbor structures made of concrete have survived two millennia in seawater.","Roman concrete was made with volcanic ash and lime."],"g":"The student wants to make a generalization about Roman concrete."},["Roman harbor structures made of concrete have survived in seawater for two millennia.","The Colosseum in Rome was built nearly 2,000 years ago, and concrete was used in its construction.","The Pantheon’s dome, completed around 126 CE, is made of concrete and is still intact today.","Roman concrete has proved durable enough to last some two thousand years."],3,"The sentence makes a statement about Roman concrete in general: it is very durable.",["r-off|It describes one kind of structure, not Roman concrete in general.","r-off|It describes one building, the Colosseum.","r-off|It describes one building, the Pantheon.",null]],
["r098","r","r-adv",3,{"n":["In 1799, no one could read Egyptian hieroglyphs.","The Rosetta Stone carries one decree in hieroglyphic, Demotic, and ancient Greek.","Scholars could read ancient Greek.","By comparing the texts, Champollion worked out the sounds of many hieroglyphs."],"g":"The student wants to explain why the Rosetta Stone made decipherment possible."},["In 1799, the year from which the notes begin, no one was able to read Egyptian hieroglyphs.","Champollion succeeded in working out the sounds of many of the hieroglyphs on the Rosetta Stone.","Because the stone repeats one decree in ancient Greek, which scholars could read, they were able to work out the unknown hieroglyphs by comparison.","The Rosetta Stone carries a single decree in three different scripts: hieroglyphic, Demotic, and ancient Greek."],2,"“Why” asks for the reason: a readable Greek version of the same text gave scholars something to compare the hieroglyphs with.",["r-part|It states the problem, not what made a solution possible.","r-off|It reports that the decipherment happened, not why it was possible.",null,"r-part|It lists the scripts but does not say that one of them could be read, which is the key to the explanation."]],
["r011","r","r-sim",3,{"n":["Emily Dickinson (1830–1886) was an American poet.","Fewer than a dozen of her nearly 1,800 poems were published during her lifetime.","The first collection of her poems appeared in 1890.","Gerard Manley Hopkins (1844–1889) was an English poet.","Almost none of his poems were published until a collection appeared in 1918."],"g":"The student wants to emphasize a similarity between the two poets."},["Dickinson’s first collection appeared four years after her death, whereas Hopkins’s did not appear until nearly thirty years after his.","Dickinson, an American poet, wrote nearly 1,800 poems, fewer than a dozen of which were published during her lifetime.","Dickinson and Hopkins were both nineteenth-century poets whose work became widely available only after their deaths.","Almost none of the poems of Hopkins, an English poet who died in 1889, were published until a collection appeared in 1918."],2,"The sentence states what the poets share: both were published mainly after death.",["r-opp|“Whereas” stresses how long each poet’s collection took to appear, a difference.","r-part|Only Dickinson is described.",null,"r-part|Only Hopkins is described."]],
["r024","r","r-diff",3,{"n":["Mitosis and meiosis are two ways in which cells divide.","Mitosis produces two cells that are genetically identical to the original.","Meiosis produces four cells, each with half the original number of chromosomes.","Mitosis allows organisms to grow and repair tissue.","Meiosis produces the cells used in sexual reproduction."],"g":"The student wants to emphasize a difference in the purposes of the two processes."},["Mitosis allows an organism to grow and repair tissue, whereas meiosis produces the cells used in sexual reproduction.","Mitosis and meiosis are both processes by which a cell divides in order to form new cells.","Meiosis, which produces four cells with half the original number of chromosomes, is what makes sexual reproduction possible.","Mitosis produces two genetically identical cells, whereas meiosis produces four cells with half as many chromosomes each."],0,"The goal is a difference in purpose. The sentence contrasts what each process is for: growth and repair versus reproduction.",[null,"r-opp|“Both” introduces what the processes have in common.","r-part|Only meiosis is described.","r-off|It contrasts the results of the two processes (number and kind of cells), not their purposes."]],
["r038","r","r-intro",3,{"n":["The Stroop effect is named for the psychologist John Ridley Stroop.","He described it in 1935.","People are slower to name the ink color of a word when the word spells a different color.","For example, the word ‘red’ printed in blue ink is named more slowly than a blue square."],"g":"The student wants to introduce the Stroop effect to an audience unfamiliar with it."},["The Stroop effect, described by the psychologist John Ridley Stroop in 1935, is the tendency to name a word’s ink color more slowly when the word spells a different color.","John Ridley Stroop was a psychologist who in 1935 described the effect that has carried his name ever since.","In demonstrations of the Stroop effect, a word such as ‘red’ may be printed in blue ink rather than in red ink.","The word ‘red’ printed in blue ink is named more slowly than a blue square, as the psychologist John Ridley Stroop showed in 1935."],0,"The sentence names the effect and defines it, which is what an unfamiliar audience needs.",[null,"r-vague|It says who described the effect but not what the effect is.","r-vague|It describes the materials used, not what happens to the person naming the colors.","r-off|It gives an example but never names the effect or states the general tendency."]],
["r052","r","r-aim",3,{"n":["In the 1880s, the German psychologist Hermann Ebbinghaus studied his own memory.","He hoped to measure how quickly newly learned material is forgotten.","He memorized lists of meaningless syllables and tested himself after delays ranging from twenty minutes to a month.","He forgot more than half of each list within an hour, after which the rate of forgetting slowed."],"g":"The student wants to present the aim of Ebbinghaus’s research."},["Ebbinghaus forgot more than half of each list within an hour, and after that his forgetting slowed.","Ebbinghaus memorized lists of meaningless syllables and tested himself after delays of twenty minutes to a month.","Ebbinghaus, a German psychologist, used himself as the subject of his memory research in the 1880s.","Ebbinghaus hoped to measure how quickly material that has just been learned is forgotten."],3,"“Hoped to measure how quickly…” states what the research was meant to establish.",["r-off|It reports the result, not the aim.","r-off|It describes the method, not the aim.","r-vague|It identifies the research without saying what it was meant to measure.",null]],
["r069","r","r-find",3,{"n":["In 1932, the psychologist Frederic Bartlett published a study of memory.","He had English participants read a Native American folktale, ‘The War of the Ghosts.’","He asked them to retell it after intervals ranging from minutes to years.","With each retelling, the story grew shorter, and unfamiliar details were replaced with familiar ones."],"g":"The student wants to present the findings of Bartlett’s study."},["Bartlett, a psychologist, published his study of how people remember stories in the year 1932.","Bartlett chose ‘The War of the Ghosts,’ a Native American folktale, as the story his English participants would read.","Bartlett found that each retelling made the story shorter and replaced its unfamiliar details with familiar ones.","Bartlett had English participants read a Native American folktale and retell it after intervals of minutes to years."],2,"The finding is what happened to the story over repeated retellings.",["r-vague|It identifies the study without reporting what it found.","r-off|It describes the material used, not the findings.",null,"r-off|It describes the procedure, not the findings."]],
["r080","r","r-spec",3,{"n":["The Terracotta Army is a collection of life-size clay soldiers.","It was buried around 210 BCE with Qin Shi Huang, the first emperor of China.","Farmers digging a well near Xi’an discovered it in 1974.","The army is estimated to include more than 8,000 soldiers.","No two faces are alike."],"g":"The student wants to emphasize the scale of the Terracotta Army."},["The Terracotta Army was buried around 210 BCE together with Qin Shi Huang, who was the first emperor of China.","The Terracotta Army, buried around 210 BCE, is estimated to include more than 8,000 life-size soldiers.","The Terracotta Army consists of life-size clay soldiers, and no two of the soldiers’ faces are alike.","The Terracotta Army, a collection of life-size clay soldiers, was discovered in 1974 by farmers digging a well near Xi’an."],1,"Scale means how large the army is. The sentence gives the number of soldiers: more than 8,000.",["r-vague|It gives the date and the emperor, not the size of the army.",null,"r-vague|It describes the individual faces, not the size of the army.","r-vague|It reports the discovery, not the number of soldiers."]],
["r091","r","r-gen",3,{"n":["Some spacecraft have outlasted their planned missions by decades.","Voyager 1 was launched in 1977 on a mission planned to last five years.","It is still sending data from beyond the edge of the solar system."],"g":"The student wants to illustrate the claim that spacecraft can outlast their planned missions."},["Voyager 1, a spacecraft that is now beyond the edge of the solar system, continues to send data.","Spacecraft sometimes far outlast their planned missions: Voyager 1, launched in 1977 for a five-year mission, is still sending data.","Some spacecraft have continued to operate for decades longer than their planned missions required.","Voyager 1 was launched in 1977 and has since traveled beyond the edge of the solar system."],1,"To illustrate the claim, the sentence needs the claim plus a case that shows it: a five-year mission still running decades later.",["r-part|It says the spacecraft still works but not how long it was meant to work.",null,"r-part|It states the claim but gives no example.","r-part|It leaves out the planned length of the mission, so nothing shows that the mission was outlasted."]],
["r100","r","r-adv",3,{"n":["Leaves contain green chlorophyll and yellow and orange pigments called carotenoids.","In summer, chlorophyll is so abundant that it hides the other pigments.","In autumn, trees stop producing chlorophyll, and what remains breaks down.","The carotenoids then become visible."],"g":"The student wants to explain why many leaves turn yellow or orange in autumn."},["Leaves contain green chlorophyll as well as carotenoids, which are yellow and orange pigments.","In summer, the chlorophyll in a leaf is so abundant that it hides the leaf’s other pigments.","In autumn, trees stop producing chlorophyll, the pigment that gives their leaves a green color.","Leaves turn yellow or orange in autumn because their chlorophyll breaks down, revealing carotenoid pigments that were hidden in summer."],3,"The sentence gives the full cause: chlorophyll breaks down and the carotenoids underneath become visible.",["r-part|It lists the pigments but does not say what happens in autumn.","r-part|It explains why leaves are green in summer, not why they change in autumn.","r-part|It says that chlorophyll production stops but never mentions the yellow and orange pigments.",null]],
["r026","r","r-diff",3,{"n":["Jean-Baptiste Lamarck and Charles Darwin both tried to explain how species change over time.","Lamarck proposed that traits an animal acquires during its life are passed to its offspring.","Darwin proposed that individuals born with advantageous traits leave more offspring.","Lamarck published his theory in 1809.","Darwin published On the Origin of Species in 1859."],"g":"The student wants to emphasize a difference between the two explanations."},["Lamarck published his theory in 1809, half a century before Darwin published On the Origin of Species.","Lamarck and Darwin both tried to explain how species change over long periods of time.","Lamarck held that traits acquired during life are inherited, whereas Darwin held that individuals born with advantageous traits leave more offspring.","Darwin, who published On the Origin of Species in 1859, proposed that individuals with advantageous traits leave more offspring."],2,"The goal is a difference between the explanations themselves. The sentence states each one and contrasts them with “whereas”.",["r-off|It contrasts the dates of publication, not the content of the two explanations.","r-opp|“Both” introduces what Lamarck and Darwin have in common.",null,"r-part|Only Darwin’s explanation is given."]],
["r082","r","r-spec",3,{"n":["The Rosetta Stone was found in Egypt in 1799.","It carries a decree issued in 196 BCE.","The decree appears in three scripts: hieroglyphic, Demotic, and ancient Greek.","Jean-François Champollion announced that he had deciphered the hieroglyphs in 1822."],"g":"The student wants to specify the scripts that appear on the Rosetta Stone."},["The Rosetta Stone, found in Egypt in 1799, carries a decree that is written in more than one script.","In 1822, Jean-François Champollion announced that he had deciphered the hieroglyphs on the stone.","The decree on the Rosetta Stone appears in three scripts: hieroglyphic, Demotic, and ancient Greek.","The Rosetta Stone, which was found in Egypt in 1799, carries a decree issued in 196 BCE."],2,"To specify the scripts, the sentence must name them. This choice names all three.",["r-vague|“More than one script” does not say which scripts.","r-part|It mentions one script, hieroglyphs, and not the other two.",null,"r-vague|It gives dates, not scripts."]]

const SKILLS = {
  "b-end":{ ty:"b", n:"Sentence boundaries", s:"Two complete sentences must be separated by a period or a semicolon, never by a comma alone or by nothing.",
    rule:["An independent clause has a subject and a verb and can stand alone as a sentence. When one independent clause follows another, you have three standard options: end the first with a period, link the two with a semicolon, or join them with a comma plus a coordinating conjunction (for, and, nor, but, or, yet, so).", "A comma by itself between two independent clauses is a comma splice. No punctuation at all is a run-on (fused) sentence. Both are always wrong on the SAT.", "The second clause often begins with a pronoun (it, they, she, this, these) or with a transitional word (then, however, instead). Those words do not make the clause dependent: it is still a complete sentence."],
    ex:[["b", "The glacier retreated, it left a deep lake behind.", "Comma splice: both halves can stand alone."], ["b", "The glacier retreated it left a deep lake behind.", "Run-on: nothing marks the boundary."], ["g", "The glacier retreated. It left a deep lake behind.", "Period between two sentences."], ["g", "The glacier retreated; it left a deep lake behind.", "A semicolon does the same job as a period."]],
    tip:"Read each side of the blank separately. If both sides could be printed as sentences, choose the period or the semicolon and reject every choice that has a comma alone or no mark.", hint:"This question is about where one sentence ends. Read the words before the blank and the words after it separately: can each stand alone as a sentence?" },
  "b-fanboys":{ ty:"b", n:"Comma + coordinating conjunction", s:"A FANBOYS conjunction joins two independent clauses only with a comma in front of it.",
    rule:["The coordinating conjunctions are for, and, nor, but, or, yet and so (FANBOYS). To join two independent clauses with one of them, put a comma before the conjunction: clause, and clause.", "The comma never goes after the conjunction, and the conjunction cannot do the job without the comma.", "Be careful with compound predicates. When the conjunction joins two verbs that share one subject (“she wrote the code and tested it”), there is no second independent clause, so no comma is used."],
    ex:[["g", "Hopper built an early compiler, and she later helped to design COBOL.", "Two clauses, each with its own subject: comma + and."], ["g", "Hopper built an early compiler and later helped to design COBOL.", "One subject with two verbs: no comma."], ["b", "Hopper built an early compiler and, she later helped to design COBOL.", "The comma is on the wrong side of the conjunction."], ["b", "Hopper built an early compiler and she later helped to design COBOL.", "Two independent clauses need the comma before “and”."]],
    tip:"After the conjunction, look for a new subject. New subject plus verb: comma before the conjunction. No new subject: no comma.", hint:"Look at the word that joins the two parts of the sentence. Is there a full clause, with its own subject, on each side of it?" },
  "b-adv":{ ty:"b", n:"Conjunctive adverbs", s:"However, therefore, for example and similar words cannot join sentences; a semicolon or period must do it.",
    rule:["Words and phrases such as however, therefore, moreover, instead, for example, in fact and as a result are conjunctive adverbs. They show a logical link, but grammatically they are not conjunctions, so “clause, however, clause” is a comma splice.", "The strong mark (a period or semicolon) goes at the point where the first sentence ends. The adverb is then set off from its own clause with a comma.", "Hard questions test which clause the adverb belongs to. In “X; however, Y” the adverb introduces Y. In “X, however; Y” the adverb closes X, which contrasts with something said earlier. Decide by meaning: which statement is the one that contrasts with, results from or illustrates what came before it?"],
    ex:[["g", "The first trial failed; however, the second succeeded.", "“However” introduces the second clause."], ["b", "The first trial failed, however, the second succeeded.", "Comma splice: commas cannot hold two sentences together."], ["g", "Critics praised the film. Audiences stayed away, however; the studio lost millions.", "Here “however” belongs to the audiences clause, which contrasts with the critics’ praise."], ["b", "Critics praised the film. Audiences stayed away; however, the studio lost millions.", "This makes the studio’s loss contrast with the empty cinemas, which is illogical."]],
    tip:"Find the two complete sentences. Then ask which one the adverb comments on, and put the semicolon or period on the other side of it.", hint:"A word like “however” or “for example” sits next to the blank. It cannot join two sentences by itself. Decide which clause it belongs to." },
  "b-colon":{ ty:"b", n:"Colons", s:"A colon follows a complete sentence and introduces a list, an explanation or a restatement.",
    rule:["What comes before a colon must be an independent clause. What comes after it explains, lists or specifies what the clause has just announced, and may be a single word, a phrase or a full sentence.", "Never put a colon between a verb and its object, between a preposition and its object, or after such as, including and like. In those positions the words before the colon are not a complete sentence.", "A colon and a single dash are interchangeable in this role, so the SAT will not ask you to choose between them when both are correct."],
    ex:[["g", "The probe carried three instruments: a camera, a spectrometer and a magnetometer.", "Complete clause, then the list it promised."], ["b", "The probe carried: a camera, a spectrometer and a magnetometer.", "“The probe carried” is not a complete clause."], ["g", "The team reached a surprising conclusion: the fossil was a forgery.", "The clause after the colon explains “conclusion”."], ["b", "The probe carried instruments such as: a camera and a spectrometer.", "No colon after “such as”."]],
    tip:"Cover everything after the colon. If what remains is a complete sentence and what follows explains or lists, the colon is right.", hint:"Ask what the words after the blank do. If they explain or list what the first part announces, check whether the first part is a complete sentence." },
  "b-dash":{ ty:"b", n:"Dashes", s:"One dash works like a colon; two dashes work like a pair of commas.",
    rule:["A single dash after an independent clause introduces an explanation, an example or an emphatic afterthought, just as a colon does.", "A pair of dashes sets off an interruption in the middle of a sentence. The marks must match: if the interruption opens with a dash, it closes with a dash, not with a comma.", "When the passage already shows one dash, the blank usually needs the matching one. Look left and right of the blank for the partner."],
    ex:[["g", "The orchid depends on one pollinator—a moth with a tongue thirty centimeters long.", "Single dash introducing a specification."], ["g", "The moth—predicted decades before anyone saw it—was found in 1903.", "A matching pair around an interruption."], ["b", "The moth—predicted decades before anyone saw it, was found in 1903.", "A dash cannot be paired with a comma."]],
    tip:"Scan the sentence for another dash. If there is one, the interruption must be closed with a dash as well.", hint:"Look for a dash elsewhere in the sentence. Punctuation that sets off an interruption comes in matching pairs." },
  "b-nonres":{ ty:"b", n:"Nonessential elements", s:"Extra information is set off on both sides with matching marks.",
    rule:["A nonessential element adds information about something that is already fully identified: an appositive after a name, a clause beginning with which or who after a specific noun, an aside. The sentence remains complete, and still points to the same person or thing, when the element is removed.", "Such an element is set off on both sides: two commas, two dashes or two parentheses. Opening it without closing it, or mixing a comma with a dash, is an error.", "At the end of a sentence the element needs only the opening mark, because the period closes it."],
    ex:[["g", "Chien-Shiung Wu, a physicist at Columbia University, designed the experiment.", "Remove the appositive and the sentence still works."], ["b", "Chien-Shiung Wu, a physicist at Columbia University designed the experiment.", "The element is opened but never closed."], ["b", "Chien-Shiung Wu—a physicist at Columbia University, designed the experiment.", "Dash and comma do not match."], ["g", "The experiment relied on cobalt-60, which decays by emitting electrons.", "A “which” clause after a specific noun takes a comma."]],
    tip:"Delete the element. If the sentence is still complete and still identifies the same thing, put the same mark on both sides.", hint:"Try deleting the descriptive phrase next to the blank. If the sentence still works and still names the same thing, the phrase is extra information." },
  "b-ess":{ ty:"b", n:"Essential elements", s:"Information needed to identify the noun takes no punctuation.",
    rule:["An essential element tells the reader which person or thing is meant. Remove it and the sentence becomes vague or changes meaning. Essential elements are never set off with commas.", "A job title or description placed before a name is essential: the novelist Toni Morrison, physicist Chien-Shiung Wu, the 1937 novel Their Eyes Were Watching God. No comma comes between the description and the name, and none follows the name unless another rule requires it.", "Clauses that begin with that are essential, and so are who clauses that pick out one group from a larger one (“students who study abroad”)."],
    ex:[["g", "The novelist Toni Morrison won the Nobel Prize in 1993.", "The name identifies which novelist."], ["b", "The novelist, Toni Morrison, won the Nobel Prize in 1993.", "Commas would mean she is the only novelist."], ["g", "The bridge that collapsed in 1940 had been open for four months.", "The “that” clause identifies the bridge."], ["b", "The bridge, that collapsed in 1940, had been open for four months.", "No commas around a “that” clause."]],
    tip:"Read the sentence without the element. If you can no longer tell which person or thing is meant, use no punctuation.", hint:"Remove the name or phrase next to the blank. Can you still tell exactly who or what the sentence is about? If not, it is essential." },
  "b-list":{ ty:"b", n:"Items in a series", s:"Commas separate simple items; semicolons separate items that contain commas.",
    rule:["Three or more parallel items are separated by commas, with a comma before the and that introduces the last item. No comma follows that and, no comma comes before the first item, and none comes after the last.", "When the items themselves contain commas (a city and its country, a name and a description), semicolons separate the items, and the same mark must be used at every boundary of the list.", "Two items joined by and are not a series: they take no comma."],
    ex:[["g", "The survey covered soil type, rainfall, and elevation.", "Commas between three simple items."], ["b", "The survey covered soil type, rainfall, and, elevation.", "No comma after the final “and”."], ["g", "She worked in Lima, Peru; Quito, Ecuador; and La Paz, Bolivia.", "Items with internal commas are separated by semicolons."], ["b", "She worked in Lima, Peru; Quito, Ecuador, and La Paz, Bolivia.", "The separators must be consistent."]],
    tip:"Find the mark that already separates the other items in the list. The blank must use the same one.", hint:"The blank sits inside a list. Find the punctuation that separates the other items and check whether the items contain commas of their own." },
  "b-intro":{ ty:"b", n:"Subordinate clauses and opening phrases", s:"A dependent clause or opening phrase is attached to the main clause with a comma, never cut off with a period or semicolon.",
    rule:["A clause that begins with a subordinating word (because, although, while, when, since, if, after, as, whereas) cannot stand alone. The same is true of a participial phrase (“Working at night, …”, “Published in 1962, …”).", "When such an element opens the sentence, it is followed by a comma. A period or a semicolon there would leave it as a fragment.", "When the dependent clause follows the main clause, it is still part of the same sentence: a period or semicolon in front of it is also a fragment error."],
    ex:[["g", "Although the fossil was small, it changed the field.", "Dependent clause, comma, main clause."], ["b", "Although the fossil was small. It changed the field.", "The first part is a fragment."], ["b", "Although the fossil was small; it changed the field.", "A semicolon needs a complete sentence on each side."], ["g", "Drawing on ship logs, the historian reconstructed the route.", "Opening participial phrase plus comma."]],
    tip:"Check the first word of each clause. A subordinating word or an -ing/-ed opener means the clause cannot be closed with a period or semicolon.", hint:"Look at how the sentence, or the clause after the blank, begins. A word like “although”, “because” or “while”, or an -ing phrase, cannot form a sentence alone." },
  "b-nopunc":{ ty:"b", n:"Unnecessary punctuation", s:"Do not separate a subject from its verb, a verb from its object, or a preposition from its object.",
    rule:["Some of the hardest Boundaries questions are solved by using no punctuation at all. A single comma never comes between a subject and its verb, however long the subject is.", "Likewise, nothing separates a verb from its object or complement, a preposition from its object, or the word that from the clause it introduces.", "Two verbs, nouns or phrases joined by and take no comma. A comma there suggests a boundary that does not exist."],
    ex:[["b", "The researchers who conducted the survey, found a clear pattern.", "The comma splits the subject from “found”."], ["g", "The researchers who conducted the survey found a clear pattern.", "Subject and verb are not separated."], ["b", "The study showed, that the birds return each spring.", "No comma before a “that” clause."], ["b", "The exhibit includes paintings by, Alma Thomas.", "No comma between a preposition and its object."]],
    tip:"If you cannot name the rule that requires a mark, the mark does not belong. Long subjects are the classic bait.", hint:"Find the subject and its verb, and the verb and its object. Does any choice put a mark between words that belong together?" },

  "f-sva":{ ty:"f", n:"Subject–verb agreement", s:"The verb agrees with its true subject, not with the nearest noun.",
    rule:["A singular subject takes a singular verb (the study shows) and a plural subject takes a plural verb (the studies show). The test hides the subject by putting distance between it and the verb.", "Cross out prepositional phrases (of the poems, along with her colleagues), relative clauses and anything between commas or dashes. What is left is the subject.", "Watch the special cases: in inverted sentences the subject follows the verb (“Among the finds were three coins”); each, every, either, neither and one of are singular; subjects joined by and are plural; an -ing phrase used as a subject is singular (“Mapping the reefs takes years”)."],
    ex:[["g", "The collection of early letters is housed in Dublin.", "Subject: collection (singular), not letters."], ["b", "The collection of early letters are housed in Dublin.", "The verb wrongly agrees with “letters”."], ["g", "Beneath the temple floor lie two older foundations.", "Inverted order: the subject “foundations” follows the verb."], ["g", "Each of the samples was tested twice.", "“Each” is singular."]],
    tip:"Put the subject and the verb next to each other and read them aloud: “collection … is”.", hint:"Find the subject of the missing verb. Cross out every phrase that begins with a preposition and everything between commas or dashes." },
  "f-tense":{ ty:"f", n:"Verb tense", s:"The tense must fit the time frame set by dates, time words and the other verbs.",
    rule:["Use the simple past for an event completed at a definite past time (in 1977, last year, during the war). Use the present for general truths, for current states and for what a text or artwork says or shows.", "Use the present perfect (has/have + participle) for something that began in the past and continues now, often with since, for decades, recently or so far. Use the past perfect (had + participle) for an action that was completed before another past action.", "Use will for the future. Use would for something that was still in the future at a past moment (“the novel she published in 1987 would win a Pulitzer Prize the following year”) or for a hypothetical result.", "Verbs in the same time frame should match. A shift in tense needs a reason in the text."],
    ex:[["g", "Since 1990, the telescope has recorded more than a million images.", "“Since 1990” reaches up to the present: present perfect."], ["b", "Since 1990, the telescope recorded more than a million images.", "Simple past ignores the link to the present."], ["g", "By the time the rescuers arrived, the storm had passed.", "The earlier of two past events takes the past perfect."], ["g", "In the poem, the speaker describes a river at dawn.", "Present tense for what a text says."]],
    tip:"Underline every time clue and every other verb in the passage before you look at the choices.", hint:"Find the time clues: dates, words like “since”, “now” or “by the time”, and the tenses of the other verbs." },
  "f-finite":{ ty:"f", n:"Finite and nonfinite verb forms", s:"Every clause needs exactly one main verb; additional verbs must be participles or infinitives.",
    rule:["A finite verb shows tense and can serve as the main verb of a clause: studies, studied, has studied, will study. Nonfinite forms cannot: studying, to study, having studied, and the participle studied used as a modifier.", "If the clause containing the blank has a subject but no main verb, the answer must be a finite verb. An -ing form or to-infinitive there produces a fragment.", "If the clause already has its main verb, a second finite verb with no conjunction is ungrammatical. The blank then needs a nonfinite form that works as a modifier (“a telescope launched in 2021”) or completes another verb (“began to study”, “enabled researchers to map”)."],
    ex:[["b", "The ceramics, found in a sealed chamber, dating to the third century.", "No main verb: a fragment."], ["g", "The ceramics, found in a sealed chamber, date to the third century.", "“Date” is the finite main verb."], ["b", "The team collected samples revealed high levels of mercury.", "Two finite verbs with nothing joining them."], ["g", "The team collected samples revealing high levels of mercury.", "The participle modifies “samples”."]],
    tip:"Ask one question: does the clause already have a main verb? If no, choose a finite verb. If yes, choose a nonfinite form.", hint:"Find the subject of the clause that contains the blank and check whether that clause already has a main verb." },
  "f-pron":{ ty:"f", n:"Pronoun–antecedent agreement", s:"A pronoun matches the noun it replaces in number.",
    rule:["A singular antecedent takes it, its, this or that; a plural antecedent takes they, them, their, these or those. A person of unspecified gender may take they, but a thing, an organization or a species treated as a unit takes it.", "Find the antecedent by asking what exactly the pronoun stands for. It is often not the nearest noun: in “the population of sea otters lost much of its range”, the range belongs to the population.", "Collective nouns such as team, committee, company, government and audience are singular in SAT usage."],
    ex:[["g", "The committee announced its decision on Friday.", "“Committee” is one body: its."], ["b", "The committee announced their decision on Friday.", "Plural pronoun for a singular collective noun."], ["g", "Octopuses can change the color of their skin in seconds.", "Plural antecedent: their."], ["b", "Each of the paintings has their own frame.", "“Each” is singular: its own frame."]],
    tip:"Replace the pronoun with the noun you think it refers to. If the sentence makes sense, count that noun.", hint:"Ask what the missing pronoun stands for. Find that noun and decide whether it is singular or plural." },
  "f-poss":{ ty:"f", n:"Plurals and possessives", s:"An apostrophe shows ownership; a plain plural has none.",
    rule:["A plural noun that owns nothing takes no apostrophe: the artists met. A singular possessive adds ’s: the artist’s studio (one artist). A plural possessive puts the apostrophe after the s: the artists’ studio (several artists). Irregular plurals add ’s: children’s, women’s.", "To test a possessive, turn it round: “the artist’s studio” means “the studio of the artist”. A possessive must be followed by the thing owned.", "Possessive pronouns never have apostrophes: its, their, whose, your. The forms with apostrophes are contractions: it’s = it is, they’re = they are, who’s = who is. There refers to place or existence."],
    ex:[["g", "The museum’s curators restored the paintings’ frames.", "One museum; several paintings."], ["b", "The museums curator’s restored the painting’s frames.", "Missing possessive, false possessive on a plain plural."], ["g", "The species is known for its bright plumage.", "Possessive pronoun: no apostrophe."], ["b", "The species is known for it’s bright plumage.", "“It’s” means “it is”."]],
    tip:"For each noun ask two questions: one or more than one? Does it own the next noun? Expand every contraction to check it.", hint:"For each noun in the choices ask: is it singular or plural, and does it own the word that follows?" },
  "f-mod":{ ty:"f", n:"Modifier placement", s:"An opening descriptive phrase must be followed at once by the noun it describes.",
    rule:["When a sentence opens with a descriptive phrase (often beginning with an -ing or -ed word, or a phrase such as “A pioneer of…”), the noun immediately after the comma must be the person or thing the phrase describes. Otherwise the modifier dangles.", "Ask who or what performs the action in the opening phrase. That noun, and nothing else, must come first in the main clause.", "Watch for possessives: in “Marie Curie’s research”, the subject is the research, not Curie. A possessive form cannot be the thing the modifier describes."],
    ex:[["b", "Trained as a chemist, the novels of Primo Levi draw on science.", "The novels were not trained as a chemist."], ["g", "Trained as a chemist, Primo Levi drew on science in his novels.", "Levi follows the comma."], ["b", "Using radar data, the lake’s depth was mapped by the team.", "The depth did not use radar data."], ["g", "Using radar data, the team mapped the lake’s depth.", "The team used the data."]],
    tip:"Cover everything after the comma, ask “who or what?”, and choose the option that starts with the answer.", hint:"Read the phrase before the comma and ask who or what it describes. That noun must come immediately after the comma." },

  "t-contrast":{ ty:"t", n:"Contrast", s:"The second statement differs from, or goes against, the first.",
    rule:["Use a contrast transition when the new sentence presents an opposing fact, an unexpected difference or the other side of a comparison: however, by contrast, in contrast, on the other hand, conversely.", "By contrast and conversely compare two different subjects (“Frogs…; toads, by contrast, …”). However is the most general and also fits a reversal of expectation."],
    ex:[["g", "Most ferns need constant moisture. The resurrection fern, however, can lose almost all of its water and survive.", "The second sentence goes against the pattern in the first."]],
    tip:"Look for opposed pairs: most/one, early/later, expected/actual, increase/decrease.", hint:"Compare the statement before the blank with the one after it. Do they point in the same direction or in different directions?" },
  "t-concession":{ ty:"t", n:"Concession", s:"The second statement holds in spite of the first.",
    rule:["Nevertheless, nonetheless, still, even so and that said introduce something that remains true despite what was just admitted. The first sentence raises an obstacle or a limitation; the second says the result was not what that obstacle would lead you to expect.", "This is narrower than plain contrast: the meaning is “despite this”."],
    ex:[["g", "The expedition lost half of its supplies in the first week. Nevertheless, it reached the summit on schedule.", "Success in spite of the setback."]],
    tip:"Try inserting “despite this”. If it fits, a concession transition is right.", hint:"Does the second statement happen in spite of what the first one says? Try the words “despite this”." },
  "t-addition":{ ty:"t", n:"Addition", s:"The second statement adds another point of the same kind.",
    rule:["Moreover, furthermore, in addition, additionally and also introduce a further reason, feature or piece of evidence that supports the same claim. The two sentences are parallel: neither is an example or a result of the other."],

  noness:{ n:"Nonessential element not set off", s:"The element only adds extra information about something already identified, so it needs punctuation on both sides.", avoid:"Remove the element. If the sentence still works and still names the same thing, set the element off with a matching pair of marks." },
