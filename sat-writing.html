/* ===================== QUESTION BANK: 4 types, 400 questions =====================
   Row: [id, type, rule, level, text or {n: notes, g: goal}, choices A–D, index of the answer, explanation, error note for each choice] */
const RAW = [
["b001","b","b-end",1,"The Mariana Trench is the deepest part of the world’s oceans. At its lowest point, the seafloor lies nearly 11,000 meters below the ____ there is more than a thousand times greater than at sea level.",["surface; the pressure,","surface. The pressure","surface, the pressure","surface the pressure"],1,"The words before the blank form a complete sentence, and “The pressure there is more than a thousand times greater…” is another. A period separates them, and nothing may come between the subject “pressure” and its verb “is”.",["split|The semicolon would be acceptable, but the comma after “pressure” separates the subject from its verb “is”.",null,"cs","ro"]],
["b015","b","b-fanboys",1,"Grace Hopper had a working compiler running in ____ her colleagues at first refused to believe that a computer could do anything other than arithmetic.",["1952 but","1952, but","1952 but,","1952; but,"],1,"Two independent clauses (“Hopper had a working compiler…” and “her colleagues … refused to believe…”) are joined by “but”, so a comma goes before the conjunction.",["cc|Two independent clauses joined by “but” need a comma before it.",null,"cc|The comma is on the wrong side of “but”.","cc|A comma after “but” separates the conjunction from its clause, and a semicolon is not used with a coordinating conjunction here."]],
["b025","b","b-adv",1,"Many animals use tools. Sea ____ carry stones under their forelimbs and use them to crack open shellfish.",["otters; for example","otters, for example","otters for example,","otters, for example,"],3,"“For example” interrupts a single clause, between the subject “sea otters” and the verb “carry”. An interrupter of this kind is set off with a comma on each side.",["semi|“Sea otters” alone is not an independent clause, so a semicolon cannot follow it.","pair|The interrupting phrase is opened with a comma but never closed.","pair|The interrupting phrase is closed with a comma but never opened.",null]],
["b033","b","b-colon",1,"The James Webb Space Telescope carries four main scientific ____ a near-infrared camera, a near-infrared spectrograph, a mid-infrared instrument, and a combined guidance sensor and imager.",["instruments;","instruments,","instruments:","instruments"],2,"“The James Webb Space Telescope carries four main scientific instruments” is a complete clause, and what follows is the list it announces. A colon introduces the list.",["semi|The list is not an independent clause, so a semicolon cannot precede it.","weak|A comma makes “instruments” look like the first item of the series instead of the word that introduces it.",null,"weak"]],
["b045","b","b-dash",1,"The axolotl—a salamander native to lakes near Mexico ____ can regrow entire limbs, parts of its heart, and even portions of its brain.",["City","City;","City,","City—"],3,"The description of the axolotl opens with a dash after “axolotl”, so it must close with a dash before the verb “can regrow”.",["pair|The interruption opens with a dash and is never closed.","semi|“The axolotl—a salamander native to lakes near Mexico City” is not an independent clause.","pair|The interruption opens with a dash and cannot close with a comma.",null]],
["b053","b","b-nonres",1,"Lake Baikal, the deepest lake on ____ holds roughly a fifth of the world’s unfrozen fresh surface water.",["Earth—","Earth,","Earth","Earth;"],1,"“The deepest lake on Earth” is extra information about Lake Baikal. It opens with a comma, so it must close with a comma before the verb “holds”.",["pair|The phrase opens with a comma and cannot close with a dash.",null,"pair|The phrase opens with a comma and is never closed.","semi|“Lake Baikal, the deepest lake on Earth” is not an independent clause."]],
["b069","b","b-ess",1,"The Nigerian ____ wrote Things Fall Apart, a novel that has been translated into more than fifty languages.",["novelist Chinua Achebe","novelist, Chinua Achebe,","novelist, Chinua Achebe","novelist Chinua Achebe,"],0,"The name tells the reader which Nigerian novelist is meant, so it is essential and takes no commas. No comma separates the subject from the verb “wrote”.",[null,"ess|Commas would mean that there is only one Nigerian novelist and the name is optional.","pair|A single comma before the name splits the description from the name and is never matched.","split|The comma after the name separates the subject from its verb “wrote”."]],
["b077","b","b-list",1,"Granite is composed mainly of three minerals: quartz, ____ mica.",["feldspar, and,","feldspar and,","feldspar; and","feldspar, and"],3,"Three simple items in a series are separated by commas, with a comma before “and” and none after it.",["list|No comma follows the “and” that introduces the last item.","list|The comma belongs before “and”, not after it.","list|The first two items are separated by a comma, so a semicolon here is inconsistent.",null]],
["b085","b","b-intro",1,"Although the giant panda belongs to the order ____ diet consists almost entirely of bamboo.",["Carnivora; its","Carnivora its","Carnivora, its","Carnivora. Its"],2,"“Although the giant panda belongs to the order Carnivora” is a dependent clause. It is joined to the main clause with a comma.",["semi|The “although” clause is not an independent clause, so a semicolon cannot follow it.","intro",null,"frag|The “although” clause cannot stand alone as a sentence."]],
["b093","b","b-nopunc",1,"The researchers who analyzed ice cores from ____ found that carbon dioxide levels rose and fell with temperature over hundreds of thousands of years.",["Antarctica,","Antarctica:","Antarctica;","Antarctica"],3,"The subject is “The researchers who analyzed ice cores from Antarctica” and its verb is “found”. Nothing separates a subject from its verb.",["split|A single comma separates the subject from its verb “found”.","colon|The words before the colon are not a complete clause.","semi|The words before the semicolon are a subject with no main verb.",null]],
["b002","b","b-end",1,"In 1977, the environmentalist Wangari Maathai founded the Green Belt Movement in ____ has since helped communities plant tens of millions of trees.",["Kenya the organization","Kenya, the organization","Kenya. The organization","Kenya. The organization,"],2,"“Maathai founded the Green Belt Movement in Kenya” is a complete sentence, and “The organization has since helped…” is a second one. A period marks the boundary, and no comma separates “organization” from “has”.",["ro","cs",null,"split|The period is right, but the comma after “organization” separates the subject from its verb “has helped”."]],
["b017","b","b-fanboys",1,"Coral polyps are animals, not ____ they depend on algae living in their tissues for most of their food.",["plants yet","plants, yet","plants, yet,","plants yet,"],1,"“Coral polyps are animals, not plants” and “they depend on algae…” are independent clauses joined by the conjunction “yet”, which takes a comma before it and none after it.",["cc|Without a comma before “yet”, the two clauses run together.",null,"cc|The comma before “yet” is right, but the second comma cuts the conjunction off from its clause.","cc|The comma belongs before “yet”, not after it."]],
["b040","b","b-colon",1,"A honeybee colony contains three kinds of ____ single queen, thousands of female workers, and, in spring and summer, a few hundred male drones.",["bees: a","bees a","bees, a","bees; a"],0,"“A honeybee colony contains three kinds of bees” is a complete clause, and the three kinds follow. A colon introduces the list.",[null,"weak","weak|A comma makes “bees” look like the first item in the series.","semi|The list of three kinds is not an independent clause."]],
["b050","b","b-dash",1,"The mimic ____ can imitate the shapes and movements of lionfish, sea snakes, and flatfish.",["octopus, a species discovered off the coast of Indonesia in 1998","octopus a species discovered off the coast of Indonesia in 1998,","octopus—a species discovered off the coast of Indonesia in 1998","octopus—a species discovered off the coast of Indonesia in 1998—"],3,"The description of the octopus interrupts the sentence between the subject and the verb “can imitate”. It must be set off on both sides with matching marks, here a pair of dashes.",["pair|The interruption opens with a comma and is never closed.","pair|The interruption is closed with a comma but never opened.","pair|The interruption opens with a dash and is never closed.",null]],
["b054","b","b-nonres",1,"Zora Neale ____ collected folktales across Florida in the 1920s and 1930s.",["Hurston, an anthropologist as well as a novelist,","Hurston, an anthropologist as well as a novelist","Hurston an anthropologist as well as a novelist,","Hurston an anthropologist as well as a novelist"],0,"“An anthropologist as well as a novelist” is extra information about Hurston, so it needs a comma on each side before the verb “collected”.",[null,"pair|The phrase is opened with a comma but never closed.","pair|The phrase is closed with a comma but never opened.","noness|The phrase is extra information about a named person and must be set off on both sides."]],
["b079","b","b-list",1,"To prepare the fresco, the painter spread a layer of wet plaster, sketched the ____ applied pigment before the surface dried.",["outline and,","outline, and","outline. And","outline; and"],1,"“Spread”, “sketched” and “applied” are three verbs in a series sharing the subject “the painter”. Commas separate them, with a comma before “and”.",["list|The comma belongs before “and”, not after it.",null,"frag|“And applied pigment before the surface dried” has no subject.","list|The first two items are separated by a comma, so a semicolon is inconsistent, and “applied pigment…” has no subject of its own."]],
["b089","b","b-intro",1,"First performed in ____ Stravinsky’s ballet The Rite of Spring provoked a near riot in the audience.",["1913,","1913.","1913","1913;"],0,"“First performed in 1913” is an opening participial phrase describing the ballet. A comma separates it from the main clause.",[null,"frag|“First performed in 1913” has no subject or finite verb.","intro","semi|“First performed in 1913” is not an independent clause."]],
["b094","b","b-nopunc",1,"The Silk Road carried goods ____ silk, spices, paper, and glassware between China and the Mediterranean.",["such as;","such as,","such as:","such as"],3,"“Such as” introduces its examples directly. No punctuation follows it.",["semi|Neither side of the semicolon is an independent clause.","split|A comma after “such as” separates the phrase from the examples it introduces.","colon|A colon cannot follow “such as”, because the words before it do not form a complete clause.",null]],
["b008","b","b-end",1,"The Great Barrier Reef stretches for more than 2,300 kilometers along the northeastern coast of ____ is the largest coral reef system on Earth.",["Australia. It","Australia it","Australia, it","Australia. Which"],0,"Both parts are complete sentences: “The Great Barrier Reef stretches…” and “It is the largest coral reef system on Earth.” The pronoun “it” is the subject of a new sentence.",[null,"ro","cs","frag|“Which is the largest coral reef system on Earth” is a relative clause. It cannot be punctuated as a sentence of its own."]],
["b042","b","b-colon",1,"In 1905, Albert Einstein published four papers that transformed ____ on the photoelectric effect, one on Brownian motion, one on special relativity, and one on the equivalence of mass and energy.",["physics; one","physics. One","physics, one","physics: one"],3,"“Einstein published four papers that transformed physics” is complete, and the four papers are then listed. A colon introduces the list.",["semi|The list of papers contains no verb and is not an independent clause.","frag|The list of four papers has no verb and cannot be a sentence.","weak|A comma makes “physics” look like part of the series that follows.",null]],
["b064","b","b-nonres",1,"Mount ____ rises almost 5,900 meters above sea level.",["Kilimanjaro Africa’s highest peak","Kilimanjaro, Africa’s highest peak","Kilimanjaro, Africa’s highest peak,","Kilimanjaro Africa’s highest peak,"],2,"“Africa’s highest peak” is extra information about Kilimanjaro, so it needs a comma on each side before the verb “rises”.",["noness|The appositive is extra information about a named mountain and must be set off on both sides.","pair|The appositive is opened with a comma but never closed.",null,"pair|The appositive is closed with a comma but never opened."]],
["b012","b","b-end",1,"Bamboo is one of the fastest-growing plants in the ____ can grow nearly a meter in a single day.",["world; some species,","world some species","world; some species","world, some species"],2,"“Bamboo is one of the fastest-growing plants in the world” and “some species can grow nearly a meter in a single day” are both independent clauses, so a semicolon can join them.",["split|The semicolon is right, but the comma after “species” separates the subject from its verb “can grow”.","ro",null,"cs"]],
["b067","b","b-nonres",1,"____ makes up most of the ocean floor and is the most common volcanic rock on Earth.",["Basalt; a dark volcanic rock","Basalt, a dark volcanic rock,","Basalt a dark volcanic rock,","Basalt, a dark volcanic rock"],1,"“A dark volcanic rock” is extra information about basalt, so it needs a comma on each side before the verb “makes up”.",["semi|“Basalt” alone is not an independent clause.",null,"pair|The appositive is closed but never opened.","pair|The appositive is opened but never closed."]],
["b003","b","b-end",2,"An octopus has three hearts. Two of them pump blood through the ____ circulates it to the rest of the body.",["gills; while the third","gills; the third","gills the third","gills, the third"],1,"“Two of them pump blood through the gills” and “the third circulates it to the rest of the body” are both independent clauses. A semicolon can join two closely related independent clauses.",["semi|“While the third circulates it…” is a dependent clause, so the words after the semicolon cannot stand alone.",null,"ro","cs"]],
["b016","b","b-fanboys",2,"The arctic tern breeds in the far north during the northern ____ flies to Antarctica for the southern one, a round trip of tens of thousands of kilometers.",["summer and then","summer, and then,","summer. And then","summer; and then"],0,"There is one subject, “the arctic tern”, with two verbs, “breeds” and “flies”. A compound predicate is joined by “and” with no punctuation.",[null,"split|The comma after “then” separates the adverb from the verb “flies”, and the two verbs share one subject, so no comma is needed.","frag|“And then flies to Antarctica…” has no subject and cannot stand as a sentence.","semi|“And then flies to Antarctica” has no subject, so it is not an independent clause."]],
["b023","b","b-adv",2,"Bessie Coleman wanted to become a pilot, but no American flight school would admit a Black woman at the ____ she learned French, moved to France, and earned an international pilot’s license in 1921.",["time, therefore;","time therefore,","time, therefore,","time; therefore,"],3,"Two independent clauses meet here. “Therefore” introduces the second one (her response to being refused), so the semicolon goes before it and a comma after it.",["adv|This attaches “therefore” to the first clause, as if the schools’ refusal were the result of something. The result is what follows.","ro|Nothing marks the end of the first independent clause.","cs|“Therefore” is an adverb, not a conjunction. Commas alone cannot hold two sentences together.",null]],
["b034","b","b-colon",2,"The 1919 solar eclipse gave astronomers a rare ____ with the Sun’s glare blocked, they could measure whether its gravity bent the light of distant stars, as Einstein had predicted.",["opportunity:","opportunity, which","opportunity","opportunity,"],0,"The first clause is complete, and the second clause explains what the “rare opportunity” was. A colon introduces an explanation after an independent clause.",[null,"dbl|“Which” would turn the second clause into a relative clause, but that clause already has its own subject and object, so the sentence falls apart.","ro","cs"]],
["b046","b","b-dash",2,"____ a vine introduced to the United States from Japan in 1876—now blankets roadsides and forest edges across the Southeast.",["Kudzu;","Kudzu,","Kudzu—","Kudzu"],2,"The phrase describing kudzu ends with a dash before “now blankets”, so it must begin with a dash as well.",["semi|“Kudzu” alone is not an independent clause.","pair|An interruption that closes with a dash cannot open with a comma.",null,"pair|The dash before “now” would have no partner."]],
["b055","b","b-nonres",2,"The team dated the stone tools using optically stimulated ____ measures when grains of sediment were last exposed to sunlight.",["luminescence which","luminescence, which","luminescence. Which","luminescence; which"],1,"The clause beginning with “which” adds a description of a method that has already been named, so it is nonessential and takes a comma before it.",["noness|The method has already been identified by name; the “which” clause only describes it and needs a comma.",null,"frag|A relative clause beginning with “which” cannot stand as a sentence.","semi|“Which measures when grains of sediment…” is a relative clause, not an independent clause."]],
["b070","b","b-ess",2,"Toni Morrison’s ____ won the Pulitzer Prize for Fiction in 1988.",["novel, Beloved","novel Beloved,","novel, Beloved,","novel Beloved"],3,"Morrison wrote many novels, so the title is needed to identify which one is meant. An essential title takes no commas.",["pair|A single comma before the title is never matched and splits “novel” from its name.","split|The comma after the title separates the subject from its verb “won”.","ess|Commas would imply that Morrison wrote only one novel.",null]],
["b078","b","b-list",2,"The conference drew researchers from Nairobi, Kenya; Accra, ____ Dakar, Senegal.",["Ghana; and,","Ghana; and","Ghana, and","Ghana and"],1,"Each item is a city followed by its country, so the items contain commas. The first two are separated by a semicolon, and the same mark must separate the second and third.",["list|The semicolon is right, but no comma follows “and”.",null,"list|A comma here would not show where one city–country pair ends and the next begins.","list|With no mark, “Ghana and Dakar” run together."]],
["b086","b","b-intro",2,"Working from photographs taken by an orbiting ____ have mapped permanently shadowed craters near the Moon’s south pole.",["spacecraft, scientists","spacecraft scientists","spacecraft. Scientists","spacecraft; scientists"],0,"“Working from photographs taken by an orbiting spacecraft” is an opening participial phrase. A comma separates it from the subject of the main clause, “scientists”.",[null,"intro","frag|The opening phrase has no subject or finite verb and cannot be a sentence.","semi|The opening phrase is not an independent clause."]],
["b095","b","b-nopunc",2,"Karl von Frisch’s experiments ____ honeybees can distinguish colors and can even be trained to associate a color with food.",["showed that,","showed: that","showed that","showed, that"],2,"The “that” clause is the object of “showed”. No punctuation separates a verb from its object or “that” from its clause.",["split|A comma after “that” separates the word from the clause it introduces.","colon|“Karl von Frisch’s experiments showed” is not a complete clause.",null,"split|A comma separates the verb “showed” from its object."]],
["b004","b","b-end",2,"Tardigrades, microscopic animals sometimes called water bears, can survive conditions that would kill almost any other ____ have revived them after freezing them, drying them out, and even exposing them to the vacuum of space.",["organism, scientists","organism. Scientists","organism scientists","organism and scientists"],1,"The first sentence is complete at “organism”. “Scientists have revived them…” has its own subject and verb, so it must begin a new sentence.",["cs",null,"ro","cc|Two independent clauses joined by “and” need a comma before the conjunction. Without it, “organism and scientists” reads at first like a pair of nouns."]],
["b018","b","b-fanboys",2,"Nearly all of the moai of Rapa Nui were carved from soft volcanic stone at a single ____ archaeologists have long asked how the islanders moved the multi-ton statues to platforms kilometers away.",["quarry so,","quarry, so","quarry so","quarry; so,"],1,"“The moai … were carved … at a single quarry” and “archaeologists have long asked…” are both independent clauses. The conjunction “so” joins them with a comma before it.",["cc|The comma is on the wrong side of “so”.",null,"cc|Two independent clauses joined by “so” need a comma before it.","cc|A semicolon followed by “so,” links the clauses twice and separates the conjunction from its clause."]],
["b026","b","b-adv",2,"The first transatlantic telegraph cable, completed in 1858, failed after only a few weeks of ____ a more durable cable laid in 1866 remained in service for years.",["operation however","operation, however","operation however;","operation; however,"],3,"The contrast lies in the second clause: the 1866 cable lasted, unlike the first. “However” therefore introduces that clause, with a semicolon before it and a comma after it.",["ro","cs","adv|Placing “however” at the end of the first clause makes the failure of the 1858 cable contrast with something earlier, and nothing earlier is there to contrast with.",null]],
["b035","b","b-colon",2,"Jacob Lawrence’s Migration Series tells one story across sixty small ____ movement of more than a million Black Americans from the rural South to northern cities.",["panels; the","panels. The","panels the","panels: the"],3,"The clause before the blank is complete, and the phrase after it specifies what the “one story” is. A colon introduces that specification.",["semi|“The movement of more than a million Black Americans…” is a noun phrase, not an independent clause.","frag|“The movement of more than a million Black Americans…” has no verb and cannot be a sentence.","weak",null]],
["b047","b","b-dash",2,"The orchid Angraecum sesquipedale keeps its nectar at the bottom of a spur about thirty centimeters long. Charles Darwin predicted that it must be pollinated by an insect with an equally long ____ a moth with just such a tongue was described decades later.",["tongue, and,","tongue,","tongue—","tongue"],2,"Two independent clauses meet at the blank. A single dash, like a colon, can link an independent clause to a second clause that completes the thought.",["cc|A comma after “and” separates the conjunction from the clause it introduces.","cs",null,"ro"]],
["b056","b","b-nonres",2,"The Voyager 1 spacecraft (launched in ____ crossed into interstellar space in 2012 and continues to send data back to Earth.",["1977)","1977—","1977,","1977),"],0,"The aside opens with a parenthesis and must close with one. No comma follows it, because the subject “spacecraft” goes straight on to its verb “crossed”.",[null,"pair|An aside that opens with a parenthesis cannot close with a dash.","pair|An aside that opens with a parenthesis cannot close with a comma.","split|The parenthesis is closed correctly, but the added comma separates the subject from its verb."]],
["b071","b","b-ess",2,"The ____ birds descended from small feathered dinosaurs is now supported by hundreds of fossils.",["hypothesis that,","hypothesis: that","hypothesis, that","hypothesis that"],3,"The clause “that birds descended from small feathered dinosaurs” states which hypothesis is meant. A “that” clause of this kind is essential and takes no punctuation.",["split|A comma after “that” separates the word from the clause it introduces.","colon|“The hypothesis” is not a complete clause, so a colon cannot follow it.","ess|No comma comes before an essential “that” clause.",null]],
["b081","b","b-list",2,"Sea otters often wrap themselves in ____ and float on their backs while they sleep.",["kelp;","kelp","kelp:","kelp,"],1,"“Wrap” and “float” are two verbs sharing the subject “sea otters”. Two items joined by “and” are not a series and take no punctuation.",["semi|“And float on their backs while they sleep” has no subject.",null,"colon|What follows does not explain or list anything; it is the second half of the predicate.","list|Two verbs joined by “and” do not form a series, so no comma separates them."]],
["b087","b","b-intro",2,"The city banned cars from its historic ____ vibrations from traffic were damaging the medieval foundations.",["center; because","center because","center, because,","center. Because"],1,"The “because” clause depends on the main clause and follows it directly. It cannot be cut off with a period or semicolon, and no comma follows “because”.",["semi|A dependent clause cannot follow a semicolon.",null,"split|A comma after “because” separates the conjunction from the clause it introduces.","frag|“Because vibrations from traffic were damaging the medieval foundations” is a dependent clause and cannot be a sentence."]],
["b096","b","b-nopunc",2,"One of the most abundant elements in Earth’s crust ____ silicon, which is the main ingredient of sand and glass.",["is—","is,","is","is:"],2,"“Silicon” completes the verb “is”. No punctuation separates a linking verb from its complement.",["split|A dash separates the verb from its complement, and the words before it are not a complete clause.","split|A comma separates the verb from its complement.",null,"colon|“One of the most abundant elements in Earth’s crust is” is not a complete clause."]],
["b005","b","b-end",2,"The Sahara was not always a desert. Roughly 6,000 to 11,000 years ago, the region received regular monsoon ____ and lakes covered land that is now sand.",["rains; grasslands","rains, grasslands","rains; with grasslands","rains grasslands"],0,"“The region received regular monsoon rains” is an independent clause, and so is “grasslands and lakes covered land that is now sand”. A semicolon joins them.",[null,"cs|The comma makes “rains, grasslands and lakes” look like a list, but “grasslands and lakes covered land” is a new clause with its own verb.","semi|“With grasslands and lakes covered land that is now sand” is not a grammatical clause, so nothing complete follows the semicolon.","ro"]],
["b019","b","b-fanboys",2,"Katherine Johnson calculated the trajectory for the first American human ____ and astronaut John Glenn later asked her to check the electronic computer’s figures for his orbital mission by hand.",["spaceflight","spaceflight,","spaceflight;","spaceflight:"],1,"“And” joins two independent clauses with different subjects (“Katherine Johnson calculated…” and “John Glenn … asked…”), so a comma is needed before it.",["cc|Without the comma, “spaceflight and astronaut John Glenn” reads like a pair of nouns before the second clause appears.",null,"dbl|A semicolon already joins two clauses; adding “and” after it links them twice.","colon|What follows does not explain or list anything in the first clause; it reports a separate, later event."]],
["b028","b","b-adv",2,"Helium is lighter than air and does not ____ it replaced flammable hydrogen as the lifting gas in airships.",["burn; consequently,","burn, consequently","burn consequently,","burn consequently;"],0,"The replacement of hydrogen is the consequence, so “consequently” introduces the second clause. A semicolon ends the first clause and a comma follows the adverb.",[null,"cs|One comma between two independent clauses is a comma splice; “consequently” is not a conjunction.","ro|No mark closes the first clause before “consequently”, so the two sentences run together.","adv|This makes “consequently” part of the first clause, as though helium’s failure to burn were a result of being lighter than air."]],
["b036","b","b-colon",2,"Sourdough bread relies on two kinds of ____ yeasts, which produce the gas that makes the dough rise, and bacteria, which produce the acids that give the bread its sour taste.",["microorganisms; wild","microorganisms, wild","microorganisms wild","microorganisms: wild"],3,"“Sourdough bread relies on two kinds of microorganisms” is a complete clause that announces two items. A colon introduces them.",["semi|What follows the mark is a pair of noun phrases, not an independent clause.","weak|With a comma, the reader cannot tell where the introductory clause ends and the two items begin, especially since the items contain commas.","weak",null]],
["b051","b","b-dash",2,"Three rivers supply most of Lake Baikal’s ____ Selenga, the Barguzin, and the Upper Angara.",["water, the","water—the","water; the","water the"],1,"“Three rivers supply most of Lake Baikal’s water” is a complete clause, and the names of the rivers follow. A single dash, like a colon, introduces the list.",["weak|A comma makes “water” look like the first item of the series.",null,"semi|The list of rivers is not an independent clause.","weak"]],
["b057","b","b-nonres",2,"In 2015, the pharmacologist Tu ____ whose team had isolated the antimalarial compound artemisinin in the 1970s, shared the Nobel Prize in Physiology or Medicine.",["Youyou,","Youyou—","Youyou;","Youyou"],0,"The clause “whose team had isolated … in the 1970s” gives extra information about a person already named. It ends with a comma, so it must begin with one.",[null,"pair|A clause that closes with a comma cannot open with a dash.","semi|“In 2015, the pharmacologist Tu Youyou” is not an independent clause.","pair|The clause closes with a comma but is never opened."]],
["b072","b","b-ess",2,"The study found that ____ reviewed their notes within a day of a lecture remembered far more a week later than those who waited.",["students who,","students; who","students, who","students who"],3,"The “who” clause picks out one group of students (those who reviewed promptly) and contrasts it with another, so it is essential and takes no comma.",["split|A comma after “who” separates the pronoun from its verb “reviewed”.","semi|“The study found that students” is not an independent clause.","ess|A comma would mean that all students reviewed their notes within a day, which contradicts “those who waited”.",null]],
["b082","b","b-list",2,"A lichen can grow on bare ____ in polar deserts, and even on the bark of city trees.",["rock:","rock,","rock;","rock"],1,"Three phrases form a series: “on bare rock”, “in polar deserts” and “on the bark of city trees”. The second and third are separated by a comma, so the first and second are too.",["colon|“A lichen can grow on bare rock” is followed by further items of the same series, not by an explanation.",null,"list|The other items are separated by commas, and the items contain no commas of their own.","list|With no mark, the first two items run together."]],
["b088","b","b-intro",2,"While the female emperor penguin returns to the sea to feed for about two ____ male balances the egg on his feet and goes without food.",["months, the","months; the","months. The","months the"],0,"The clause beginning with “While” is dependent. It is followed by a comma and then the main clause, “the male balances the egg…”.",[null,"semi|The “while” clause is not an independent clause.","frag|The “while” clause cannot stand alone as a sentence.","intro"]],
["b098","b","b-nopunc",2,"The Inca Empire built thousands of kilometers of roads, ____ suspension bridges woven from grass.",["including;","including,","including:","including"],3,"“Including” introduces its object directly, so no punctuation follows it.",["semi|“Suspension bridges woven from grass” is not an independent clause.","split|A comma separates “including” from its object.","colon|A colon cannot follow “including”, because the words before it do not form a complete statement of what is included.",null]],
["b007","b","b-end",2,"Honeybees do not hibernate in winter. Instead, the workers cluster tightly around the queen and shiver their flight ____ enough heat to keep the center of the cluster warm.",["muscles; generating","muscles, this activity generates","muscles. This activity generates","muscles this activity generates"],2,"“The workers cluster … and shiver their flight muscles” is complete. “This activity generates enough heat…” is a second complete sentence, so a period is needed.",["semi|“Generating enough heat…” is a phrase with no subject or finite verb, so it cannot follow a semicolon.","cs",null,"ro"]],
["b021","b","b-fanboys",2,"Hedy Lamarr was best known as a film ____ but she also co-invented a frequency-hopping system intended to keep radio-guided torpedoes from being jammed.",["star,","star;","star:","star"],0,"“Hedy Lamarr was best known as a film star” and “she also co-invented a frequency-hopping system” are independent clauses joined by “but”. The comma goes before the conjunction.",[null,"dbl|A semicolon and “but” would link the two clauses twice.","colon|The second clause contrasts with the first; it does not explain or specify it.","cc|Two independent clauses joined by “but” need a comma before it."]],
["b030","b","b-adv",2,"Cork is harvested by stripping the bark from cork oak trees, a process that does not kill the ____ the bark grows back and can be harvested again about every nine years.",["tree, in fact","tree in fact;","tree; in fact,","tree in fact,"],2,"“In fact” introduces the second independent clause, which strengthens the claim that the tree survives. The semicolon goes before the phrase and a comma after it.",["cs|A single comma cannot separate two independent clauses, and “in fact” needs a comma after it.","adv|This places “in fact” inside the first clause and leaves it without a comma, and the emphasis belongs to the statement that the bark grows back.",null,"ro|No mark closes the first clause before “in fact”, so the two sentences run together."]],
["b038","b","b-colon",2,"Physicist Chien-Shiung Wu’s 1956 experiment overturned a principle that physicists had long taken for ____ conservation, the idea that nature does not distinguish between left and right.",["granted: parity","granted parity","granted; parity","granted. Parity"],0,"The clause before the blank is complete. “Parity conservation, the idea that…” names the principle just mentioned, so a colon introduces it.",[null,"weak|Without a mark, “taken for granted parity conservation” runs the clause into the phrase that names the principle.","semi|“Parity conservation, the idea that…” is a noun phrase, not an independent clause.","frag|“Parity conservation, the idea that nature does not distinguish…” has no main verb."]],
["b052","b","b-dash",2,"For centuries, sailors told stories of rogue ____ walls of water far taller than the surrounding seas—but scientists did not confirm that such waves exist until an oil platform recorded one in 1995.",["waves—","waves,","waves","waves;"],0,"The phrase “walls of water far taller than the surrounding seas” closes with a dash, so it must open with one.",[null,"pair|An interruption that closes with a dash cannot open with a comma.","pair|The dash before “but” would have no partner.","semi|“Walls of water far taller than the surrounding seas” is not an independent clause."]],
["b059","b","b-nonres",2,"Mae Jemison, who flew aboard the space shuttle Endeavour in ____ had trained as both an engineer and a physician.",["1992","1992,","1992—","1992;"],1,"The “who” clause gives extra information about a named person. It opened with a comma after “Jemison” and must close with a comma before “had trained”.",["pair|The clause opened with a comma and is never closed.",null,"pair|A clause that opens with a comma cannot close with a dash.","semi|The words before the semicolon have no main verb for “Mae Jemison”."]],
["b074","b","b-ess",2,"Biologists use the ____ to describe a species whose influence on its ecosystem is far greater than its numbers would suggest.",["term, keystone species,","term: keystone species","term keystone species","term keystone species,"],2,"“Keystone species” tells the reader which term is meant. It is essential to “the term” and takes no punctuation.",["ess|Without the words “keystone species” the sentence would not say which term, so they cannot be set off.","colon|“Biologists use the term” is not complete without the term itself, and the sentence continues after it.",null,"split|The comma separates the object from the rest of the predicate, “to describe…”."]],
["b083","b","b-list",2,"Among the instruments the expedition carried were a barometer, which measured air pressure; a hygrometer, which measured ____ a theodolite, which measured angles between distant landmarks.",["humidity and","humidity; and","humidity; and,","humidity, and"],1,"Each instrument is followed by a “which” clause set off by a comma. Items that contain commas are separated by semicolons throughout the series.",["list|With no mark, the second item runs into the third.",null,"list|The semicolon is right, but no comma follows “and”.","list|A comma cannot separate items that already contain commas; the semicolon after “pressure” sets the pattern."]],
["b091","b","b-intro",2,"When humpback whales feed ____ sometimes blow a ring of bubbles around a school of fish to trap it near the surface.",["cooperatively; they","cooperatively they","cooperatively, they","cooperatively. They"],2,"“When humpback whales feed cooperatively” is a dependent clause that opens the sentence. A comma separates it from the main clause.",["semi|The “when” clause is not an independent clause.","intro",null,"frag|The “when” clause cannot stand alone as a sentence."]],
["b099","b","b-nopunc",2,"The treaty required each country to reduce its ____ to report its progress every two years.",["emissions, and,","emissions: and","emissions; and","emissions and"],3,"“To reduce its emissions” and “to report its progress” are two infinitive phrases joined by “and”. Two items joined by “and” take no punctuation.",["split|The comma after “and” has no function, and two phrases joined by “and” need no comma.","colon|What follows is the second of two requirements, not an explanation of the first.","semi|“And to report its progress every two years” is not an independent clause.",null]],
["b010","b","b-end",2,"Mount Everest grows by a few millimeters each ____ Indian tectonic plate continues to push northward into the Eurasian plate, forcing the Himalayas upward.",["year, the","year. The","year the","year; because the"],1,"“Mount Everest grows by a few millimeters each year” is a complete sentence. “The Indian tectonic plate continues to push northward…” is another, so a period separates them.",["cs",null,"ro","semi|“Because the Indian tectonic plate continues…” is a dependent clause and cannot stand after a semicolon."]],
["b031","b","b-adv",2,"The Antikythera mechanism, recovered from a shipwreck in 1901, is so corroded that its gears can be studied only with X-ray ____ researchers have determined that the device modeled the motions of the Sun and Moon.",["imaging nevertheless;","imaging nevertheless,","imaging. Nevertheless,","imaging, nevertheless"],2,"The first sentence ends at “imaging”. “Nevertheless” introduces the second sentence, which states what researchers achieved despite the corrosion.",["adv|“Nevertheless” at the end of the first clause would mean the corrosion happened in spite of something. The concession applies to the researchers’ success.","ro",null,"cs"]],
["b041","b","b-colon",2,"Kintsugi, the Japanese craft of mending broken pottery with lacquer and powdered gold, rests on an unusual ____ repair should be displayed rather than hidden.",["principle, a","principle; that a","principle: a","principle. That a"],2,"The first clause is complete at “principle”, and “a repair should be displayed rather than hidden” states the principle. A colon introduces it.",["cs","semi|“That a repair should be displayed” is a noun clause, not an independent clause.",null,"frag|“That a repair should be displayed rather than hidden” is a noun clause and cannot stand as a sentence."]],
["b060","b","b-nonres",2,"The Sagrada Família, the basilica that Antoni Gaudí worked on for more than four decades and left unfinished at his death in ____ is still under construction.",["1926, it","1926","1926;","1926,"],3,"The appositive “the basilica that Gaudí worked on … in 1926” opened with a comma and must close with a comma before the verb “is”.",["dbl|Adding “it” gives the verb a second subject and leaves “The Sagrada Família” stranded.","pair|The appositive is never closed, so the subject runs into the verb.","semi|The words before the semicolon have no main verb for “The Sagrada Família”.",null]],
["b075","b","b-ess",2,"____ grow in nutrient-poor bogs sometimes obtain nitrogen by trapping insects.",["Plants that","Plants, that","Plants, which","Plants that,"],0,"Only some plants are meant: those growing in nutrient-poor bogs. The clause is essential, so it begins with “that” and takes no comma.",[null,"ess|No comma comes before an essential “that” clause.","pair|“Which” with a comma would make the clause apply to all plants, and the comma is never matched before “sometimes obtain”.","split|A comma after “that” separates the word from its verb “grow”."]],
["b014","b","b-end",2,"Venus rotates so slowly that a single day there lasts longer than a ____ takes about 243 Earth days to turn once on its axis but only about 225 to orbit the Sun.",["year the planet","year; with the planet","year; the planet","year, the planet"],2,"“A single day there lasts longer than a year” completes the first clause. “The planet takes about 243 Earth days…” is a second independent clause, so a semicolon is correct.",["ro","semi|“With the planet takes about 243 Earth days” is not a grammatical clause, so the semicolon has nothing complete after it.",null,"cs"]],
["b044","b","b-colon",2,"The Inca kept detailed records without a writing system. They used the ____ assemblage of knotted, colored cords whose patterns encoded numbers and possibly narratives.",["quipu. An","quipu: an","quipu; an","quipu an"],1,"“They used the quipu” is a complete clause, and the phrase that follows explains what a quipu is. A colon introduces the explanation.",["frag|“An assemblage of knotted, colored cords…” has no main verb.",null,"semi|“An assemblage of knotted, colored cords…” is a noun phrase, not an independent clause.","noness|The phrase defining “quipu” is extra information and must be set off from the noun."]],
["b061","b","b-nonres",2,"The sculptor El Anatsui is best known for his shimmering wall ____ sheets assembled from thousands of flattened bottle caps joined with copper wire.",["hangings, vast","hangings; vast","hangings. Vast","hangings vast"],0,"“Vast sheets assembled from thousands of flattened bottle caps…” renames “wall hangings”. A nonessential appositive at the end of a sentence is set off with a comma.",[null,"semi|“Vast sheets assembled from thousands of flattened bottle caps…” is a noun phrase, not an independent clause.","frag|The phrase has no main verb (“assembled” is a participle here) and cannot be a sentence.","noness|The phrase renames “wall hangings” and must be separated from it."]],
["b062","b","b-nonres",2,"In 1960, Jane Goodall arrived at Gombe Stream in what is now ____ to observe wild chimpanzees at close range.",["Tanzania. Hoping","Tanzania; hoping","Tanzania, she hoped","Tanzania, hoping"],3,"“Hoping to observe wild chimpanzees at close range” is a participial phrase that adds information about Goodall. It is attached to the main clause with a comma.",["frag|“Hoping to observe wild chimpanzees at close range” has no subject or finite verb.","semi|“Hoping to observe wild chimpanzees…” is a phrase, not an independent clause.","cs",null]],
["b063","b","b-nonres",2,"Maya Lin’s first major ____ the Vietnam Veterans Memorial in Washington, DC, was selected in a national competition while she was still an undergraduate.",["work;","work:","work,","work"],2,"“The Vietnam Veterans Memorial in Washington, DC” renames “Maya Lin’s first major work”. The appositive closes with a comma before “was selected”, so it opens with one too.",["semi|“Maya Lin’s first major work” is not an independent clause.","colon|“Maya Lin’s first major work” is not a complete clause, so a colon cannot follow it.",null,"pair|The appositive closes with a comma but is never opened."]],
["b065","b","b-nonres",2,"Monarch butterflies that hatch in late summer fly as far as 4,000 kilometers to central ____ they spend the winter clustered on fir trees.",["Mexico, where","Mexico where","Mexico; where","Mexico. Where"],0,"“Where they spend the winter…” adds information about a place that is already identified, so the clause is nonessential and takes a comma.",[null,"noness|Central Mexico is already identified; the “where” clause is additional information and needs a comma.","semi|“Where they spend the winter…” is a dependent clause.","frag|“Where they spend the winter clustered on fir trees” is a dependent clause and cannot stand alone."]],
["b006","b","b-end",3,"When Jocelyn Bell Burnell examined the chart recordings from a new radio telescope in 1967, she noticed a faint signal that repeated about every 1.3 ____ turned out to be the first pulsar ever detected, a rapidly spinning neutron star.",["seconds; its source,","seconds its source","seconds, its source","seconds. Its source"],3,"The long first sentence ends at “seconds”. “Its source turned out to be the first pulsar…” is a new independent clause; a possessive pronoun at its start does not make it dependent.",["split|The semicolon would work, but the comma after “source” separates the subject from the verb “turned out”.","ro","cs",null]],
["b020","b","b-fanboys",3,"The poet Gwendolyn Brooks published her first collection in ____ five years later became the first Black author to win a Pulitzer Prize.",["1945; and","1945 and","1945 and,","1945, and,"],1,"“Brooks” is the subject of both “published” and “became”. Two verbs sharing one subject form a compound predicate, which takes no punctuation.",["semi|“And five years later became…” has no subject of its own, so it cannot follow a semicolon.",null,"split|A comma after “and” separates the conjunction from the rest of the predicate.","split|The comma after “and” has no function, and no comma is needed between two verbs that share a subject."]],
["b024","b","b-adv",3,"Most spiders are solitary and will attack others of their own kind. A few species, such as Anelosimus eximius, live in colonies of ____ members cooperate to build webs several meters across and to subdue prey far larger than any single spider.",["thousands, however, their","thousands; however, their","thousands, however; their","thousands however, their"],2,"“However” marks the contrast between the few social species and the solitary majority described in the previous sentence, so it belongs at the end of the first clause. The semicolon then separates that clause from “their members cooperate…”.",["cs","adv|With “however” placed after the semicolon, cooperating would contrast with living in colonies, which makes no sense.",null,"ro|With no mark before “however”, the first clause is not closed off, and a comma cannot separate two independent clauses."]],
["b037","b","b-colon",3,"After decades of searching the sediment record for a cause of the extinction, the geologists kept returning to a single ____ asteroid impact.",["explanation. An","explanation; an","explanation: an","explanation an"],2,"The clause is complete at “explanation”, and “an asteroid impact” names that explanation. A colon can introduce a single phrase as long as an independent clause precedes it.",["frag|“An asteroid impact” cannot stand alone as a sentence.","semi|“An asteroid impact” is a noun phrase, not an independent clause.",null,"weak"]],
["b048","b","b-dash",3,"Ruth Asawa’s hanging sculptures—looped by hand from a single continuous length of wire, using a technique she had learned from basket makers in Toluca, ____ cast shadows that she considered part of the work.",["Mexico—","Mexico","Mexico,","Mexico;"],0,"The long description opens with a dash after “sculptures”. The commas inside it do not close it; only a matching dash before the verb “cast” can.",[null,"pair|The interruption that opened with a dash is never closed.","pair|The interruption opened with a dash, so a comma cannot close it, however many commas appear inside.","semi|Nothing before the semicolon forms an independent clause, because the subject “sculptures” has not yet reached its verb."]],
["b058","b","b-nonres",3,"The baobab, a tree that can store thousands of liters of water in its swollen trunk and that may live for more than a thousand ____ is sometimes called the tree of life.",["years,","years","years;","years, and"],0,"Everything from “a tree” to “years” describes the baobab. This long appositive opened with a comma and must close with a comma before the verb “is”.",[null,"pair|The appositive that opened after “baobab” is never closed.","semi|The words before the semicolon contain no main verb for “baobab”, so they are not an independent clause.","dbl|“And” would join “is sometimes called” to the description, leaving “The baobab” with no verb of its own."]],
["b073","b","b-ess",3,"____ the Burgess Shale of British Columbia preserve the soft tissues of animals that lived more than 500 million years ago.",["Fossils, found in","Fossils found in,","Fossils found in","Fossils; found in"],2,"“Found in the Burgess Shale of British Columbia” identifies which fossils are meant, so it is essential. No punctuation separates it from “Fossils” or from the place name.",["pair|A comma after “Fossils” opens an interruption that is never closed before the verb “preserve”.","split|The comma separates the preposition “in” from its object.",null,"semi|“Fossils” alone is not an independent clause."]],
["b080","b","b-list",3,"The exhibition includes works by Alma Thomas, who began painting full-time at sixty-eight; Jacob Lawrence, whose Migration Series made him famous in his early ____ Faith Ringgold, who is known for her painted story quilts.",["twenties and","twenties: and","twenties, and","twenties; and"],3,"Each item is a name plus a “who” clause set off by a comma. Because the items contain commas, they are separated by semicolons, as the mark after “sixty-eight” shows.",["list|With no mark, the description of Lawrence runs into the third artist.","list|The other items are separated by a semicolon; a colon does not separate items in a series.","list|A comma here would be indistinguishable from the commas inside the items.",null]],
["b090","b","b-intro",3,"Because the reservoir’s water level fell so low during the drought that the ruins of a flooded village ____ could walk among stone walls that had been underwater for sixty years.",["reappeared, visitors","reappeared; visitors","reappeared, and visitors","reappeared. Visitors"],0,"Everything from “Because” to “reappeared” is one long dependent clause. It is followed by a comma and the main clause “visitors could walk…”.",[null,"semi|The long “because” clause is dependent, so a semicolon cannot follow it.","dbl|With “and”, the sentence consists of a “because” clause joined to another clause and never reaches a main clause.","frag|The “because” clause, however long, cannot be a sentence."]],
["b097","b","b-nopunc",3,"The discovery that some bacteria can break down the plastic used in beverage ____ has encouraged researchers to search landfills for other plastic-eating microbes.",["bottles,","bottles;","bottles—","bottles"],3,"The whole phrase “The discovery that some bacteria can break down the plastic used in beverage bottles” is the subject of “has encouraged”. However long a subject is, no punctuation separates it from its verb.",["split|A single comma separates the long subject from its verb “has encouraged”.","semi|The words before the semicolon are a subject with no main verb.","split|A single dash separates the subject from its verb.",null]],
["b009","b","b-end",3,"Making a Japanese woodblock print required several specialists. An artist drew the design on thin ____ pasted the drawing onto a block of cherry wood and cut away everything but the lines.",["paper, a carver then","paper; then","paper a carver then","paper; a carver then"],3,"“An artist drew the design on thin paper” and “a carver then pasted the drawing…” are independent clauses with different subjects. The word “then” is an adverb, not a conjunction, so a semicolon is required.",["cs|“Then” cannot join two independent clauses; with only a comma this is a comma splice.","semi|After the semicolon, “then pasted the drawing…” has no subject, so it is not an independent clause.","ro",null]],
["b022","b","b-fanboys",3,"Sea otters must eat about a quarter of their body weight every ____ they will lose more heat to the cold Pacific water than their metabolism can replace.",["day, or","day or","day; or,","day or,"],0,"Both halves are independent clauses (“Sea otters must eat…” and “they will lose more heat…”). The conjunction “or” joins them with a comma before it.",[null,"cc|Two independent clauses joined by “or” need a comma before it.","cc|A semicolon followed by “or,” links the clauses twice and cuts the conjunction off from its clause.","cc|The comma is on the wrong side of “or”."]],
["b027","b","b-adv",3,"Early critics dismissed the Eiffel Tower as an eyesore and expected it to be torn down after twenty years. The tower proved valuable as a radio ____ city officials decided to let it stand.",["antenna, however and","antenna, however, and","antenna. However and","antenna; however and"],1,"“However” belongs to the clause “The tower proved valuable as a radio antenna”, which contrasts with the critics’ expectation. As an interrupter it takes commas on both sides, and “, and” then joins the next independent clause.",["pair|“However” is set off on one side only, so it is not marked as an interrupter and the comma before “and” is lost.",null,"dbl|A sentence cannot begin “However and city officials decided”: two connectors are stacked together.","dbl|After the semicolon, the clause would begin with two connecting words at once: “however and”."]],
["b039","b","b-colon",3,"The engineers who rebuilt the bridge after its 1940 collapse had learned an expensive ____ deck that is too flexible can be torn apart by wind long before it is overloaded by traffic.",["lesson a","lesson; that a","lesson: a","lesson, a"],2,"“The engineers … had learned an expensive lesson” is complete, and the independent clause after it states the lesson. A colon may introduce a full sentence that explains the clause before it.",["ro","semi|“That a deck … can be torn apart by wind” is a noun clause, not an independent clause, so it cannot follow a semicolon.",null,"cs"]],
["b049","b","b-dash",3,"The team spent three seasons excavating the mound and recovered thousands of pottery fragments, dozens of stone tools, and several ____ not a single written record.",["hearths; but","hearths—but","hearths. But","hearths, but,"],1,"“But not a single written record” is a phrase, not a clause. A single dash can attach an emphatic afterthought to a complete independent clause.",["semi|“But not a single written record” is not an independent clause.",null,"frag|“But not a single written record” has no verb and cannot be a sentence.","split|The comma after “but” separates the conjunction from the phrase it introduces."]],
["b066","b","b-nonres",3,"The physicist Subrahmanyan ____ calculated in 1930 that a white dwarf star above a certain mass must collapse, was only nineteen at the time.",["Chandrasekhar, who","Chandrasekhar, he","Chandrasekhar who","Chandrasekhar; who"],0,"The main clause is “Chandrasekhar … was only nineteen at the time”. The “who” clause in the middle is extra information; it ends with a comma after “collapse”, so it must begin with one.",[null,"dbl|“He calculated…” creates a complete clause, which leaves “was only nineteen at the time” with no subject.","pair|The “who” clause closes with a comma after “collapse” but is never opened.","semi|“The physicist Subrahmanyan Chandrasekhar” is not an independent clause."]],
["b076","b","b-ess",3,"Kazuo Ishiguro’s ____ which follows an English butler looking back on his career, won the Booker Prize in 1989.",["novel The Remains of the Day","novel, The Remains of the Day","novel, The Remains of the Day,","novel The Remains of the Day,"],3,"The title identifies which of Ishiguro’s novels is meant, so no comma comes before it. The “which” clause that follows is extra information and needs a comma in front of it to match the one after “career”.",["noness|The “which” clause is nonessential and closes with a comma after “career”, so it must open with one.","ess|The comma before the title treats it as optional, and the “which” clause is left without its opening comma.","ess|The comma before the title would imply that Ishiguro has written only one novel.",null]],
["b084","b","b-list",3,"Solar panels, wind turbines, and hydroelectric ____ now supply more than a quarter of the world’s electricity.",["dams—","dams,","dams","dams;"],2,"The series ends with “hydroelectric dams”. No mark follows the last item of a series, and here a mark would also separate the compound subject from its verb “supply”.",["pair|A dash here has no partner and separates the subject from its verb.","list|No comma follows the last item of a series; it would cut the subject off from its verb.",null,"semi|The three nouns are a subject with no verb yet, not an independent clause."]],
["b092","b","b-intro",3,"The glacier has retreated more than two kilometers since ____ a chain of meltwater lakes in the valley below.",["1950, leaving","1950. Leaving","1950, it left","1950; leaving"],0,"“Leaving a chain of meltwater lakes…” is a participial phrase describing the result of the retreat. It is attached to the main clause with a comma.",[null,"frag|“Leaving a chain of meltwater lakes in the valley below” has no subject or finite verb.","cs","semi|“Leaving a chain of meltwater lakes…” is a phrase, not an independent clause."]],
["b100","b","b-nopunc",3,"The cave’s stable temperature and high ____ have preserved wooden tools that would have rotted anywhere else.",["humidity;","humidity,","humidity, they","humidity"],3,"“The cave’s stable temperature and high humidity” is the compound subject of “have preserved”. Nothing separates a subject from its verb.",["semi|The words before the semicolon are a subject with no verb.","split|A single comma separates the compound subject from its verb.","dbl|Adding “they” gives the verb a second subject and leaves the first one stranded.",null]],
["b011","b","b-end",3,"Marie Tharp’s maps of the Atlantic seafloor, drawn in the 1950s, revealed a rift valley running down the center of the Mid-Atlantic ____ initially dismissed the finding, but later evidence confirmed it.",["Ridge. Her colleague, Bruce Heezen","Ridge. Her colleague Bruce Heezen","Ridge, her colleague Bruce Heezen","Ridge her colleague Bruce Heezen"],1,"The first sentence ends at “Ridge”. The second begins with the subject “Her colleague Bruce Heezen”, which must not be separated from its verb “dismissed” by a single comma.",["pair|The period is right, but the comma before “Bruce Heezen” opens an interruption that is never closed and cuts the subject off from “dismissed”.",null,"cs","ro"]],
["b029","b","b-adv",3,"Some desert plants complete their entire life cycle in the brief period after a rain. The seeds of many desert wildflowers can lie dormant for years, for ____ a heavy storm finally arrives, they germinate, flower, and set seed within weeks.",["instance when","instance; when,","instance, when","instance; when"],3,"“For instance” belongs to the clause about dormant seeds, which illustrates the first sentence. That clause ends after “instance”, and a new independent clause begins with “when a heavy storm finally arrives, they germinate…”.",["ro","split|The semicolon is right, but a comma after “when” separates the conjunction from its clause.","cs|Commas alone leave two independent clauses (“The seeds … can lie dormant” and “they germinate…”) spliced together.",null]],
["b043","b","b-colon",3,"Astronomers classify Pluto as a dwarf planet for one ____ has not cleared other objects from the neighborhood of its orbit.",["reason; because it","reason, it","reason: it","reason it"],2,"“Astronomers classify Pluto as a dwarf planet for one reason” is a complete clause, and the clause after the colon states that reason.",["semi|“Because it has not cleared other objects…” is a dependent clause and cannot follow a semicolon.","cs",null,"ro"]],
["b068","b","b-nonres",3,"Lynn Margulis argued that mitochondria, the structures ____ were once free-living bacteria.",["which supply most of a cell’s energy","that supply most of a cell’s energy","that supply most of a cell’s energy,","that supply most of a cell’s energy;"],2,"The appositive “the structures that supply most of a cell’s energy” opened with a comma after “mitochondria”. It must close with a comma before the verb “were”.",["pair|Changing “that” to “which” does not close the appositive; a comma is still missing before “were”.","pair|The appositive is never closed, so “energy were once free-living bacteria” runs together.",null,"semi|The words before the semicolon contain no verb for “mitochondria”."]],
["b013","b","b-end",3,"The Rosetta Stone carries the same decree in three scripts: hieroglyphic, Demotic, and ancient ____ scholars could already read the last of these, the stone gave them a key to the other two.",["Greek, because","Greek. Because","Greek; because,","Greek because"],1,"The first sentence is complete at “Greek”. The next sentence consists of a dependent clause (“Because scholars could already read the last of these”) followed by its main clause (“the stone gave them a key”), so a period must come before “Because”.",["cs|The “because” clause belongs to what follows it. Attaching it with a comma leaves “the stone gave them a key” spliced onto the first sentence.",null,"split|The semicolon is in the right place, but a comma after “because” separates the conjunction from the clause it introduces.","ro"]],
["b032","b","b-adv",3,"The architects of the Centre Pompidou in Paris did not hide the building’s ducts and pipes behind walls. They placed them on the ____ system was painted a different bright color so that visitors could tell them apart.",["exterior; instead, each","exterior, instead each","exterior instead; each","exterior instead, each"],2,"“Instead” completes the clause “They placed them on the exterior”: that is what the architects did in place of hiding the pipes. The semicolon then separates this clause from “each system was painted…”.",["adv|With “instead” after the semicolon, painting the systems would be what replaced something, but nothing was rejected in favor of painting.","cs",null,"cs"]],
["f001","f","f-sva",1,"The collection of letters that the poet exchanged with her editors over three decades still ____ to the university’s library, where scholars may consult it.",["have belonged","belongs","belong","belonging"],1,"The subject is the singular noun “collection”; “of letters” and the clause after it only describe the collection. A singular subject takes “belongs”.",["agr|“Collection” is singular and cannot take “have”.",null,"agr|The verb must agree with “collection”, not with the nearer plural nouns “letters”, “editors” and “decades”.","nonfin"]],
["f023","f","f-tense",1,"In 1903, Marie Curie ____ the first woman to win a Nobel Prize, sharing the physics award with Pierre Curie and Henri Becquerel.",["became","becomes","will become","has become"],0,"“In 1903” names a finished moment in the past, so the simple past is needed.",[null,"tense|The event took place at a definite past date.","tense|1903 is in the past, not the future.","tense|The present perfect cannot be used with a definite past date such as “in 1903”."]],
["f041","f","f-finite",1,"The ceramic bowl, discovered in a sealed chamber beneath the temple floor, ____ to the third century BCE.",["dating","dates","date","to date"],1,"The subject “The ceramic bowl” has no main verb yet (“discovered” is a participle inside the commas). The blank must supply a finite verb, and it must be singular.",["nonfin",null,"agr|“Bowl” is singular, so the plural “date” does not agree.","nonfin"]],
["f059","f","f-pron",1,"The cuttlefish can change the color and texture of ____ skin in less than a second.",["it’s","its","they’re","their"],1,"The pronoun refers to “The cuttlefish”, a singular noun here, and shows possession of “skin”. The singular possessive is “its”, with no apostrophe.",["pform|“It’s” means “it is”.",null,"pform|“They’re” means “they are”.","pnum|The antecedent “the cuttlefish” is singular here."]],
["f073","f","f-poss",1,"A ____ are covered in tiny scales that give them their color.",["butterflies wings","butterflies’ wing’s","butterfly’s wings","butterfly’s wing’s"],2,"“A” signals one butterfly, which owns the wings: “butterfly’s”. “Wings” is a plain plural and the subject of “are”, so it takes no apostrophe.",["apos|“Butterflies” is a plural with no possessive mark, and “a” requires a singular.","apos|“A” requires a singular owner, and “wing’s” is wrongly possessive.",null,"apos|“Wing’s” is a possessive, but the wings own nothing; the word is simply plural."]],
["f087","f","f-mod",1,"Trained as a chemist before he turned to writing, ____ in several of his books.",["science was a subject that Primo Levi drew on","the Italian author Primo Levi drew on his scientific background","Primo Levi’s scientific background was something he drew on","a scientific background informed Primo Levi’s work"],1,"The opening phrase describes a person who was trained as a chemist. That person, Primo Levi, must be the subject that follows the comma.",["dangle|The subject is “science”, which was not trained as a chemist.",null,"dangle|The subject is “background”; the possessive “Primo Levi’s” is not the person.","dangle|The subject is “a scientific background”, which was not trained as a chemist."]],
["f002","f","f-sva",1,"Each of the moons orbiting Jupiter ____ a slightly different amount of sunlight, which helps astronomers estimate what its surface is made of.",["reflects","reflect","reflecting","have reflected"],0,"The subject is “Each”, which is always singular. “Of the moons orbiting Jupiter” is a prepositional phrase and does not change the number.",[null,"agr|“Each” is singular; the plural “moons” is only the object of “of”.","nonfin","agr|“Each” is singular, so “have” cannot follow it."]],
["f026","f","f-tense",1,"Water expands when it freezes, which ____ why ice floats on the surface of a lake instead of sinking.",["had explained","explained","explains","will explain"],2,"The sentence states general facts in the present tense (“expands”, “freezes”, “floats”). The missing verb must match.",["tense|There is no past event for the past perfect to precede.","tense|The other verbs state permanent facts in the present.",null,"tense|The explanation holds now; it is not a future event."]],
["f051","f","f-finite",1,"Many migratory birds fly at night ____ predators and to take advantage of cooler, calmer air.",["to avoid","avoids","avoid","avoided"],0,"The sentence gives two purposes joined by “and”. The second is “to take advantage”, so the first must be the matching infinitive “to avoid”.",[null,"fin|“Avoids” does not agree with “birds” and does not match “to take”.","fin|“Avoid” would be a second main verb, and it does not match “to take”.","fin|“Avoided” does not match the infinitive “to take” and shifts the tense."]],
["f066","f","f-pron",1,"A honeybee that finds a rich source of nectar returns to the hive and performs a dance that tells ____ nestmates where to fly.",["their","its’","it’s","its"],3,"The antecedent is “A honeybee”, which is singular. The possessive pronoun is “its”, with no apostrophe.",["pnum|“A honeybee” is singular.","pform|“Its’” is not an English word; possessive pronouns never take apostrophes.","pform|“It’s” means “it is”.",null]],
["f076","f","f-poss",1,"The river has changed ____ course several times over the past thousand years.",["it’s","their","its’","its"],3,"The possessive pronoun for the singular “river” is “its”, with no apostrophe.",["pform|“It’s” means “it is”.","pnum|“The river” is singular.","pform|“Its’” is not an English word.",null]],
["f093","f","f-mod",1,"Found only in the rivers of South America, ____.",["scientists have observed the pink river dolphin navigating flooded forests using echolocation","the pink river dolphin navigates flooded forests using echolocation","echolocation helps the pink river dolphin navigate flooded forests","flooded forests are navigated by the pink river dolphin using echolocation"],1,"What is found only in South American rivers is the dolphin, so “the pink river dolphin” must follow the comma.",["dangle|The subject is “scientists”, who are not found only in South American rivers.",null,"dangle|The subject is “echolocation”, which is not found only in South American rivers.","dangle|The subject is “flooded forests”."]],
["f012","f","f-sva",1,"Each leaf of the sensitive plant, Mimosa pudica, ____ within seconds when it is touched.",["folding","folds","fold","to fold"],1,"The subject is “Each leaf”, which is singular. “Of the sensitive plant” and the name between commas only identify the leaf.",["nonfin",null,"agr|“Each leaf” is singular.","nonfin"]],
["f035","f","f-tense",1,"The ancient city of Pompeii ____ buried under volcanic ash when Mount Vesuvius erupted in 79 CE.",["is","will be","was","has been"],2,"The burial happened at a definite past time, marked by “erupted in 79 CE”. The simple past is required.",["tense|The event is in the past.","tense|The event is in the past.",null,"tense|The present perfect cannot be tied to a definite past date."]],
["f085","f","f-poss",1,"The ____ surface is marked by thousands of craters.",["Moons","Moon","Moon’s","Moons’"],2,"The surface belongs to one Moon, so the singular possessive “Moon’s” is needed.",["apos|“Moons” is a plural with no possessive mark.","apos|Without ’s the word does not show that the surface belongs to the Moon.",null,"apos|“Moons’” refers to several moons, but “The Moon” is one body."]],
["f018","f","f-sva",1,"The root system of a mangrove tree ____ above the mud, allowing the tree to take in oxygen at low tide.",["rises","rise","rising","have risen"],0,"The subject is the singular “root system”. “Of a mangrove tree” is a prepositional phrase.",[null,"agr|The subject “root system” is singular.","nonfin","agr|“Root system” is singular and cannot take “have”."]],
["f003","f","f-sva",2,"Beneath the streets of the old city ____ a network of Roman aqueducts, some of which still carry water.",["lying","have lain","lie","lies"],3,"The sentence is inverted: the subject, “a network”, comes after the verb. “Network” is singular, so the verb is “lies”.",["nonfin","agr|“A network” is singular and cannot take “have”.","agr|The subject is “network”, not “streets” or “aqueducts”.",null]],
["f024","f","f-tense",2,"Since its launch in 1990, the Hubble Space Telescope ____ more than a million observations.",["has made","made","makes","had made"],0,"“Since its launch in 1990” describes a period that began in the past and continues to the present. That calls for the present perfect.",[null,"tense|The simple past treats the period as closed, but “since” reaches to the present.","tense|The simple present cannot express a total accumulated since 1990.","tense|The past perfect needs a later past event for the action to precede."]],
["f042","f","f-finite",2,"Researchers studying a coral reef off Belize recorded the sounds ____ by snapping shrimp and found that healthy reefs are far noisier than damaged ones.",["produce","to produce","produced","were produced"],2,"The clause already has its main verbs, “recorded” and “found”. The blank needs a participle that describes “the sounds”: the sounds produced by shrimp.",["fin|“Produce” would be a second main verb, and the sounds do not produce anything.","vform|“The sounds to produce by snapping shrimp” is not a grammatical phrase.",null,"fin"]],
["f060","f","f-pron",2,"When elephants encounter the bones of a dead elephant, ____ often stop and touch the remains with their trunks.",["one","it","you","they"],3,"The pronoun refers to the plural “elephants”, and “their trunks” later in the sentence confirms the plural.",["pnum|“One” is singular and impersonal; the antecedent is “elephants”.","pnum|The antecedent is the plural “elephants”.","pnum|The sentence is about elephants, not about the reader.",null]],
["f074","f","f-poss",2,"The two ____ findings contradicted each other, so a third team was asked to repeat the experiment.",["laboratories","laboratorys’","laboratory’s","laboratories’"],3,"“Two” shows that there are several laboratories, and they own the findings. A plural possessive puts the apostrophe after the plural form: “laboratories’”.",["apos|Without an apostrophe the word does not show that the findings belong to the laboratories.","apos|The plural of “laboratory” is “laboratories”, not “laboratorys”.","apos|“Laboratory’s” refers to one laboratory, but there are two.",null]],
["f088","f","f-mod",2,"Using data from more than 4,000 weather stations, ____ over the past century.",["a team of climatologists reconstructed how rainfall patterns have shifted","it was shown by climatologists how rainfall patterns have shifted","the reconstruction by climatologists showed how rainfall patterns have shifted","rainfall patterns were reconstructed by climatologists to show their shifts"],0,"The people who used the data are the climatologists, so “a team of climatologists” must come directly after the comma.",[null,"dangle|The subject is “it”, which refers to no one who could use the data.","dangle|The subject is “the reconstruction”, which did not use the data.","dangle|The subject is “rainfall patterns”, which did not use the data."]],
["f004","f","f-sva",2,"Among the manuscripts preserved in Timbuktu’s libraries ____ treatises on astronomy, medicine, and law written between the thirteenth and seventeenth centuries.",["are","being","is","was"],0,"The sentence is inverted: the subject is “treatises”, which follows the verb. A plural subject takes “are”.",[null,"nonfin","agr|The subject “treatises” is plural.","agr|The subject “treatises” is plural, and the manuscripts still exist, so the present is used."]],
["f025","f","f-tense",2,"By the time European naturalists first described the giant squid in the 1850s, sailors ____ stories about enormous tentacled sea creatures for centuries.",["have been telling","will tell","had been telling","are telling"],2,"The storytelling went on before another past event (“described … in the 1850s”). An action that precedes a past action takes the past perfect.",["tense|The present perfect links an action to now, but the reference point here is the 1850s.","tense|Nothing in the sentence points to the future.",null,"tense|The reference point is in the past, not the present."]],
["f043","f","f-finite",2,"Kehinde Wiley, an artist known for portraits that place contemporary Black subjects in poses borrowed from European old masters, ____ the official portrait of President Barack Obama in 2018.",["to paint","painted","who painted","painting"],1,"The subject “Kehinde Wiley” is followed by a long description between commas and still needs a main verb. “Painted” is finite and fits “in 2018”.",["nonfin",null,"nonfin|“Who painted” starts a relative clause, so the sentence still has no main verb.","nonfin"]],
["f061","f","f-pron",2,"Each of the three sculptures was shipped in ____ own custom-built crate.",["its","it’s","their","there"],0,"The antecedent is “Each”, which is singular (as the verb “was” shows). The singular possessive is “its”.",[null,"pform|“It’s” means “it is”.","pnum|“Each” is singular, as “was shipped” confirms.","pform|“There” refers to place, not possession."]],
["f075","f","f-poss",2,"During the exhibition, both ____ were displayed side by side.",["artists’ sketch’s","artist’s sketch’s","artists’ sketches","artists sketches"],2,"“Both” means two artists who own the sketches: “artists’”. “Sketches” is the plural subject of “were displayed” and owns nothing.",["apos|“Sketch’s” is a possessive, but the word is simply plural.","apos|“Artist’s” refers to one artist, and “sketch’s” is wrongly possessive.",null,"apos|“Artists” needs an apostrophe to show that the sketches belong to them."]],
["f089","f","f-mod",2,"Built in the twelfth century as a Hindu temple, ____.",["Buddhists gradually converted Angkor Wat into a site of their own","Angkor Wat was gradually converted into a Buddhist site","the conversion of Angkor Wat into a Buddhist site was gradual","Cambodia’s rulers gradually converted Angkor Wat into a Buddhist site"],1,"What was built in the twelfth century as a temple is Angkor Wat, so it must be the subject that follows the comma, even though that makes the clause passive.",["dangle|The subject is “Buddhists”, who were not built in the twelfth century.",null,"dangle|The subject is “the conversion”, which was not built as a temple.","dangle|The subject is “rulers”, who were not built as a temple."]],
["f005","f","f-sva",2,"The paintings that Alma Thomas completed in the last decade of her life ____ bright, mosaic-like patches of color arranged in loose stripes or circles.",["had featured","will feature","features","feature"],3,"The subject is the plural “paintings”. What artworks show is described in the present tense, so “feature” is correct.",["tense|The past perfect needs a later past event to precede, and none is given; artworks are described in the present.","tense|The paintings already exist; nothing in the text points to the future.","agr|The verb agrees with “paintings”, not with the nearer singular nouns “decade” and “life”.",null]],

["f045","f","f-finite",2,"By ____ the growth rings of trees buried in volcanic ash, scientists can determine the year of an eruption that occurred thousands of years ago.",["counting","count","counted","to count"],0,"A verb that follows a preposition such as “by” must be in the -ing form.",[null,"vform|A preposition cannot be followed by the base form of a verb.","vform|A preposition cannot be followed by a past form.","vform|A preposition cannot be followed by a to-infinitive."]],
