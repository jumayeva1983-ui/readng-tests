  for (let i = 0; i < qs.length; i += 10) {
    const part = qs.slice(i, i + 10), no = i / 10 + 1, lv = [...new Set(part.map(q => q.lvl))].sort();
    const st = { id:ty + no, ty, no, qs:part, ids:part.map(q => q.id), title:TYPES[ty].n + " · Set " + no, lv:lv.length > 1 ? LEVELS[lv[0]] + "–" + LEVELS[lv[lv.length - 1]] : LEVELS[lv[0]] };
    part.forEach((q, j) => { q.set = st; q.no = j + 1; });
    SETS.push(st); SBY[st.id] = st;
  }
});
const TOTALQ = ALLQ.length;
const SECS = 71; /* 32 minutes for 27 questions in a real module */
function minsFor(n){ return Math.ceil(n * SECS / 60); }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmt(sec){ sec = Math.max(0, sec); return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s"); }
function opt(q, v){ return q.o[LET.indexOf(v)]; }
function ol(v){ return '<span class="ol">' + v + "</span>"; }
function hd(q, v){ return '<span class="hd"><b>' + v + "</b>" + esc(opt(q, v)) + "</span>"; }
function normT(w){ return w.toLowerCase().replace(/[,\s]+$/, "").replace(/’/g, "'"); }

/* The text with the blank left open, or filled with a choice */
function textHTML(q, fill){
  const e = esc(q.body);
  return e.replace("____", fill ? '<mark class="ev">' + esc(fill) + "</mark>" : '<span class="blank" role="img" aria-label="blank"></span>');
}
/* The sentence that contains the blank, completed with a choice */
function sentenceOf(q, fill){
  const parts = q.body.split(/(?<=[.!?]["’”]?)\s+(?=[A-Z“"])/);
  const idx = parts.findIndex(p => p.indexOf("____") > -1);
  let s = parts[idx < 0 ? 0 : idx];
  if (/[.;:!?]\s+[A-Z]/.test(fill) && parts[idx + 1] && s.trim().endsWith("____")) s += " " + parts[idx + 1];
  if (q.ty === "t" && idx > 0) s = parts[idx - 1] + " " + s;
  return esc(s).replace("____", "<b>" + esc(fill) + "</b>");
}

/* Why a wrong choice is wrong: error key, error name, specific note */
function errOf(q, v){
  if (!v || v === q.k) return null;
  const i = LET.indexOf(v), raw = q.x[i] || "";
  if (q.ty === "t") {
    const w = TR[normT(q.o[i])], cat = w ? w[0] : "other";
    let note = "“" + q.o[i].replace(/,$/, "") + "” " + (w ? w[1] : "signals a different relationship") + ". ";
    note += raw ? raw : "That is not how these sentences relate: here " + REL[q.sk.slice(2)].is + ".";
    return { k:"t-" + cat, n:ERR["t-" + cat].n, note, gen:"" };
  }
  const p = raw.indexOf("|"), k = p < 0 ? raw : raw.slice(0, p), note = p < 0 ? "" : raw.slice(p + 1);
  const e = ERR[k] || { n:"Incorrect", s:"" };
  return { k, n:e.n, note:note || e.s, gen:note ? e.s : "" };
}
function skillQs(sk){ return ALLQ.filter(q => q.sk === sk); }
function errQs(k){ return ALLQ.filter(q => LET.some(v => v !== q.k && errOf(q, v).k === k)); }
function exHTML(rows){ return '<ul class="exl">' + rows.map(r => '<li class="' + r[0] + '"><i>' + (r[0] === "g" ? "✓" : "✗") + "</i><span>" + esc(r[1]) + (r[2] ? "<small>" + esc(r[2]) + "</small>" : "") + "</span></li>").join("") + "</ul>"; }
function ruleHTML(sk){ const x = SKILLS[sk]; return x.rule.map(p => "<p>" + esc(p) + "</p>").join("") + exHTML(x.ex) + '<p><span class="lab">Working tip</span>' + esc(x.tip) + "</p>"; }

/* ===================== STORAGE ===================== */
const KEY = "sat-writing-v1";
function fresh(){ return { ans:{}, exams:{} }; }
let store = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.ans) store = Object.assign(fresh(), s); } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
function record(q, v){
  const r = store.ans[q.id] || { n:0, wrong:0, hist:[] };
  r.n++; r.last = v; r.ok = v === q.k; if (!r.ok) r.wrong++;
  r.hist = (r.hist || []).concat(v).slice(-10); r.r = "";
  store.ans[q.id] = r; save();
}
function answeredIds(){ return Object.keys(store.ans).filter(k => QID[k]); }
function wrongIds(){ return answeredIds().filter(k => !store.ans[k].ok); }

const S = { view:"lib", sess:null, timer:null, confirmReset:false };

/* ===================== SESSION ===================== */
function startSession(ids, title, mode, sid){

  S.sess = { ids, title, mode, sid:sid || null, idx:0, ans:{}, pick:{}, hint:{}, ro:{}, flag:{}, submitted:false, auto:false, warn:false, mins, left:mode === "exam" ? mins * 60 : 0, used:null };
  S.view = "sess"; render(); window.scrollTo(0, 0);
  if (mode === "exam") S.timer = setInterval(tick, 1000);
}
function stopTimer(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function tick(){
  const s = S.sess; if (!s || s.submitted || s.mode !== "exam") return stopTimer();
  s.left--;

  const el = document.getElementById("clock"); if (el) { el.textContent = fmt(s.left); el.classList.toggle("low", s.left < 120); }
}
function sessOpen(){ const s = S.sess; return !!s && (s.mode === "exam" ? !s.submitted : s.ids.some(id => !s.ans[id])); }
function isOk(s, id){ return s.ans[id] === QID[id].k; }
function shown(s, id){ return s.mode === "exam" ? s.submitted : !!s.ans[id]; }
function curQ(){ const s = S.sess; return s ? QID[s.ids[s.idx]] : null; }
function mixedExam(){
  const pick = (ty, n) => shuffle(ALLQ.filter(q => q.ty === ty)).slice(0, n).map(q => q.id);
  return shuffle(pick("b", 6).concat(pick("f", 6))).concat(pick("t", 4), pick("r", 4));
}

function questionHTML(s, q){

/* ---------- Explanation: verdict, completed text, reason, mistake, every choice, the rule ---------- */
function fbHTML(q, v, uid){

  h += '<div class="verdict ' + (ok ? "ok" : "bad") + '"><span class="vt">' + (ok ? "✓ Correct: " + q.k : blank ? "✗ No answer. Correct choice: " + q.k : "✗ Incorrect. You chose " + v + ". Correct choice: " + q.k) + '</span><span class="vh">' + esc(q.o[q.a]) + "</span></div>";

  else h += '<div class="fsec"><h4>The completed text</h4><blockquote>' + sentenceOf(q, q.o[q.a]) + "</blockquote></div>";

      (ERR[x.k] ? '<p class="note"><span class="lab">How to avoid it</span>' + esc(ERR[x.k].avoid) + "</p>" : "");

function submitExam(auto){
  const s = S.sess; if (!s || s.submitted) return;

  const okN = s.ids.filter(id => isOk(s, id)).length, key = s.sid || "mix", prev = store.exams[key] || { n:0, best:0 };
  store.exams[key] = { n:prev.n + 1, best:Math.max(prev.best || 0, okN), last:okN, total:s.ids.length, used:s.used, t:Date.now() };
  save(); S.view = "fin"; render(); window.scrollTo(0, 0);
}

    qcard("hard", "Hard only", "Ten of the " + ALLQ.filter(q => q.lvl === 3).length + " hardest questions") +
    qcard("mist", "My mistakes", wrong.length ? plural(wrong.length, "question") + " to solve again" : "No mistakes yet", !wrong.length) +
    qcard("new", "Not yet solved", fresh0 ? plural(fresh0, "new question") : "Every question is solved", !fresh0) + "</section>";
  TYPE_ORDER.forEach(ty => {
    const sts = SETS.filter(st => st.ty === ty), all = sts.length * 10, d = sts.reduce((a, st) => a + st.qs.filter(q => store.ans[q.id]).length, 0);
    h += '<div class="typeh"><div class="lvh"><h2>' + TYPES[ty].n + '</h2><span class="band">' + TYPES[ty].dom + '</span><span class="rule"></span><span class="small num">' + d + " / " + all + " solved</span></div><p>" + TYPES[ty].d + "</p></div>";
    h += '<section class="tgrid">' + sts.map(st => {
      const done = st.qs.filter(q => store.ans[q.id]).length, ok = st.qs.filter(q => store.ans[q.id] && store.ans[q.id].ok).length, ex = store.exams[st.id];
      const sk = [...new Set(st.qs.map(q => SKILLS[q.sk].n))];
      return '<article class="tcard"><span class="tno">' + st.lv + "</span><h3>Set " + st.no + '</h3><p class="skills">' + esc(sk.slice(0, 3).join(" · ")) + (sk.length > 3 ? " · +" + (sk.length - 3) + " more" : "") + '</p><div class="bar"><i style="width:' + pct(done, 10) + '%"></i></div><p class="meta num">' + (done ? done + " / 10 solved, " + ok + " correct" : "Not started") + (ex ? " · exam best " + ex.best + " / " + ex.total : "") + "</p>" +
        '<div class="btns"><button class="btn primary sm" data-act="start" data-s="' + st.id + '" data-m="practice">Practice</button><button class="btn sm" data-act="start" data-s="' + st.id + '" data-m="exam">Exam · ' + minsFor(10) + " min</button></div></article>";
    }).join("") + "</section>";
  });
  h += '<p class="foot"><b>Practice mode:</b> one question at a time. After every answer you see the correct choice, the completed text, the reason, the error behind each wrong choice and the full rule. Hints are available and there is no time limit. <b>Exam mode:</b> timed at the real pace of about 71 seconds per question, with no hints and no feedback until you submit. You can mark questions for review and change answers, as in the Bluebook app.</p>';
  h += '<p class="foot">All questions were written for this trainer as practice material in the format of the digital SAT Reading and Writing section. They are not official College Board questions, and the difficulty labels are approximate. SAT is a trademark of the College Board, which is not involved in this trainer. Your results are stored only in this browser.</p>';
  return h;
}

/* ===================== RULES ===================== */
function rulesHTML(){
  let h = `<section class="doc"><h1>Rules</h1><p class="lede">The writing questions test a small, fixed set of rules. Learn to name the rule before you choose, and the answer stops depending on what “sounds right”.</p>
<div class="rsec"><h2>How the section works</h2>
<p>The digital SAT has one Reading and Writing section in two modules. Each module has 27 questions and lasts 32 minutes, so you have about 71 seconds per question. Every question has its own short text of 25 to 150 words and four answer choices.</p>
<p>About half of the section is writing. The questions in each module are grouped by type and always arrive in the same order: reading questions first, then Standard English Conventions, then Transitions, then Rhetorical Synthesis.</p>
<div class="tbl"><table><thead><tr><th>Domain</th><th>Question type</th><th>What it tests</th><th>Stem</th></tr></thead><tbody>` +
  TYPE_ORDER.map(ty => "<tr><td>" + TYPES[ty].dom + "</td><td><b>" + TYPES[ty].n + "</b></td><td>" + TYPES[ty].d + '</td><td class="en">' + TYPES[ty].stem + "</td></tr>").join("") +
  `</tbody></table></div></div>
<div class="rsec"><h2>Three habits for every question</h2><ol>
<li><b>Read to the period.</b> The subject, the matching dash or the clue to the tense is often several lines away from the blank.</li>
<li><b>Compare the choices before you read them into the text.</b> What changes from A to D tells you which rule is being tested.</li>
<li><b>Name the rule, then choose.</b> If you cannot say why a comma or a change of form is required, it probably is not.</li></ol></div>`;
  TYPE_ORDER.forEach(ty => {
    const sks = SKILL_ORDER.filter(k => SKILLS[k].ty === ty && skillQs(k).length);
    h += '<div class="rsec"><h2>' + TYPES[ty].n + '</h2><p class="small" style="margin-bottom:10px">' + TYPES[ty].dom + " · " + TYPES[ty].d + '</p><h3 style="margin-top:6px">Method</h3><ol class="steps">' + TYPES[ty].steps.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol>";
    if (ty === "b") h += puncTable();
    if (ty === "t") h += transTable();
    h += "<h3>The rules</h3><div class=\"traps\">" + sks.map(k => '<details class="trap"><summary><span class="tn">' + esc(SKILLS[k].n) + '</span><span class="ts">' + esc(SKILLS[k].s) + '</span></summary><div class="tb">' + ruleHTML(k) + '<div class="btns"><button class="btn primary sm" data-act="drill" data-sk="' + k + '">Practice this rule (' + plural(skillQs(k).length, "question") + ")</button></div></div></details>").join("") + "</div>";
    const errs = Object.keys(ERR).filter(k => k.indexOf("t-") !== 0 && errQs(k).some(q => q.ty === ty));
    if (ty !== "t" && errs.length) h += "<h3>Errors behind the wrong choices</h3><div class=\"traps\">" + errs.map(k => '<details class="trap"><summary><span class="tn">' + esc(ERR[k].n) + '</span><span class="ts">' + plural(errQs(k).length, "question") + '</span></summary><div class="tb"><p>' + esc(ERR[k].s) + '</p><p><span class="lab">How to avoid it</span>' + esc(ERR[k].avoid) + '</p><div class="btns"><button class="btn sm" data-act="errdrill" data-k="' + k + '">Practice this error (' + errQs(k).length + ")</button></div></div></details>").join("") + "</div>";
    h += "</div>";
  });
  h += `<div class="rsec"><h2>Timing</h2><ul>
<li>Each module gives 32 minutes for 27 questions. Writing questions are short, so aim for 45 to 60 seconds on conventions and transitions and keep the saved time for the reading questions.</li>
<li>Rhetorical synthesis looks long but is quick once you read the goal first: you rarely need to study every note.</li>
<li>Use “Mark for review” when two choices remain, pick one of them, and return at the end. There is no penalty for a wrong answer, so never leave a blank.</li>
<li>The section is adaptive: your result in the first module decides whether the second is easier or harder. Careless slips on easy conventions questions cost the most.</li></ul></div></section>`;
  return h;
}
function puncTable(){
  return `<h3>Punctuation at a glance</h3><div class="tbl"><table><thead><tr><th>Mark</th><th>Before it</th><th>After it</th><th>Example</th></tr></thead><tbody>
<tr><td><b>Period</b></td><td>complete sentence</td><td>complete sentence</td><td class="en">The dam failed. The valley flooded.</td></tr>
<tr><td><b>Semicolon</b></td><td>complete sentence</td><td>complete sentence</td><td class="en">The dam failed; the valley flooded.</td></tr>
<tr><td><b>Comma + FANBOYS</b></td><td>complete sentence</td><td>complete sentence</td><td class="en">The dam failed, and the valley flooded.</td></tr>
<tr><td><b>Colon</b></td><td>complete sentence</td><td>list, explanation or sentence</td><td class="en">The cause was simple: the dam had failed.</td></tr>
<tr><td><b>Single dash</b></td><td>complete sentence</td><td>explanation or afterthought</td><td class="en">The valley flooded—the dam had failed.</td></tr>
<tr><td><b>Comma alone</b></td><td colspan="2">never between two complete sentences; used after an opening clause or phrase, around extra information and between list items</td><td class="en">When the dam failed, the valley flooded.</td></tr>
<tr><td><b>Paired commas, dashes, parentheses</b></td><td colspan="2">around extra information in mid-sentence; the two marks must match</td><td class="en">The dam, built in 1911, failed.</td></tr>
<tr><td><b>No mark</b></td><td colspan="2">between subject and verb, verb and object, preposition and object, and around essential information</td><td class="en">The dam that failed was built in 1911.</td></tr></tbody></table></div>`;
}
function transTable(){
  const groups = {};
  Object.keys(TR).forEach(w => { (groups[TR[w][0]] = groups[TR[w][0]] || []).push(w); });
  return '<h3>Transition words by relationship</h3><div class="sigs">' + Object.keys(REL).filter(k => groups[k]).map(k => "<div><b>" + REL[k].n + "</b><span>" + (k === "other" ? "Words with a meaning of their own" : REL[k].is.charAt(0).toUpperCase() + REL[k].is.slice(1)) + ': <span class="w">' + groups[k].join(", ") + "</span></span></div>").join("") + "</div>";
}

/* ===================== RESULTS ===================== */
function bars(rows, cls){
  const max = Math.max(1, ...rows.map(r => r[1]));
  return '<div class="hbars">' + rows.map(r => '<div class="hb"><span>' + r[0] + '</span><div class="track ' + cls + '"><i style="width:' + pct(r[1], max) + '%"></i></div><span class="hv num">' + (r[3] || r[1] + "×") + "</span></div>").join("") + "</div>";
}
function statsHTML(){
  const ids = answeredIds(), wrong = wrongIds(), ok = ids.length - wrong.length;
  let h = '<section class="doc" style="max-width:1000px"><h1>Results</h1><p class="lede">Your latest answer to each question is what counts. Results are stored only in this browser.</p>';
  if (!ids.length) return h + '<div class="rsec"><p class="empty">No results yet. Solve your first set and this page will show your accuracy by question type and by rule, the errors that catch you and your mistakes notebook.</p><button class="btn primary" data-act="start" data-s="' + SETS[0].id + '" data-m="practice">Start with Boundaries · Set 1</button></div></section>';
  h += '<div class="kpis"><div><span class="mono">Questions solved</span><b class="num">' + ids.length + " / " + TOTALQ + '</b></div><div><span class="mono">Accuracy</span><b class="num">' + pct(ok, ids.length) + '%</b><span class="small">' + ok + " of " + ids.length + ' correct</span></div><div><span class="mono">Mistakes now</span><b class="num">' + wrong.length + "</b></div></div>";
  h += '<div class="rsec"><h2>By question type</h2><div class="hbars">' + TYPE_ORDER.map(ty => {
    const xs = ids.filter(id => QID[id].ty === ty), o = xs.filter(id => store.ans[id].ok).length;
    return '<div class="hb"><span>' + TYPES[ty].n + '</span><div class="track r"><i style="width:' + pct(o, xs.length) + '%"></i></div><span class="hv num">' + (xs.length ? pct(o, xs.length) + "% · " + o + " / " + xs.length : "not started") + "</span></div>";
  }).join("") + "</div></div>";
  const rows = SKILL_ORDER.map(k => { const xs = ids.filter(id => QID[id].sk === k), o = xs.filter(id => store.ans[id].ok).length; return { k, n:xs.length, o }; }).filter(r => r.n).sort((a, b) => a.o / a.n - b.o / b.n || b.n - a.n);
  h += '<div class="rsec"><h2>By rule</h2><p class="small">Weakest rules first.</p><div class="tbl"><table><thead><tr><th>Rule</th><th>Type</th><th>Solved</th><th>Correct</th><th></th></tr></thead><tbody>' + rows.map(r => "<tr><td><b>" + esc(SKILLS[r.k].n) + "</b></td><td>" + TYPES[SKILLS[r.k].ty].n + '</td><td class="num">' + r.n + " / " + skillQs(r.k).length + '</td><td class="num">' + pct(r.o, r.n) + '%</td><td><button class="btn ghost sm" data-act="drill" data-sk="' + r.k + '">Practice</button></td></tr>').join("") + "</tbody></table></div></div>";
  const exs = Object.keys(store.exams);
  if (exs.length) h += '<div class="rsec"><h2>Exams</h2><div class="tbl"><table><thead><tr><th>Exam</th><th>Attempts</th><th>Last</th><th>Best</th><th>Time used</th></tr></thead><tbody>' + exs.map(k => { const ex = store.exams[k]; return "<tr><td>" + (SBY[k] ? esc(SBY[k].title) : "Timed module") + '</td><td class="num">' + ex.n + '</td><td class="num">' + ex.last + " / " + ex.total + '</td><td class="num">' + ex.best + " / " + ex.total + '</td><td class="num">' + fmt(ex.used) + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
  const tally = {};
  ids.forEach(id => { const q = QID[id]; (store.ans[id].hist || []).forEach(v => { if (v !== q.k) { const k = errOf(q, v).k; tally[k] = (tally[k] || 0) + 1; } }); });
  const tc = Object.keys(tally).filter(k => ERR[k]).map(k => [ERR[k].n, tally[k], k]).sort((a, b) => b[1] - a[1]);
  if (tc.length) {
    const top = tc[0];
    h += '<div class="rsec"><h2>Errors that catch you</h2><p class="small">Counts every wrong answer across all your attempts.</p>' + bars(tc.slice(0, 12), "") + '<div class="insight"><b>Your main weak spot: ' + esc(top[0]) + "</b><p>" + esc(ERR[top[2]].s) + "</p><p>" + esc(ERR[top[2]].avoid) + '</p><div class="btns"><button class="btn sm" data-act="errdrill" data-k="' + top[2] + '">Practice this error (' + errQs(top[2]).length + ")</button></div></div></div>";
    const rc = Object.keys(REASONS).map(r => [REASONS[r].t, ids.filter(id => store.ans[id].r === r).length, r]).filter(r => r[1]).sort((a, b) => b[1] - a[1]);
    h += '<div class="rsec"><h2>Reasons you gave</h2>' + (rc.length ? bars(rc, "r") + '<div class="insight"><b>Advice</b><p>' + esc(REASONS[rc[0][2]].a) + "</p></div>" : '<p class="empty">When you answer “Why did you choose it?” after a mistake, personal advice appears here.</p>') + "</div>";
  }
  h += '<div class="rsec"><h2>Mistakes notebook</h2>';
  if (wrong.length) h += '<p class="small">Questions whose latest answer is wrong. A question leaves the notebook once you solve it correctly.</p><div class="btns" style="margin-bottom:6px"><button class="btn primary" data-act="quick" data-k="mist">Solve them all again (' + wrong.length + ')</button></div><ul class="wlist">' + wrong.map(id => {
    const q = QID[id], r = store.ans[id], x = errOf(q, r.last);
    return '<li><span class="mono">' + esc(q.set.title) + " · question " + q.no + " · " + esc(SKILLS[q.sk].n) + (r.wrong > 1 ? " · wrong " + r.wrong + " times" : "") + "</span>" +
      (q.ty === "r" ? '<p class="small">' + esc(q.body.g) + "</p>" : '<p class="hd">' + sentenceOf(q, "____").replace("<b>____</b>", '<span class="blank"></span>') + "</p>") +
      '<p><span class="lab">You chose</span>' + hd(q, r.last) + '</p><p><span class="lab">Correct</span>' + hd(q, q.k) + '</p><p><span class="ttag">' + esc(x.n) + "</span>" + (r.r ? ' <span class="small">· ' + REASONS[r.r].t + "</span>" : "") + '</p><p class="small">' + esc(x.note) + "</p>" +
      '<details class="more"><summary>Explanation and rule</summary><p style="margin-top:8px">' + esc(q.why) + '</p><p class="small" style="margin-top:6px"><b>' + esc(SKILLS[q.sk].n) + ".</b> " + esc(SKILLS[q.sk].tip) + "</p></details></li>";
  }).join("") + "</ul>";
  else h += "<p>No wrong answers at the moment.</p>";
  h += "</div>";
  h += '<div class="rsec plain"><h2>Clear results</h2>' + (S.confirmReset ? '<p>All results and the mistakes notebook will be deleted. Continue?</p><div class="btns"><button class="btn danger" data-act="reset2">Yes, delete</button><button class="btn" data-act="reset0">Cancel</button></div>' : '<button class="btn" data-act="reset1">Delete all results</button>') + "</div></section>";
  return h;
}

/* ===================== RENDER AND EVENTS ===================== */
function render(){
  const v = S.view;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", (b.dataset.v === v || ((v === "sess" || v === "fin") && b.dataset.v === "lib")) ? "page" : "false"));
  document.getElementById("app").innerHTML = v === "sess" ? sessHTML() : v === "fin" ? finishHTML() : v === "rules" ? rulesHTML() : v === "stats" ? statsHTML() : libHTML();
}
function keep(fn){ const y = window.scrollY; fn(); render(); window.scrollTo(0, y); }
function narrow(){ return window.innerWidth <= 900; }
function goQ(){
  S.sess.warn = false; render();
  if (narrow()) { const g = document.getElementById("sgrid"); if (g) g.scrollIntoView({ block:"start" }); } else window.scrollTo(0, 0);
}
function drill(ids, title){ if (ids.length) startSession(shuffle(ids), title, "practice"); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset, s = S.sess, q = S.view === "sess" ? curQ() : null;
  switch (d.act) {
    case "tab": S.view = d.v; S.confirmReset = false; render(); window.scrollTo(0, 0); break;
    case "home": S.view = "lib"; render(); window.scrollTo(0, 0); break;
    case "start": { const st = SBY[d.s]; startSession(st.ids.slice(), st.title, d.m, st.id); break; }
    case "resume": S.view = "sess"; render(); window.scrollTo(0, 0); break;
    case "results": S.view = "fin"; render(); window.scrollTo(0, 0); break;
    case "quick": {
      if (d.k === "exam") startSession(mixedExam(), "Timed module", "exam", "mix");
      if (d.k === "mix") startSession(shuffle(ALLQ).slice(0, 10).map(x => x.id), "Mixed ten", "practice");
      if (d.k === "hard") startSession(shuffle(ALLQ.filter(x => x.lvl === 3)).slice(0, 10).map(x => x.id), "Hard only", "practice");
      if (d.k === "mist") drill(wrongIds(), "My mistakes");
      if (d.k === "new") { const n = ALLQ.filter(x => !store.ans[x.id]).map(x => x.id); if (n.length) startSession(n.slice(0, 10), "Not yet solved", "practice"); }
      break; }
    case "drill": drill(skillQs(d.sk).map(x => x.id), "Rule: " + SKILLS[d.sk].n); break;
    case "errdrill": drill(errQs(d.k).map(x => x.id), "Error: " + ERR[d.k].n); break;
    case "pick": if (q && !shown(s, q.id)) {
      keep(() => { if (s.mode === "exam") s.ans[q.id] = s.ans[q.id] === d.k ? "" : d.k; else s.pick[q.id] = d.k; });
      const f = document.querySelector('.hopt[data-k="' + d.k + '"]'); if (f) f.focus({ preventScroll:true });
    } break;
    case "check": if (q && s.mode === "practice" && s.pick[q.id] && !s.ans[q.id]) {
      keep(() => { s.ans[q.id] = s.pick[q.id]; record(q, s.pick[q.id]); });
      if (narrow()) { const vd = document.querySelector(".verdict"); if (vd) vd.scrollIntoView({ block:"start" }); }
    } break;
    case "hint": if (q) keep(() => { s.hint[q.id] = !s.hint[q.id]; }); break;
    case "flag": if (q) keep(() => { s.flag[q.id] = !s.flag[q.id]; }); break;
    case "next": if (s.idx < s.ids.length - 1) { s.idx++; goQ(); } break;
    case "prev": if (s.idx > 0) { s.idx--; goQ(); } break;
    case "goto": s.idx = +d.i; S.view = "sess"; goQ(); break;
    case "finish": S.view = "fin"; render(); window.scrollTo(0, 0); break;
    case "redowrong": { const w = s.ids.filter(id => !isOk(s, id) && (s.mode === "exam" || s.ans[id])); if (w.length) startSession(w, "Redo the mistakes", "practice"); break; }
    case "submit": if (s.ids.some(id => !s.ans[id])) keep(() => { s.warn = true; }); else submitExam(false); break;
    case "submit2": submitExam(false); break;
    case "nowarn": keep(() => { s.warn = false; }); break;
    case "rule": keep(() => { s.ro[d.uid] = !s.ro[d.uid]; }); break;
    case "reason": keep(() => { const r = store.ans[d.id]; if (r) { r.r = r.r === d.r ? "" : d.r; save(); } }); break;
    case "reset1": keep(() => { S.confirmReset = true; }); break;
    case "reset0": keep(() => { S.confirmReset = false; }); break;
    case "reset2": stopTimer(); store = fresh(); save(); S.sess = null; S.confirmReset = false; render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "sess" || !S.sess || e.metaKey || e.ctrlKey || e.altKey) return;
  const el = e.target; if (el.matches && el.matches("select, textarea, input")) return;
  const s = S.sess, q = curQ(), free = s.mode === "exam" || s.ans[q.id];
  if (e.key === "ArrowRight" && free && s.idx < s.ids.length - 1) { s.idx++; goQ(); }
  else if (e.key === "ArrowLeft" && s.idx > 0) { s.idx--; goQ(); }
  else if (/^[a-dA-D]$/.test(e.key) && !shown(s, q.id)) { const L = e.key.toUpperCase(); keep(() => { if (s.mode === "exam") s.ans[q.id] = L; else s.pick[q.id] = L; }); }
});

/* Links to the sibling trainers show only where the files sit side by side (a site or a local folder) */
(function(){ if (/\.github\.io$/.test(location.hostname) || location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) ["xlink1", "xlink2", "xlink3"].forEach(id => { const x = document.getElementById(id); if (x) x.hidden = false; }); })();

render();
</script>
</body>
</html>
