["A","The term microplastics refers to plastic fragments smaller than five millimetres, roughly the size of a lentil or smaller. [[Some are produced at this size deliberately, while others form when larger items such as bottles and bags break down]] under sunlight and waves. Plastic does not decay in the way that wood or paper does; instead, it breaks into ever smaller pieces that may persist for centuries. Tiny fibres from clothing and dust from car tyres are also counted, which means microplastics come from a surprisingly wide range of sources, both on land and at sea.","i","The paragraph defines microplastics and lists the different ways they are formed.",{ ix:["assumption","The paragraph defines microplastics; the invention of plastic is not discussed."] }],
["B","[[Microplastics have now been found almost everywhere scientists have looked.]] They have been detected in the deepest ocean trenches, in Arctic sea ice and in the snow of high mountains, places that most people imagine to be untouched by human activity. Some are carried long distances by wind and fall with rain, so that even areas far from cities receive a steady supply. Rivers carry particles from inland areas to the coast, and ocean currents then spread them across entire seas. Scientists have also found them in soils, where they may affect the worms and microorganisms that keep the ground fertile.","ii","The paragraph shows that microplastics have reached even the most remote environments.",null],
["C","Because they are so small, microplastics are easily eaten by plankton and other tiny animals at the base of the food chain, which often mistake them for food. [[From there, they pass to fish, shellfish and the animals that eat them]], and they have been found in the stomachs of seabirds, seals and whales. Humans take them in through seafood, drinking water and even salt, as well as by breathing in particles from the air indoors. Particles have been detected in samples of human blood and other tissues, confirming that they can enter the body.","iii","The paragraph traces how microplastics pass from tiny organisms to larger animals and humans.",{ viii:["degree","The paragraph shows that particles are present in the body, not that they cause illness."] }],
["D","[[What this means for human health is still unclear.]] Laboratory studies suggest that high doses can cause inflammation and other damage in animals, and plastics may carry harmful chemicals, either added during manufacture or picked up from the environment. However, the doses used in such experiments are often far higher than those people actually receive. Measuring the very small amounts present in real diets is difficult, and samples are easily contaminated by plastic in the laboratory itself, from clothing, equipment or even the air. Many scientists therefore call for better methods before firm conclusions are drawn.","iv","The paragraph explains that the health effects are uncertain and hard to measure.",{ viii:["degree","The paragraph stresses uncertainty; nothing has been proven."] }],
["E","Public campaigns have often focused on plastic bags, bottles and straws, which are easy to see on beaches and in the sea. [[Some of the largest sources of microplastics, however, are far less visible.]] Washing synthetic clothes releases thousands of fibres in a single load, many of them too small to be caught by water treatment plants. The gradual wearing down of car tyres produces large quantities of plastic dust that is washed from roads into rivers whenever it rains, and some studies suggest that tyres may be among the most important sources of all. Paint from buildings, roads and ships adds further particles.","v","The paragraph identifies clothing fibres and tyre dust as large but overlooked sources.",{ i:["neighbour","Fibres and tyre dust were listed in Paragraph A; here the point is that these large sources are overlooked."] }],
["F","[[Some governments have begun to act on specific sources.]] Several countries have banned the tiny plastic beads once common in face washes and toothpastes, which were washed straight down the drain. France has passed a law intended to require filters that capture fibres in new washing machines, and similar measures are being discussed elsewhere. Engineers are also developing tyres that wear down more slowly and road surfaces that trap particles before they reach drains. Each of these measures tackles only part of the problem, but together they could significantly reduce the amount of plastic released each year.","vi","The paragraph describes bans and technical measures aimed at particular sources.",{ x:["focus","These measures stop particles before they are released; none removes plastic from the ocean."] }],
["G","Some projects aim to remove plastic from the sea, using floating barriers or nets towed by boats, and these can collect large items such as fishing nets and containers. Collecting particles smaller than a grain of rice from the open ocean, however, is practically impossible, and attempts to filter seawater on a large scale would also capture plankton and other marine life. [[Most scientists therefore argue that the only lasting solution is to reduce the amount of plastic produced and released in the first place.]] This means designing products that last longer, using less plastic in packaging and ensuring that waste is collected and managed properly.","vii","The paragraph argues that prevention, not clean-up, is the realistic answer.",{ x:["turn","Ocean clean-up is mentioned first only to be dismissed as impractical."] }]
]});
T.push({ id:"language", lvl:3, title:"Learning a Language as an Adult",
H:{ i:"A widely held assumption", ii:"Faster at first, not in the long run", iii:"Why an early start at school may achieve little", iv:"What adults bring to the task", v:"Obstacles that are practical and emotional", vi:"Being understood matters more than sounding native", vii:"Age is not the deciding factor", viii:"The brain stops developing at twelve", ix:"The best textbooks for adult learners", x:"Adults can never achieve fluency" },
D:{ viii:["degree","The passage never mentions brain development or a specific age limit."], ix:["assumption","Study strategies are mentioned in Paragraph D, but no textbooks are discussed."], x:["opposite","The passage argues that adults can learn successfully: it is never too late to start."] },
P:[
["A","It is widely believed that children learn languages effortlessly while adults struggle. A child who moves to a new country seems to pick up the language within months, while the parents may still be searching for words years later. [[This view has been reinforced by the influential idea of a 'critical period': a window in early life after which learning a language to a native level becomes difficult or impossible.]] Parents who enrol toddlers in language classes and adults who give up after a few lessons are often acting on this belief, and education systems in many countries have introduced foreign languages earlier and earlier in primary school.","i","The paragraph presents the widespread belief that childhood is the best time to learn a language.",{ viii:["degree","The 'critical period' is presented as an idea; nothing is said about the brain stopping development at a specific age."] }],
["B","The research picture is more complicated. [[Studies of immigrants suggest that those who arrive as young children are more likely eventually to sound like native speakers, yet adults and teenagers usually make faster progress in the early months.]] Older learners grasp grammar and vocabulary more quickly at first, partly because they can understand explanations and apply rules deliberately. Children, by contrast, learn slowly and gradually, absorbing the language through constant exposure in play and at school. Their advantage appears only after many years of immersion, and even then it is most visible in pronunciation and in a subtle feel for what sounds natural.","ii","The paragraph shows that adults progress faster at first, while young children tend to do better eventually.",{ x:["degree","Adults are said to progress faster at first; the paragraph never says they cannot become fluent."] }],
["C","These findings, however, concern people living in a new country and surrounded by the language every day. [[In classrooms, where pupils may receive only two or three hours a week, the benefits of an early start appear much smaller.]] A few hours of lessons cannot provide anything like the vast quantity of exposure that immersion offers. Several studies comparing children who began a foreign language at different ages in school found that later starters often caught up within a few years, and sometimes overtook those who had started earlier. Early lessons may still have value, for example in building positive attitudes, but they rarely produce the dramatic advantage that parents expect.","iii","The paragraph argues that with limited lesson time, starting young brings little advantage.",{ ii:["neighbour","Faster early progress was the subject of Paragraph B; here the point is that early school lessons achieve little."] }],
["D","[[Adults also bring resources that children lack.]] They can read and write, use dictionaries and grammar explanations, and reflect consciously on how a language works, comparing it with languages they already know. Many have learned other skills before and can apply effective study strategies, such as spacing their practice or testing themselves rather than simply rereading notes. Adults also tend to know what they want to use the language for, whether for work, travel or study, and can focus on the vocabulary and situations that matter most to them. These advantages help to explain their rapid progress in the early stages.","iv","The paragraph lists strengths that adult learners possess.",{ ix:["assumption","Dictionaries and grammar explanations are mentioned, but no textbooks are recommended."] }],
["E","Their difficulties are often less to do with ability than with circumstances. [[Adults usually have less time to study, fewer opportunities to hear and use the language, and a stronger fear of making mistakes in public.]] Work and family responsibilities leave little energy for lessons, and many adults spend most of their day using their first language. Embarrassment can lead them to avoid speaking altogether, which deprives them of exactly the practice they need. Children, in contrast, are often less self-conscious and are surrounded by classmates who expect them to join in, whether or not their grammar is correct.","v","The paragraph explains that adults' problems come from limited time and exposure, and from anxiety.",{ x:["opposite","The paragraph says adults' problems are not mainly about ability."] }],
["F","Pronunciation is the area where age seems to matter most: few people who start as adults lose their accent completely, however long they live abroad. [[Yet researchers increasingly argue that the goal should be intelligibility rather than a native-like accent.]] Many highly successful speakers of a second language, including well-known writers, scientists and politicians, have a clear foreign accent but are easily understood, and listeners quickly adapt to them. Teaching, it is argued, should therefore concentrate on the features of pronunciation that cause real misunderstanding, rather than on removing every trace of an accent.","vi","After 'Yet', the paragraph argues that being understood matters more than sounding native.",{ x:["turn","The opening admits that accents remain, but the main point is that this does not prevent success."] }],
["G","[[Taken together, the evidence suggests that age is only one factor among many, and rarely the decisive one.]] Motivation, the amount of contact with the language, the quality of teaching and the learner's opportunities to use the language in real situations often predict success more reliably. An adult who studies regularly and seeks out conversation may well outperform a child who receives a few lessons a week. For adults, the practical message is encouraging: it is never too late to start, and many of the obstacles they face can be reduced by planning study time and finding supportive settings in which to practise.","vii","The paragraph concludes that factors other than age are usually more important.",{ i:["opposite","The paragraph rejects the belief described in Paragraph A rather than presenting it."] }]
]});

T.push({ id:"navigation", lvl:3, title:"How Animals Find Their Way",
H:{ i:"Journeys of astonishing precision", ii:"Using the sun and an internal clock", iii:"Lessons from the night sky", iv:"An invisible map in the Earth itself", v:"Following a familiar scent", vi:"Instinct for the young, experience for the old", vii:"Navigation disrupted by human activity", viii:"Why animals migrate in winter", ix:"Tracking animals with satellites", x:"Animals that never leave home" },
D:{ viii:["focus","The passage explains how animals navigate, not why they migrate."], ix:["assumption","Satellite tracking is never mentioned."], x:["opposite","Every paragraph concerns animals that travel."] },
P:[
["A","Every year, billions of animals make journeys that would challenge a human with a map and a compass. [[Some travel thousands of kilometres and arrive at exactly the place they set out from]]: Arctic terns fly between the polar regions, salmon return from the ocean to the stream where they hatched, and sea turtles come back to nest on the beaches where they were born, often after many years at sea. Even small songbirds weighing less than a coin may cross deserts and seas on their way to distant feeding grounds. How they achieve such precision has puzzled naturalists for centuries, and only in recent decades have scientists begun to understand the senses involved.","i","The paragraph highlights how far, and how accurately, some animals travel.",{ viii:["focus","The paragraph describes the journeys themselves, not the reasons for migrating."] }],
["B","[[One of the simplest tools animals use is the sun.]] Because the sun moves across the sky during the day, an animal can only use it as a compass if it also knows the time: at sunrise the sun lies roughly in the east, but by midday it has moved a long way across the sky. Experiments with birds and honeybees have shown that they combine the sun's position with an internal clock, adjusting their direction as the hours pass. When researchers shifted birds' internal clocks by keeping them under artificial light, the birds set off in predictably wrong directions, confirming that timing is essential to the system.","ii","The paragraph explains how animals use the sun together with a sense of time.",{ iii:["neighbour","The sky is involved, but stars and night-time navigation belong to Paragraph C."] }],
["C","Many songbirds migrate at night, when the sun is not available and the air is cooler and calmer. [[Planetarium experiments have shown that some species learn the pattern of stars around the point in the sky that stays still as the Earth turns]], and use it to find north. Remarkably, this knowledge is not inherited in detail: young birds must observe the night sky while they are growing. Birds raised under an artificial sky that rotated around a different star oriented themselves to that star instead, showing that they learn the centre of rotation rather than any particular pattern.","iii","The paragraph describes how night-flying birds learn to navigate by the stars.",null],
["D","[[Perhaps the most mysterious sense is the ability to detect the Earth's magnetic field.]] The field varies in strength and angle from place to place, and sea turtles, for example, appear to recognise these local values, which gives them a kind of map. Young turtles placed in tanks that reproduce the magnetic conditions of distant locations swim in the direction that would carry them home. How animals sense magnetism, however, remains a matter of debate: some scientists believe that particles of a magnetic mineral act like tiny compass needles, while others suggest that special molecules in the eye are involved, and several competing explanations are still being tested.","iv","The paragraph is about the magnetic sense that gives animals a kind of map.",null],
["E","Close to home, other senses take over. Magnetic and celestial cues may bring an animal to the right region, but they are rarely precise enough to identify a single river or nest. [[Salmon appear to recognise the chemical scent of the river in which they were born]], allowing them to choose the right stream among many as they swim upriver. Experiments in which young salmon were exposed to particular chemicals, and later returned to streams containing them, support this idea. Some seabirds also seem to use smell to find their way across open water, perhaps by detecting the odours of feeding areas carried on the wind.","v","The paragraph explains how animals use smell to find home in the final stage of a journey.",{ i:["neighbour","Salmon returning home were introduced in Paragraph A; here the focus is the sense of smell they use."] }],
["F","[[A classic experiment revealed a difference between young and experienced migrants.]] Thousands of birds caught during their autumn migration were moved hundreds of kilometres sideways and released. Adults corrected their course and reached their usual winter grounds, apparently aware that they had been displaced. Young birds on their first journey, however, kept flying in the same inherited direction and ended up somewhere new. The results suggest that first-time migrants follow a simple programme of direction and distance, while experienced birds have learned a map that allows them to correct mistakes.","vi","The paragraph contrasts inherited direction in young birds with learned navigation in adults.",{ ix:["assumption","Birds were caught and moved, but tracking technology is not mentioned."] }],
["G","[[Human activity is increasingly interfering with these abilities.]] Bright lights along coasts can draw newly hatched turtles away from the sea, towards roads and buildings, and city lighting confuses birds migrating at night, causing many to collide with tall structures. Some experiments have even suggested that electronic noise from human equipment can disrupt birds' magnetic sense. In response, some coastal towns now dim their lights during the turtle nesting season, and a few cities switch off decorative lighting on skyscrapers during the main migration periods.","vii","The paragraph describes how light and electronic noise disturb animal navigation.",{ iv:["wordmatch","The magnetic sense is mentioned only as something humans disrupt; it is explained in Paragraph D."] }]
]});

T.push({ id:"crowds", lvl:3, title:"The Wisdom of Crowds",
H:{ i:"A surprise at a country fair", ii:"Errors that cancel each other out", iii:"When the crowd stops thinking independently", iv:"How early votes shape later opinion", v:"Putting collective judgement to work", vi:"Questions crowds cannot answer", vii:"Asking first, discussing later", viii:"Experts are always wrong", ix:"The history of opinion polls", x:"Larger groups always decide better" },
D:{ viii:["degree","Paragraph E says crowds often did better than specialists, which is far from saying experts are always wrong."], ix:["assumption","Opinion polls are not discussed."], x:["degree","Paragraphs C and F describe situations where groups perform poorly."] },
P:[
["A","In 1906, the scientist Francis Galton visited a country fair in England where visitors paid to guess the weight of an ox once it had been slaughtered and prepared. Galton, who doubted the judgement of ordinary people, collected the entries afterwards, expecting to find evidence of their poor estimates. Some of the people who entered were butchers and farmers, but most had no special knowledge of cattle. [[To his surprise, the middle value of the roughly 800 guesses was almost exactly the true weight]], closer than the great majority of individual estimates. Galton published his findings in a scientific journal, admitting that the result reflected better on popular judgement than he had expected.","i","The paragraph tells how the combined guesses of a crowd proved surprisingly accurate.",{ ix:["assumption","Galton collected guesses at a fair; opinion polls are not discussed."] }],
["B","[[The explanation lies in how errors behave when many independent estimates are combined.]] Each guess contains some truth and some error. If people's mistakes are unrelated, some will guess too high and others too low, and there is no reason for the errors to lean in one direction. When the estimates are averaged, much of the error cancels out, leaving a figure closer to the truth than most individuals manage. The larger and more varied the group, the more completely this cancelling tends to work. The same principle explains why scientists repeat measurements and take an average rather than relying on a single reading.","ii","The paragraph explains that independent errors balance each other out when averaged.",null],
["C","This effect depends on two conditions: the crowd must be diverse, and its members must judge independently. [[When people are influenced by one another, their errors tend to point in the same direction]], and the average simply reflects a shared mistake. In experiments where participants were told others' estimates before giving their own, the range of answers narrowed and people became more confident, yet the group's accuracy did not improve. A group that hears a confident opinion before forming its own may end up less accurate than its members would have been alone.","iii","The paragraph explains that crowds lose accuracy when members influence each other.",{ x:["opposite","The paragraph shows that a group can be less accurate than its members alone."] }],
["D","Online ratings offer a clear example. [[In one experiment on a news website, comments that randomly received an early positive vote were significantly more likely to attract further positive votes later.]] Comments given an early negative vote, by contrast, showed no lasting effect, as other readers tended to correct it. Initial opinions, in other words, can snowball, so that ratings reflect the order in which people voted as much as the quality of the item. Similar effects have been observed with music downloads, where songs that appeared popular early on went on to become far more successful than songs of similar quality.","iv","The paragraph shows how early online votes influence later ones.",{ iii:["broad","This describes the general principle of Paragraph C; Paragraph D gives a specific case about early votes."] }],
["E","Despite these risks, organisations have found practical ways to use collective judgement. [[Some combine the forecasts of many people to predict sales, project deadlines or economic trends]], either by averaging their estimates or by allowing them to trade on the likely outcome, as in a market. In forecasting competitions, the averaged predictions of large groups of carefully selected volunteers have often outperformed those of individual specialists. Some companies have also asked their own staff to estimate when projects will be finished, at times obtaining more realistic dates than official plans.","v","The paragraph describes practical uses of combined forecasts.",{ viii:["degree","The paragraph says crowds have often outperformed specialists, not that experts are always wrong."] }],
["F","The method has clear limits, however. [[Averaging works only when individuals possess at least some relevant knowledge]]; combining many uninformed guesses about a technical question, such as the safe dose of a new drug, simply produces an uninformed average. Crowds may also share the same biases, for example overestimating dramatic risks, in which case their errors do not cancel out. Nor can a crowd settle questions of value, such as what is fair or beautiful, where there is no single correct answer to find. On such matters, a vote may tell us what most people prefer, but not what is true.","vi","The paragraph explains the kinds of questions where crowds fail.",{ x:["opposite","The paragraph sets out situations where groups do not produce good answers."] }],
["G","[[The research has practical lessons for meetings and committees.]] Instead of opening with a discussion, which allows the most senior or confident voices to dominate, a group can first collect each member's view privately, in writing. Quieter members, who may hold important information, are then more likely to contribute. Only then should people discuss the results, so that independent information is not lost before it has been shared. Some organisations also ask members to explain their reasoning briefly, which helps the group to identify where disagreements come from rather than simply counting opinions.","vii","The paragraph recommends collecting private opinions before group discussion.",{ iii:["neighbour","Loss of independence was explained in Paragraph C; here the focus is a practical method for meetings."] }]
]});

T.push({ id:"rewild", lvl:3, title:"The Case for Rewilding",
H:{ i:"Letting nature take the lead", ii:"A famous case under re-examination", iii:"Grazing animals as habitat makers", iv:"Tension with those who work the land", v:"New sources of income", vi:"Doubts about the whole idea", vii:"Rewilding on a smaller scale", viii:"Proof that predators control every ecosystem", ix:"Building new parks in cities", x:"Recreating the landscape of the distant past" },
D:{ viii:["degree","Paragraph B says later research found other factors also mattered."], ix:["assumption","Urban parks are not discussed."], x:["opposite","Paragraph F argues that there is no single natural state to return to."] },
P:[
["A","Traditional conservation has often focused on protecting particular species or managing habitats carefully, for example by cutting grass, removing scrub or controlling water levels to maintain the conditions that rare plants and animals require. Such work is effective but demands constant effort and funding. [[Rewilding takes a different approach: it aims to restore natural processes and then allow nature to manage itself]] with as little human intervention as possible. Rivers may be allowed to flood, trees to fall and decay, and vegetation to develop without a fixed plan. This often involves bringing back animals that have disappeared from a region, since their feeding and movement shape the landscape.","i","The paragraph defines rewilding as restoring natural processes and then stepping back.",{ x:["assumption","The paragraph speaks of restoring processes, not of recreating a historical landscape."] }],
["B","The best-known example is the return of wolves to Yellowstone National Park in the United States in 1995, some seventy years after they had been eliminated there. Early studies reported that wolves reduced the number of elk and changed their behaviour, allowing young trees along rivers to recover and setting off a chain of effects that reached birds, beavers and even the shape of the riverbanks. The story became famous worldwide as a demonstration of the power of predators. [[More recent research, however, suggests that the story is more complicated]], since other factors, including hunting by humans, drought and the growth of bear populations, also played a role.","ii","The paragraph presents the famous wolf example and explains that newer research questions the original story.",{ viii:["degree","The paragraph ends by saying other factors also mattered, so it proves nothing about every ecosystem."] }],
["C","In Europe, rewilding projects have often relied on large grazing animals rather than predators, partly because predators are difficult to accept in crowded landscapes. On one former farm in southern England, where intensive agriculture had stopped being profitable, free-roaming cattle, ponies, pigs and deer were introduced, and [[their grazing, trampling and rooting created a mixture of open ground, scrub and woodland]]. The result was a constantly changing patchwork rather than a uniform forest. Rare birds and insects that had vanished from the area soon returned, and some species were recorded there in greater numbers than almost anywhere else in the country.","iii","The paragraph shows how grazing animals shaped a varied set of habitats.",null],
["D","[[Bringing back large animals inevitably creates conflict with people who live and work nearby.]] Farmers fear for their sheep and cattle when wolves or lynx return, and some feel that decisions are being made by people in cities who will not bear the consequences. Beavers can flood fields and damage trees by blocking streams, while large herbivores may wander onto roads. Many schemes now offer compensation for losses or pay for protective fences and guard dogs, but trust between conservationists and rural communities is often fragile, and a single incident can undo years of careful negotiation.","iv","The paragraph is about conflict between rewilding and farming communities.",{ vii:["wordmatch","Beavers appear here as a cause of conflict; their positive role is discussed in Paragraph G."] }],
["E","For some rural areas, however, rewilding has brought unexpected benefits. [[Visitors pay to watch wildlife, stay in local guesthouses and join guided walks]], creating jobs in places where farming had become unprofitable and young people were leaving. Safari-style tours, photography holidays and nature festivals have all appeared in regions that once had little to offer tourists. In such cases, wild animals can be worth more alive than the land was under cultivation, and some landowners have found that income from visitors is more reliable than income from crops or livestock.","v","The paragraph describes rewilding creating income through wildlife tourism.",{ iv:["neighbour","The opening 'however' contrasts with the conflict in Paragraph D; this paragraph is about benefits."] }],
["F","Not everyone is convinced. [[Critics argue that rewilding can sweep away cultural landscapes, such as traditional meadows and hedgerows, that people value and that support their own wildlife.]] Some of the most species-rich habitats in Europe were created by centuries of farming, and they may disappear if management stops. Others point out that there is no single 'natural' state to return to, since landscapes have always changed, and that the results of releasing animals are hard to predict. A project designed to restore one kind of habitat may produce something quite different, with consequences that are difficult to reverse.","vi","The paragraph sets out several criticisms of rewilding.",{ x:["opposite","The paragraph says there is no single natural state to return to."] }],
["G","[[Rewilding need not involve vast areas or dangerous predators.]] Releasing beavers into small streams has been shown to slow floodwater and create wetlands that support insects, frogs and birds, and in some places this has reduced flooding in villages downstream. Farmers can leave field edges to grow wild, and gardeners can let parts of their lawns become meadows or leave dead wood for insects. Supporters argue that thousands of such small projects, taken together, could make a significant difference, especially if they are connected so that wildlife can move between them.","vii","The paragraph focuses on small-scale rewilding projects.",{ ix:["assumption","Gardens are mentioned, but not new parks in cities."] }]
]});

T.push({ id:"antibiotics", lvl:3, title:"The Rise of Antibiotic Resistance",
H:{ i:"A foundation of modern medicine", ii:"Evolution at work", iii:"Overuse in clinics and on farms", iv:"An empty pipeline", v:"Ordinary infections become dangerous again", vi:"Looking beyond conventional drugs", vii:"A problem that ignores borders", viii:"Bacteria that are harmless to humans", ix:"Antibiotics that cure viral infections", x:"Companies racing to develop new antibiotics" },
D:{ viii:["assumption","The passage is about harmful bacteria; harmless species are not discussed."], ix:["opposite","Paragraph C says antibiotics have no effect on viral infections."], x:["opposite","Paragraph D says companies have little financial reason to develop antibiotics."] },
P:[
["A","Before antibiotics became widely available in the 1940s, a scratch, a sore throat or a difficult childbirth could lead to a fatal infection, and doctors had few effective treatments to offer. [[Since then, these drugs have become one of the foundations of modern medicine]]: routine operations, cancer treatment, organ transplants and the care of premature babies all depend on the ability to prevent or cure bacterial infections. Many procedures that are now considered safe would carry a serious risk of death without them. It is therefore no exaggeration to say that much of the progress of modern medicine rests on these drugs.","i","The paragraph explains how essential antibiotics have become to modern medical care.",null],
["B","[[Resistance is a natural consequence of evolution.]] When bacteria are exposed to an antibiotic, most die, but a few may carry random genetic changes that allow them to survive. These survivors multiply, and since bacteria can divide every twenty minutes or so in favourable conditions, a resistant population can develop remarkably quickly. Bacteria can also pass genes directly to one another, so resistance can spread rapidly, even between different species. Resistance was observed soon after the first antibiotics came into use, and the scientists who developed them warned that careless use would make the problem worse.","ii","The paragraph explains how resistance develops through survival of the fittest and gene sharing.",{ viii:["assumption","The paragraph explains how resistance spreads; it does not discuss whether bacteria are harmful."] }],
["C","Human behaviour has greatly accelerated this process. [[Antibiotics are frequently prescribed for colds and other viral infections, against which they have no effect]], often because patients expect a prescription or doctors are uncertain of the cause. In some countries, they can be bought without a prescription at all, and every unnecessary course gives bacteria another opportunity to develop resistance. In agriculture, large quantities have been given to healthy animals, sometimes simply to make them grow faster, a practice that some regions, including the European Union, have now banned.","iii","The paragraph describes unnecessary use of antibiotics in medicine and in farming.",{ ix:["opposite","The paragraph states that antibiotics have no effect on viral infections."] }],
["D","At the same time, the supply of new drugs has slowed dramatically. In the middle decades of the twentieth century, new classes of antibiotics were discovered at a rapid pace. [[Very few genuinely new classes, however, have reached patients in recent decades.]] For pharmaceutical companies, developing an antibiotic is expensive and offers poor returns: patients take it for days rather than years, and doctors are encouraged to keep new drugs in reserve for the most serious cases, which limits sales. Several large companies have therefore abandoned antibiotic research altogether, leaving the field largely to small firms and universities.","iv","The paragraph explains why few new antibiotics are being developed.",{ x:["opposite","The paragraph says companies have little financial reason to develop new antibiotics."] }],
["E","The consequences are already visible. [[Infections of the urinary tract, lungs and blood that were once easily treated now sometimes require several attempts with different drugs, or cannot be cured at all.]] Patients may spend longer in hospital, and doctors may be forced to use older drugs with more serious side effects. Infections acquired in hospitals are of particular concern, since vulnerable patients are exposed to resistant bacteria. One major study estimated that resistant bacteria were directly responsible for more than a million deaths worldwide in a single year.","v","The paragraph shows that once-simple infections are becoming hard or impossible to treat.",null],
["F","[[Researchers are exploring alternatives to conventional antibiotics.]] One approach uses phages, viruses that infect and kill specific bacteria while leaving human cells unharmed. Phages were studied in the early twentieth century but were largely forgotten in many countries once antibiotics arrived. Other researchers are developing substances that disarm bacteria rather than killing them, which may put less pressure on bacteria to evolve resistance. Still others aim to prevent infections in the first place, for example through new vaccines, so that fewer antibiotics are needed.","vi","The paragraph outlines alternative approaches such as phages and vaccines.",{ ix:["wordmatch","Viruses are mentioned as a weapon against bacteria, not as infections that antibiotics cure."], viii:["wordmatch","It is the phages, not the bacteria, that leave human cells unharmed."] }],
["G","Because resistant bacteria travel with people, animals and food, [[no country can solve the problem alone]]. A resistant strain that emerges in one hospital can appear on another continent within months, carried by travellers who show no symptoms. Experts therefore call for international cooperation to monitor resistance, regulate the use of antibiotics in farming and share the costs of developing new treatments, perhaps by paying companies a fixed reward for successful new drugs rather than relying on sales. Without such coordination, the efforts of individual countries may be undone by weaker controls elsewhere.","vii","The paragraph argues that resistance is a global problem that requires cooperation.",{ iii:["detail","Farming regulation is one of several areas of cooperation; the paragraph's focus is international action."] }]
]});

"museums-A":{ p:[["sudden","Within weeks"],["move online","find new ways to reach visitors through screens"]], s:"The first two sentences describe the starting point: little online experience and basic websites. The third states the change, and the rest gives examples of it: video tours, online workshops, opened databases and live events." },

"museums-C":{ p:[["Reaching people","attracted people"],["far away","who could never travel to the museum itself"]], s:"The topic sentence is followed by examples of these audiences: distant students, people with disabilities, those who cannot afford the journey and remote communities. The final sentence about short online visits is a qualification, not the main idea." },

  t.P.forEach(q => { t.ans[q.a] = q.L; t.pm[q.L] = q; QID[q.id] = q; ALLQ.push(q); });
  t.mins = Math.round(t.P.length * 1.5);
});
const TOTALQ = ALLQ.length;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function plain(t){ return t.replace(/\[\[|\]\]/g, ""); }
function ptext(t, ev){ const e = esc(t); return ev ? e.replace(/\[\[(.+?)\]\]/g, '<mark class="ev">$1</mark>') : e.replace(/\[\[|\]\]/g, ""); }
function sentences(t){ return t.split(/(?<=[.!?]['’”"]?(?:\]\])?)\s+(?=(?:\[\[)?['‘“"]?[A-Z])/); }
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmt(sec){ sec = Math.max(0, sec); return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hd(t, k){ return '<span class="hd"><b>' + k + "</b>" + esc(t.H[k]) + "</span>"; }
function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s"); }

/* Where the main idea sits: sentence list, index of the key sentence, and any turn signal that opens it */
function keyInfo(q){
  if (q.ki) return q.ki;
  const ss = sentences(q.t);
  let idx = ss.findIndex(x => x.indexOf("[[") > -1); if (idx < 0) idx = 0;
  const m = plain(ss[idx]).match(/^(However|Yet|But|In fact|Instead|Nevertheless|In reality|In practice|Still)\b/);
  q.ki = { ss, idx, n:ss.length, pos:idx === 0 ? "first" : idx === ss.length - 1 ? "last" : "mid", sig:m ? m[1] : "", ev:ss.filter(x => x.indexOf("[[") > -1).map(plain).join(" … ") };
  return q.ki;
}
function posText(q){
  const k = keyInfo(q);
  if (k.pos === "first") return "The main idea opens the paragraph (sentence 1 of " + k.n + "). Everything after it is support: reasons, examples and figures.";
  if (k.pos === "last") return "The main idea closes the paragraph (sentence " + k.n + " of " + k.n + "). The earlier sentences build up to it.";
  return "The main idea sits in sentence " + (k.idx + 1) + " of " + k.n + ". The opening only sets the scene, so a heading that fits just the first lines is a trap." + (k.sig ? " The signal “" + k.sig + "” marks the turn." : "");
}
function hintText(q){
  const k = keyInfo(q);
  if (k.pos === "first") return "Start with the opening sentence, then check that the remaining sentences support it rather than change direction.";
  if (k.pos === "last") return "The opening sentences only prepare the ground. Read the final sentence closely.";
  return "Do not stop at the first sentence. The main idea arrives in sentence " + (k.idx + 1) + ": read it, then check that the rest of the paragraph develops it.";
}
function pmapHTML(q){
  const k = keyInfo(q);
  return '<div class="pmap" role="img" aria-label="Paragraph map: sentence ' + (k.idx + 1) + " of " + k.n + ' carries the main idea">' + k.ss.map((x, i) => '<i class="' + (x.indexOf("[[") > -1 ? "k" : "") + '" style="flex:' + Math.max(4, x.split(/\s+/).length) + ' 1 0"></i>').join("") + "</div>";
}

/* Which trap a wrong heading is, and why it is wrong for this paragraph */
function trapOf(t, q, v, reveal){
  if (!v) return { k:"blank", note:"" };
  if (q.tr[v]) return { k:q.tr[v][0], note:q.tr[v][1] };
  if (t.ans[v]) {
    const o = t.pm[t.ans[v]];
    if (reveal || store.ans[o.id]) return { k:"other", note:"Heading " + v + " states the main idea of paragraph " + o.L + ". " + o.why + " Paragraph " + q.L + " makes a different point." };
    return { k:"other", note:"This heading states the main idea of a different paragraph in the passage, so it cannot be used here." };
  }
  if (t.D[v]) return { k:t.D[v][0], note:"This is a spare heading: it fits no paragraph in the passage. " + t.D[v][1] };
  return { k:"other", note:"" };
}
function trapParas(k){ return ALLQ.filter(q => Object.keys(q.tr).some(h => q.tr[h][0] === k)); }
function trapCount(k){ return trapParas(k).length; }
function trapExample(k){
  for (const t of T) for (const q of t.P) for (const h of Object.keys(q.tr)) if (q.tr[h][0] === k) return '<div class="exbox"><span class="lab">From the tests · Test ' + t.no + ", paragraph " + q.L + "</span><span>Trap heading: " + hd(t, h) + "</span><span>" + esc(q.tr[h][1]) + "</span></div>";
  if (k === "other") return '<div class="exbox"><span class="lab">Example</span><span>If the heading of paragraph C is given to paragraph A, paragraph C is left without its heading too: one mistake becomes two.</span></div>';
  return "";
}
function ruleHTML(k){ const x = TRAPS[k]; return "<p>" + esc(x.l) + '</p><p><span class="lab">How to avoid it</span>' + esc(x.avoid) + "</p>" + trapExample(k); }

/* ===================== STORAGE ===================== */
const KEY = "mh-pro-v2";
function fresh(){ return { ans:{}, exams:{} }; }
let store = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.ans) store = Object.assign(fresh(), s); } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
function record(q, v){
  const r = store.ans[q.id] || { n:0, wrong:0, hist:[] };
  r.n++; r.last = v; r.ok = v === q.a; if (!r.ok) r.wrong++;
  r.hist = (r.hist || []).concat(v).slice(-10); r.r = "";
  store.ans[q.id] = r; save();
}
function answeredIds(){ return Object.keys(store.ans).filter(k => QID[k]); }
function wrongIds(){ return answeredIds().filter(k => !store.ans[k].ok); }

const S = { view:"lib", sess:null, timer:null, confirmReset:false };

/* ===================== SESSION ===================== */
function startSession(ids, title, mode, tid){
  stopTimer();
  S.sess = { ids, title, mode, tid:tid || null, idx:0, ans:{}, pick:{}, hint:{}, open:{}, ro:{}, full:false, submitted:false, auto:false, left:mode === "exam" ? TBY[tid].mins * 60 : 0, used:null };
  S.view = "sess"; render(); window.scrollTo(0, 0); focusPara();
  if (mode === "exam") S.timer = setInterval(tick, 1000);
}
function stopTimer(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function tick(){
  const s = S.sess; if (!s || s.submitted || s.mode !== "exam") return stopTimer();
  s.left--;
  if (s.left <= 0) { s.left = 0; submitExam(true); return; }
  const el = document.getElementById("clock"); if (el) { el.textContent = fmt(s.left); el.classList.toggle("low", s.left < 120); }
}
function sessOpen(){ const s = S.sess; return !!s && (s.mode === "exam" ? !s.submitted : s.ids.some(id => !s.ans[id])); }
function isOk(s, id){ return s.ans[id] === QID[id].a; }
function curQ(){ const s = S.sess; return s && s.mode === "practice" ? QID[s.ids[s.idx]] : null; }

function sessHTML(){
  const s = S.sess, exam = s.mode === "exam";
  const q = exam ? null : QID[s.ids[s.idx]];
  const t = exam ? TBY[s.tid] : q.T;
  const okN = s.ids.filter(id => isOk(s, id)).length, done = s.ids.filter(id => s.ans[id]).length;
  let h = '<div class="sbar"><button class="btn ghost" data-act="home">← Tests</button><div class="stitle"><span class="mono">' + (exam ? "Exam mode" : "Practice mode") + (s.tid ? " · Test " + t.no : "") + "</span><b>" + esc(s.title) + '</b></div><div class="clockwrap">';
  if (exam) h += s.submitted ? '<span class="mono">Score</span><span class="score num">' + okN + " / " + s.ids.length + "</span>" : '<span class="mono">Time left</span><span id="clock" class="clock num' + (s.left < 120 ? " low" : "") + '">' + fmt(s.left) + "</span>";
  else h += '<span class="mono">Correct</span><span class="score num">' + okN + " / " + done + "</span>";
  h += "</div></div>";
  if (!exam) h += '<div class="strip" role="group" aria-label="Paragraphs">' + s.ids.map((id, i) => {
    let c = "sq"; if (s.ans[id]) c += isOk(s, id) ? " ok" : " bad"; if (i === s.idx) c += " cur";
    const lbl = s.tid ? QID[id].L : i + 1;
    return '<button class="' + c + '" data-act="goto" data-i="' + i + '" aria-label="' + (s.tid ? "Paragraph " + lbl : "Question " + lbl) + '"' + (i === s.idx ? ' aria-current="true"' : "") + ">" + lbl + "</button>";
  }).join("") + "</div>";
  h += '<div class="sgrid" id="sgrid">' + passageHTML(t, s, q) + '<div class="qpane">' + (exam ? examHTML(t, s) : practiceHTML(t, s, q)) + "</div></div>";
  return h;
}

function passageHTML(t, s, q){
  const exam = s.mode === "exam";
  let h = '<article class="passage' + (!exam && !s.full ? " solo" : "") + '" id="passage" aria-label="Passage"><div class="ph"><span class="tag">Level ' + t.lvl + " · " + LEVELS[t.lvl] + '</span><h2 class="ptitle">' + esc(t.title) + '</h2><p class="small">';
  if (exam) h += "The passage has " + t.P.length + " paragraphs, A–" + t.P[t.P.length - 1].L + ". Choose the correct heading for each one. There are more headings than paragraphs, so some will not be used.";
  else h += "You are working on <b>paragraph " + q.L + "</b>. Glance at its neighbours too: a linking sentence can be a trap.";
  h += "</p>";
  if (!exam) h += '<button class="btn ghost sm only-narrow" data-act="full" aria-pressed="' + s.full + '">' + (s.full ? "Show only paragraph " + q.L : "Show the whole passage") + "</button>";
  h += "</div>";
  h += t.P.map(x => {
    const v = s.ans[x.id];
    const shown = exam ? s.submitted : !!v;
    let cls = "para"; if (!exam) cls += x.id === q.id ? " cur" : " dim";
    let pk = "";
    if (shown) pk = '<span class="pk ' + (v === x.a ? "ok" : "bad") + '" title="Correct heading">' + x.a + "</span>";
    else if (exam && v) pk = '<span class="pk">' + v + "</span>";
    return '<p class="' + cls + '" id="para-' + x.L + '"><span class="pl">' + x.L + "</span>" + pk + ptext(x.t, shown) + "</p>";
  }).join("");
  return h + "</article>";
}

/* ---------- Practice mode: one paragraph at a time, full explanation after every answer ---------- */
function practiceHTML(t, s, q){
  const v = s.ans[q.id], done = !!v, pick = s.pick[q.id] || "";
  const usedBy = {};
  t.P.forEach(x => { if (x.id !== q.id && s.ans[x.id]) usedBy[x.a] = x.L; });
  let h = '<section class="card qcard"><div class="qh"><span class="mono">Paragraph ' + q.L + " · " + (s.idx + 1) + " of " + s.ids.length + '</span><span class="mono">Test ' + t.no + " · " + LEVELS[t.lvl] + "</span></div>";
  h += '<p class="instr">Choose the correct heading for paragraph ' + q.L + ".<span>Pick the heading that states the main idea of the whole paragraph, then check your answer.</span></p>";
  h += '<div class="hopts" role="radiogroup" aria-label="List of headings">' + Object.keys(t.H).map(k => {
    let c = "hopt", dis = done, note = "";
    if (done) { if (k === q.a) { c += " right"; note = "correct"; } else if (k === v) { c += " wrong"; note = "your answer"; } }
    else if (usedBy[k]) { c += " used"; dis = true; note = "paragraph " + usedBy[k]; }
    else if (pick === k) c += " sel";
    return '<button class="' + c + '" role="radio" aria-checked="' + (done ? k === v : pick === k) + '" data-act="pick" data-k="' + k + '"' + (dis ? " disabled" : "") + '><span class="rn">' + k + '</span><span class="ht">' + esc(t.H[k]) + "</span>" + (note ? '<span class="un">' + note + "</span>" : "") + "</button>";
  }).join("") + "</div>";
  if (!done) {
    h += '<div class="nav"><button class="btn ghost" data-act="hint" aria-expanded="' + !!s.hint[q.id] + '">' + (s.hint[q.id] ? "Hide hint" : "Hint") + '</button><button class="btn primary" data-act="check"' + (pick ? "" : " disabled") + ">Check answer</button></div>";
    if (s.hint[q.id]) h += '<p class="hinttxt">' + esc(hintText(q)) + "</p>";
    if (Object.keys(usedBy).length) h += '<p class="small" style="margin:10px 0 0">Crossed-out headings are already used in earlier paragraphs. Each heading is used only once.</p>';
  } else h += fbHTML(t, q, v, "p" + q.id, false);
  h += '<div class="nav"><button class="btn" data-act="prev"' + (s.idx === 0 ? " disabled" : "") + ">← Previous</button>" +
    (s.idx < s.ids.length - 1 ? '<button class="btn' + (done ? " primary" : "") + '" data-act="next">Next →</button>' : '<button class="btn' + (done ? " primary" : "") + '" data-act="finish">Finish</button>') + "</div>";
  return h + "</section>";
}

/* ---------- Explanation: verdict, evidence, reason, mistake, decision path, trap rule ---------- */
function pathHTML(q, v, x){
  const ok = v === q.a;
  return '<ol class="tree">' + STEPS.map((st, i) => {
    const fail = !ok && x && st.f.indexOf(x.k) > -1;
    return '<li class="' + (fail ? "fail" : "") + '"><span class="tq"><b>' + (i + 1) + ". " + st.t + "</b>" + st.q + '</span><span class="tr"><span class="r yes">' + q.a + " ✓</span>" + (fail ? '<span class="r no">' + v + " ✗</span>" : "") + "</span>" +
      (fail ? '<span class="why">Your heading fails this check: ' + STEPFAIL[x.k] + ".</span>" : "") + "</li>";
  }).join("") + "</ol>";
}
/* Expanded note: how the heading paraphrases the paragraph, and how the paragraph is built */
function noteHTML(q){
  const x = X[q.id]; if (!x) return "";
  return '<div class="fsec"><h4>How the heading paraphrases the text</h4><div class="px"><div class="pxr pxh"><span>The heading says</span><span>The paragraph says</span></div>' +
    x.p.map(r => '<div class="pxr"><span class="hw">' + esc(r[0]) + '</span><span class="tw">“' + esc(r[1]) + "”</span></div>").join("") + "</div></div>" +
    '<div class="fsec"><h4>How the paragraph is built</h4><p>' + esc(x.s) + "</p></div>";
}
function fbHTML(t, q, v, uid, reveal){
  const s = S.sess, ok = v === q.a, blank = !v;
  const x = ok || blank ? null : trapOf(t, q, v, reveal);
  const k = keyInfo(q);
  let h = '<div class="fb">';
  h += '<div class="verdict ' + (ok ? "ok" : "bad") + '"><span class="vt">' + (ok ? "✓ Correct: " + q.a : blank ? "✗ No answer. Correct heading: " + q.a : "✗ Incorrect. You chose " + v + ". Correct heading: " + q.a) + '</span><span class="vh">' + esc(t.H[q.a]) + "</span></div>";
  h += '<div class="fsec"><h4>Evidence · paragraph ' + q.L + "</h4><blockquote>“" + esc(k.ev) + "”</blockquote>" + pmapHTML(q) + '<p class="cap">' + esc(posText(q)) + "</p></div>";
  h += '<div class="fsec"><h4>Why ' + q.a + " is correct</h4><p>" + esc(q.why) + "</p></div>";
  h += noteHTML(q);
  if (x) {
    const rec = store.ans[q.id];
    h += '<div class="fsec miss"><h4>Where you went wrong</h4><p><span class="lab">You chose</span>' + hd(t, v) + "</p>" + (x.note ? "<p>" + esc(x.note) + "</p>" : "") +
      '<p><span class="ttag">' + TRAPS[x.k].n + "</span></p><p>" + esc(TRAPS[x.k].s) + '</p><p class="note"><span class="lab">Rule</span>' + esc(TRAPS[x.k].avoid) + "</p>";
    if (rec && !rec.ok && rec.last === v) {
      h += '<div><span class="lab">Why did you choose it? (optional)</span><div class="chips" style="margin-top:6px">' + Object.keys(REASONS).map(r => '<button class="chip" data-act="reason" data-id="' + q.id + '" data-r="' + r + '" aria-pressed="' + (rec.r === r) + '">' + REASONS[r].t + "</button>").join("") + "</div></div>";
      if (rec.r) h += '<p class="advice"><span class="lab">Advice</span>' + esc(REASONS[rec.r].a) + "</p>";
    }
    h += "</div>";
  }
  h += '<div class="fsec"><h4>Decision path</h4>' + pathHTML(q, v, x) + "</div>";
  if (x) {
    const n = trapCount(x.k), open = s && s.ro[uid];
    h += '<div class="trapcard"><div class="th"><span class="eyebrow2">Trap</span><b>' + TRAPS[x.k].n + '</b></div><div class="btns"><button class="btn ghost sm" data-act="rule" data-uid="' + uid + '" aria-expanded="' + !!open + '">' + (open ? "Hide the rule" : "Read the full rule") + "</button>" +
      (n ? '<button class="btn ghost sm" data-act="trapdrill" data-t="' + x.k + '">Practise this trap (' + n + ")</button>" : "") + "</div>" + (open ? '<div class="rulefull">' + ruleHTML(x.k) + "</div>" : "") + "</div>";
  }
  const ks = Object.keys(q.tr).filter(h2 => h2 !== v && (reveal || !t.ans[h2] || store.ans[t.pm[t.ans[h2]].id]));
  if (ks.length) h += '<div class="fsec"><h4>' + (x ? "Other trap headings" : "Trap headings") + ' for this paragraph</h4><ul class="tlist">' + ks.map(h2 => "<li>" + hd(t, h2) + '<span class="ttag">' + TRAPS[q.tr[h2][0]].n + "</span><span>" + esc(q.tr[h2][1]) + "</span></li>").join("") + "</ul></div>";
  return h + "</div>";
}

/* ---------- Exam mode: all paragraphs together, against the clock ---------- */
function examHTML(t, s){
  const used = new Set(s.ids.map(id => s.ans[id]).filter(Boolean));
  let h = "";
  if (s.submitted) {
    const okN = s.ids.filter(id => isOk(s, id)).length;
    h += '<section class="card" id="fbtop"><h3>Result</h3><div class="rsum"><div><span class="mono">Correct</span><b class="num">' + okN + " / " + s.ids.length + '</b></div><div><span class="mono">Accuracy</span><b class="num">' + pct(okN, s.ids.length) + '%</b></div><div><span class="mono">Time used</span><b class="num">' + fmt(s.used) + "</b></div></div>" +
      (s.auto ? '<p class="small" style="margin:10px 0 0">Time ran out, so your answers were submitted automatically.</p>' : "") +
      '<p class="small" style="margin:10px 0 0">The evidence sentence is now highlighted in every paragraph, with the correct heading number beside it. Each paragraph has a full explanation below. Explanations for wrong answers are open.</p></section>';
    h += '<section class="card"><h3>Paragraph by paragraph</h3>' + s.ids.map(id => {
      const q = QID[id], v = s.ans[id] || "", ok = v === q.a;
      return '<div class="erow"><div class="eh"><span class="fl">' + q.L + '</span><span class="pill ' + (ok ? "ok" : "bad") + '">' + (ok ? "Correct" : v ? "Incorrect" : "No answer") + '</span><span class="ea">' + (ok ? "<i>" + q.a + "</i>" : (v ? "You: <i>" + v + "</i> · " : "") + "Correct: <b><i>" + q.a + "</i></b>") + '</span><button class="btn ghost sm" data-act="eopen" data-id="' + id + '" aria-expanded="' + !!s.open[id] + '">' + (s.open[id] ? "Hide explanation" : "Explanation and evidence") + "</button></div>" +
        (s.open[id] ? fbHTML(t, q, v, "e" + id, true) : "") + "</div>";
    }).join("") + "</section>";
    h += distractHTML(t);
    h += '<div class="btns">' + (s.ids.some(id => !isOk(s, id)) ? '<button class="btn primary" data-act="redowrong">Redo the mistakes in practice mode</button>' : "") + '<button class="btn" data-act="start" data-t="' + t.id + '" data-m="practice">This test in practice mode</button><button class="btn" data-act="home">Another test</button></div>';
    return h;
  }
  h += '<section class="card"><h3>List of headings</h3><ol class="hlist">' + Object.keys(t.H).map(k => '<li class="' + (used.has(k) ? "used" : "") + '"><span class="rn">' + k + "</span><span>" + esc(t.H[k]) + "</span></li>").join("") + "</ol></section>";
  h += '<section class="card"><h3>Answer sheet</h3>' + s.ids.map(id => {
    const q = QID[id];
    const opts = '<option value="">Choose a heading</option>' + Object.keys(t.H).map(k => '<option value="' + k + '"' + (s.ans[id] === k ? " selected" : "") + ">" + k + " – " + esc(t.H[k]) + "</option>").join("");
    return '<div class="arow"><label class="al" for="sel-' + q.L + '">' + q.L + '</label><select id="sel-' + q.L + '" data-id="' + id + '">' + opts + "</select></div>";
  }).join("");
  const blanks = s.ids.filter(id => !s.ans[id]).length;
  h += '<div class="nav"><span class="small">' + (blanks ? plural(blanks, "paragraph") + " unanswered" : "All paragraphs answered") + '</span><button class="btn primary" data-act="submit">Submit answers</button></div></section>';
  return h;
}
function distractHTML(t){
  return '<section class="card"><h3>Why the spare headings fit nowhere</h3><ul class="dlist">' + Object.keys(t.D).map(k => "<li>" + hd(t, k) + '<span class="ttag">' + TRAPS[t.D[k][0]].n + "</span><p>" + esc(t.D[k][1]) + "</p></li>").join("") + "</ul></section>";
}
function submitExam(auto){
  const s = S.sess; if (!s || s.submitted) return;
  const t = TBY[s.tid];
  stopTimer(); s.submitted = true; s.auto = !!auto; s.used = t.mins * 60 - s.left;
  s.ids.forEach(id => { if (s.ans[id]) record(QID[id], s.ans[id]); if (!isOk(s, id)) s.open[id] = true; });
  const okN = s.ids.filter(id => isOk(s, id)).length, prev = store.exams[t.id] || { n:0, best:0 };
  store.exams[t.id] = { n:prev.n + 1, best:Math.max(prev.best || 0, okN), last:okN, total:s.ids.length, used:s.used, t:Date.now() };
  save(); S.view = "sess"; render(); window.scrollTo(0, 0);
}

/* ---------- End of a practice session ---------- */
function finishHTML(){
  const s = S.sess, n = s.ids.length, done = s.ids.filter(id => s.ans[id]).length, ok = s.ids.filter(id => isOk(s, id)).length;
  const by = {};
  s.ids.forEach(id => { const q = QID[id]; if (s.ans[id] && !isOk(s, id)) { const k = trapOf(q.T, q, s.ans[id], true).k; by[k] = (by[k] || 0) + 1; } });
  const tops = Object.keys(by).sort((a, b) => by[b] - by[a]).slice(0, 3);
  let h = '<section class="finish"><span class="mono">Session complete</span><h1 class="num">' + ok + " / " + done + "</h1><p>" + esc(s.title) + ": " + done + " of " + plural(n, "paragraph") + " answered, " + pct(ok, done) + "% correct.</p>";
  if (tops.length) h += '<div class="rsec"><h2>Traps that caught you</h2><ul class="tlist" style="padding:0;max-width:none">' + tops.map(k => "<li><span><b>" + TRAPS[k].n + "</b> · " + plural(by[k], "mistake") + "</span><span>" + esc(TRAPS[k].s) + '</span><span class="note"><span class="lab">Rule</span>' + esc(TRAPS[k].avoid) + "</span>" + (trapCount(k) ? '<span><button class="btn sm" data-act="trapdrill" data-t="' + k + '">Practise this trap (' + trapCount(k) + ")</button></span>" : "") + "</li>").join("") + "</ul></div>";
  else if (done) h += "<p>No mistakes in this session.</p>";
  if (s.tid && done === n) h += distractHTML(TBY[s.tid]);
  h += '<div class="btns">' + (s.ids.some(id => s.ans[id] && !isOk(s, id)) ? '<button class="btn primary" data-act="redowrong">Redo the mistakes</button>' : "") + (s.tid ? '<button class="btn" data-act="start" data-t="' + s.tid + '" data-m="exam">This test in exam mode</button>' : "") + '<button class="btn" data-act="home">Back to tests</button><button class="btn" data-act="tab" data-v="stats">Results</button></div></section>';
  return h;
}

/* ===================== RULES ===================== */
function rulesHTML(){
  return `<section class="doc"><h1>Rules</h1><p class="lede">The correct heading states the main idea of the paragraph: not one detail from it, and not the topic of the whole passage. The answer rests on the text alone. General knowledge and guesses do not count.</p>
<div class="rsec"><h2>Three core rules</h2><div class="tbl"><table><thead><tr><th>Rule</th><th>What it means</th><th>Ask yourself</th></tr></thead><tbody>
<tr><td><b>Main idea, not a detail</b></td><td>The heading covers most of the sentences in the paragraph. An example, a number or a name only supports the idea.</td><td>What is the writer doing here: giving a reason, raising a problem, offering a solution?</td></tr>
<tr><td><b>Matching ideas, not words</b></td><td>The correct heading is usually a paraphrase. A heading that repeats a word from the text is often a trap.</td><td>What in the text corresponds to each word of the heading?</td></tr>
<tr><td><b>Each heading once</b></td><td>There are more headings than paragraphs. A used heading is crossed off, and the spare ones fit nowhere.</td><td>Would this heading fit another paragraph better?</td></tr></tbody></table></div></div>
<div class="rsec"><h2>The decision path: four checks</h2><p>Every candidate heading must pass all four checks. If it fails one, it is a trap. After each answer the trainer shows this path and marks the check where the wrong heading stops.</p><ol class="dsteps">` +
  STEPS.map((st, i) => '<li><span class="sn">' + (i + 1) + "</span><b>" + st.t + "</b><span>" + st.q + '</span><span class="no">If not: ' + st.f.map(k => TRAPS[k].n.toLowerCase()).join(", ") + ".</span></li>").join("") +
  `</ol></div>
<div class="rsec"><h2>How the task works</h2>
<p>The passage is divided into paragraphs (A, B, C…) and a separate list gives headings numbered with roman numerals (i, ii, iii…). You choose one heading for each paragraph. There are always more headings than paragraphs, and the spare ones are written to distract. In IELTS each heading is normally used once. Sometimes one paragraph is done for you as an example: cross that heading off straight away.</p>
<p>The task tests the job a paragraph does, not a detail inside it. Is the writer giving a cause, raising a problem, offering a solution, or rejecting an older view?</p></div>
<div class="rsec"><h2>A working method</h2><ol>
<li><b>Read the headings first</b> and mark the focus word in each (reasons, effects, obstacles, unexpected…). Pair up “twin” headings that look alike.</li>
<li><b>Cross off the example heading</b> if one is given.</li>
<li><b>Read the first two sentences of the paragraph, then the last.</b> Watch for turn words such as however, yet, but and in fact.</li>
<li><b>Say the main idea in your own words</b> in four to seven words. Your own language is fine.</li>
<li><b>Compare your summary with the list</b> and pick one or two candidates.</li>
<li><b>Run each candidate through the four checks</b> of the decision path: proof, coverage, focus and strength, fit.</li>
<li><b>If you are sure,</b> write the answer and cross the heading off. If you are torn, note both candidates and move on.</li>
<li><b>Return to the open paragraphs at the end.</b> By then the list of candidates is shorter.</li></ol></div>
<div class="rsec"><h2>Where the main idea sits</h2><div class="pos">
<div><b>In the first sentence</b><p>The classic topic sentence. The rest of the paragraph supports it with reasons and examples.</p></div>
<div><b>After the opening</b><p>The first sentence sets the scene or states a common belief. The real point follows, often after a turn word.</p></div>
<div><b>In the last sentence</b><p>Context and examples come first, and the conclusion closes the paragraph.</p></div>
<div><b>Unstated</b><p>With no single topic sentence, join the examples under one idea: weight, cost and wind together are “obstacles”.</p></div></div>
<p class="small" style="margin:12px 0 0">In this trainer the main idea opens the paragraph in ${ALLQ.filter(q => keyInfo(q).pos === "first").length} of ${TOTALQ} paragraphs. In the rest it comes later, so reading only the first sentence is not enough.</p></div>
<div class="rsec"><h2>Focus words in headings</h2><div class="tbl"><table><thead><tr><th>Word in the heading</th><th>What to look for in the paragraph</th></tr></thead><tbody>
<tr><td class="en">reasons, causes, why…</td><td>because, due to, led to: a list of causes</td></tr>
<tr><td class="en">effects, consequences, impact</td><td>as a result, therefore, consequently: outcomes</td></tr>
<tr><td class="en">solutions, responses, measures</td><td>tackle, address, introduce: action taken</td></tr>
<tr><td class="en">problems, obstacles, limits, drawbacks</td><td>however, difficult, cannot, costly: barriers</td></tr>
<tr><td class="en">benefits, advantages</td><td>help, improve, save, reduce: gains</td></tr>
<tr><td class="en">unexpected, surprising, paradox</td><td>surprisingly, in fact, instead: a result nobody predicted</td></tr>
<tr><td class="en">history, origins, early</td><td>dates, past tenses, first, originally</td></tr>
<tr><td class="en">future, prospects, outlook</td><td>will, may, likely, looking ahead: predictions</td></tr>
<tr><td class="en">opposition, debate, criticism</td><td>critics, not everyone, argue, refuse: opposing views</td></tr>
<tr><td class="en">comparison, contrast</td><td>whereas, unlike, while, compared with</td></tr></tbody></table></div></div>
<div class="rsec"><h2>Signal words</h2><div class="sigs">
<div><b>Turn</b><span>The main idea often follows: <span class="w">however, yet, but, in fact, instead, rather, nevertheless</span></span></div>
<div><b>Addition</b><span>The idea continues: <span class="w">also, in addition, moreover, similarly, another</span></span></div>
<div><b>Example</b><span>A detail, not a heading: <span class="w">for example, for instance, such as, including</span></span></div>
<div><b>Result</b><span>A summing-up: <span class="w">as a result, therefore, in other words, in short</span></span></div>
<div><b>Caution</b><span>Check for overstatement: <span class="w">may, some, in some cases, few, rarely, suggests</span></span></div></div></div>
<div class="rsec"><h2>The ten traps</h2><p>Each trap has a definition, the reason it works, a way to avoid it and an example from the tests. When you choose a wrong heading, the trainer names one of these.</p><div class="traps">` +
  TRAP_ORDER.map(k => '<details class="trap"><summary><span class="tn">' + TRAPS[k].n + '</span><span class="ts">' + esc(TRAPS[k].s) + '</span></summary><div class="tb">' + ruleHTML(k) + (trapCount(k) ? '<div class="btns"><button class="btn primary sm" data-act="trapdrill" data-t="' + k + '">Practise this trap (' + plural(trapCount(k), "paragraph") + ")</button></div>" : "") + "</div></details>").join("") +
  `</div></div>
<div class="rsec"><h2>Timing</h2><ul>
<li>IELTS Reading gives 60 minutes for 3 passages and 40 questions, with no extra time to transfer answers.</li>
<li>Allow about 1 to 1.5 minutes per paragraph. Do not spend more than 2 minutes on a hard one: note two candidates and come back.</li>
<li>Start with the short, clear paragraphs. Once their headings are off the list, the hard paragraphs have fewer candidates.</li>
<li>Matching headings is usually the first task on its passage. Solving it first gives you a map of the text for the questions that follow.</li></ul></div></section>`;
}

/* ===================== RESULTS ===================== */
function bars(rows, cls, unit){
  const max = Math.max(1, ...rows.map(r => r[1]));
  return '<div class="hbars">' + rows.map(r => '<div class="hb"><span>' + r[0] + '</span><div class="track ' + cls + '"><i style="width:' + pct(r[1], max) + '%"></i></div><span class="hv num">' + (r[3] || r[1] + "×") + "</span></div>").join("") + "</div>";
}
function statsHTML(){
  const ids = answeredIds(), wrong = wrongIds(), ok = ids.length - wrong.length;
  let h = '<section class="doc" style="max-width:1000px"><h1>Results</h1><p class="lede">Your latest answer to each paragraph is what counts. Results are stored only in this browser.</p>';
  if (!ids.length) return h + '<div class="rsec"><p class="empty">No results yet. Solve your first passage and this page will show your accuracy by level, the traps that catch you and your mistakes notebook.</p><button class="btn primary" data-act="start" data-t="' + T[0].id + '" data-m="practice">Start with Test 1</button></div></section>';
  h += '<div class="kpis"><div><span class="mono">Paragraphs solved</span><b class="num">' + ids.length + " / " + TOTALQ + '</b></div><div><span class="mono">Accuracy</span><b class="num">' + pct(ok, ids.length) + '%</b><span class="small">' + ok + " of " + ids.length + ' correct</span></div><div><span class="mono">Mistakes now</span><b class="num">' + wrong.length + "</b></div></div>";
  h += '<div class="rsec"><h2>By level</h2><div class="hbars">' + [1, 2, 3].map(lv => {
    const xs = ids.filter(id => QID[id].T.lvl === lv), o = xs.filter(id => store.ans[id].ok).length;
    return '<div class="hb"><span>Level ' + lv + " · " + LEVELS[lv] + '</span><div class="track r"><i style="width:' + pct(o, xs.length) + '%"></i></div><span class="hv num">' + (xs.length ? pct(o, xs.length) + "% · " + o + " / " + xs.length : "not started") + "</span></div>";
  }).join("") + "</div></div>";
  h += '<div class="rsec"><h2>By test</h2><div class="tbl"><table><thead><tr><th>Test</th><th>Solved</th><th>Correct</th><th>Exam: last</th><th>Exam: best</th></tr></thead><tbody>' + T.filter(t => t.P.some(q => store.ans[q.id]) || store.exams[t.id]).map(t => {
    const d = t.P.filter(q => store.ans[q.id]).length, o = t.P.filter(q => store.ans[q.id] && store.ans[q.id].ok).length, ex = store.exams[t.id];
    return "<tr><td>" + t.no + ". " + esc(t.title) + '</td><td class="num">' + d + " / " + t.P.length + '</td><td class="num">' + (d ? o + " / " + d : "–") + '</td><td class="num">' + (ex ? ex.last + " / " + ex.total : "–") + '</td><td class="num">' + (ex ? ex.best + " / " + ex.total : "–") + "</td></tr>";
  }).join("") + "</tbody></table></div></div>";
  const tally = {};
  ids.forEach(id => { const q = QID[id]; (store.ans[id].hist || []).forEach(v => { if (v !== q.a) { const k = trapOf(q.T, q, v, true).k; tally[k] = (tally[k] || 0) + 1; } }); });
  const tc = TRAP_ORDER.map(k => [TRAPS[k].n, tally[k] || 0, k]).filter(r => r[1]).sort((a, b) => b[1] - a[1]);
  if (tc.length) {
    const top = tc[0];
    h += '<div class="rsec"><h2>Traps that catch you</h2><p class="small">Counts every wrong answer across all your attempts.</p>' + bars(tc, "") + '<div class="insight"><b>Your main weak spot: ' + top[0] + "</b><p>" + esc(TRAPS[top[2]].avoid) + "</p>" + (trapCount(top[2]) ? '<div class="btns"><button class="btn sm" data-act="trapdrill" data-t="' + top[2] + '">Practise this trap (' + trapCount(top[2]) + ")</button></div>" : "") + "</div></div>";
    const rc = Object.keys(REASONS).map(r => [REASONS[r].t, ids.filter(id => store.ans[id].r === r).length, r]).filter(r => r[1]).sort((a, b) => b[1] - a[1]);
    h += '<div class="rsec"><h2>Reasons you gave</h2>' + (rc.length ? bars(rc, "r") + '<div class="insight"><b>Advice</b><p>' + esc(REASONS[rc[0][2]].a) + "</p></div>" : '<p class="empty">When you answer “Why did you choose it?” after a mistake, personal advice appears here.</p>') + "</div>";
  }
  h += '<div class="rsec"><h2>Mistakes notebook</h2>';
  if (wrong.length) h += '<p class="small">Paragraphs whose latest answer is wrong. A paragraph leaves the notebook once you solve it correctly.</p><div class="btns" style="margin-bottom:6px"><button class="btn primary" data-act="quick" data-k="mist">Solve them all again (' + wrong.length + ')</button></div><ul class="wlist">' + wrong.map(id => {
    const q = QID[id], t = q.T, r = store.ans[id], x = trapOf(t, q, r.last, true);
    return '<li><span class="mono">Test ' + t.no + " · " + esc(t.title) + " · paragraph " + q.L + (r.wrong > 1 ? " · wrong " + r.wrong + " times" : "") + '</span><p><span class="lab">You chose</span>' + hd(t, r.last) + '</p><p><span class="lab">Correct</span>' + hd(t, q.a) + '</p><p><span class="ttag">' + TRAPS[x.k].n + "</span>" + (r.r ? ' <span class="small">· ' + REASONS[r.r].t + "</span>" : "") + "</p>" + (x.note ? '<p class="small">' + esc(x.note) + "</p>" : "") +
      '<details class="more"><summary>Evidence and explanation</summary><blockquote style="margin-top:8px">“' + esc(keyInfo(q).ev) + '”</blockquote><p style="margin-top:8px">' + esc(q.why) + " " + esc(posText(q)) + "</p>" + noteHTML(q) + "</details></li>";
  }).join("") + "</ul>";
  else h += "<p>No wrong answers at the moment.</p>";
  h += "</div>";
  h += '<div class="rsec plain"><h2>Clear results</h2>' + (S.confirmReset ? '<p>All results and the mistakes notebook will be deleted. Continue?</p><div class="btns"><button class="btn danger" data-act="reset2">Yes, delete</button><button class="btn" data-act="reset0">Cancel</button></div>' : '<button class="btn" data-act="reset1">Delete all results</button>') + "</div></section>";
  return h;
}

/* ===================== RENDER AND EVENTS ===================== */
function render(){
  const v = S.view;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", (b.dataset.v === v || ((v === "sess" || v === "fin") && b.dataset.v === "lib")) ? "page" : "false"));
  document.getElementById("app").innerHTML = v === "sess" ? sessHTML() : v === "fin" ? finishHTML() : v === "rules" ? rulesHTML() : v === "stats" ? statsHTML() : libHTML();
}
function paneTop(){ const el = document.getElementById("passage"); return el ? el.scrollTop : 0; }
function keep(fn){ const y = window.scrollY, py = paneTop(); fn(); render(); const el = document.getElementById("passage"); if (el) el.scrollTop = py; window.scrollTo(0, y); }
function scrollable(el){ return el && el.scrollHeight > el.clientHeight + 4; }
function focusPara(){
  const pane = document.getElementById("passage"), cur = pane && pane.querySelector(".para.cur");
  if (cur && scrollable(pane)) pane.scrollTop = Math.max(0, cur.offsetTop - 14);
}
function focusEvidence(){
  const pane = document.getElementById("passage"), cur = pane && pane.querySelector(".para.cur"), m = cur && cur.querySelector("mark.ev");
  if (m && scrollable(pane)) pane.scrollTop = Math.max(0, cur.offsetTop + m.offsetTop - pane.clientHeight / 3);
}
function narrow(){ return window.innerWidth <= 900; }
function goPara(){
  render();
  if (narrow()) { const g = document.getElementById("sgrid"); if (g) g.scrollIntoView({ block:"start" }); }
  else { window.scrollTo(0, 0); focusPara(); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset, s = S.sess, q = S.view === "sess" ? curQ() : null;
  switch (d.act) {
    case "tab": S.view = d.v; S.confirmReset = false; render(); window.scrollTo(0, 0); break;
    case "home": S.view = "lib"; render(); window.scrollTo(0, 0); break;
    case "start": { const t = TBY[d.t]; startSession(t.P.map(x => x.id), t.title, d.m, t.id); break; }
    case "resume": S.view = "sess"; render(); window.scrollTo(0, 0); focusPara(); break;
    case "quick": {
      if (d.k === "mix") startSession(shuffle(ALLQ).slice(0, 10).map(x => x.id), "Mixed ten", "practice");
      if (d.k === "hard") startSession(shuffle(ALLQ.filter(x => x.T.lvl === 3)).map(x => x.id), "Band 8–9 only", "practice");
      if (d.k === "mist") { const w = wrongIds(); if (w.length) startSession(shuffle(w), "My mistakes", "practice"); }
      if (d.k === "new") { const n = ALLQ.filter(x => !store.ans[x.id]).map(x => x.id); if (n.length) startSession(n.slice(0, 10), "Not yet solved", "practice"); }
      break; }
    case "trapdrill": { const ids = shuffle(trapParas(d.t)).map(x => x.id); if (ids.length) startSession(ids, "Trap: " + TRAPS[d.t].n, "practice"); break; }
    case "pick": if (q && !s.ans[q.id]) { keep(() => { s.pick[q.id] = d.k; }); const f = document.querySelector('.hopt[data-k="' + d.k + '"]'); if (f) f.focus({ preventScroll:true }); } break;
    case "check": if (q && s.pick[q.id] && !s.ans[q.id]) {
      keep(() => { s.ans[q.id] = s.pick[q.id]; record(q, s.pick[q.id]); });
      focusEvidence();
      if (narrow()) { const vd = document.querySelector(".verdict"); if (vd) vd.scrollIntoView({ block:"start" }); }
      break; }
    case "hint": if (q) keep(() => { s.hint[q.id] = !s.hint[q.id]; }); break;
    case "full": keep(() => { s.full = !s.full; }); break;
    case "next": if (s.idx < s.ids.length - 1) { s.idx++; goPara(); } break;
    case "prev": if (s.idx > 0) { s.idx--; goPara(); } break;
    case "goto": s.idx = +d.i; goPara(); break;
    case "finish": S.view = "fin"; render(); window.scrollTo(0, 0); break;
    case "redowrong": { const w = s.ids.filter(id => !isOk(s, id) && (s.mode === "exam" || s.ans[id])); if (w.length) startSession(w, "Redo the mistakes", "practice"); break; }
    case "submit": submitExam(false); break;
    case "eopen": keep(() => { s.open[d.id] = !s.open[d.id]; }); break;
    case "rule": keep(() => { s.ro[d.uid] = !s.ro[d.uid]; }); break;
    case "reason": keep(() => { const r = store.ans[d.id]; if (r) { r.r = r.r === d.r ? "" : d.r; save(); } }); break;
    case "reset1": keep(() => { S.confirmReset = true; }); break;
    case "reset0": keep(() => { S.confirmReset = false; }); break;
    case "reset2": stopTimer(); store = fresh(); save(); S.sess = null; S.confirmReset = false; render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "sess" || !S.sess || S.sess.mode !== "practice" || e.metaKey || e.ctrlKey || e.altKey) return;
  const el = e.target; if (el.matches && el.matches("select, textarea, input")) return;
  const s = S.sess, q = curQ();
  if (e.key === "ArrowRight" && s.ans[q.id] && s.idx < s.ids.length - 1) { s.idx++; goPara(); }
  else if (e.key === "ArrowLeft" && s.idx > 0) { s.idx--; goPara(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.matches("select[data-id]") && S.sess && S.sess.mode === "exam" && !S.sess.submitted) { const id = el.dataset.id, sid = el.id; keep(() => { S.sess.ans[id] = el.value; }); const f = document.getElementById(sid); if (f) f.focus({ preventScroll:true }); }
});

/* Links to the sibling trainers show only where the files sit side by side (a site or a local folder) */
(function(){ if (/\.github\.io$/.test(location.hostname) || location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) ["xlink1", "xlink2"].forEach(id => { const x = document.getElementById(id); if (x) x.hidden = false; }); })();

render();
</script>
</body>
