["C","These findings, however, concern people living in a new country and surrounded by the language every day. [[In classrooms, where pupils may receive only two or three hours a week, the benefits of an early start appear much smaller.]] A few hours of lessons cannot provide anything like the vast quantity of exposure that immersion offers. Several studies comparing children who began a foreign language at different ages in school found that later starters often caught up within a few years, and sometimes overtook those who had started earlier. Early lessons may still have value, for example in building positive attitudes, but they rarely produce the dramatic advantage that parents expect.","iii","The paragraph argues that with limited lesson time, starting young brings little advantage.",{ ii:["neighbour","Faster early progress was the subject of Paragraph B; here the point is that early school lessons achieve little."] }],
["D","[[Adults also bring resources that children lack.]] They can read and write, use dictionaries and grammar explanations, and reflect consciously on how a language works, comparing it with languages they already know. Many have learned other skills before and can apply effective study strategies, such as spacing their practice or testing themselves rather than simply rereading notes. Adults also tend to know what they want to use the language for, whether for work, travel or study, and can focus on the vocabulary and situations that matter most to them. These advantages help to explain their rapid progress in the early stages.","iv","The paragraph lists strengths that adult learners possess.",{ ix:["assumption","Dictionaries and grammar explanations are mentioned, but no textbooks are recommended."] }],
["E","Their difficulties are often less to do with ability than with circumstances. [[Adults usually have less time to study, fewer opportunities to hear and use the language, and a stronger fear of making mistakes in public.]] Work and family responsibilities leave little energy for lessons, and many adults spend most of their day using their first language. Embarrassment can lead them to avoid speaking altogether, which deprives them of exactly the practice they need. Children, in contrast, are often less self-conscious and are surrounded by classmates who expect them to join in, whether or not their grammar is correct.","v","The paragraph explains that adults' problems come from limited time and exposure, and from anxiety.",{ x:["opposite","The paragraph says adults' problems are not mainly about ability."] }],
["F","Pronunciation is the area where age seems to matter most: few people who start as adults lose their accent completely, however long they live abroad. [[Yet researchers increasingly argue that the goal should be intelligibility rather than a native-like accent.]] Many highly successful speakers of a second language, including well-known writers, scientists and politicians, have a clear foreign accent but are easily understood, and listeners quickly adapt to them. Teaching, it is argued, should therefore concentrate on the features of pronunciation that cause real misunderstanding, rather than on removing every trace of an accent.","vi","After 'Yet', the paragraph argues that being understood matters more than sounding native.",{ x:["turn","The opening admits that accents remain, but the main point is that this does not prevent success."] }],
["G","[[Taken together, the evidence suggests that age is only one factor among many, and rarely the decisive one.]] Motivation, the amount of contact with the language, the quality of teaching and the learner's opportunities to use the language in real situations often predict success more reliably. An adult who studies regularly and seeks out conversation may well outperform a child who receives a few lessons a week. For adults, the practical message is encouraging: it is never too late to start, and many of the obstacles they face can be reduced by planning study time and finding supportive settings in which to practise.","vii","The paragraph concludes that factors other than age are usually more important.",{ i:["opposite","The paragraph rejects the belief described in Paragraph A rather than presenting it."] }]
]});

T.push({ id:"navigation", lvl:3, title:"How Animals Find Their Way",
H:{ i:"Journeys of astonishing precision", ii:"Using the sun and an internal clock", iii:"Lessons from the night sky", iv:"An invisible map in the Earth itself", v:"Following a familiar scent", vi:"Instinct for the young, experience for the old", vii:"Navigation disrupted by human activity", viii:"Why animals migrate in winter", ix:"Tracking animals with satellites", x:"Animals that never leave home" },
D:{ viii:["focus","The passage explains how animals navigate, not why they migrate."], ix:["assumption","Satellite tracking is never mentioned."], x:["opposite","Every paragraph concerns animals that travel."] },
P:[
["A","Every year, billions of animals make journeys that would challenge a human with a map and a compass. [[Some travel thousands of kilometres and arrive at exactly the place they set out from]]: Arctic terns fly between the polar regions, salmon return from the ocean to the stream where they hatched, and sea turtles come back to nest on the beaches where they were born, often after many years at sea. Even small songbirds weighing less than a coin may cross deserts and seas on their way to distant feeding grounds. How they achieve such precision has puzzled naturalists for centuries, and only in recent decades have scientists begun to understand the senses involved.","i","The paragraph highlights how far, and how accurately, some animals travel.",{ viii:["focus","The paragraph describes the journeys themselves, not the reasons for migrating."] }],
["B","[[One of the simplest tools animals use is the sun.]] Because the sun moves across the sky during the day, an animal can only use it as a compass if it also knows the time: at sunrise the sun lies roughly in the east, but by midday it has moved a long way across the sky. Experiments with birds and honeybees have shown that they combine the sun's position with an internal clock, adjusting their direction as the hours pass. When researchers shifted birds' internal clocks by keeping them under artificial light, the birds set off in predictably wrong directions, confirming that timing is essential to the system.","ii","The paragraph explains how animals use the sun together with a sense of time.",{ iii:["neighbour","The sky is involved, but stars and night-time navigation belong to Paragraph C."] }],
["C","Many songbirds migrate at night, when the sun is not available and the air is cooler and calmer. [[Planetarium experiments have shown that some species learn the pattern of stars around the point in the sky that stays still as the Earth turns]], and use it to find north. Remarkably, this knowledge is not inherited in detail: young birds must observe the night sky while they are growing. Birds raised under an artificial sky that rotated around a different star oriented themselves to that star instead, showing that they learn the centre of rotation rather than any particular pattern.","iii","The paragraph describes how night-flying birds learn to navigate by the stars.",null],
["D","[[Perhaps the most mysterious sense is the ability to detect the Earth's magnetic field.]] The field varies in strength and angle from place to place, and sea turtles, for example, appear to recognise these local values, which gives them a kind of map. Young turtles placed in tanks that reproduce the magnetic conditions of distant locations swim in the direction that would carry them home. How animals sense magnetism, however, remains a matter of debate: some scientists believe that particles of a magnetic mineral act like tiny compass needles, while others suggest that special molecules in the eye are involved, and several competing explanations are still being tested.","iv","The paragraph is about the magnetic sense that gives animals a kind of map.",null],
["E","Close to home, other senses take over. Magnetic and celestial cues may bring an animal to the right region, but they are rarely precise enough to identify a single river or nest. [[Salmon appear to recognise the chemical scent of the river in which they were born]], allowing them to choose the right stream among many as they swim upriver. Experiments in which young salmon were exposed to particular chemicals, and later returned to streams containing them, support this idea. Some seabirds also seem to use smell to find their way across open water, perhaps by detecting the odours of feeding areas carried on the wind.","v","The paragraph explains how animals use smell to find home in the final stage of a journey.",{ i:["neighbour","Salmon returning home were introduced in Paragraph A; here the focus is the sense of smell they use."] }],
["F","[[A classic experiment revealed a difference between young and experienced migrants.]] Thousands of birds caught during their autumn migration were moved hundreds of kilometres sideways and released. Adults corrected their course and reached their usual winter grounds, apparently aware that they had been displaced. Young birds on their first journey, however, kept flying in the same inherited direction and ended up somewhere new. The results suggest that first-time migrants follow a simple programme of direction and distance, while experienced birds have learned a map that allows them to correct mistakes.","vi","The paragraph contrasts inherited direction in young birds with learned navigation in adults.",{ ix:["assumption","Birds were caught and moved, but tracking technology is not mentioned."] }],
["G","[[Human activity is increasingly interfering with these abilities.]] Bright lights along coasts can draw newly hatched turtles away from the sea, towards roads and buildings, and city lighting confuses birds migrating at night, causing many to collide with tall structures. Some experiments have even suggested that electronic noise from human equipment can disrupt birds' magnetic sense. In response, some coastal towns now dim their lights during the turtle nesting season, and a few cities switch off decorative lighting on skyscrapers during the main migration periods.","vii","The paragraph describes how light and electronic noise disturb animal navigation.",{ iv:["wordmatch","The magnetic sense is mentioned only as something humans disrupt; it is explained in Paragraph D."] }]
]});

T.push({ id:"crowds", lvl:3, title:"The Wisdom of Crowds",
H:{ i:"A surprise at a country fair", ii:"Errors that cancel each other out", iii:"When the crowd stops thinking independently", iv:"How early votes shape later opinion", v:"Putting collective judgement to work", vi:"Questions crowds cannot answer", vii:"Asking first, discussing later", viii:"Experts are always wrong", ix:"The history of opinion polls", x:"Larger groups always decide better" },
D:{ viii:["degree","Paragraph E says crowds often did better than specialists, which is far from saying experts are always wrong."], ix:["assumption","Opinion polls are not discussed."], x:["degree","Paragraphs C and F describe situations where groups perform poorly."] },
P:[
["A","In 1906, the scientist Francis Galton visited a country fair in England where visitors paid to guess the weight of an ox once it had been slaughtered and prepared. Galton, who doubted the judgement of ordinary people, collected the entries afterwards, expecting to find evidence of their poor estimates. Some of the people who entered were butchers and farmers, but most had no special knowledge of cattle. [[To his surprise, the middle value of the roughly 800 guesses was almost exactly the true weight]], closer than the great majority of individual estimates. Galton published his findings in a scientific journal, admitting that the result reflected better on popular judgement than he had expected.","i","The paragraph tells how the combined guesses of a crowd proved surprisingly accurate.",{ ix:["assumption","Galton collected guesses at a fair; opinion polls are not discussed."] }],
["B","[[The explanation lies in how errors behave when many independent estimates are combined.]] Each guess contains some truth and some error. If people's mistakes are unrelated, some will guess too high and others too low, and there is no reason for the errors to lean in one direction. When the estimates are averaged, much of the error cancels out, leaving a figure closer to the truth than most individuals manage. The larger and more varied the group, the more completely this cancelling tends to work. The same principle explains why scientists repeat measurements and take an average rather than relying on a single reading.","ii","The paragraph explains that independent errors balance each other out when averaged.",null],
["C","This effect depends on two conditions: the crowd must be diverse, and its members must judge independently. [[When people are influenced by one another, their errors tend to point in the same direction]], and the average simply reflects a shared mistake. In experiments where participants were told others' estimates before giving their own, the range of answers narrowed and people became more confident, yet the group's accuracy did not improve. A group that hears a confident opinion before forming its own may end up less accurate than its members would have been alone.","iii","The paragraph explains that crowds lose accuracy when members influence each other.",{ x:["opposite","The paragraph shows that a group can be less accurate than its members alone."] }],
["D","Online ratings offer a clear example. [[In one experiment on a news website, comments that randomly received an early positive vote were significantly more likely to attract further positive votes later.]] Comments given an early negative vote, by contrast, showed no lasting effect, as other readers tended to correct it. Initial opinions, in other words, can snowball, so that ratings reflect the order in which people voted as much as the quality of the item. Similar effects have been observed with music downloads, where songs that appeared popular early on went on to become far more successful than songs of similar quality.","iv","The paragraph shows how early online votes influence later ones.",{ iii:["broad","This describes the general principle of Paragraph C; Paragraph D gives a specific case about early votes."] }],
["E","Despite these risks, organisations have found practical ways to use collective judgement. [[Some combine the forecasts of many people to predict sales, project deadlines or economic trends]], either by averaging their estimates or by allowing them to trade on the likely outcome, as in a market. In forecasting competitions, the averaged predictions of large groups of carefully selected volunteers have often outperformed those of individual specialists. Some companies have also asked their own staff to estimate when projects will be finished, at times obtaining more realistic dates than official plans.","v","The paragraph describes practical uses of combined forecasts.",{ viii:["degree","The paragraph says crowds have often outperformed specialists, not that experts are always wrong."] }],
["F","The method has clear limits, however. [[Averaging works only when individuals possess at least some relevant knowledge]]; combining many uninformed guesses about a technical question, such as the safe dose of a new drug, simply produces an uninformed average. Crowds may also share the same biases, for example overestimating dramatic risks, in which case their errors do not cancel out. Nor can a crowd settle questions of value, such as what is fair or beautiful, where there is no single correct answer to find. On such matters, a vote may tell us what most people prefer, but not what is true.","vi","The paragraph explains the kinds of questions where crowds fail.",{ x:["opposite","The paragraph sets out situations where groups do not produce good answers."] }],
["G","[[The research has practical lessons for meetings and committees.]] Instead of opening with a discussion, which allows the most senior or confident voices to dominate, a group can first collect each member's view privately, in writing. Quieter members, who may hold important information, are then more likely to contribute. Only then should people discuss the results, so that independent information is not lost before it has been shared. Some organisations also ask members to explain their reasoning briefly, which helps the group to identify where disagreements come from rather than simply counting opinions.","vii","The paragraph recommends collecting private opinions before group discussion.",{ iii:["neighbour","Loss of independence was explained in Paragraph C; here the focus is a practical method for meetings."] }]
]});

T.push({ id:"rewild", lvl:3, title:"The Case for Rewilding",
H:{ i:"Letting nature take the lead", ii:"A famous case under re-examination", iii:"Grazing animals as habitat makers", iv:"Tension with those who work the land", v:"New sources of income", vi:"Doubts about the whole idea", vii:"Rewilding on a smaller scale", viii:"Proof that predators control every ecosystem", ix:"Building new parks in cities", x:"Recreating the landscape of the distant past" },
D:{ viii:["degree","Paragraph B says later research found other factors also mattered."], ix:["assumption","Urban parks are not discussed."], x:["opposite","Paragraph F argues that there is no single natural state to return to."] },
P:[
["A","Traditional conservation has often focused on protecting particular species or managing habitats carefully, for example by cutting grass, removing scrub or controlling water levels to maintain the conditions that rare plants and animals require. Such work is effective but demands constant effort and funding. [[Rewilding takes a different approach: it aims to restore natural processes and then allow nature to manage itself]] with as little human intervention as possible. Rivers may be allowed to flood, trees to fall and decay, and vegetation to develop without a fixed plan. This often involves bringing back animals that have disappeared from a region, since their feeding and movement shape the landscape.","i","The paragraph defines rewilding as restoring natural processes and then stepping back.",{ x:["assumption","The paragraph speaks of restoring processes, not of recreating a historical landscape."] }],

/* ---------- reference data ---------- */
const LEVELS = { 1:"Band 5.5–6.5", 2:"Band 6.5–7.5", 3:"Band 8–9" };
const TRAPS = {
  wordmatch:["Word match","The heading repeats a word from the paragraph, but the idea is different."],
  detail:["Too narrow","The heading covers only one example or detail."],
  broad:["Too broad","The heading states a general principle, not this paragraph's specific point."],
  turn:["Turn signal","The heading matches an opening idea that the paragraph then rejects."],
  opposite:["Opposite meaning","The heading says the reverse of what the paragraph says."],
  focus:["Wrong focus","Right topic, wrong angle: cause or effect, problem or solution."],
  neighbour:["Neighbouring paragraph","The idea is mainly developed in another paragraph."],
  degree:["Overstatement","The heading makes a stronger claim than the text."],
  assumption:["Not in the text","Plausible, but the passage never says it."],
  other:["Misplaced heading","This heading belongs to another paragraph."],
  blank:["No answer","No heading was chosen."]
};
const TRAP_ORDER = ["wordmatch","detail","broad","turn","opposite","focus","neighbour","degree","assumption","other"];
const WORDS = ["","one","two","three","four","five","six","seven","eight","nine","ten"];

T.forEach((t, i) => {
  t.no = i + 1; t.ans = {}; t.pm = {};
  t.P = t.P.map(p => ({ L:p[0], t:p[1], a:p[2], why:p[3], tr:p[4] || {} }));
  t.P.forEach(p => { t.ans[p.a] = p.L; t.pm[p.L] = p; });
  t.mins = Math.round(t.P.length * 1.5);
});
const TBY = {}; T.forEach(t => TBY[t.id] = t);
const TOTAL_P = T.reduce((a, t) => a + t.P.length, 0);

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const txt = (t, hl) => { const e = esc(t); return hl ? e.replace(/\[\[(.+?)\]\]/g, '<mark class="ev">$1</mark>') : e.replace(/\[\[|\]\]/g, ""); };
const pad = n => (n < 10 ? "0" : "") + n;
const clock = s => pad(Math.floor(s / 60)) + ":" + pad(s % 60);
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const two = n => (n < 10 ? "0" : "") + n;
const head = (t, k) => '<span class="hd"><b>' + k + "</b><span>" + esc(t.H[k]) + "</span></span>";
function trapOf(t, p, v){
  if (!v) return ["blank", ""];
  if (p.tr[v]) return p.tr[v];
  if (t.ans[v]) return ["other", "This heading matches Paragraph " + t.ans[v] + "."];
  if (t.D[v]) return t.D[v];
  return ["other", ""];
}

/* ---------- storage ---------- */
const KEY = "mh-pro-v1";
const blank = () => ({ tests:{}, miss:{}, traps:{}, answered:0, firstOk:0, resolved:0 });
let db = blank();
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.tests) db = Object.assign(blank(), s); } } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} };
function logAnswer(t, p, v, first){
  const key = t.id + ":" + p.L;
  if (first) db.answered++;
  if (v === p.a) {
    if (first) db.firstOk++;
    if (db.miss[key]) { delete db.miss[key]; db.resolved++; }
  } else {
    const k = trapOf(t, p, v)[0];
    if (k !== "blank") db.traps[k] = (db.traps[k] || 0) + 1;
    const prev = db.miss[key];
    db.miss[key] = { id:t.id, L:p.L, v, k, n:(prev ? prev.n : 0) + 1, at:Date.now() };
  }
}

/* ---------- state ---------- */
const S = { view:"home", lvl:0, run:null, timer:null, drill:null, confirm:false };

/* ---------- test run ---------- */
function startTest(id, timed){
  stopTimer();
  const t = TBY[id];
  S.run = { id, timed, sel:{}, st:{}, round:0, reveal:false, t0:Date.now(), left:t.mins * 60, used:null, score:null };
  S.view = "test"; render(); window.scrollTo(0, 0);
  S.timer = setInterval(tick, 1000);
}
function stopTimer(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function elapsed(){ return Math.floor((Date.now() - S.run.t0) / 1000); }
function clockText(){ const r = S.run; if (r.used != null) return clock(r.used); return r.timed ? clock(r.left) : clock(elapsed()); }
function tick(){
  const r = S.run; if (!r) return stopTimer();
  if (r.timed && r.round === 0) { r.left--; if (r.left <= 0) { r.left = 0; submit(); return; } }
  const el = document.getElementById("clock");
  if (el) { el.textContent = clockText(); el.classList.toggle("low", r.timed && r.round === 0 && r.left <= 60); }
}
function submit(){
  const r = S.run; if (!r) return;
  const t = TBY[r.id], first = r.round === 0;
  r.round++;
  t.P.forEach(p => {
    if (r.st[p.L] === "ok") return;
    const v = r.sel[p.L] || "";
    r.st[p.L] = v === p.a ? "ok" : "bad";
    r.last = r.last || {}; r.last[p.L] = v;
    logAnswer(t, p, v, first);
  });
  if (first) {
    r.score = t.P.filter(p => r.st[p.L] === "ok").length;
    r.used = elapsed(); if (r.timed) r.used = Math.min(r.used, t.mins * 60);
    const prev = db.tests[t.id] || { n:0, best:0 };
    db.tests[t.id] = { n:prev.n + 1, best:Math.max(prev.best, r.score), last:r.score, total:t.P.length, at:Date.now() };
    stopTimer();
    if (r.timed) r.reveal = true;
  }
  if (t.P.every(p => r.st[p.L] === "ok")) r.reveal = true;
  save(); render();
  const b = document.getElementById("result"); if (b) b.scrollIntoView({ block:"start" });
}
function retry(){
  const r = S.run, t = TBY[r.id];
  t.P.forEach(p => { if (r.st[p.L] === "bad") { delete r.st[p.L]; r.sel[p.L] = ""; } });
  render();
  const f = document.querySelector(".pick select:not([disabled])"); if (f) { f.closest(".para").scrollIntoView({ block:"start" }); f.focus({ preventScroll:true }); }
}

/* ---------- views ---------- */
function homeView(){
  const done = Object.keys(db.tests).filter(id => TBY[id]).length;
  const nMiss = Object.keys(db.miss).length;
  let h = '<section class="hero"><h1>Matching Headings</h1><p class="sub">15 tests · ' + TOTAL_P + ' paragraphs · IELTS Academic Reading format</p>';
  h += '<dl class="stats"><div><dt>Tests completed</dt><dd>' + done + '<small>/ ' + T.length + '</small></dd></div><div><dt>First-attempt accuracy</dt><dd>' + (db.answered ? pct(db.firstOk, db.answered) + "%" : "—") + '</dd></div><div><dt>Mistakes to review</dt><dd>' + nMiss + "</dd></div></dl></section>";
  if (S.run && S.run.round === 0) h += '<div class="resume"><span>Test in progress: <b>' + esc(TBY[S.run.id].title) + '</b></span><button class="btn primary" data-act="resume">Continue</button></div>';
  h += '<div class="filters" role="group" aria-label="Level">' + [0,1,2,3].map(l => '<button class="seg" data-act="lvl" data-v="' + l + '" aria-pressed="' + (S.lvl === l) + '">' + (l ? LEVELS[l] : "All levels") + "</button>").join("") + "</div>";
  h += '<div class="grid">' + T.filter(t => !S.lvl || t.lvl === S.lvl).map(t => {
    const r = db.tests[t.id];
    return '<article class="tcard"><div class="trow"><span class="tno">Test ' + two(t.no) + '</span><span class="lv lv' + t.lvl + '">' + LEVELS[t.lvl] + '</span></div><h3>' + esc(t.title) + '</h3><p class="meta">' + t.P.length + " paragraphs · " + Object.keys(t.H).length + " headings · " + t.mins + " min</p>" +
      '<div class="score">' + (r ? '<div class="bar"><i style="width:' + pct(r.best, r.total) + '%"></i></div><span>Best ' + r.best + "/" + r.total + "</span>" : '<span class="muted">Not attempted</span>') + "</div>" +
      '<div class="acts"><button class="btn primary" data-act="start" data-id="' + t.id + '">Practice</button><button class="btn" data-act="start" data-id="' + t.id + '" data-timed="1">Timed · ' + t.mins + " min</button></div></article>";
  }).join("") + "</div>";
  return h;
}

function testView(){
  const r = S.run, t = TBY[r.id];
  const answered = t.P.filter(p => r.sel[p.L]).length;
  const open = t.P.some(p => !r.st[p.L]);
  const last = t.P[t.P.length - 1].L;
  let h = '<div class="testbar"><button class="btn ghost" data-act="home">← All tests</button><div class="tt"><span class="tno">Test ' + two(t.no) + " · " + (r.timed ? "Timed" : "Practice") + "</span><b>" + esc(t.title) + '</b></div><div class="tb-right">';
  if (open) h += '<span class="count" id="count">' + answered + " / " + t.P.length + " answered</span>";
  h += '<span class="clock" id="clock">' + clockText() + "</span>";
  if (open) h += '<button class="btn primary" data-act="submit">' + (r.round ? "Check again" : "Submit") + "</button>";
  h += "</div></div>";
  if (r.round) h += resultBanner(t, r);
  h += '<div class="layout"><article class="passage"><p class="instr">The reading passage has ' + WORDS[t.P.length] + " paragraphs, <b>A–" + last + "</b>. Choose the correct heading for each paragraph from the list of headings.</p><h2>" + esc(t.title) + "</h2>";
  h += t.P.map(p => paraHTML(t, r, p)).join("");
  h += "</article>" + headingsPanel(t, r) + "</div>";
  return h;
}
function resultBanner(t, r){
  const ok = t.P.filter(p => r.st[p.L] === "ok").length, bad = t.P.length - ok;
  const pending = t.P.filter(p => !r.st[p.L]).length;
  let h = '<section class="result" id="result"><div class="rs"><span class="big">' + r.score + '<small> / ' + t.P.length + '</small></span><span class="rl">First attempt · ' + pct(r.score, t.P.length) + "% · " + clock(r.used) + "</span></div>";
  if (r.round > 1 || (!pending && ok > r.score)) h += '<div class="rs"><span class="big alt">' + ok + "<small> / " + t.P.length + '</small></span><span class="rl">After review</span></div>';
  h += '<div class="ra">';
  if (pending) h += '<span class="muted">Choose new headings for the highlighted paragraphs, then select Check again.</span>';
  else if (bad && !r.reveal) h += '<button class="btn primary" data-act="retry">Retry incorrect (' + bad + ')</button><button class="btn" data-act="reveal">Show answers</button>';
  else { const nx = T[t.no % T.length]; h += '<button class="btn primary" data-act="start" data-id="' + nx.id + '">Next test →</button><button class="btn" data-act="start" data-id="' + t.id + '"' + (r.timed ? ' data-timed="1"' : "") + '>Restart</button><button class="btn ghost" data-act="home">All tests</button>'; }
  return h + "</div></section>";
}
function paraHTML(t, r, p){
  const st = r.st[p.L], v = r.sel[p.L] || "";
  const show = st === "ok" || (st === "bad" && r.reveal);
  const cls = st === "ok" ? " ok" : st === "bad" ? " bad" : (r.round ? " redo" : "");
  let h = '<section class="para' + cls + '" id="p-' + p.L + '"><div class="pl">' + p.L + '</div><div class="pb"><p class="ptext">' + txt(p.t, show) + "</p>";
  h += '<div class="pick"><label for="s-' + p.L + '">Heading for paragraph ' + p.L + '</label><select id="s-' + p.L + '" data-l="' + p.L + '"' + (st ? " disabled" : "") + '><option value="">Select a heading</option>' +
    Object.keys(t.H).map(k => '<option value="' + k + '"' + (v === k ? " selected" : "") + ">" + k + ".  " + esc(t.H[k]) + "</option>").join("") + "</select></div>";
  if (st === "ok") h += '<div class="fb good"><div class="fh"><span class="mk">✓</span><b>Correct</b></div><p>' + esc(p.why) + "</p></div>";
  if (st === "bad") {
    const v0 = (r.last || {})[p.L] || "", tr = trapOf(t, p, v0);
    h += '<div class="fb miss"><div class="fh"><span class="mk">✕</span><b>' + (v0 ? "Incorrect" : "No answer") + "</b>" + (tr[0] !== "blank" ? '<span class="trap">' + TRAPS[tr[0]][0] + "</span>" : "") + "</div>";
    if (v0) h += '<p class="your">Your answer: ' + head(t, v0) + "</p>" + (tr[1] ? "<p>" + esc(tr[1]) + "</p>" : "");
    if (r.reveal) h += '<p class="your">Correct answer: ' + head(t, p.a) + "</p><p>" + esc(p.why) + "</p>";
    h += "</div>";
  }
  return h + "</div></section>";
}
function headingsPanel(t, r){
  const used = new Set(Object.values(r.sel).filter(Boolean));
  const done = r.round && r.reveal;
  let h = '<aside class="panel"><details open><summary>List of Headings</summary><ol class="hlist" id="hlist">';
  h += Object.keys(t.H).map(k => {
    let tag = "", note = "";
    if (done) { if (t.ans[k]) tag = '<span class="to">' + t.ans[k] + "</span>"; else { tag = '<span class="to none">—</span>'; note = '<p class="dn">Not used. ' + esc(t.D[k][1]) + "</p>"; } }
    return '<li data-k="' + k + '" class="' + (!done && used.has(k) ? "used" : "") + '"><span class="rn">' + k + '</span><span class="ht">' + esc(t.H[k]) + note + "</span>" + tag + "</li>";
  }).join("");
  return h + "</ol></details></aside>";
}

/* ---------- mistakes & review ---------- */
function missList(){ return Object.values(db.miss).filter(m => TBY[m.id]).sort((a, b) => TBY[a.id].no - TBY[b.id].no || a.L.localeCompare(b.L)); }
function mistakesView(){
  const list = missList();
  let h = '<section class="hero"><h1>Mistakes</h1><p class="sub">Paragraphs you answered incorrectly. Answer one correctly in review or in a test to clear it.</p></section>';
  if (!list.length) return h + '<div class="empty"><p>No mistakes to review.</p><button class="btn primary" data-act="home">Go to tests</button></div>';
  h += '<div class="bar-actions"><button class="btn primary big" data-act="drill">Review ' + list.length + " mistake" + (list.length > 1 ? "s" : "") + '</button><span class="muted">' + db.resolved + " cleared so far</span></div>";
  h += '<div class="mlist">' + list.map(m => { const t = TBY[m.id]; return '<div class="mrow"><div class="mi"><span class="tno">Test ' + two(t.no) + " · Paragraph " + m.L + "</span><b>" + esc(t.title) + '</b><span class="mv">' + (m.v ? "Your answer: " + m.v + ". " + esc(t.H[m.v]) : "No answer") + '</span></div><div class="mr"><span class="trap">' + TRAPS[m.k][0] + '</span>' + (m.n > 1 ? '<span class="muted">' + m.n + "× missed</span>" : "") + '<button class="btn sm" data-act="start" data-id="' + t.id + '">Open test</button></div></div>'; }).join("") + "</div>";
  return h;
}
function startDrill(){
  const items = missList().map(m => [m.id, m.L]);
  for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  S.drill = { items, i:0, pick:null, ok:0 };
  S.view = "drill"; render(); window.scrollTo(0, 0);
}
function drillView(){
  const d = S.drill;
  if (d.i >= d.items.length) return '<section class="hero"><h1>Review complete</h1><p class="sub">' + d.ok + " of " + d.items.length + ' answered correctly.</p></section><div class="acts"><button class="btn primary" data-act="mistakes">Back to mistakes</button><button class="btn" data-act="home">All tests</button></div>';
  const [id, L] = d.items[d.i], t = TBY[id], p = t.pm[L], picked = d.pick;
  let h = '<div class="testbar"><button class="btn ghost" data-act="mistakes">← Mistakes</button><div class="tt"><span class="tno">Review · ' + (d.i + 1) + " of " + d.items.length + "</span><b>" + esc(t.title) + " · Paragraph " + L + '</b></div><div class="tb-right"><span class="count">' + d.ok + " correct</span></div></div>";
  h += '<div class="drill"><article class="passage single"><section class="para"><div class="pl">' + L + '</div><div class="pb"><p class="ptext">' + txt(p.t, picked != null) + "</p></div></section></article>";
  h += '<div class="opts" role="group" aria-label="Headings">' + Object.keys(t.H).map(k => {
    let c = ""; if (picked != null) { if (k === p.a) c = " right"; else if (k === picked) c = " wrong"; }
    return '<button class="opt' + c + '" data-act="dpick" data-k="' + k + '"' + (picked != null ? " disabled" : "") + '><span class="rn">' + k + "</span><span>" + esc(t.H[k]) + "</span></button>";
  }).join("") + "</div>";
  if (picked != null) {
    const ok = picked === p.a, tr = trapOf(t, p, picked);
    h += '<div class="fb ' + (ok ? "good" : "miss") + '"><div class="fh"><span class="mk">' + (ok ? "✓" : "✕") + "</span><b>" + (ok ? "Correct" : "Incorrect") + "</b>" + (!ok ? '<span class="trap">' + TRAPS[tr[0]][0] + "</span>" : "") + "</div>" + (!ok && tr[1] ? "<p>" + esc(tr[1]) + "</p>" : "") + "<p>" + esc(p.why) + '</p></div><div class="acts"><button class="btn primary" data-act="dnext">' + (d.i + 1 < d.items.length ? "Next paragraph →" : "Finish") + "</button></div>";
  }
  return h + "</div>";
}

/* ---------- progress ---------- */
function progressView(){
  const ids = Object.keys(db.tests).filter(id => TBY[id]);
  let h = '<section class="hero"><h1>Progress</h1><p class="sub">Saved in this browser.</p></section>';
  if (!db.answered) return h + '<div class="empty"><p>No results yet. Complete a test to see your progress.</p><button class="btn primary" data-act="home">Go to tests</button></div>';
  h += '<dl class="stats wide"><div><dt>Tests completed</dt><dd>' + ids.length + "<small>/ " + T.length + '</small></dd></div><div><dt>First-attempt accuracy</dt><dd>' + pct(db.firstOk, db.answered) + '%</dd></div><div><dt>Paragraphs answered</dt><dd>' + db.answered + '</dd></div><div><dt>Mistakes cleared</dt><dd>' + db.resolved + "</dd></div></dl>";
  h += '<section class="card"><h2>By level</h2>' + [1,2,3].map(l => {
    const ts = T.filter(t => t.lvl === l), d = ts.filter(t => db.tests[t.id]);
    const s = d.reduce((a, t) => a + db.tests[t.id].best, 0), tot = d.reduce((a, t) => a + t.P.length, 0);
    return '<div class="lrow"><span>' + LEVELS[l] + '</span><div class="bar"><i style="width:' + pct(s, tot) + '%"></i></div><span class="num">' + (d.length ? pct(s, tot) + "%" : "—") + '</span><span class="muted">' + d.length + "/" + ts.length + " tests</span></div>";
  }).join("") + "</section>";
  const rows = TRAP_ORDER.map(k => [k, db.traps[k] || 0]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
  if (rows.length) {
    const max = rows[0][1];
    h += '<section class="card"><h2>Traps that caught you</h2><div class="traps">' + rows.map(([k, n]) => '<div class="trow2"><div class="tl"><b>' + TRAPS[k][0] + "</b><span>" + TRAPS[k][1] + '</span></div><div class="bar"><i style="width:' + pct(n, max) + '%"></i></div><span class="num">' + n + "</span></div>").join("") + "</div></section>";
  }
  h += '<section class="card"><h2>Tests</h2><div class="tbl"><table><thead><tr><th>Test</th><th>Level</th><th>Best</th><th>Last</th><th>Attempts</th></tr></thead><tbody>' + T.filter(t => db.tests[t.id]).map(t => { const r = db.tests[t.id]; return "<tr><td>" + two(t.no) + ". " + esc(t.title) + "</td><td>" + LEVELS[t.lvl] + '</td><td class="num">' + r.best + "/" + r.total + '</td><td class="num">' + r.last + "/" + r.total + '</td><td class="num">' + r.n + "</td></tr>"; }).join("") + "</tbody></table></div></section>";
  h += '<div class="reset">' + (S.confirm ? '<span>Delete all results and mistakes?</span><button class="btn danger" data-act="reset2">Delete</button><button class="btn" data-act="reset0">Cancel</button>' : '<button class="btn ghost" data-act="reset1">Reset progress</button>') + "</div>";
  return h;
}

/* ---------- render & events ---------- */
function render(){
  const v = S.view;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v === v || (v === "test" && b.dataset.v === "home") || (v === "drill" && b.dataset.v === "mistakes") ? "page" : "false"));
  const n = Object.keys(db.miss).filter(k => TBY[k.split(":")[0]]).length;
  const badge = document.getElementById("mbadge"); badge.textContent = n; badge.hidden = !n;
  document.getElementById("app").innerHTML = v === "test" ? testView() : v === "mistakes" ? mistakesView() : v === "drill" ? drillView() : v === "progress" ? progressView() : homeView();
}
function keep(fn){ const y = window.scrollY; fn(); render(); window.scrollTo(0, y); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset;
  switch (d.act) {
    case "nav": S.view = d.v; S.confirm = false; if (d.v !== "test" && S.run && S.run.round > 0) { stopTimer(); } render(); window.scrollTo(0, 0); break;
    case "home": S.view = "home"; render(); window.scrollTo(0, 0); break;
    case "mistakes": S.view = "mistakes"; render(); window.scrollTo(0, 0); break;
    case "lvl": keep(() => { S.lvl = +d.v; }); break;
    case "start": startTest(d.id, !!d.timed); break;
    case "resume": S.view = "test"; render(); break;
    case "submit": submit(); break;
    case "retry": retry(); break;
    case "reveal": keep(() => { S.run.reveal = true; }); break;
    case "drill": startDrill(); break;
    case "dpick": keep(() => { const dr = S.drill, [id, L] = dr.items[dr.i], t = TBY[id], p = t.pm[L]; dr.pick = d.k; if (d.k === p.a) dr.ok++; logAnswer(t, p, d.k, false); save(); }); break;
    case "dnext": S.drill.i++; S.drill.pick = null; render(); window.scrollTo(0, 0); break;
    case "reset1": keep(() => { S.confirm = true; }); break;
    case "reset0": keep(() => { S.confirm = false; }); break;
    case "reset2": db = blank(); save(); S.confirm = false; render(); break;
  }
});
document.addEventListener("change", e => {
  const s = e.target; if (!s.matches("select[data-l]") || !S.run) return;
  const r = S.run, t = TBY[r.id];
  r.sel[s.dataset.l] = s.value;
  const used = new Set(Object.values(r.sel).filter(Boolean));
  document.querySelectorAll("#hlist li").forEach(li => li.classList.toggle("used", used.has(li.dataset.k)));
  const c = document.getElementById("count"); if (c) c.textContent = t.P.filter(p => r.sel[p.L]).length + " / " + t.P.length + " answered";
});

render();

</script>
</body>
</html>
