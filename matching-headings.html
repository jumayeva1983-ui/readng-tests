/* ===================== MASHQLAR ===================== */
const DKINDS = { trap:["Tuzoqni aniqla","Notoʻgʻri sarlavha qaysi tuzoq turiga kirishini topasiz"], topic:["Mavzu gapini top","Paragrafdagi asosiy fikrni ifodalagan gapni bosasiz"], write:["Sarlavhani oʻzing yoz","Roʻyxatsiz oʻz sarlavhangizni yozib, namuna bilan solishtirasiz"] };
function nextDrill(){
  const d = S.dr; d.pick = null; d.shown = false; d.txt = "";
  const pool = d.kind === "trap" ? TPOOL : PPOOL;
  let i; do { i = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && d.item === i);
  d.item = i;
  if (d.kind === "trap") {
    const [pid, L, h] = TPOOL[i], k = PBY[pid].pm[L].tr[h][0];
    d.opts = shuffle([k].concat(shuffle(TRAP_ORDER.filter(x => x !== k && x !== "other")).slice(0, 3)));
  }
}
function drillHTML(){
  const d = S.dr; if (d.item == null) nextDrill();
  let h = '<section class="intro"><h1>Mashqlar</h1><p class="lede">Uch xil qisqa mashq matching headingsning alohida koʻnikmalarini ishlab chiqadi: tuzoqni tanish, mavzu gapini topish va asosiy fikrni oʻz soʻzlaring bilan ifodalash. Hamma mashqlar trenajordagi ' + PASSAGES.length + " ta matn asosida tuziladi.</p></section>";
  h += '<div class="seg" role="group" aria-label="Mashq turi">' + Object.keys(DKINDS).map(k => '<button data-act="dkind" data-k="' + k + '" aria-pressed="' + (d.kind === k) + '">' + DKINDS[k][0] + "</button>").join("") + "</div>";
  h += '<div class="dwrap"><p class="small" style="margin:0">' + DKINDS[d.kind][1] + "</p>";
  if (d.kind === "trap") h += drillTrap(); else if (d.kind === "topic") h += drillTopic(); else h += drillWrite();
  return h + "</div>";
}
function drillTrap(){
  const d = S.dr, [pid, L, hk] = TPOOL[d.item], p = PBY[pid], q = p.pm[L], tr = q.tr[hk];
  let h = '<section class="card"><h3>' + p.no + "-matn · " + esc(p.title) + " · " + L + ' paragraf</h3><p class="dpara">' + ptext(q.t, false) + "</p></section>";
  h += '<section class="card"><p><span class="lab">Toʻgʻri sarlavha</span>' + hd(p, q.a) + '</p><p style="margin-top:8px"><span class="lab">Talaba tanlagan</span>' + hd(p, hk) + '</p><p style="margin-top:12px;font-weight:600">Bu sarlavha qaysi tuzoq turiga kiradi?</p><div class="opts" style="margin-top:8px">';
  h += d.opts.map(k => { let c = ""; if (d.pick) { if (k === tr[0]) c = " right"; else if (k === d.pick) c = " wrong"; } return '<button class="opt' + c + '" data-act="dtrap" data-k="' + k + '"' + (d.pick ? " disabled" : "") + "><b>" + TRAPS[k].n + "</b><span>" + TRAPS[k].s + "</span></button>"; }).join("") + "</div>";
  if (d.pick) h += '<div class="fcard" style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px"><span class="pill ' + (d.pick === tr[0] ? "ok" : "bad") + '" style="align-self:flex-start">' + (d.pick === tr[0] ? "Toʻgʻri" : "Notoʻgʻri · javob: " + TRAPS[tr[0]].n) + "</span><p>" + esc(tr[1]) + '</p><p class="note"><span class="lab">Qoida</span>' + esc(TRAPS[tr[0]].avoid) + '</p><p class="note">Baʼzan bitta sarlavhada ikki tuzoq birlashadi; bu yerda eng kuchli taʼsir qiluvchi tur koʻrsatilgan.</p></div>';
  h += '<div class="nav"><span class="small num">Natija: ' + store.dr.trap[0] + " / " + store.dr.trap[1] + '</span><button class="btn primary" data-act="dnext">Keyingisi</button></div></section>';
  return h;
}
function drillTopic(){
  const d = S.dr, [pid, L] = PPOOL[d.item], p = PBY[pid], q = p.pm[L];
  const ss = sentences(q.t), right = ss.findIndex(x => x.indexOf("[[") > -1);
  let h = '<section class="card"><h3>' + p.no + "-matn · " + esc(p.title) + " · " + L + ' paragraf</h3><p class="dpara">';
  h += ss.map((x, i) => { let c = "sent"; if (d.pick != null) { c += " off"; if (i === right) c += " right"; else if (i === d.pick) c += " wrong"; } const t = esc(plain(x)); return '<span class="' + c + '" role="button" tabindex="' + (d.pick != null ? "-1" : "0") + '" data-act="dsent" data-i="' + i + '">' + (d.sig ? sigHL(t) : t) + "</span>"; }).join(" ");
  h += '</p><div class="nav"><button class="btn ghost sm" data-act="dsig" aria-pressed="' + d.sig + '">' + (d.sig ? "Signal soʻzlarni yashirish" : "Signal soʻzlarni koʻrsatish") + "</button></div>";
  if (d.pick != null) h += '<div class="fcard" style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px"><span class="pill ' + (d.pick === right ? "ok" : "bad") + '" style="align-self:flex-start">' + (d.pick === right ? "Toʻgʻri" : "Notoʻgʻri") + '</span><p><span class="lab">Sarlavha</span>' + hd(p, q.a) + "</p><p>" + esc(q.why) + '</p><p class="note">Baʼzan asosiy fikr ikki gapga taqsimlanadi. Bunday holda sarlavhaga eng yaqin gap belgilangan.</p></div>';
  h += '<div class="nav"><span class="small num">Natija: ' + store.dr.topic[0] + " / " + store.dr.topic[1] + '</span><button class="btn primary" data-act="dnext">Keyingisi</button></div></section>';
  return h;
}
function drillWrite(){
  const d = S.dr, [pid, L] = PPOOL[d.item], p = PBY[pid], q = p.pm[L];
  let h = '<section class="card"><h3>' + p.no + "-matn · " + esc(p.title) + " · " + L + ' paragraf</h3><p class="dpara">' + ptext(q.t, d.shown) + "</p></section>";
  h += '<section class="card"><label class="lab" for="own-heading">Sizning sarlavhangiz (inglizcha, 4–8 soʻz)</label><textarea id="own-heading" data-act-input="own" placeholder="Masalan: Why the plan failed">' + esc(d.txt) + "</textarea>";
  if (!d.shown) h += '<div class="nav"><span class="small">Avval yozing, keyin solishtiring.</span><button class="btn primary" data-act="dshow">Namuna bilan solishtirish</button></div>';
  else h += '<div class="fcard" style="margin-top:14px"><p><span class="lab">Imtihondagi sarlavha</span>' + hd(p, q.a) + '</p><p><span class="lab">Qisqa mazmun</span><span class="hd">' + esc(q.gist) + "</span></p><p>" + esc(q.why) + '</p><p style="font-weight:600;margin-top:6px">Oʻzingizni tekshiring:</p><ol class="checklist"><li>Sarlavhangiz butun paragrafni qamraydimi yoki bitta misolnimi?</li><li>Unda paragrafning vazifasi (sabab, muammo, yechim, eʼtiroz, kelajak) koʻrinadimi?</li><li>Paragrafdagi soʻzlarni takrorlamay, parafraz qildingizmi?</li><li>Sarlavhangiz matndagidan kuchliroq daʼvo qilmayaptimi (all, always, the only)?</li></ol><div class="nav" style="margin-top:6px"><span></span><button class="btn primary" data-act="dnext">Keyingi paragraf</button></div></div>';
  return h + "</section>";
}

/* ===================== STRATEGIYA ===================== */
function trapExample(k){
  for (const p of PASSAGES) for (const q of p.paras) if (q.tr) for (const h of Object.keys(q.tr)) if (q.tr[h][0] === k) return '<div class="exbox"><span class="lab">Trenajordan misol · ' + p.no + "-matn, " + q.L + " paragraf</span><span>Tuzoq sarlavha: " + hd(p, h) + "</span><span>" + esc(q.tr[h][1]) + "</span></div>";
  if (k === "other") return '<div class="exbox"><span class="lab">Misol</span><span>2-matnda C paragrafga “vii” qoʻyilsa, A paragraf ham sarlavhasiz qoladi: bitta xato ikkita xatoga aylanadi.</span></div>';
  return "";
}
function rulesHTML(){
  return `<section class="doc"><h1>Strategiya</h1><p class="lede">Matching headings topshirigʻini yechish algoritmi, sarlavhaning fokus soʻzlari, signal soʻzlar va eng koʻp uchraydigan tuzoqlar.</p>
<div class="rsec"><h2>Topshiriq qanday tuzilgan</h2>
<p>Matn paragraflarga (A, B, C…) boʻlingan, alohida roʻyxatda rim raqamlari bilan belgilangan sarlavhalar (i, ii, iii…) beriladi. Har bir paragrafga uning asosiy fikrini ifodalaydigan bitta sarlavha tanlanadi. Sarlavhalar paragraflardan koʻp boʻladi, ortiqchalari esa ataylab chalgʻitish uchun qoʻshiladi. IELTSda odatda har bir sarlavha bir marta ishlatiladi, baʼzan bitta paragraf namuna sifatida yechib beriladi: bunday sarlavhani darhol roʻyxatdan oʻchiring.</p>
<p>Topshiriq detalni emas, paragrafning vazifasini tekshiradi: muallif shu paragrafda nima qilyapti? Sabab koʻrsatyaptimi, muammo qoʻyyaptimi, yechim taklif qilyaptimi yoki eski qarashni rad etyaptimi?</p></div>
<div class="rsec"><h2>Ishlash algoritmi</h2><ol>
<li><b>Sarlavhalarni oʻqing</b> va har biridagi fokus soʻzni belgilang (reasons, effects, obstacles, unexpected…). Bir-biriga oʻxshash “egizak” sarlavhalarni juftlab qoʻying.</li>
<li><b>Namuna sarlavhani</b> (agar berilgan boʻlsa) roʻyxatdan oʻchiring.</li>
<li><b>Paragrafning birinchi va ikkinchi gapini, keyin oxirgi gapini oʻqing.</b> Burilish soʻzlariga (however, yet, but, in fact) alohida eʼtibor bering.</li>
<li><b>Asosiy fikrni oʻz soʻzlaringiz bilan</b> 4–7 soʻzda ayting. Oʻzbekcha boʻlsa ham boʻladi.</li>
<li><b>Shu qisqa xulosani sarlavhalar bilan solishtiring</b> va 1–2 nomzod tanlang.</li>
<li><b>Har bir nomzodni uch savol bilan tekshiring:</b> butun paragrafni qamraydimi? Fokus soʻzi mosmi? Matnda dalil gapi bormi?</li>
<li><b>Ishonchingiz komil boʻlsa</b>, javobni yozing va sarlavhani roʻyxatdan oʻchiring. Ikkilansangiz, ikkala nomzodni yozib qoʻyib, keyingi paragrafga oʻting.</li>
<li><b>Oxirida qolgan paragraflarga qayting:</b> endi roʻyxatda nomzodlar kamaygan boʻladi.</li></ol></div>
<div class="rsec"><h2>Asosiy fikr qayerda boʻladi</h2><div class="pos">
<div><b>Birinchi gapda</b><p>Eng koʻp uchraydigan holat. 1-matn, B paragraf: “The most immediate beneficiaries are often the buildings themselves.”</p></div>
<div><b>Burilishdan keyin</b><p>Paragraf odatiy qarash bilan boshlanib, keyin uni cheklaydi. 2-matn, D paragraf: “Yet environmental values alone rarely fill a train.”</p></div>
<div><b>Oxirgi gapda</b><p>Avval kontekst yoki misollar, keyin xulosa. 4-matn, A paragraf va 6-matn, C paragraf.</p></div>
<div><b>Yashirin</b><p>Alohida mavzu gapi boʻlmasa, misollarni bitta umumiy tushunchaga birlashtiring: ogʻirlik + xarajat + shamol = toʻsiqlar.</p></div></div></div>
<div class="rsec"><h2>Sarlavhaning fokus soʻzi</h2><div class="tbl"><table><thead><tr><th>Sarlavhadagi soʻz</th><th>Paragrafda nimani izlash kerak</th></tr></thead><tbody>
<tr><td class="en">reasons, causes, why…</td><td>because, due to, led to; sabablar sanab oʻtilgan boʻladi</td></tr>
<tr><td class="en">effects, consequences, impact</td><td>as a result, therefore, consequently; natijalar</td></tr>
<tr><td class="en">solutions, responses, measures</td><td>tackle, address, introduce; koʻrilgan choralar</td></tr>
<tr><td class="en">problems, obstacles, limits, drawbacks</td><td>however, difficult, cannot, costly; toʻsiqlar</td></tr>
<tr><td class="en">benefits, advantages</td><td>help, improve, save, reduce; foydalar</td></tr>
<tr><td class="en">unexpected, surprising, paradox</td><td>surprisingly, paradoxically, unlikely, instead; kutilmagan natija</td></tr>
<tr><td class="en">history, origins, early</td><td>sanalar, oʻtgan zamon, first, originally</td></tr>
<tr><td class="en">future, prospects, outlook</td><td>will, may, likely, looking ahead; kelajak haqidagi taxmin</td></tr>
<tr><td class="en">opposition, debate, criticism</td><td>critics, not everyone, complained, refused; qarama-qarshi fikrlar</td></tr>
<tr><td class="en">comparison, contrast</td><td>whereas, unlike, while, compared with</td></tr></tbody></table></div></div>
<div class="rsec"><h2>Signal soʻzlar</h2><div class="sigs">
<div><b>Burilish</b><span>Asosiy fikr koʻpincha shundan keyin keladi: <span class="w">however, yet, but, in fact, instead, rather, nevertheless</span></span></div>
<div><b>Qoʻshish</b><span>Fikr davom etadi: <span class="w">also, in addition, moreover, similarly, another</span></span></div>
<div><b>Misol</b><span>Detal, sarlavha emas: <span class="w">for example, for instance, such as, including</span></span></div>
<div><b>Natija va xulosa</b><span>Umumlashtirish: <span class="w">as a result, therefore, in other words, on this view, in a sense</span></span></div>
<div><b>Ehtiyotkorlik</b><span>Daraja tuzogʻini tekshiring: <span class="w">may, some, in some cases, few, rarely, suggests</span></span></div></div></div>
<div class="rsec"><h2>Tuzoqlar</h2><p>Har bir tuzoq turi uchun taʼrif, nega ishlashi, undan qanday qochish va trenajordagi misol. Testda notoʻgʻri javob tanlansa, aynan shu turlardan biri koʻrsatiladi.</p><div class="traps">` +
  TRAP_ORDER.map(k => '<details class="trap"><summary><span class="tn">' + TRAPS[k].n + ' <span class="mono">' + TRAPS[k].en + '</span></span><span class="ts">' + TRAPS[k].s + '</span></summary><div class="tb"><p>' + TRAPS[k].l + '</p><p><span class="lab">Qanday qochish</span>' + TRAPS[k].avoid + "</p>" + trapExample(k) + "</div></details>").join("") +
  `</div></div>
<div class="rsec"><h2>Vaqt</h2><ul>
<li>IELTS Readingda 3 ta matn va 40 ta savolga 60 daqiqa beriladi; javoblarni koʻchirish uchun alohida vaqt berilmaydi.</li>
<li>Har bir paragrafga taxminan 1–1,5 daqiqa ajrating. Qiyin paragrafga 2 daqiqadan ortiq vaqt sarflamang: ikki nomzodni yozib, keyinroq qayting.</li>
<li>Qisqa va aniq paragraflardan boshlang: ularning sarlavhalari roʻyxatdan chiqib ketsa, qiyin paragraflar uchun tanlov kamayadi.</li>
<li>Matching headings odatda matn boʻyicha birinchi topshiriq boʻladi. Uni avval yechsangiz, matnning tuzilishi tushunarli boʻladi va keyingi savollarda kerakli paragrafni tez topasiz.</li></ul></div></section>`;
}

/* ===================== OʻQITUVCHIGA ===================== */
function teachHTML(){
  return `<section class="doc"><h1>Oʻqituvchiga</h1><p class="lede">Matching headings koʻnikmasini bosqichma-bosqich oʻrgatish, darsdagi usullar va qoʻshimcha mashqlar. Tavsiyalar IELTS tayyorgarligida keng qoʻllanadigan usullarga tayanadi; ularning samaradorligi haqida aniq raqamlar keltirilmaydi.</p>

<li><b>Parafraz.</b> Toʻgʻri sarlavha matndagi soʻzlarni kamdan kam takrorlaydi. Sinonim va umumlashtirish mashqlari bering: “subsidies, track fees, funding” → “political decisions”.</li>

<div class="ex"><span class="in">Trenajorda bor</span><b>Tuzoqni aniqla</b><p><i>Maqsad:</i> tuzoq turlarini nomi bilan tanish.</p><p>Notoʻgʻri sarlavha beriladi; talaba uning tuzoq turini aniqlaydi va matndan isbot keltiradi.</p></div>
<div class="ex"><b>Tor, keng, toʻgʻri</b><p><i>Maqsad:</i> qamrov hissini shakllantirish.</p><p>Bitta paragrafga uchta sarlavha beriladi: biri detal, biri butun matn nomi, biri toʻgʻri. Talaba ularni tasniflaydi va sababini aytadi.</p></div>
<div class="ex"><b>Tuzoq yasash</b><p><i>Maqsad:</i> test tuzuvchi nuqtayi nazaridan qarash.</p><p>Talabalar paragraf uchun oʻzlari 2 ta chalgʻituvchi sarlavha yozadi va tuzoq turini koʻrsatadi; guruhlar topshiriqlarni almashib yechadi.</p></div>
<div class="ex"><b>Soʻz koʻprigi</b><p><i>Maqsad:</i> parafrazni koʻrish.</p><p>Sarlavhadagi har bir soʻz uchun matndagi ekvivalent topiladi va chiziq bilan bogʻlanadi: unlikely → unexpected, expensive to operate → cost so much to run.</p></div>
<div class="ex"><b>Egizak sarlavhalar</b><p><i>Maqsad:</i> fokus soʻziga eʼtibor.</p><p>Oʻqituvchi bir soʻz bilan farq qiladigan juftliklar tuzadi (Reasons for… / Responses to…). Talaba paragrafga qaysi biri mosligini va farq qiluvchi soʻzni koʻrsatadi.</p></div>
<div class="ex"><b>Sarlavhasiz yangilik</b><p><i>Maqsad:</i> haqiqiy matnlarda mashq qilish.</p><p>Ingliz tilidagi yangilik yoki ilmiy-ommabop maqoladan kichik sarlavhalar olib tashlanadi; talaba oʻz variantini yozib, asl sarlavha bilan solishtiradi.</p></div>
<div class="ex"><b>Paragraflar jumbogʻi</b><p><i>Maqsad:</i> matn mantiqini tushunish.</p><p>Paragraflar aralashtirib beriladi; talaba ularni tartibga keltiradi va oʻtish gaplarini belgilaydi. Qoʻshni paragraf tuzogʻini tushunishga yordam beradi.</p></div>
<div class="ex"><b>30 soniyalik skimming</b><p><i>Maqsad:</i> tezlik.</p><p>Har bir paragrafga 30 soniya: faqat birinchi gap, burilish soʻzi va oxirgi gap oʻqiladi, keyin asosiy fikr ogʻzaki aytiladi.</p></div>
<div class="ex"><b>Sud bahsi</b><p><i>Maqsad:</i> dalil bilan fikrlash.</p><p>Sinf ikki guruhga boʻlinadi; har bir guruh bitta nomzod sarlavhani matndan dalil bilan himoya qiladi. Hakam qaror chiqaradi va uni asoslaydi.</p></div>
<div class="ex"><b>Matn xaritasi</b><p><i>Maqsad:</i> butun matn tuzilishini koʻrish.</p><p>Har bir paragraf uchun bir qator yoziladi: “A – nima haqida, qanday vazifa (sabab, misol, eʼtiroz)”. Xarita keyingi savol turlarida ham ishlatiladi.</p></div>
<div class="ex"><b>Teskari topshiriq</b><p><i>Maqsad:</i> Writing bilan bogʻlash.</p><p>Talaba berilgan sarlavha asosida 5–6 gapli paragraf yozadi. Mavzu gapini toʻgʻri joylashtirish koʻnikmasi mustahkamlanadi.</p></div>
<div class="ex"><b>Vaqt zinapoyasi</b><p><i>Maqsad:</i> imtihon tezligiga oʻtish.</p><p>Bir xil turdagi matnlar kamayib boruvchi vaqt bilan yechiladi: vaqtsiz → paragrafga 2 daqiqa → 1,5 daqiqa → 1 daqiqa.</p></div>
</div></div>
<div class="rsec"><h2>Xato tahlili kartochkasi</h2><p>Talaba har bir xato uchun quyidagi kartochkani toʻldiradi:</p>
<pre class="tpl">Matn / paragraf: ______
Men tanlagan sarlavha: ______, chunki ______
Toʻgʻri sarlavha: ______, dalil gap: “______”
Tuzoq turi: ______
Keyingi safar nima qilaman: ______</pre></div>
<div class="rsec"><h2>Trenajordan foydalanish rejasi</h2><ol>
<li><b>1-dars.</b> “Strategiya” boʻlimi; 1-matn mashq rejimida; xatolar tahlili.</li>
<li><b>2-dars.</b> “Mavzu gapini top” mashqi (15–20 paragraf); 2-matn mashq rejimida.</li>
<li><b>3-dars.</b> Tuzoqlar boʻlimi; “Tuzoqni aniqla” mashqi; 3- va 4-matn.</li>
<li><b>4-dars.</b> 5- va 6-matn imtihon rejimida; “Natijalar” boʻlimidagi tuzoqlar statistikasi asosida har bir talabaga shaxsiy reja.</li></ol></div>
<div class="rsec plain"><h2>Imtihonlar haqida eslatma</h2>
<p>Matching headings – IELTS Reading (Academic va General Training) topshiriq turi. TOEFL iBT va SATda aynan shu formatdagi topshiriq yoʻq, lekin ularda ham matn yoki paragrafning asosiy fikri va tuzilishini aniqlash savollari bor: SATda “Central Ideas and Details” va “Text Structure and Purpose” savol turlari, TOEFLda matnning asosiy gʻoyasi va tuzilishi bilan bogʻliq savollar. Cambridge English imtihonlaridagi (B2 First, C1 Advanced) multiple matching topshiriqlari ham shu koʻnikmaga yaqin.</p>
<p>Shuning uchun trenajordagi TOEFL va SAT belgili matnlar oʻsha imtihonlarga xos mavzu va lugʻat darajasida yozilgan, topshiriq shakli esa IELTSniki. Imtihon formatlari yangilanib turadi: talabalarni rasmiy saytlardagi amaldagi namunalar bilan tanishtiring (ielts.org, ets.org/toefl, satsuite.collegeboard.org). Haqiqiy imtihon matnlari uchun Cambridge University Press nashr etgan “Cambridge IELTS” toʻplamlaridan foydalaning.</p></div></section>`;
}

/* ===================== NATIJALAR ===================== */
function bars(rows, cls){
  const max = Math.max(1, ...rows.map(r => r[1]));
  return '<div class="hbars">' + rows.map(r => '<div class="hb"><span>' + r[0] + '</span><div class="track ' + cls + '"><i style="width:' + pct(r[1], max) + '%"></i></div><span class="hv num">' + r[1] + " marta</span></div>").join("") + "</div>";
}
function statsHTML(){
  const ids = Object.keys(store.att).filter(id => PBY[id]);
  const log = store.log.filter(e => PBY[e.p] && e.k !== "blank");
  let h = '<section class="doc" style="max-width:1000px"><h1>Natijalar</h1><p class="lede">Birinchi urinishlar, tuzoqlar statistikasi va xatolar daftari. Maʼlumotlar faqat shu brauzerda saqlanadi.</p>';
  if (!ids.length && !log.length && !store.dr.trap[1] && !store.dr.topic[1]) return h + '<div class="rsec"><p class="empty">Hali natija yoʻq. Birinchi testni yeching: tekshiruvdan keyin bu yerda tuzoqlar statistikasi va xatolar daftari paydo boʻladi.</p><button class="btn primary" data-act="start" data-p="rooftop" data-m="practice">1-matnni boshlash</button></div></section>';
  const tot = ids.reduce((a, id) => a + store.att[id].total, 0), ok = ids.reduce((a, id) => a + store.att[id].first, 0);
  h += '<div class="kpis"><div><span class="mono">Birinchi urinishdagi aniqlik</span><b class="num">' + pct(ok, tot) + '%</b><span class="small">' + ok + " / " + tot + ' paragraf</span></div><div><span class="mono">Yechilgan testlar</span><b class="num">' + ids.length + " / " + PASSAGES.length + '</b></div><div><span class="mono">Tuzoqqa tushishlar</span><b class="num">' + log.length + '</b><span class="small">qayta urinishlar bilan birga</span></div></div>';
  if (ids.length) h += '<div class="rsec"><h2>Testlar boʻyicha</h2><div class="tbl"><table><thead><tr><th>Matn</th><th>Oxirgi birinchi urinish</th><th>Eng yaxshi</th><th>Xatolar tahlilidan keyin</th><th>Urinishlar</th></tr></thead><tbody>' + ids.map(id => { const a = store.att[id], p = PBY[id]; return "<tr><td>" + p.no + ". " + esc(p.title) + '</td><td class="num">' + a.first + " / " + a.total + '</td><td class="num">' + a.best + " / " + a.total + '</td><td class="num">' + (a.fin != null ? a.fin + " / " + a.total : "—") + '</td><td class="num">' + a.n + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
  if (log.length) {
    const tc = TRAP_ORDER.map(k => [TRAPS[k].n, log.filter(e => e.k === k).length, k]).filter(r => r[1]).sort((a, b) => b[1] - a[1]);
    const top = tc[0];
    h += '<div class="rsec"><h2>Qaysi tuzoqlarga tushyapsiz</h2>' + bars(tc, "") + '<div class="insight"><b>Asosiy zaif nuqta: ' + top[0] + "</b><p>" + TRAPS[top[2]].avoid + "</p><p class=\"note\">Mashq: “Mashqlar” → “Tuzoqni aniqla”, keyin “Strategiya” boʻlimidagi shu tuzoq taʼrifini qayta oʻqing.</p></div></div>";
    const rc = Object.keys(REASONS).map(r => [REASONS[r].t, log.filter(e => e.r === r).length, r]).filter(r => r[1]).sort((a, b) => b[1] - a[1]);
    h += '<div class="rsec"><h2>Xato sabablari (oʻzingiz belgilagan)</h2>' + (rc.length ? bars(rc, "r") + '<div class="insight"><b>Tavsiya: ' + rc[0][0].toLowerCase() + "</b><p>" + REASONS[rc[0][2]].a + "</p></div>" : '<p class="empty">Test tahlilida “Nega xato qildingiz?” savoliga javob bersangiz, bu yerda shaxsiy tavsiya paydo boʻladi.</p>') + "</div>";
  }
  h += '<div class="rsec"><h2>Mashqlar</h2><p>Tuzoqni aniqla: <b class="num">' + store.dr.trap[0] + " / " + store.dr.trap[1] + "</b> · Mavzu gapini top: <b class=\"num\">" + store.dr.topic[0] + " / " + store.dr.topic[1] + "</b></p></div>";
  if (log.length) h += '<div class="rsec"><h2>Xatolar daftari</h2><p class="small">Oxirgi 30 ta xato. Toʻgʻri javob yopiq: avval oʻzingiz eslab koʻring.</p><ul class="wlist">' + log.slice(-30).reverse().map(e => { const p = PBY[e.p]; return '<li><span class="mono">' + p.no + "-matn · " + esc(p.title) + " · " + e.L + " paragraf" + (e.n > 1 ? " · " + e.n + "-urinish" : "") + '</span><p><span class="lab">Tanlangan</span>' + hd(p, e.v) + '</p><p><span class="ttag">' + TRAPS[e.k].n + "</span>" + (e.r ? ' <span class="small">· ' + REASONS[e.r].t + "</span>" : "") + '</p><details class="more"><summary>Toʻgʻri javob</summary><p style="margin-top:6px">' + hd(p, e.a) + '</p></details><div class="btns"><button class="btn sm" data-act="start" data-p="' + p.id + '" data-m="practice">Testni qayta yechish</button></div></li>'; }).join("") + "</ul></div>";
  h += '<div class="rsec plain"><h2>Natijalarni tozalash</h2>' + (S.confirmReset ? '<p>Barcha natijalar va xatolar daftari oʻchiriladi. Davom etasizmi?</p><div class="btns"><button class="btn danger" data-act="reset2">Ha, oʻchirish</button><button class="btn" data-act="reset0">Bekor qilish</button></div>' : '<button class="btn" data-act="reset1">Hamma natijalarni oʻchirish</button>') + "</div></section>";
  return h;
}

/* ===================== RENDER VA HODISALAR ===================== */
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", (b.dataset.v === S.view || (S.view === "sess" && b.dataset.v === "lib")) ? "page" : "false"));
  const v = S.view;
  document.getElementById("app").innerHTML = v === "sess" ? sessHTML() : v === "drill" ? drillHTML() : v === "rules" ? rulesHTML() : v === "stats" ? statsHTML() : v === "teach" ? teachHTML() : libHTML();
}
function keep(fn){ const y = window.scrollY; fn(); render(); window.scrollTo(0, y); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset, s = S.sess;
  switch (d.act) {
    case "tab": S.view = d.v; S.confirmReset = false; render(); window.scrollTo(0, 0); break;
    case "start": start(d.p, d.m); break;
    case "resume": S.view = "sess"; render(); break;
    case "check": check(false); break;
    case "hint": keep(() => { s.hint[d.l] = !s.hint[d.l]; }); break;
    case "reason": keep(() => { const ent = store.log[s.li[d.l]]; if (ent) { ent.r = ent.r === d.r ? "" : d.r; save(); } }); break;
    case "reveal": keep(() => { s.st[d.l] = "rev"; finishIfDone(); save(); }); break;
    case "revealall": keep(() => { PBY[s.pid].paras.forEach(q => { if (s.st[q.L] === "bad" || !s.st[q.L]) { s.st[q.L] = "rev"; } }); finishIfDone(); save(); }); break;
    case "retry": { PBY[s.pid].paras.forEach(q => { if (s.st[q.L] === "bad") { delete s.st[q.L]; s.sel[q.L] = ""; } }); render(); const f = document.querySelector("select:not([disabled])"); if (f) { f.scrollIntoView({ block:"center" }); f.focus(); } break; }
    case "dkind": S.dr.kind = d.k; S.dr.item = null; render(); break;
    case "dnext": nextDrill(); render(); break;
    case "dtrap": keep(() => { const [pid, L, h] = TPOOL[S.dr.item]; S.dr.pick = d.k; store.dr.trap[1]++; if (d.k === PBY[pid].pm[L].tr[h][0]) store.dr.trap[0]++; save(); }); break;
    case "dsent": if (S.dr.pick == null) keep(() => { const [pid, L] = PPOOL[S.dr.item]; const i = +d.i; S.dr.pick = i; store.dr.topic[1]++; if (sentences(PBY[pid].pm[L].t)[i].indexOf("[[") > -1) store.dr.topic[0]++; save(); }); break;
    case "dsig": keep(() => { S.dr.sig = !S.dr.sig; }); break;
    case "dshow": keep(() => { const t = document.getElementById("own-heading"); S.dr.txt = t ? t.value : ""; S.dr.shown = true; }); break;
    case "reset1": keep(() => { S.confirmReset = true; }); break;
    case "reset0": keep(() => { S.confirmReset = false; }); break;
    case "reset2": store = fresh(); save(); S.confirmReset = false; render(); break;
  }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.matches && t.matches('[role="button"][data-act]')) { e.preventDefault(); t.click(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("select[data-l]") && S.sess) { const L = t.dataset.l; keep(() => { S.sess.sel[L] = t.value; }); const f = document.getElementById("sel-" + L); if (f) f.focus({ preventScroll:true }); }
});
document.addEventListener("input", e => { if (e.target.id === "own-heading") S.dr.txt = e.target.value; });

render();
</script>
