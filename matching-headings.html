<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matching Headings Trenajori</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: imtihon kitobchasi — chapda matn varagʻi, oʻngda sarlavhalar roʻyxati va javob varagʻi; isbot gapi marker bilan belgilanadi */
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#151D2C; --muted:#586376; --line:#D5DBE4; --soft:#E6EAF0;
  --pencil:#2B4BD3; --pencil-ink:#FFFFFF; --pencil-soft:#E3E8FC;
  --marker:#FFE27A; --marker-ink:#2E2500;
  --ok:#17744B; --ok-soft:#DDF2E6; --bad:#B23C27; --bad-soft:#FAE4DE;
  --f-read:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F131B; --sheet:#171C27; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2B3345; --soft:#1F2533;
  --pencil:#8AA2FF; --pencil-ink:#0F131B; --pencil-soft:#222B4A;
  --marker:#6A5717; --marker-ink:#FFF3CC;
  --ok:#55C792; --ok-soft:#17301F; --bad:#F08C76; --bad-soft:#3A1F1A; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F131B; --sheet:#171C27; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2B3345; --soft:#1F2533;
  --pencil:#8AA2FF; --pencil-ink:#0F131B; --pencil-soft:#222B4A;
  --marker:#6A5717; --marker-ink:#FFF3CC;
  --ok:#55C792; --ok-soft:#17301F; --bad:#F08C76; --bad-soft:#3A1F1A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-ui);margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.mono{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:600 19px/1 var(--f-read);letter-spacing:-.01em}
.brand .key{display:inline-flex;gap:3px;font:600 11px/1 var(--f-mono);color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tabs button:hover{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.intro{padding-block:32px 8px;max-width:780px}
.intro h1{font:600 clamp(30px,5vw,46px)/1.05 var(--f-read);letter-spacing:-.02em;margin:0 0 12px}
.lede{font-size:16.5px;color:var(--muted);margin:0;max-width:64ch}
.progress-line{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.progress-line b{color:var(--ink)}
.resume{margin-block:18px 0;border:1px solid var(--pencil);background:var(--pencil-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);margin-top:24px}
.prow{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-child{border-top:0}
.pinfo{min-width:0;flex:1 1 320px}
.pinfo h3{font:500 20px/1.25 var(--f-read);margin:6px 0 2px}
.pmeta{font-size:13px;color:var(--muted)}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:4px;background:var(--soft);border-radius:2px;margin:10px 0 4px;max-width:280px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pencil)}
.tag{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid currentColor;display:inline-block}
.t-IELTS{color:var(--pencil)} .t-TOEFL{color:var(--ok)} .t-SAT{color:var(--bad)}
.foot{font-size:12.5px;color:var(--muted);max-width:84ch;margin-top:24px}

/* session */
.sbar{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.stitle{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.stitle b{font:500 17px/1.2 var(--f-read)}
.clockwrap{display:flex;align-items:baseline;gap:8px}
.clock{font:500 22px/1 var(--f-mono)}
.clock.low{color:var(--bad)}
.sgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.passage{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 72px);max-height:calc(100vh - 96px);overflow:auto;min-width:0}
.ph{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:6px}
.ptitle{font:600 24px/1.2 var(--f-read);margin:10px 0 4px}
.para{font:400 17.5px/1.62 var(--f-read);margin:14px 0;position:relative;padding-left:44px;max-width:66ch}
.para .pl{position:absolute;left:0;top:3px;font:600 12px/1 var(--f-mono);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px 6px}
.para .pk{position:absolute;left:0;top:28px;font:600 11px/1 var(--f-mono);color:var(--pencil);padding:3px 0}
.para .pk.ok{color:var(--ok)} .para .pk.bad{color:var(--bad)}
mark.ev{background:var(--marker);color:var(--marker-ink);padding:1px 2px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.qpane{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h3{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hlist li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:6px;padding:5px 6px;border-radius:4px;font:400 16px/1.4 var(--f-read)}
.hlist .rn{font:600 12.5px/1.75 var(--f-mono);color:var(--muted)}
.hlist li.used{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.arow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .al{font:600 13px/1 var(--f-mono)}
.arow select{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.arow.ok select{border-color:var(--ok);background:var(--ok-soft)}
.arow.bad select{border-color:var(--bad);background:var(--bad-soft)}
.arow .ic{font:600 14px/1 var(--f-mono);width:24px;text-align:center}
.arow.ok .ic{color:var(--ok)} .arow.bad .ic{color:var(--bad)}
.hinttxt{grid-column:2 / -1;font-size:13.5px;background:var(--pencil-soft);padding:8px 10px;border-radius:4px;margin:0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

.rsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rsum div{display:flex;flex-direction:column;gap:4px}
.rsum b{font:600 26px/1 var(--f-read)}
.fcard{border-top:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:8px}
.fcard:first-child{border-top:0;padding-top:0}
.fh{display:flex;align-items:center;gap:10px}
.fl{font:600 13px/1 var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:4px 7px}
.pill{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.fcard p{margin:0;max-width:68ch}
.lab{display:inline-block;font:500 10.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.hd{font-family:var(--f-read);font-size:16px}
.hd b{font-family:var(--f-mono);font-size:13px;margin-right:6px}
blockquote{margin:0;font:400 16px/1.5 var(--f-read);padding:8px 12px;background:var(--marker);color:var(--marker-ink);border-radius:4px}
.trapbox{background:var(--bad-soft);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.trapbox .tn{font-weight:600}
.note{font-size:13.5px;color:var(--muted)}
.trapbox .note{color:var(--ink);opacity:.85}
.eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
details.more summary{cursor:pointer;font-size:13.5px;color:var(--pencil);font-weight:500}
details.more ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.dlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.dlist li{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:4px}
.dlist li:first-child{border-top:0}
.ttag{font:500 10.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--bad);border:1px solid currentColor;padding:3px 6px;border-radius:3px;align-self:flex-start}

/* drills */
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sheet);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dwrap{display:flex;flex-direction:column;gap:14px;max-width:820px;margin-top:18px}
.dpara{font:400 17.5px/1.65 var(--f-read);margin:0}
.sent{cursor:pointer;border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sent:hover{background:var(--pencil-soft)}
.sent.right{background:var(--marker);color:var(--marker-ink)}
.sent.wrong{background:var(--bad-soft);text-decoration:line-through;text-decoration-color:var(--bad)}
.sent.off{cursor:default} .sent.off:hover{background:none}
.sent.right.off:hover{background:var(--marker)} .sent.wrong.off:hover{background:var(--bad-soft)}
b.sigw{font-weight:600;text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:2px;text-underline-offset:3px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.opt span{font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);font:400 17px/1.4 var(--f-read);resize:vertical}
.checklist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* reading pages */
.doc{max-width:860px;padding-block:28px 0}
.doc > h1{font:600 clamp(28px,4.5vw,40px)/1.1 var(--f-read);letter-spacing:-.02em;margin:0 0 10px}
.rsec{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:16px}
.rsec h2{font:600 22px/1.2 var(--f-read);margin:0 0 12px}
.rsec h3{font:600 16px/1.3 var(--f-ui);margin:14px 0 6px}
.rsec p{margin:0 0 10px;max-width:70ch}
.rsec ol,.rsec ul{margin:0 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:7px;max-width:72ch}
.rsec.plain{background:transparent;border-style:dashed}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.en{font-family:var(--f-read);font-size:15.5px}
.pos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pos div{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper)}
.pos b{display:block;margin-bottom:4px}
.pos p{font-size:14px;margin:0}
.sigs{display:flex;flex-direction:column;gap:10px}
.sigs div{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:10px}
.sigs .w{font-family:var(--f-read);font-size:16px}
.traps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r)}
.trap{border-top:1px solid var(--line)} .trap:first-child{border-top:0}
.trap summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:12px 14px;list-style:none;align-items:baseline;flex-wrap:wrap}
.trap summary::-webkit-details-marker{display:none}
.trap summary .tn{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-weight:600}
.trap summary .tn::before{content:"+";font-family:var(--f-mono);color:var(--muted);width:12px}
.trap[open] summary .tn::before{content:"−"}
.trap .ts{font-size:13px;color:var(--muted)}
.trap .tb{padding:0 14px 16px 36px}
.trap .tb p{margin:0 0 8px;max-width:68ch}
.exbox{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.ex b{font-size:15.5px}
.ex p{margin:0;font-size:14px}
.ex .in{font:500 10.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ok)}
pre.tpl{margin:0;white-space:pre-wrap;font:400 14px/1.7 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.kpis div{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpis b{font:600 30px/1 var(--f-read)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(140px,230px) minmax(60px,1fr) auto;gap:10px;align-items:center;font-size:14px}
.track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--bad)}
.track.r i{background:var(--pencil)}
.hv{font-size:13px;color:var(--muted);white-space:nowrap}
.insight{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper)}
.insight p{margin:6px 0 0}
.wlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.wlist li{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:4px}
.wlist li:first-child{border-top:0}
.empty{padding:20px 0;color:var(--muted)}

@media (max-width: 900px){
  .sgrid{grid-template-columns:minmax(0,1fr)}
  .passage{position:relative;top:0;max-height:none;padding:16px 18px}
  .para{font-size:16.5px}
}
@media (max-width: 560px){
  .kpis,.rsum{grid-template-columns:1fr}
  .stitle{flex:1 1 100%;order:-1}
  .sbar{gap:10px}
  .opts{grid-template-columns:1fr}
  .hb{grid-template-columns:1fr auto}
  .hb .track{grid-column:1 / -1;grid-row:2}
  .sigs div{grid-template-columns:1fr;gap:2px}
  .tabs button{padding:7px 8px;font-size:14px}
  .trap .tb{padding-left:14px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="key" aria-hidden="true">i–x</span><b>Matching Headings</b></div>
    <nav class="tabs" aria-label="Boʻlimlar">
      <button data-act="tab" data-v="lib">Testlar</button>
      <button data-act="tab" data-v="drill">Mashqlar</button>
      <button data-act="tab" data-v="rules">Strategiya</button>
      <button data-act="tab" data-v="stats">Natijalar</button>
      <button data-act="tab" data-v="teach">Oʻqituvchiga</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
/* ===================== TUZOQLAR ===================== */
const TRAPS = {
  wordmatch:{ n:"Soʻz mosligi", en:"Word matching",
    s:"Sarlavhadagi soʻz matnda bor, lekin fikr boshqa.",
    l:"Eng koʻp uchraydigan tuzoq. Test tuzuvchilar paragrafdagi koʻzga tashlanadigan soʻzni (nom, atama, raqam) notoʻgʻri sarlavhaga joylashtiradi. Toʻgʻri sarlavha esa odatda parafraz qilingan boʻladi va paragraf soʻzlarini kamdan kam takrorlaydi.",
    avoid:"Bir xil soʻzni koʻrsangiz, toʻxtang va tekshiring: bu soʻz paragrafda qaysi maʼnoda ishlatilgan va butun paragraf shu haqdami?" },
  detail:{ n:"Tor sarlavha (detal)", en:"Too narrow",
    s:"Sarlavha paragrafdagi bitta misol yoki faktni ifodalaydi.",
    l:"Paragraf asosiy fikr va uni dalillovchi misollardan iborat. Tuzoq sarlavha misollardan birini, ayniqsa qiziqarli yoki esda qoladigan misolni, butun paragrafning mavzusi qilib koʻrsatadi.",
    avoid:"Qamrov testini qoʻllang: sarlavha paragrafdagi gaplarning koʻpchiligini soyabon kabi qamrab oladimi? Faqat bitta gapga mos kelsa, bu detal." },
  broad:{ n:"Keng sarlavha", en:"Too general",
    s:"Sarlavha butun matnga mos, aniq shu paragrafga emas.",
    l:"Baʼzi sarlavhalar butun matnning nomi boʻlishi mumkin. Ular har bir paragrafga “bir oz” mos keladi, shuning uchun ishonchli koʻrinadi. Lekin har bir paragrafning oʻz vazifasi bor va toʻgʻri sarlavha aynan shu vazifani nomlaydi.",
    avoid:"Tekshiring: bu sarlavha boshqa 2–3 paragrafga ham mos keladimi? Mos kelsa, u juda keng; aniqroq variantni qidiring." },

{ id:"rooftop", exam:"IELTS", band:"Band 5.5–6.5", mins:10, title:"Farming on City Rooftops",
  H:{ i:"New rules and methods that could support growth", ii:"A solution to flooding across the city", iii:"Earning money from more than the crop", iv:"Finding a purpose for neglected urban space", v:"Limits of weight, cost and access", vi:"Teaching children to eat healthily", vii:"Stronger communities rather than bigger harvests", viii:"How the buildings underneath benefit", ix:"Why city farms will soon replace the countryside" },
  D:{ ii:["detail","B paragrafda yomgʻir suvini singdirish bitta afzallik sifatida tilga olinadi. Butun shahar boʻyicha suv toshqini muammosi hal boʻlishi haqida gap yoʻq: sarlavha ham tor, ham boʻrttirilgan."],
      vi:["wordmatch","D paragrafda oʻqituvchilar bolalarga oziq-ovqat qayerdan kelishini koʻrsatishi aytiladi, lekin sogʻlom ovqatlanish haqida soʻz yoʻq. Sarlavha kichik misol ustiga qurilgan va matnda boʻlmagan fikrni qoʻshadi."],
      ix:["degree","F paragrafda mutaxassislarning aksariyati tom fermalari butun shaharni boqishiga ishonmasligi aytilgan, E paragrafda esa ular qishloq fermalari bilan narxda raqobatlasha olmasligi qayd etilgan. Sarlavha matnga zid va haddan kuchli."] },
  paras:[
  { L:"A", a:"iv", t:"Look down from any tall building in a major city and you will see a landscape of grey: flat roofs covered in gravel, air-conditioning units and little else. For most of the twentieth century, this space was simply ignored. Over the past twenty years, however, a growing number of architects, entrepreneurs and ordinary residents have begun to ask whether these empty surfaces could be put to work. [[Increasingly, the answer is to turn them into farms.]] From Montreal to Singapore, rooftops that once collected only dust now produce lettuce, tomatoes and herbs.",
    hint:"Paragrafning oxirgi gaplarida qanday yangi gʻoya paydo boʻladi? Oʻtmish haqidagi gaplar asosiy fikrmi yoki kirishmi?",
    why:"Paragraf tomlar uzoq vaqt eʼtiborsiz qolganini aytib, yangi gʻoyaga oʻtadi: “Increasingly, the answer is to turn them into farms.” Sarlavhadagi “neglected urban space” – “this space was simply ignored… empty surfaces”, “finding a purpose” esa “could be put to work” iborasining parafrazi.",
    gist:"Empty city roofs are being turned into farms.",
    tr:{ ix:["assumption","Paragrafda tomlarda sabzavot yetishtirilayotgani aytiladi, lekin qishloq xoʻjaligining oʻrnini bosishi haqida hech narsa yoʻq. Bu fikr oʻquvchining oʻz taxmini."] } },
  { L:"B", a:"viii", t:"[[The most immediate beneficiaries are often the buildings themselves.]] A layer of soil and plants acts as insulation, keeping the floors below cooler in summer and warmer in winter, which can noticeably reduce energy bills. Plants and soil also absorb rainwater that would otherwise rush off the roof into overloaded drains. Some building managers report that a planted roof lasts longer than a bare one, because the waterproof layer underneath is protected from sunlight and extreme temperatures.",
    hint:"Birinchi gap kim yoki nima foyda koʻrishini aytadi. Qolgan gaplar shu fikrni qanday dalillaydi?",
    why:"Mavzu gapi birinchi oʻrinda: “The most immediate beneficiaries are often the buildings themselves.” Qolgan gaplar (issiqlik izolyatsiyasi, yomgʻir suvi, tom qoplamasining uzoq xizmat qilishi) shu fikrni misollar bilan toʻldiradi. “Underneath” – “the floors below” va “the waterproof layer underneath” ga mos.",
    gist:"Green roofs insulate and protect the building.",
    tr:{ ii:["detail","Yomgʻir suvi paragrafdagi uchta misoldan biri, xolos. Bundan tashqari, matnda faqat suv “overloaded drains” ga kamroq tushishi aytiladi; butun shahar boʻyicha toshqin muammosini hal qilish haqida gap yoʻq."] } },
  { L:"C", a:"v", t:"[[Not every roof, however, can carry a farm.]] Wet soil is extremely heavy, and many older buildings were never designed to support such loads. Strengthening a roof can cost more than the farm will ever earn, and in some cases it is simply impossible. Farmers also need a reliable water supply, safe access for workers and protection from strong winds, which at twenty storeys can flatten young plants in minutes. For these reasons, only a fraction of city roofs are suitable without major building work.",
    hint:"“however” dan keyin qanday muammolar sanaladi? Ularni bitta umumiy soʻz bilan qanday atash mumkin?",
    why:"Mavzu gapi birinchi oʻrinda: “Not every roof, however, can carry a farm.” Bu yerda “however” B paragrafdagi afzalliklarga qarama-qarshilikni bildiradi. Keyingi gaplar toʻsiqlarni sanaydi: ogʻirlik (“Wet soil is extremely heavy”), xarajat (“Strengthening a roof can cost more…”), suv, ishchilar uchun xavfsiz kirish va shamol. Sarlavha shu toʻsiqlarni umumlashtiradi.",
    gist:"Many roofs are too weak, costly or hard to use.",
    tr:{ iii:["focus","Paragrafda pul haqida gap bor, lekin daromad emas, xarajat – toʻsiq sifatida. Sarlavha muammoni daromad bilan almashtiradi."] } },
  { L:"D", a:"vii", t:"Many rooftop farms are not really businesses at all. They are run by volunteers, schools or neighbourhood groups, and [[their main harvest is social rather than agricultural]]. Residents who had lived in the same building for years without speaking say that working side by side on the roof has turned strangers into friends. Teachers use rooftop plots to show children where food comes from, and some hospitals have created gardens where patients can spend time outdoors.",
    hint:"Birinchi ikki gapga qarang: bu fermalarning asosiy “hosili” nima?",
    why:"Asosiy fikr ikkinchi gapda: “their main harvest is social rather than agricultural”. Keyingi gaplar qoʻshnilar doʻstlashgani, maktab va kasalxonalar misolida shu ijtimoiy foydani koʻrsatadi. Sarlavhadagi “rather than bigger harvests” – “rather than agricultural” ning parafrazi.",
    gist:"Rooftop gardens mainly build social ties.",
    tr:{ vi:["detail","Maktab – paragrafdagi misollardan biri. Bundan tashqari, matnda sogʻlom ovqatlanish emas, oziq-ovqat qayerdan kelishi haqida gap boradi."],
         iii:["opposite","Paragraf “Many rooftop farms are not really businesses at all” gapi bilan boshlanadi. Pul topish haqidagi sarlavha bu fikrga zid; u E paragrafga tegishli."] } },
  { L:"E", a:"iii", t:"Commercial rooftop farms face a harder test. Because space is limited, they cannot compete with large rural farms on the price of ordinary vegetables. [[The successful ones survive by selling something more than produce]]: they charge for tours and workshops, rent out space for weddings and parties, or sign contracts to supply nearby restaurants that are willing to pay extra for herbs picked an hour before dinner. In other words, the view and the experience are often worth more than the crop.",
    hint:"Tijorat fermalari sabzavot narxida raqobatlasha olmasa, qanday yashab qoladi?",
    why:"Kalit gap: “The successful ones survive by selling something more than produce”. Ekskursiya, seminar, toʻylar uchun ijara va restoranlar bilan shartnomalar – sabzavot sotishdan tashqari daromad manbalari. “More than the crop” – “more than produce” ning parafrazi; oxirgi gap ham shu fikrni takrorlaydi.",
    gist:"Profitable rooftop farms sell experiences, not just food.",
    tr:{ ix:["opposite","Matnda aksincha: tom fermalari “cannot compete with large rural farms on the price of ordinary vegetables”. Qishloq fermalarining oʻrnini bosish haqidagi sarlavha matnga zid."] } },
  { L:"F", a:"i", t:"[[Looking ahead, two developments may change the picture.]] Several cities, including Toronto and Copenhagen, now require some new buildings to include green roofs, which creates ready-made space for growing food. At the same time, lightweight systems that grow plants in water rather than soil are making it possible to farm on roofs that could never carry heavy earth. Few experts believe that rooftops will ever feed entire cities, but most expect them to become a far more common sight.",
    hint:"Paragrafda nechta “development” sanaladi? Ular qanday turdagi oʻzgarishlar: qonunmi, texnologiyami?",
    why:"Paragraf kelajakdagi oʻsishga yordam berishi mumkin boʻlgan ikki omilni koʻrsatadi: yangi binolarga yashil tom talabi (rules) va tuproqsiz yengil tizimlar (methods). Sarlavhadagi ehtiyotkor “could” matndagi “may change the picture” ga, “growth” esa “a far more common sight” ga mos.",
    gist:"New laws and soil-free systems may spread rooftop farms.",
    tr:{ ix:["degree","Oxirgi gap aynan shu fikrni rad etadi: “Few experts believe that rooftops will ever feed entire cities”. Matnda “more common” (koʻproq uchraydi) deyilgan, “replace” (oʻrnini bosadi) emas."] } }
  ]},

{ id:"night", exam:"IELTS", band:"Band 6.5–7", mins:12, title:"The Return of the Night Train",
  H:{ i:"Obstacles that continue to slow expansion", ii:"The rise of budget airlines", iii:"A rescue from an unexpected source", iv:"Why sleeper services cost so much to run", v:"Travellers' growing guilt about flying", vi:"Designing carriages for a new kind of passenger", vii:"From everyday transport to near disappearance", viii:"Falling ticket prices win new customers", ix:"Political decisions will shape the outcome", x:"Practical attractions beyond green values" },
  D:{ ii:["detail","Arzon aviakompaniyalar A paragrafda tunggi poyezdlar qisqarishining ikki sababidan biri sifatida bir gapda tilga olinadi. Bu paragrafning asosiy fikri emas, balki bitta detal."],
      v:["turn","D paragraf “flygskam” (parvozdan uyalish) bilan boshlanadi, lekin “Yet environmental values alone rarely fill a train” gapi bu tushuntirishni yetarli emas deb topadi. Asosiy fikr burilishdan keyin keladi."],
      viii:["opposite","E paragrafda aksincha aytiladi: “tickets are often more expensive than travellers expect”. Matnda chipta arzonlashgani haqida hech qayerda gap yoʻq."] },
  paras:[
  { L:"A", a:"vii", t:"In the 1950s and 1960s, a traveller could board a train in Paris after dinner and wake up in Rome, Vienna or Copenhagen. Sleeper services formed a dense network across Europe, and for many people they were the normal way to make a long international journey. [[Over the following decades, however, the network shrank dramatically.]] Cheap airlines offered fares that were often lower than the price of a sleeping berth, and new high-speed lines made daytime rail journeys of several hundred kilometres quicker than an overnight trip. By the 2010s, many routes that had run for half a century had disappeared from the timetable.",
    hint:"Paragraf qaysi holatdan qaysi holatga oʻtadi? “however” dan keyingi gapga eʼtibor bering.",
    why:"Paragraf ikki qismdan iborat: 1950–60-yillardagi zich tarmoq va keyingi oʻn yilliklarda uning keskin qisqarishi (“Over the following decades, however, the network shrank dramatically”). Sarlavha ikki qismni ham qamraydi: “everyday transport” – “the normal way to make a long international journey”, “near disappearance” – “disappeared from the timetable”.",
    gist:"Sleeper trains were common, then almost vanished.",
    tr:{ ii:["detail","Arzon aviakompaniyalar qisqarishning ikki sababidan biri (ikkinchisi – tezyurar poyezdlar). Sarlavha paragrafning faqat bitta gapini qamraydi."] } },
  { L:"B", a:"iv", t:"The reasons were not only competition. [[Night trains are expensive to operate by their very nature.]] A sleeping car carries perhaps thirty passengers in beds, while a daytime carriage of the same length can seat eighty or more. Staff must work through the night, and because a typical journey takes ten or twelve hours, each carriage can make only one trip a day, while a daytime train might cover the same route twice. Railway companies under pressure to reduce losses found it easy to justify cutting services with such a high cost for every passenger carried.",
    hint:"Birinchi gap “not only competition” deydi. Raqobatdan tashqari qanday sabab bor?",
    why:"Mavzu gapi: “Night trains are expensive to operate by their very nature.” Keyin xarajat sabablari sanaladi: bir vagonda kam yoʻlovchi, tunda ishlaydigan xodimlar, vagonning kuniga bir marta qatnashi. Sarlavhadagi “cost so much to run” – “expensive to operate” ning parafrazi.",
    gist:"Sleeper trains carry few people at a high cost.",
    tr:{ ii:["neighbour","“The reasons were not only competition” – A paragrafdagi raqobatga ishora qiluvchi oʻtish gapi. B paragraf aviakompaniyalar haqida emas, poyezdning oʻz xarajatlari haqida."] } },
  { L:"C", a:"iii", t:"[[Just as the night train seemed finished, it found an unlikely rescuer.]] In 2016, when Germany's national railway decided to end its sleeper services, Austria's state operator, a much smaller company, took over several of the routes. Many observers expected the experiment to fail. Instead, the trains were frequently full, and within a few years new routes had been launched linking cities such as Vienna, Brussels, Amsterdam and Paris. Other operators, including several private start-ups, soon announced plans of their own.",
    hint:"Xizmatni kim qutqardi va nega bu kutilmagan edi?",
    why:"Mavzu gapi: “Just as the night train seemed finished, it found an unlikely rescuer.” “Unlikely” – sarlavhadagi “unexpected” ning sinonimi. Avstriya kompaniyasi “a much smaller company” boʻlgani va kuzatuvchilar muvaffaqiyatsizlik kutgani ham shu kutilmaganlikni tasdiqlaydi.",
    gist:"A smaller Austrian operator unexpectedly revived the routes.",
    tr:{ vii:["neighbour","“seemed finished” iborasi A paragrafdagi qisqarishga ishora qiladi, lekin C paragrafning asosiy fikri – tiklanish. Pasayish haqidagi sarlavha A paragrafga tegishli."] } },
  { L:"D", a:"x", t:"The revival is often explained as a response to climate concern. A flight produces far more carbon dioxide per passenger than a train covering the same distance, and in Sweden the word flygskam, or 'flight shame', came into wide use around 2018. [[Yet environmental values alone rarely fill a train.]] For many travellers, the attraction is practical: a night train leaves from one city centre and arrives in another, saves the cost of a hotel, and turns travelling time into sleeping time. A business traveller who can attend a morning meeting in Brussels after leaving Vienna the previous evening has gained a day rather than lost one.",
    hint:"“Yet” soʻzi qayerda? Undan oldingi va keyingi fikrlarni solishtiring.",
    why:"“Yet environmental values alone rarely fill a train” gapidan keyin paragraf amaliy afzalliklarni sanaydi: shahar markazidan markazga qatnash, mehmonxona xarajatini tejash, yoʻl vaqtini uyqu vaqtiga aylantirish. Sarlavhadagi “practical attractions” – “the attraction is practical”, “beyond green values” – “environmental values alone” ga mos.",
    gist:"Travellers choose night trains mostly for practical benefits.",
    tr:{ v:["turn","Parvozdan uyalish (flygskam) paragrafning boshida tilga olinadi, lekin keyin “Yet…” bilan bu tushuntirish cheklanadi. Paragrafning boshlanishi har doim ham asosiy fikr emas."] } },
  { L:"E", a:"i", t:"Despite this success, [[growth has been slower than enthusiasts hoped]]. Most sleeper carriages in Europe are decades old, and building new ones takes years because few factories make them. Crossing borders adds further complications: each country charges its own fees for using the tracks, and differences in electrical and signalling systems can mean changing locomotives at the frontier. As a result, tickets are often more expensive than travellers expect, and popular routes sell out weeks in advance.",
    hint:"“Despite this success” dan keyin qanday fikr keladi? Qolgan gaplar shu fikrni qanday dalillaydi?",
    why:"Mavzu gapi: “growth has been slower than enthusiasts hoped”. Keyin sabablar sanaladi: eski vagonlar, ishlab chiqaruvchilarning ozligi, chegaradagi toʻlovlar va texnik farqlar. Sarlavhadagi “obstacles” shu sabablarning umumlashmasi, “continue to” esa hozir ham davom etayotganini bildiradi.",
    gist:"Old carriages and border rules still limit growth.",
    tr:{ viii:["opposite","Matnda chiptalar “more expensive than travellers expect” deyilgan – arzonlashish emas, qimmatlik."] } },
  { L:"F", a:"vi", t:"[[Operators have also had to rethink what a night train should feel like.]] Traditional compartments, with six narrow bunks shared by strangers, appeal mainly to budget travellers and groups. Newer carriages are designed with privacy in mind: they offer small single 'capsules' for people travelling alone, private showers in more expensive cabins, and wider corridors that make it easier to move luggage. The aim is to attract passengers who would otherwise book a hotel and a flight.",
    hint:"Eski kupelar kimlarga mos edi, yangi vagonlar esa kimlarni jalb qilmoqchi?",
    why:"Paragraf vagonlarning yangi dizayni haqida: yolgʻiz sayohatchilar uchun “capsules”, dush, keng yoʻlaklar. Oxirgi gap maqsadni koʻrsatadi: “to attract passengers who would otherwise book a hotel and a flight” – bu sarlavhadagi “a new kind of passenger”.",
    gist:"New carriages offer privacy to attract new travellers.",
    tr:{ ii:["wordmatch","Paragrafda “budget travellers” iborasi bor, lekin u eski kupelardagi tejamkor yoʻlovchilar haqida. Aviakompaniyalarga aloqasi yoʻq: soʻz bir xil, maʼno boshqa."] } },
  { L:"G", a:"ix", t:"[[Whether the revival continues will depend less on passengers than on governments.]] Night trains rarely make large profits, and the routes that succeed usually receive some form of public support, whether through subsidies or reduced track fees. Several governments have declared their support for international rail, but turning those declarations into funding is a slower process. If that support arrives, the sleeper may become an ordinary choice again; if it does not, the current revival could prove temporary.",
    hint:"Birinchi gapga qarang: tiklanishning taqdiri kimga bogʻliq?",
    why:"Mavzu gapi: “Whether the revival continues will depend less on passengers than on governments.” Keyingi gaplar subsidiya, yoʻl toʻlovlari va hukumatlarning moliyalash jarayonini tushuntiradi. “Political decisions” – “governments… subsidies… funding” ning umumlashmasi, “outcome” – tiklanishning davom etish-etmasligi.",
    gist:"Government support will decide the revival's future.",
    tr:{ iv:["neighbour","“Night trains rarely make large profits” gapi B paragrafdagi xarajat mavzusini eslatadi, lekin bu yerda u faqat hukumat yordami nega kerakligini tushuntiradigan dalil."] } }
  ]},

{ id:"forget", exam:"IELTS", band:"Band 7–8", mins:12, title:"Why We Forget",
  H:{ i:"Stored but temporarily out of reach", ii:"Why sleep is the secret of learning", iii:"A familiar belief questioned", iv:"Recognising the early signs of memory disease", v:"Removing the unimportant on purpose", vi:"The case for spreading out study", vii:"The popularity of memory-improvement products", viii:"Old and new information in competition", ix:"The brain's limited storage space", x:"Distinguishing everyday forgetting from illness", xi:"A pattern first measured over a century ago" },
  D:{ ii:["detail","Uyqu C paragrafda faqat interferensiya gʻoyasini tasdiqlovchi tajriba sifatida tilga olinadi. Bundan tashqari, “the secret of learning” juda kuchli daʼvo – matnda bunday umumlashma yoʻq."],
      iv:["wordmatch","G paragrafda Alzheimer kasalligi tilga olinadi, lekin kasallik belgilarini aniqlash haqida emas, balki oddiy unutishni kasallikdan ajratish haqida gap boradi."],
      vii:["detail","A paragrafdagi “buy books that promise to improve our memory” – unutishni muvaffaqiyatsizlik deb bilishimizning bir misoli. Paragraf bunday mahsulotlarning ommabopligi haqida emas."],
      ix:["opposite","D paragraf unutish koʻpincha saqlash emas, balki eslab olish (“access”) muammosi ekanini aytadi. E paragrafda ham sabab joy yetishmasligi emas, kerakli maʼlumotni topishni osonlashtirish."] },
  paras:[
  { L:"A", a:"iii", t:"Most of us treat forgetting as a kind of failure. We apologise for missing a friend's birthday, worry when a familiar name escapes us, and buy books that promise to improve our memory. Behind these habits lies an assumption that the mind is a container in which information should ideally be kept forever, and that anything lost has leaked away through some defect. [[A growing body of research suggests that this picture is, at best, incomplete.]]",
    hint:"Paragrafning oxirgi gapi oldingi gaplardagi qarashga qanday munosabat bildiradi?",
    why:"Paragraf odamlarning odatiy qarashini tasvirlaydi (unutish – nuqson) va oxirgi gapda unga shubha bildiradi: “A growing body of research suggests that this picture is, at best, incomplete.” Sarlavhadagi “familiar belief” – “assumption”, “questioned” – “at best, incomplete” bahosining parafrazi.",
    gist:"Research questions the idea that forgetting is failure.",
    tr:{ vii:["detail","Kitoblar odatiy qarashning uchta misolidan biri; paragraf ularning ommabopligi haqida emas."],
         ix:["assumption","“Container” (idish) metaforasi odamlarning qarashini tasvirlaydi va paragraf oxirida shubha ostiga olinadi. Miyaning joyi cheklangan degan fikr matnda aytilmagan."] } },
  { L:"B", a:"xi", t:"The first systematic study of forgetting was carried out in the 1880s by the German psychologist Hermann Ebbinghaus, who memorised lists of meaningless syllables and tested how many he could recall after different intervals. [[His results produced what is now called the forgetting curve: memory drops steeply in the first hours after learning and then declines much more slowly.]] Later studies with more meaningful material have confirmed the general shape of the curve, although the rate of loss varies considerably with the type of information and the learner's prior knowledge.",
    hint:"Ebbinghaus nimani oʻlchadi va natijada qanday “shakl” paydo boʻldi?",
    why:"Kalit gap: “His results produced what is now called the forgetting curve…” Sarlavhadagi “first measured over a century ago” – 1880-yillardagi birinchi tizimli tadqiqot, “pattern” – unutish egri chizigʻining shakli. Oxirgi gap keyingi tadqiqotlar ham shu shaklni tasdiqlaganini aytadi.",
    gist:"Ebbinghaus showed memory falls fast, then slowly.",
    tr:null },
  { L:"C", a:"viii", t:"Ebbinghaus assumed that memories simply fade with time, but later researchers argued that time itself does little damage. [[What matters, they suggested, is what happens during that time.]] New learning can disrupt older memories, and old habits can block new ones, as anyone who has changed their phone number or moved to a country that drives on the other side of the road will know. In experiments where participants slept between learning and testing, and so had fewer new experiences, they often forgot less than those who stayed awake.",
    hint:"Birinchi gapda kim nima deb taxmin qilgan va keyingi tadqiqotchilar unga qanday eʼtiroz bildirgan?",
    why:"Paragraf Ebbinghausning “vaqt oʻtishi bilan xotira soʻnadi” degan qarashini rad etadi: “What matters, they suggested, is what happens during that time.” Yangi bilim eskisini buzadi, eski odatlar yangisiga toʻsqinlik qiladi – sarlavhadagi “old and new information in competition” ayni shu.",
    gist:"New and old memories interfere with each other.",
    tr:{ ii:["detail","Uyqu tajribasi interferensiya gʻoyasini tasdiqlovchi dalil: uyquda yangi taassurotlar kam boʻlgani uchun unutish kamayadi. Paragrafning mavzusi uyqu emas, xotiralarning bir-biriga xalaqit berishi."],
         xi:["turn","Paragraf Ebbinghaus nomi bilan boshlanadi, lekin darhol “but later researchers argued…” burilishi keladi. Ebbinghausning oʻlchovlari B paragrafga tegishli."] } },
  { L:"D", a:"i", t:"Another line of research questions whether many forgotten memories are lost at all. The familiar 'tip-of-the-tongue' experience, in which we know a word but cannot produce it, shows that information can be stored yet temporarily unreachable. [[In many cases, what we call forgetting may be a problem of access rather than storage]]: given the right cue, such as a smell, a place or the first letter of a name, memories that seemed to have vanished can return in surprising detail.",
    hint:"“Tip-of-the-tongue” holati xotira haqida nimani koʻrsatadi: maʼlumot yoʻqolganmi yoki boshqa narsami?",
    why:"Kalit gap: “what we call forgetting may be a problem of access rather than storage”. Maʼlumot saqlanadi, lekin vaqtincha topilmaydi; toʻgʻri ishora (hid, joy, birinchi harf) uni qaytaradi. “Stored but temporarily out of reach” – “stored yet temporarily unreachable” ning parafrazi.",
    gist:"Forgotten memories are often stored, just inaccessible.",
    tr:{ ix:["opposite","Matn saqlash joyi muammo emasligini aytadi: “access rather than storage”. Sarlavhada “storage” soʻzi bor, lekin maʼnosi matnga teskari."] } },
  { L:"E", a:"v", t:"Some scientists go further and argue that forgetting is not a weakness but a process the brain actively produces. A memory system that kept every detail would be overwhelmed: recalling where you parked today would be harder if you also remembered, equally clearly, every place you had parked in the past ten years. [[By weakening information that is rarely used, the brain makes what is important and current easier to find.]] On this view, forgetting is closer to editing than to erasing.",
    hint:"Hamma narsani eslab qoladigan xotira nega yomon boʻlardi? Miya buning oldini qanday oladi?",
    why:"Paragraf unutishni miya ataylab bajaradigan foydali jarayon deb taʼriflaydi: “By weakening information that is rarely used, the brain makes what is important and current easier to find.” Sarlavhadagi “removing the unimportant on purpose” – “actively produces” va “weakening information that is rarely used” ning parafrazi.",
    gist:"The brain deliberately weakens rarely used memories.",
    tr:{ ix:["assumption","Miyada joy tugashi haqida matnda gap yoʻq. Muammo – haddan ortiq maʼlumot ichidan keraklisini topish qiyinligi (“would be harder”), joyning yetishmasligi emas."] } },
  { L:"F", a:"vi", t:"This research has practical consequences for anyone who has to learn. [[Because memory falls fastest soon after learning, a single long study session is far less effective than several shorter sessions spread over days or weeks.]] Each time a learner returns to material that is starting to fade, the effort of recalling it strengthens the memory more than simply rereading would. Many students, however, still prefer last-minute revision, partly because it produces a feeling of familiarity that is easily mistaken for real learning.",
    hint:"Tadqiqotdan oʻquvchilar uchun qanday amaliy xulosa chiqadi: bitta uzun mashgʻulotmi yoki bir nechta qisqa mashgʻulotmi?",
    why:"Paragraf xotira tadqiqotidan amaliy xulosa chiqaradi: oʻqishni kunlar va haftalarga taqsimlash bitta uzun mashgʻulotdan samaraliroq. Oxirgi gapdagi “however” asosiy fikrni oʻzgartirmaydi: u talabalar nega bu usuldan foydalanmasligini tushuntiradi.",
    gist:"Spaced study works better than last-minute cramming.",
    tr:{ vii:["assumption","Paragraf xotirani yaxshilash usuli haqida, lekin tijoriy mahsulotlar haqida emas. Umumiy mavzu (“xotirani yaxshilash”) yuzaki oʻxshashlik beradi, xolos."] } },
  { L:"G", a:"x", t:"None of this means that all forgetting is harmless. In conditions such as Alzheimer's disease, memory loss is caused by damage to the brain itself and can have devastating effects on a person's sense of identity. [[The new research does not deny such cases; rather, it insists that they should not shape our understanding of everyday forgetting.]] For a healthy mind, losing a name or a date is usually not a sign of decline but evidence of a system doing what it evolved to do.",
    hint:"“None of this means…” bilan boshlangan paragraf qanday chegarani belgilaydi?",
    why:"Paragraf yangi qarashning chegarasini koʻrsatadi: Alzheimer kabi kasalliklardagi unutish miya shikastlanishining natijasi, tadqiqot esa oddiy, kundalik unutish haqida. Kalit gap: “it insists that they should not shape our understanding of everyday forgetting”.",
    gist:"Illness-related memory loss differs from normal forgetting.",
    tr:{ iv:["wordmatch","Kasallik tilga olinadi, lekin uning belgilarini qanday aniqlash haqida soʻz yoʻq. Paragrafning maqsadi – oddiy unutishni kasallikdan ajratish."] } }
  ]},

{ id:"desert", exam:"TOEFL", band:"B2–C1", mins:10, title:"How Desert Plants Survive",
  H:{ i:"Storing water for later", ii:"Protection from hungry animals", iii:"Living fast while water lasts", iv:"The harsh climate of desert regions", v:"Reaching hidden water below ground", vi:"Many solutions to one problem", vii:"The growing threat of desertification", viii:"Cutting the loss of water", ix:"A possible model for future crops", x:"Plant life in the world's deserts" },
  D:{ ii:["assumption","E paragrafdagi tikanlar (“spines”) umumiy bilimga koʻra hayvonlardan himoya bilan bogʻlanadi, lekin matnda ular faqat suv yoʻqotishni kamaytirish usuli sifatida keltirilgan. B paragrafdagi “chemicals” esa urugʻning erta unib chiqishini toʻxtatadi."],
      iv:["turn","A paragrafning dastlabki gaplari iqlimni tasvirlaydi, lekin bu – kirish. Asosiy fikr oxirgi gapda: oʻsimliklar bitta muammoga koʻp turli yechim topgan."],
      vii:["assumption","F paragrafda qurgʻoqchilik tez-tez takrorlanayotgani aytiladi, lekin choʻllanish yoki choʻllarning kengayishi haqida gap yoʻq. Bu oʻquvchining umumiy bilimi."],
      x:["broad","Bu sarlavha butun matnning nomi boʻlishi mumkin: har bir paragraf choʻl oʻsimliklari haqida. Shuning uchun u biror paragrafning oʻziga xos fikrini bermaydi."] },
  paras:[
  { L:"A", a:"vi", t:"Deserts are commonly defined as regions that receive less than 250 millimetres of rain a year, and many receive far less. Daytime temperatures can exceed 45°C, and the little water that falls often evaporates within hours. It might seem that few plants could survive such conditions, yet deserts support thousands of plant species. [[What is remarkable is not that these plants survive, but how many different solutions they have found to the same problem.]]",
    hint:"Oxirgi gapda “not that… but…” tuzilmasi bor. Muallif nimani muhim deb biladi?",
    why:"Dastlabki gaplar sharoit ogʻirligini tasvirlab, kontekst yaratadi. Asosiy fikr oxirgi gapda: “What is remarkable is… how many different solutions they have found to the same problem.” Sarlavha shu gapning parafrazi: “many solutions” – “many different solutions”, “one problem” – “the same problem”.",
    gist:"Desert plants solve drought in many different ways.",
    tr:{ iv:["turn","Iqlim haqidagi maʼlumot kirish qismi. “yet deserts support thousands of plant species” dan keyin fikr oʻsimliklarga oʻtadi."],
         x:["broad","A paragraf kirish boʻlgani uchun umumiy sarlavha jozibali koʻrinadi. Lekin uning oʻziga xos fikri aniqroq: bitta muammo va koʻp yechim."] } },
  { L:"B", a:"iii", t:"[[One group of plants avoids drought rather than enduring it.]] Desert annuals spend most of their lives as seeds lying in the soil, sometimes for years. When enough rain falls, they germinate, grow, flower and produce new seeds within a few weeks, completing their life cycle before the ground dries out again. Many of these seeds contain chemicals that prevent germination until a substantial amount of water has washed them away, which stops the plant from sprouting after a light shower that could not sustain it.",
    hint:"Bu oʻsimliklar qurgʻoqchilikka chidaydimi yoki undan “qochadi”mi? Ularning hayot sikli qancha davom etadi?",
    why:"Mavzu gapi: “One group of plants avoids drought rather than enduring it.” Ular yomgʻirdan soʻng bir necha hafta ichida unib, gullab, urugʻ beradi – “living fast while water lasts”. Kimyoviy moddalar haqidagi oxirgi gap ham shu strategiyaga xizmat qiladi.",
    gist:"Desert annuals complete their life cycle quickly after rain.",
    tr:{ ii:["wordmatch","“Chemicals” soʻzi bor, lekin ular urugʻni yetarli yomgʻir yogʻguncha unib chiqishdan saqlaydi. Hayvonlardan himoya haqida gap yoʻq."] } },
  { L:"C", a:"i", t:"[[Other plants take the opposite approach and store water for the long dry periods.]] Succulents, such as cacti, hold large quantities of water in thick stems or leaves, and many can expand like an accordion after rain and shrink as their reserves are used. Their roots are typically shallow but spread widely, allowing them to collect water from a large area quickly after even a brief storm.",
    hint:"“the opposite approach” – nimaga qarama-qarshi? Bu oʻsimliklar suv bilan nima qiladi?",
    why:"Mavzu gapi: “Other plants take the opposite approach and store water for the long dry periods.” Sukkulentlarning qalin poyasi va barglari suv zaxirasi vazifasini bajaradi. Sarlavhadagi “for later” – “for the long dry periods” ning parafrazi.",
    gist:"Succulents store water in thick stems and leaves.",
    tr:{ v:["opposite","Paragrafda sukkulentlarning ildizi “typically shallow but spread widely” deyilgan – chuqur emas, sayoz. Chuqur ildizlar D paragrafga tegishli."] } },
  { L:"D", a:"v", t:"[[A third strategy is to reach water that lies far below the surface.]] Some desert shrubs and trees develop roots that extend many metres downwards to reach groundwater that remains available throughout the year. Such plants often grow slowly above ground during their early years, investing their energy in roots before the shoot becomes large.",
    hint:"Bu oʻsimliklar suvni qayerdan oladi: yer yuzasidanmi yoki chuqurdanmi?",
    why:"Mavzu gapi: “A third strategy is to reach water that lies far below the surface.” Ildizlar koʻp metr chuqurlikka boradi va yil boʻyi mavjud yer osti suviga yetadi. “Hidden water below ground” – “groundwater… far below the surface”.",
    gist:"Some plants grow deep roots to reach groundwater.",
    tr:null },
  { L:"E", a:"viii", t:"Finding water is only half the challenge; [[plants must also avoid losing it]]. Leaves lose water through tiny openings called stomata, which must open to take in carbon dioxide. Many desert plants reduce this loss through changes in their structure and timing: their leaves are small, waxy or replaced entirely by spines, and some species open their stomata only at night, when cooler air means less water evaporates. Dense hairs on some leaves reflect sunlight and trap a layer of moist air close to the surface.",
    hint:"“only half the challenge” – birinchi yarmi nima edi, ikkinchi yarmi-chi?",
    why:"Mavzu gapi: “plants must also avoid losing it”. Kichik va mumli barglar, tikanlar, stomalarning faqat tunda ochilishi, tukchalar – hammasi suvni yoʻqotmaslik usullari. “Cutting the loss of water” – “reduce this loss” ning parafrazi.",
    gist:"Leaf structure and timing reduce water loss.",
    tr:{ ii:["assumption","Tikanlar hayotda hayvonlardan himoya bilan bogʻlanadi, lekin bu paragrafda ular barg oʻrnini bosuvchi, suvni tejovchi tuzilma sifatida tilga olinadi. Javobni matndan oling, umumiy bilimdan emas."] } },
  { L:"F", a:"ix", t:"These adaptations are attracting interest far beyond botany. [[As droughts become more frequent in many farming regions, plant scientists are studying how desert species control water loss, in the hope of developing crops that need less irrigation.]] The desert, long regarded as a place of scarcity, may turn out to be a valuable source of ideas.",
    hint:"Paragraf botanikadan tashqari qaysi sohani tilga oladi va qanday maqsadda?",
    why:"Paragraf choʻl oʻsimliklarining moslashuvini qishloq xoʻjaligi uchun foydali deb koʻrsatadi: olimlar kam sugʻoriladigan ekinlar yaratmoqchi. “A possible model for future crops” – “in the hope of developing crops that need less irrigation”; “possible” – matndagi “may turn out” ehtiyotkorligiga mos.",
    gist:"Desert plants may inspire drought-resistant crops.",
    tr:{ vii:["assumption","Qurgʻoqchilik tilga olingan, lekin choʻllanish haqida emas. Bundan tashqari, paragraf tahdid haqida emas, imkoniyat haqida."] } }
  ]},

{ id:"time", exam:"SAT", band:"C1", mins:12, title:"The Day the Clocks Changed",
  H:{ i:"Opposition to an imposed change", ii:"Laws that forced the railways to change", iii:"When every town had its own noon", iv:"A shift in what time means", v:"The dangers of railway travel", vi:"One clock for a small country", vii:"Dividing a continent into zones", viii:"Faster journeys, confusing clocks", ix:"Simple convenience for passengers", x:"From company timetable to world standard" },
  D:{ ii:["opposite","Matnning hamma joyida qonun amaliyotdan keyin keladi: Britaniyada 1880-yilda (C), AQShda 1918-yilda (F), 1883-yilgi oʻzgarish haqida esa “no law required it” deyilgan (D). Sarlavha matnga zid."],
      v:["detail","B paragrafda toʻqnashuvlar (“collisions”) chalkashlik oqibatlaridan biri sifatida oxirgi gapda tilga olinadi. Paragrafning asosiy fikri – soatlar va jadvallar chalkashligi."],
      ix:["turn","G paragraf “usually told as a story about convenience, but…” deb boshlanadi: qulaylik – muallif cheklab qoʻygan odatiy talqin. Asosiy fikr “but” dan keyin keladi."] },
  paras:[
  { L:"A", a:"iii", t:"For most of human history, time was local. Noon was the moment the sun stood highest in the sky, and because that moment arrives slightly later the further west one travels, [[every town kept its own time]]. This arrangement caused few problems while journeys were slow: a traveller on horseback could adjust a pocket watch at the end of a long day without noticing that a few minutes had been lost or gained.",
    hint:"Paragraf qaysi davr haqida va oʻsha davrda vaqt qanday aniqlangan?",
    why:"Paragraf temir yoʻllargacha boʻlgan davrni tasvirlaydi: har bir shahar quyoshga qarab oʻz vaqtini belgilagan (“every town kept its own time”), sekin sayohatda bu muammo tugʻdirmagan. “Every town had its own noon” – “Noon was the moment the sun stood highest… every town kept its own time” ning parafrazi.",
    gist:"Before railways, each town used its own solar time.",
    tr:{ viii:["neighbour","A paragrafning oxirida sekin sayohat tilga olinadi, lekin tezlik va chalkashlik B paragrafda boshlanadi (“The railway changed this”)."] } },
  { L:"B", a:"viii", t:"The railway changed this. Trains covered in an hour distances that had once taken a day, and each railway company typically ran its trains according to the time of its home city. [[A passenger changing trains at a busy junction might face several clocks on the station wall, each showing a different time]], and timetables became so complicated that missed connections and even collisions became a serious concern.",
    hint:"“The railway changed this” – nima oʻzgardi va bu qanday muammoni keltirib chiqardi?",
    why:"Paragraf tez sayohat bir necha xil vaqtni keltirib chiqarganini tushuntiradi: har bir kompaniya oʻz shahri vaqtidan foydalangan, vokzal devorida turli vaqtni koʻrsatuvchi bir nechta soat boʻlgan. Sarlavhaning ikki qismi – “faster journeys” va “confusing clocks” – paragrafning ikki qismiga mos.",
    gist:"Fast trains made local times confusing.",
    tr:{ v:["detail","Toʻqnashuvlar chalkashlik oqibatlaridan biri sifatida oxirgi gapda “even” soʻzi bilan tilga olinadi. Bu detal, paragrafning mavzusi emas."] } },
  { L:"C", a:"vi", t:"[[Britain, a small country with a dense railway network, solved the problem early.]] During the 1840s its railway companies gradually adopted London time, measured at the Royal Observatory in Greenwich, and within a few years most of the country's trains ran by it. Yet official law lagged behind practice: Greenwich time did not become the legal time throughout Britain until 1880, and for decades some public clocks showed two times, one for local life and one for the trains.",
    hint:"Britaniya muammoni qachon va qanday hal qildi? “Yet” dan keyingi gap asosiy fikrni oʻzgartiradimi yoki faqat toʻldiradimi?",
    why:"Mavzu gapi: “Britain, a small country with a dense railway network, solved the problem early.” Butun mamlakat bitta – London vaqtiga oʻtgan. “Yet official law lagged behind practice” gapi asosiy fikrni agʻdarmaydi, balki toʻldiradi: yechim avval temir yoʻllarda, keyin qonunda paydo boʻlgan. “One clock for a small country” – “a small country… adopted London time”.",
    gist:"Britain adopted one national railway time early.",
    tr:{ ii:["opposite","“Yet official law lagged behind practice”: qonun temir yoʻllardan ancha kechikkan. Temir yoʻllarni qonun majburlamagan, aksincha."] } },
  { L:"D", a:"vii", t:"In North America the distances were far greater, and a single national time was impossible. [[On 18 November 1883, the railways of the United States and Canada adopted a system of time zones, each one hour apart.]] In many cities, clocks were reset at noon that day, so that residents experienced a 'day of two noons'. The change was organised entirely by the railway companies; no law required it.",
    hint:"Shimoliy Amerikada bitta umumiy vaqt nega imkonsiz edi va uning oʻrniga nima joriy qilindi?",
    why:"Kalit gap: “the railways of the United States and Canada adopted a system of time zones, each one hour apart.” “A continent” – AQSh va Kanada, “zones” – “time zones”. “Day of two noons” – oʻzgarishning qiziqarli tafsiloti, xolos.",
    gist:"North American railways created hourly time zones.",
    tr:{ ii:["opposite","Paragrafning oxirgi gapi aniq: “The change was organised entirely by the railway companies; no law required it.”"],
         vi:["neighbour","Bitta umumiy vaqt C paragrafdagi Britaniyaga tegishli. D paragraf esa birinchi gapdayoq bitta vaqt Shimoliy Amerikada “impossible” ekanini aytadi."] } },
  { L:"E", a:"i", t:"[[Not everyone welcomed the change.]] Some newspapers complained that the railways had no right to alter something as natural as the time of day, and others saw the new zones as a threat to local independence. Several cities refused to adopt the system for years, continuing to use local time out of pride or out of suspicion of the powerful railway companies.",
    hint:"Oʻzgarishni hamma qoʻllab-quvvatladimi? Tanqidchilar nimadan norozi edi?",
    why:"Mavzu gapi: “Not everyone welcomed the change.” Gazetalar va baʼzi shaharlar yangi tizimni rad etgan. Sarlavhadagi “opposition” – “not everyone welcomed… refused”, “imposed” – temir yoʻllarning bunga “no right” i yoʻqligi va kuchli kompaniyalarga ishonchsizlik.",
    gist:"Some newspapers and cities resisted railway time.",
    tr:null },
  { L:"F", a:"x", t:"[[International agreement followed.]] In 1884, delegates from twenty-five countries meeting in Washington chose the meridian passing through Greenwich as the starting point for measuring longitude, a decision that eventually provided the basis for time zones around the world. In the United States, however, standard time did not become law until 1918, thirty-five years after the railways had introduced it.",
    hint:"Paragraf temir yoʻl tizimidan qaysi darajaga oʻtadi? Qonun haqidagi gap nima uchun keltirilgan?",
    why:"Paragraf jarayonning xalqaro darajaga chiqqanini koʻrsatadi: 1884-yilda Grinvich meridiani boshlangʻich nuqta sifatida tanlangan va keyinchalik butun dunyo vaqt mintaqalariga asos boʻlgan. “From company timetable to world standard” – temir yoʻl kompaniyalari joriy qilgan tizimdan xalqaro meʼyorga oʻtish. AQShda qonun faqat 1918-yilda qabul qilingani ham shu tarixni toʻldiradi.",
    gist:"Railway time became the basis of a world system.",
    tr:{ ii:["opposite","Delegatlar hukumatlar vakillari edi, lekin ular temir yoʻllarni majburlamagan: tizim allaqachon ishlab turardi. AQShda qonun temir yoʻllardan 35 yil keyin qabul qilingan (“not… until 1918”)."] } },
  { L:"G", a:"iv", t:"The adoption of standard time is usually told as a story about convenience, but [[it also marked a deeper change in how people related to time]]. Time was no longer something read from the sky; it became a shared agreement, set by institutions and distributed by telegraph. In a sense, every smartphone that silently corrects its clock today continues a process that began on the railway platforms of the nineteenth century.",
    hint:"“usually told as… but…” – odatiy talqin qanday va muallif qanday chuqurroq maʼnoni koʻradi?",
    why:"Asosiy fikr “but” dan keyin: “it also marked a deeper change in how people related to time.” Vaqt endi osmondan oʻqiladigan narsa emas, institutlar belgilaydigan “shared agreement” ga aylangan. “A shift in what time means” – shu fikrning parafrazi.",
    gist:"Time became a social agreement rather than a solar fact.",
    tr:{ ix:["turn","Qulaylik – muallif “usually told as” deb keltirgan va “but” bilan cheklagan odatiy talqin. Asosiy fikr undan keyin keladi."] } }
  ]},

{ id:"placebo", exam:"IELTS", band:"Band 8–9", mins:12, title:"The Placebo Paradox",

const EXAM = { IELTS:"IELTS Academic", TOEFL:"TOEFL uslubi", SAT:"SAT uslubi" };
const PBY = {};
PASSAGES.forEach((p, i) => { p.no = i + 1; p.ans = {}; p.pm = {}; PBY[p.id] = p; p.paras.forEach(q => { p.ans[q.a] = q.L; p.pm[q.L] = q; }); });
const TPOOL = [], PPOOL = [];
PASSAGES.forEach(p => p.paras.forEach(q => { PPOOL.push([p.id, q.L]); if (q.tr) Object.keys(q.tr).forEach(h => TPOOL.push([p.id, q.L, h])); }));
const TOTALQ = PPOOL.length;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function plain(t){ return t.replace(/\[\[|\]\]/g, ""); }
function ptext(t, ev){ const e = esc(t); return ev ? e.replace(/\[\[(.+?)\]\]/g, '<mark class="ev">$1</mark>') : e.replace(/\[\[|\]\]/g, ""); }
function sentences(t){ return t.split(/(?<=[.!?](?:\]\])?)\s+(?=[A-Z\['])/); }
function evSentence(t){ const s = sentences(t).find(x => x.indexOf("[[") > -1); return s ? plain(s) : ""; }
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmt(sec){ return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hd(p, k){ return '<span class="hd"><b>' + k + "</b>" + esc(p.H[k]) + "</span>"; }
const SIGNALS = ["however","yet","but","instead","rather","in fact","despite","although","not only","paradoxically","none of this","not every","not everyone","in other words","as a result","for these reasons","on this view","in a sense","looking ahead","for instance","such as","another","a third strategy","other plants","just as"];
const SIG_RE = new RegExp("\\b(" + SIGNALS.map(s => s.replace(/ /g, "\\s")).join("|") + ")\\b", "gi");
function sigHL(html){ return html.replace(SIG_RE, '<b class="sigw">$1</b>'); }

function trapOf(p, q, v){
  if (!v) return { k:"blank", note:"Bu paragrafga sarlavha tanlanmagan." };
  if (q.tr && q.tr[v]) return { k:q.tr[v][0], note:q.tr[v][1] };
  if (p.ans[v]) return { k:"other", note:"“" + v + "” sarlavhasi " + p.ans[v] + " paragrafning asosiy fikrini ifodalaydi. Uni oʻsha paragrafga qoʻyish kerak edi." };
  if (p.D[v]) return { k:p.D[v][0], note:p.D[v][1] };
  return { k:"other", note:"" };
}

/* ===================== SAQLASH ===================== */
const KEY = "mh-trenajor-v1";
function fresh(){ return { att:{}, log:[], dr:{ trap:[0,0], topic:[0,0] } }; }
let store = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.att && s.log) store = Object.assign(fresh(), s); } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }

const S = { view:"lib", sess:null, timer:null, confirmReset:false, dr:{ kind:"trap", item:null, opts:[], pick:null, txt:"", shown:false, sig:false } };

/* ===================== TEST SESSIYASI ===================== */
function start(pid, mode){
  stopTimer();
  const p = PBY[pid];
  S.sess = { pid, mode, sel:{}, st:{}, okr:{}, li:{}, hint:{}, round:0, first:null, t0:Date.now(), left:p.mins * 60, used:null, done:false };
  S.view = "sess"; render(); window.scrollTo(0, 0);
  S.timer = setInterval(tick, 1000);
}
function stopTimer(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function elapsed(){ return Math.floor((Date.now() - S.sess.t0) / 1000); }
function tick(){
  const s = S.sess; if (!s) return stopTimer();
  if (s.mode === "exam" && s.round === 0) { s.left--; if (s.left <= 0) { s.left = 0; check(true); return; } }
  const el = document.getElementById("clock");
  if (el) { el.textContent = clockVal(); el.classList.toggle("low", s.mode === "exam" && s.round === 0 && s.left < 120); }
}
function clockVal(){ const s = S.sess; if (s.used != null) return fmt(s.used); return s.mode === "exam" && s.round === 0 ? fmt(s.left) : fmt(elapsed()); }

function check(auto){
  const s = S.sess; if (!s || s.done) return;
  const p = PBY[s.pid];
  s.round++;
  p.paras.forEach(q => {
    if (s.st[q.L]) return;
    const v = s.sel[q.L] || "";
    if (v === q.a) { s.st[q.L] = "ok"; s.okr[q.L] = s.round; }
    else {
      s.st[q.L] = "bad";
      const t = trapOf(p, q, v);
      store.log.push({ p:p.id, L:q.L, v, a:q.a, k:t.k, r:"", n:s.round, t:Date.now() });
      s.li[q.L] = store.log.length - 1;
    }
  });
  if (s.round === 1) {
    s.first = p.paras.filter(q => s.st[q.L] === "ok").length;
    s.auto = !!auto;
    const prev = store.att[p.id] || { n:0, best:0 };
    store.att[p.id] = { n:prev.n + 1, first:s.first, best:Math.max(prev.best || 0, s.first), total:p.paras.length, mode:s.mode, hints:Object.keys(s.hint).length, t:Date.now() };
    if (s.mode === "exam") { s.used = p.mins * 60 - s.left; stopTimer(); }
  }
  finishIfDone(); save(); render();
  const el = document.getElementById("fbtop"); if (el) el.scrollIntoView({ block:"start" });
}
function finishIfDone(){
  const s = S.sess, p = PBY[s.pid];
  if (p.paras.every(q => s.st[q.L] === "ok" || s.st[q.L] === "rev")) {
    s.done = true;
    if (s.used == null) s.used = elapsed();
    stopTimer();
    const a = store.att[p.id]; if (a) a.fin = p.paras.filter(q => s.st[q.L] === "ok").length;
  }
}

function sessHTML(){
  const s = S.sess, p = PBY[s.pid];
  const clockLbl = s.used != null ? "Sarflangan vaqt" : (s.mode === "exam" && s.round === 0 ? "Qolgan vaqt" : "Vaqt");
  let h = '<div class="sbar"><button class="btn ghost" data-act="tab" data-v="lib">← Testlar</button><div class="stitle"><span class="mono">' + p.no + "-matn · " + (s.mode === "exam" ? "Imtihon rejimi" : "Mashq rejimi") + "</span><b>" + esc(p.title) + '</b></div><div class="clockwrap"><span class="mono">' + clockLbl + '</span><span id="clock" class="clock num">' + clockVal() + "</span></div></div>";
  h += '<div class="sgrid">' + passageHTML(p, s) + '<div class="qpane">' + sheetHTML(p, s) + fbHTML(p, s) + "</div></div>";
  return h;
}
function passageHTML(p, s){
  let h = '<article class="passage" aria-label="Matn"><div class="ph"><span class="tag t-' + p.exam + '">' + EXAM[p.exam] + '</span> <span class="mono">' + p.band + '</span><h2 class="ptitle">' + esc(p.title) + '</h2><p class="small">Matnda ' + p.paras.length + " ta paragraf (A–" + p.paras[p.paras.length - 1].L + ") bor. Har bir paragrafga roʻyxatdan mos sarlavhani tanlang. Sarlavhalar paragraflardan koʻp, ortiqchalari ishlatilmaydi.</p></div>";
  h += p.paras.map(q => {
    const st = s.st[q.L], v = s.sel[q.L];
    const ev = st === "ok" || st === "rev";
    return '<p class="para" id="para-' + q.L + '"><span class="pl">' + q.L + "</span>" + (v ? '<span class="pk ' + (st === "ok" ? "ok" : st ? "bad" : "") + '">' + v + "</span>" : "") + ptext(q.t, ev) + "</p>";
  }).join("");
  return h + "</article>";
}
function sheetHTML(p, s){
  const used = new Set(Object.values(s.sel).filter(Boolean));
  let h = '<section class="card"><h3>Sarlavhalar roʻyxati</h3><ol class="hlist">' + Object.keys(p.H).map(k => '<li class="' + (used.has(k) ? "used" : "") + '"><span class="rn">' + k + "</span><span>" + esc(p.H[k]) + "</span></li>").join("") + "</ol></section>";
  h += '<section class="card"><h3>Javoblar varagʻi</h3>';
  h += p.paras.map(q => {
    const st = s.st[q.L];
    const cls = st === "ok" ? "ok" : st ? "bad" : "";
    const opts = '<option value="">— tanlang —</option>' + Object.keys(p.H).map(k => '<option value="' + k + '"' + (s.sel[q.L] === k ? " selected" : "") + ">" + k + " – " + esc(p.H[k]) + "</option>").join("");
    let side = "";
    if (st === "ok") side = '<span class="ic" aria-label="toʻgʻri">✓</span>';
    else if (st) side = '<span class="ic" aria-label="notoʻgʻri">✗</span>';
    else if (s.mode === "practice") side = '<button class="btn ghost sm" data-act="hint" data-l="' + q.L + '" aria-expanded="' + !!s.hint[q.L] + '">Ishora</button>';
    return '<div class="arow ' + cls + '"><label class="al" for="sel-' + q.L + '">' + q.L + '</label><select id="sel-' + q.L + '" data-l="' + q.L + '"' + (st ? " disabled" : "") + ">" + opts + "</select>" + side + (s.hint[q.L] && !st ? '<p class="hinttxt">' + esc(q.hint) + "</p>" : "") + "</div>";
  }).join("");
  const open = p.paras.filter(q => !s.st[q.L]);
  if (open.length) {
    const blanks = open.filter(q => !s.sel[q.L]).length;
    h += '<div class="nav"><span class="small">' + (s.round ? "Xato paragraflarni qayta yeching. " : "") + (blanks ? blanks + " ta paragraf javobsiz" : "Hamma paragraflarga javob berildi") + '</span><button class="btn primary" data-act="check">' + (s.round ? "Qayta tekshirish" : "Tekshirish") + "</button></div>";
  }
  return h + "</section>";
}
function fbHTML(p, s){
  if (!s.round) return "";
  const total = p.paras.length;
  const okN = p.paras.filter(q => s.st[q.L] === "ok").length;
  const badN = p.paras.filter(q => s.st[q.L] === "bad").length;
  let h = '<section class="card" id="fbtop"><h3>Natija va tahlil</h3><div class="rsum"><div><span class="mono">Birinchi urinish</span><b class="num">' + s.first + " / " + total + '</b></div><div><span class="mono">Hozirgi holat</span><b class="num">' + okN + " / " + total + '</b></div><div><span class="mono">Vaqt</span><b class="num">' + (s.used != null ? fmt(s.used) : fmt(elapsed())) + "</b></div></div>";
  if (s.auto) h += '<p class="small">Vaqt tugadi, javoblar avtomatik tekshirildi.</p>';
  if (badN) h += '<p class="small" style="margin-top:12px">Xato paragraflar uchun avval tuzoq izohini oʻqing va xato sababini belgilang. Keyin “Xatolarni qayta ishlash” tugmasi bilan shu paragraflarni yana yeching yoki toʻgʻri javobni oching.</p>';
  h += "</section>";
  h += '<section class="card"><h3>Har bir javobning izohi</h3>' + p.paras.map(q => cardHTML(p, s, q)).join("") + "</section>";
  if (badN) h += '<div class="btns"><button class="btn primary" data-act="retry">Xatolarni qayta ishlash (' + badN + ')</button><button class="btn" data-act="revealall">Hamma javoblarni koʻrsatish</button></div>';
  if (s.done) {
    h += '<section class="card"><h3>Ortiqcha sarlavhalar nega ortiqcha</h3><ul class="dlist">' + Object.keys(p.D).map(k => "<li>" + hd(p, k) + '<span class="ttag">' + TRAPS[p.D[k][0]].n + "</span><p>" + esc(p.D[k][1]) + "</p></li>").join("") + "</ul></section>";
    h += '<div class="btns"><button class="btn primary" data-act="tab" data-v="lib">Testlar roʻyxati</button><button class="btn" data-act="start" data-p="' + p.id + '" data-m="' + s.mode + '">Shu testni qaytadan</button><button class="btn" data-act="tab" data-v="stats">Natijalar va xatolar daftari</button></div>';
  }
  return h;
}
function cardHTML(p, s, q){
  const st = s.st[q.L];
  if (!st) return '<div class="fcard"><div class="fh"><span class="fl">' + q.L + '</span><span class="pill bad">Qayta yechilmoqda</span></div></div>';
  const v = s.sel[q.L] || "";
  let h = '<div class="fcard"><div class="fh"><span class="fl">' + q.L + "</span>";
  if (st === "ok") h += '<span class="pill ok">Toʻgʻri' + (s.okr[q.L] > 1 ? " · " + s.okr[q.L] + "-urinishda" : "") + "</span>";
  else if (st === "bad") h += '<span class="pill bad">Notoʻgʻri</span>';
  else h += '<span class="pill bad">Notoʻgʻri · javob ochildi</span>';
  h += "</div>";
  if (st !== "ok") {
    const ent = store.log[s.li[q.L]];
    const t = trapOf(p, q, ent ? ent.v : v);
    h += '<p><span class="lab">Siz tanladingiz</span>' + (ent && ent.v ? hd(p, ent.v) : "javob berilmagan") + "</p>";
    if (t.k !== "blank") h += '<div class="trapbox"><div><span class="eyebrow">Tuzoq</span><span class="tn">' + TRAPS[t.k].n + "</span></div>" + (t.note ? "<p>" + esc(t.note) + "</p>" : "") + '<p class="note"><span class="lab">Qoida</span>' + esc(TRAPS[t.k].avoid) + "</p></div>";
    if (st === "bad") {
      h += '<div><span class="lab">Nega xato qildingiz?</span><div class="chips" style="margin-top:6px">' + Object.keys(REASONS).map(r => '<button class="chip" data-act="reason" data-l="' + q.L + '" data-r="' + r + '" aria-pressed="' + !!(ent && ent.r === r) + '">' + REASONS[r].t + "</button>").join("") + "</div></div>";
      h += '<p class="note"><span class="lab">Ishora</span>' + esc(q.hint) + "</p>";
      h += '<div class="btns"><button class="btn sm" data-act="reveal" data-l="' + q.L + '">Toʻgʻri javobni koʻrsatish</button></div>';
    }
  }
  if (st === "ok" || st === "rev") {
    h += '<p><span class="lab">Toʻgʻri javob</span>' + hd(p, q.a) + "</p><p>" + esc(q.why) + "</p><blockquote>" + esc(evSentence(q.t)) + "</blockquote>";
    if (q.tr) {
      const ks = Object.keys(q.tr).filter(k => k !== (store.log[s.li[q.L]] || {}).v);
      if (ks.length) h += '<details class="more"><summary>Bu paragrafdagi boshqa tuzoqlar (' + ks.length + ")</summary><ul>" + ks.map(k => "<li><b>" + k + "</b> " + esc(p.H[k]) + " – <i>" + TRAPS[q.tr[k][0]].n + "</i>. " + esc(q.tr[k][1]) + "</li>").join("") + "</ul></details>";
    }
  }
  return h + "</div>";
}
